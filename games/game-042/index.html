<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Slide - Day 42</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    background: #0a0a12; 
    color: #00ffff; 
    font-family: 'Courier New', monospace; 
    overflow: hidden; 
    touch-action: none;
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    min-height: 100vh; 
  }
  canvas { 
    display: block; 
    border: 2px solid #00ffff; 
    box-shadow: 0 0 20px #00ffff, inset 0 0 20px rgba(0,255,255,0.1); 
    border-radius: 4px;
    background: #050510;
  }
  #ui { 
    position: fixed; 
    top: 10px; 
    left: 50%; 
    transform: translateX(-50%); 
    display: flex; 
    gap: 30px; 
    font-size: 18px; 
    text-shadow: 0 0 10px #00ffff; 
    z-index: 10; 
  }
  #ui div { background: rgba(0,0,0,0.7); padding: 5px 15px; border: 1px solid #00ffff; border-radius: 3px; }
  .overlay { 
    position: fixed; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%; 
    background: rgba(0,0,0,0.9); 
    display: none; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    gap: 20px; 
    z-index: 100; 
    border: 2px solid #00ffff; 
  }
  .overlay.active { display: flex; }
  .overlay h1 { font-size: 48px; text-shadow: 0 0 20px #ff00ff, 0 0 40px #00ffff; margin-bottom: 10px; }
  .overlay p { font-size: 24px; color: #ffff00; text-shadow: 0 0 10px #ffff00; }
  .btn { 
    padding: 15px 40px; 
    font-size: 20px; 
    font-family: inherit; 
    background: transparent; 
    border: 2px solid #00ffff; 
    color: #00ffff; 
    cursor: pointer; 
    transition: all 0.2s; 
    text-shadow: 0 0 5px #00ffff; 
    box-shadow: 0 0 10px rgba(0,255,255,0.3); 
  }
  .btn:hover, .btn:focus { background: #00ffff; color: #000; box-shadow: 0 0 30px #00ffff; outline: none; }
  .btn.quit { border-color: #ff0066; color: #ff0066; text-shadow: 0 0 5px #ff0066; box-shadow: 0 0 10px rgba(255,0,102,0.3); }
  .btn.quit:hover { background: #ff0066; color: #fff; box-shadow: 0 0 30px #ff0066; }
  @media (max-width: 600px) { 
    #ui { font-size: 14px; gap: 15px; top: 5px; } 
    #ui div { padding: 3px 10px; }
    .overlay h1 { font-size: 32px; }
    .overlay p { font-size: 18px; }
    .btn { padding: 12px 30px; font-size: 18px; }
  }
</style>
</head>
<body>
<div id="ui">
  <div>LEVEL: <span id="levelEl">1</span></div>
  <div>SCORE: <span id="scoreEl">0</span></div>
  <div>HIGH: <span id="highEl">0</span></div>
  <div>TIME: <span id="timeEl">60</span></div>
  <div>MOVES: <span id="movesEl">0</span></div>
</div>
<canvas id="gameCanvas"></canvas>

<div id="startOverlay" class="overlay active">
  <h1>NEON SLIDE</h1>
  <p>Slide tiles to solve the puzzle before time runs out</p>
  <p style="font-size:16px; color:#888;">Arrows / WASD / Swipe to move • P or ESC to pause</p>
  <button class="btn" id="startBtn">START GAME</button>
</div>

<div id="pauseOverlay" class="overlay">
  <h1>PAUSED</h1>
  <button class="btn" id="resumeBtn">RESUME</button>
  <button class="btn quit" id="quitPauseBtn">QUIT TO MENU</button>
</div>

<div id="gameOverOverlay" class="overlay">
  <h1>TIME UP</h1>
  <p id="finalScore">Score: 0</p>
  <button class="btn" id="retryBtn">RETRY</button>
  <button class="btn quit" id="menuBtn">MAIN MENU</button>
</div>

<div id="levelCompleteOverlay" class="overlay">
  <h1>LEVEL COMPLETE!</h1>
  <p id="levelBonus">Bonus: +0</p>
  <button class="btn" id="nextLevelBtn">NEXT LEVEL</button>
  <button class="btn quit" id="menuBtn2">MAIN MENU</button>
</div>

<script>
/* ===== GAME CONSTANTS & STATE ===== */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let running = false;           // main loop flag
let paused = false;            // pause flag
let gameState = 'menu';        // 'menu', 'playing', 'paused', 'gameover', 'levelcomplete'
let animationId = null;

const GRID_MIN = 3, GRID_MAX = 6;
let gridSize = GRID_MIN;
let tiles = [];                // 1D array of tile numbers, 0 = empty
let emptyIndex = 0;
let targetTiles = [];          // solved state

let score = 0;
let highScore = parseInt(localStorage.getItem('neonSlideHigh')) || 0;
let level = 1;
let moves = 0;
let timeLeft = 60;
let baseTime = 60;
let timeDecrease = 5;
let lastTime = 0;
let accum = 0;

const COLORS = {
  bg: '#050510',
  grid: '#00ffff',
  tile: '#001122',
  tileBorder: '#00ffff',
  tileText: '#00ffff',
  empty: '#000000',
  glow1: '#00ffff',
  glow2: '#ff00ff',
  glow3: '#ffff00',
  particle: '#00ffff'
};

let particles = [];
let shake = 0;
let solveAnim = null; // { progress, from, to }

/* ===== CANVAS SIZING ===== */
function resizeCanvas() {
  const maxW = window.innerWidth * 0.95;
  const maxH = window.innerHeight * 0.85;
  const size = Math.min(maxW, maxH, 600);
  canvas.width = size;
  canvas.height = size;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

/* ===== UTILITIES ===== */
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function rand(min, max) { return Math.random() * (max - min) + min; }
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

/* ===== PUZZLE LOGIC ===== */
function createSolvedGrid(size) {
  const arr = [];
  for (let i = 1; i < size * size; i++) arr.push(i);
  arr.push(0);
  return arr;
}

function isSolvable(arr, size) {
  let inv = 0;
  for (let i = 0; i < arr.length; i++) {
    if (arr[i] === 0) continue;
    for (let j = i + 1; j < arr.length; j++) {
      if (arr[j] === 0) continue;
      if (arr[i] > arr[j]) inv++;
    }
  }
  const row = Math.floor(arr.indexOf(0) / size);
  if (size % 2 === 1) return inv % 2 === 0;
  return (row % 2 === 0) === (inv % 2 === 1);
}

function shuffleGrid(size) {
  let arr = createSolvedGrid(size);
  do {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = randInt(0, i);
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  } while (!isSolvable(arr, size) || arraysEqual(arr, targetTiles));
  return arr;
}

function arraysEqual(a, b) { return a.length === b.length && a.every((v, i) => v === b[i]); }

function getNeighbors(index, size) {
  const r = Math.floor(index / size), c = index % size;
  const res = [];
  if (r > 0) res.push(index - size);
  if (r < size - 1) res.push(index + size);
  if (c > 0) res.push(index - 1);
  if (c < size - 1) res.push(index + 1);
  return res;
}

function moveTile(index) {
  if (!getNeighbors(emptyIndex, gridSize).includes(index)) return false;
  tiles[emptyIndex] = tiles[index];
  tiles[index] = 0;
  emptyIndex = index;
  moves++;
  document.getElementById('movesEl').textContent = moves;
  addParticles(index);
  checkSolve();
  return true;
}

function checkSolve() {
  if (arraysEqual(tiles, targetTiles)) {
    levelComplete();
  }
}

function levelComplete() {
  running = false;
  gameState = 'levelcomplete';
  const bonus = Math.floor(timeLeft * 10) + Math.max(0, 100 - moves * 2);
  score += bonus;
  document.getElementById('scoreEl').textContent = score;
  document.getElementById('levelBonus').textContent = `Bonus: +${bonus} (Time: ${timeLeft}s, Moves: ${moves})`;
  document.getElementById('levelCompleteOverlay').classList.add('active');
  createSolveParticles();
}

/* ===== PARTICLES ===== */
function addParticles(tileIndex) {
  const size = gridSize;
  const cell = canvas.width / size;
  const r = Math.floor(tileIndex / size), c = tileIndex % size;
  const cx = c * cell + cell / 2, cy = r * cell + cell / 2;
  for (let i = 0; i < 8; i++) {
    const ang = rand(0, Math.PI * 2);
    const spd = rand(2, 6);
    particles.push({
      x: cx, y: cy,
      vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
      life: 1, decay: rand(0.02, 0.04),
      size: rand(3, 6),
      color: rand() < 0.5 ? COLORS.glow1 : COLORS.glow2
    });
  }
}

function createSolveParticles() {
  const size = gridSize;
  const cell = canvas.width / size;
  for (let r = 0; r < size; r++) {
    for (let c = 0; c < size; c++) {
      const cx = c * cell + cell / 2, cy = r * cell + cell / 2;
      for (let i = 0; i < 5; i++) {
        const ang = rand(0, Math.PI * 2);
        const spd = rand(1, 4);
        particles.push({
          x: cx, y: cy,
          vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
          life: 1, decay: rand(0.01, 0.02),
          size: rand(4, 8),
          color: [COLORS.glow1, COLORS.glow2, COLORS.glow3][randInt(0, 2)]
        });
      }
    }
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt * 60;
    p.y += p.vy * dt * 60;
    p.vy += 0.1 * dt * 60;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  });
  ctx.globalAlpha = 1;
}

/* ===== DRAWING ===== */
function drawGrid() {
  const size = gridSize;
  const cell = canvas.width / size;
  const lineW = Math.max(2, canvas.width / 200);
  
  ctx.strokeStyle = COLORS.grid;
  ctx.lineWidth = lineW;
  ctx.shadowColor = COLORS.grid;
  ctx.shadowBlur = 10;
  
  for (let i = 1; i < size; i++) {
    const pos = i * cell;
    ctx.beginPath();
    ctx.moveTo(pos, 0); ctx.lineTo(pos, canvas.height);
    ctx.moveTo(0, pos); ctx.lineTo(canvas.width, pos);
    ctx.stroke();
  }
  ctx.shadowBlur = 0;
}

function drawTiles() {
  const size = gridSize;
  const cell = canvas.width / size;
  const padding = Math.max(2, cell * 0.03);
  const radius = Math.max(4, cell * 0.08);
  
  tiles.forEach((val, idx) => {
    if (val === 0) return;
    const r = Math.floor(idx / size), c = idx % size;
    const x = c * cell + padding, y = r * cell + padding;
    const w = cell - padding * 2, h = cell - padding * 2;
    
    // tile background
    const grad = ctx.createLinearGradient(x, y, x + w, y + h);
    grad.addColorStop(0, '#002244');
    grad.addColorStop(1, '#001122');
    ctx.fillStyle = grad;
    ctx.strokeStyle = COLORS.tileBorder;
    ctx.lineWidth = 2;
    ctx.shadowColor = COLORS.glow1;
    ctx.shadowBlur = 8;
    roundRect(ctx, x, y, w, h, radius, true, true);
    ctx.shadowBlur = 0;
    
    // number
    ctx.fillStyle = COLORS.tileText;
    ctx.font = `bold ${Math.max(16, cell * 0.4)}px Courier New`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = COLORS.glow1;
    ctx.shadowBlur = 5;
    ctx.fillText(val, x + w/2, y + h/2);
    ctx.shadowBlur = 0;
  });
}

function roundRect(ctx, x, y, w, h, r, fill, stroke) {
  if (w < 2 * r) r = w / 2;
  if (h < 2 * r) r = h / 2;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  if (fill) ctx.fill();
  if (stroke) ctx.stroke();
}

function drawBackground() {
  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  // subtle grid pattern
  ctx.strokeStyle = 'rgba(0,255,255,0.03)';
  ctx.lineWidth = 1;
  const step = 20;
  for (let x = 0; x < canvas.width; x += step) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for (let y = 0; y < canvas.height; y += step) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }
}

function drawShake() {
  if (shake > 0) {
    const dx = rand(-shake, shake);
    const dy = rand(-shake, shake);
    ctx.translate(dx, dy);
    shake = Math.max(0, shake - 1);
  }
}

function render() {
  ctx.save();
  drawShake();
  drawBackground();
  drawGrid();
  drawTiles();
  drawParticles();
  ctx.restore();
}

/* ===== GAME LOOP ===== */
function gameLoop(timestamp) {
  if (!running) return;
  const dt = (timestamp - lastTime) / 1000;
  lastTime = timestamp;
  
  if (!paused) {
    accum += dt;
    while (accum >= 1/60) {
      update(1/60);
      accum -= 1/60;
    }
    updateParticles(dt);
    timeLeft -= dt;
    document.getElementById('timeEl').textContent = Math.ceil(timeLeft);
    if (timeLeft <= 0) gameOver();
  }
  render();
  animationId = requestAnimationFrame(gameLoop);
}

function update(dt) {
  // any per-frame logic
}

/* ===== INPUT HANDLING ===== */
function handleKeyDown(e) {
  if (gameState !== 'playing') return;
  const dir = { ArrowUp: -gridSize, ArrowDown: gridSize, ArrowLeft: -1, ArrowRight: 1,
                KeyW: -gridSize, KeyS: gridSize, KeyA: -1, KeyD: 1 }[e.code];
  if (dir !== undefined) {
    const target = emptyIndex + dir;
    if (target >= 0 && target < tiles.length) {
      const er = Math.floor(emptyIndex / gridSize), ec = emptyIndex % gridSize;
      const tr = Math.floor(target / gridSize), tc = target % gridSize;
      if (Math.abs(er - tr) + Math.abs(ec - tc) === 1) {
        moveTile(target);
      }
    }
  }
  if (e.code === 'Escape' || e.code === 'KeyP') togglePause();
}
document.addEventListener('keydown', handleKeyDown);

let touchStart = null;
canvas.addEventListener('touchstart', e => {
  if (gameState !== 'playing') return;
  e.preventDefault();
  touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, { passive: false });

canvas.addEventListener('touchend', e => {
  if (!touchStart || gameState !== 'playing') return;
  e.preventDefault();
  const dx = e.changedTouches[0].clientX - touchStart.x;
  const dy = e.changedTouches[0].clientY - touchStart.y;
  touchStart = null;
  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 30) moveTile(emptyIndex - 1); // swipe right -> move left tile
    else if (dx < -30) moveTile(emptyIndex + 1);
  } else {
    if (dy > 30) moveTile(emptyIndex - gridSize); // swipe down -> move up tile
    else if (dy < -30) moveTile(emptyIndex + gridSize);
  }
}, { passive: false });

/* ===== BUTTON HANDLERS ===== */
document.getElementById('startBtn').onclick = startGame;
document.getElementById('resumeBtn').onclick = resumeGame;
document.getElementById('quitPauseBtn').onclick = quitToMenu;
document.getElementById('retryBtn').onclick = startGame;
document.getElementById('menuBtn').onclick = quitToMenu;
document.getElementById('nextLevelBtn').onclick = nextLevel;
document.getElementById('menuBtn2').onclick = quitToMenu;

/* ===== GAME STATE FUNCTIONS ===== */
function startGame() {
  hideAllOverlays();
  level = 1;
  score = 0;
  moves = 0;
  gridSize = GRID_MIN;
  baseTime = 60;
  timeLeft = baseTime;
  initLevel();
  running = true;
  paused = false;
  gameState = 'playing';
  lastTime = performance.now();
  accum = 0;
  animationId = requestAnimationFrame(gameLoop);
  updateUI();
}

function initLevel() {
  targetTiles = createSolvedGrid(gridSize);
  tiles = shuffleGrid(gridSize);
  emptyIndex = tiles.indexOf(0);
  moves = 0;
  timeLeft = baseTime - (level - 1) * timeDecrease;
  timeLeft = clamp(timeLeft, 15, 120);
  particles = [];
  solveAnim = null;
  updateUI();
}

function nextLevel() {
  hideAllOverlays();
  level++;
  gridSize = clamp(gridSize + 1, GRID_MIN, GRID_MAX);
  initLevel();
  running = true;
  paused = false;
  gameState = 'playing';
  lastTime = performance.now();
  accum = 0;
  animationId = requestAnimationFrame(gameLoop);
}

function pauseGame() {
  if (gameState !== 'playing') return;
  paused = true;
  gameState = 'paused';
  document.getElementById('pauseOverlay').classList.add('active');
}

function resumeGame() {
  if (gameState !== 'paused') return;
  paused = false;
  gameState = 'playing';
  document.getElementById('pauseOverlay').classList.remove('active');
  lastTime = performance.now();
  animationId = requestAnimationFrame(gameLoop);
}

function togglePause() {
  if (gameState === 'playing') pauseGame();
  else if (gameState === 'paused') resumeGame();
}

function gameOver() {
  running = false;
  gameState = 'gameover';
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('neonSlideHigh', highScore);
    document.getElementById('highEl').textContent = highScore;
  }
  document.getElementById('finalScore').textContent = `Final Score: ${score} | Level Reached: ${level}`;
  document.getElementById('gameOverOverlay').classList.add('active');
}

function quitToMenu() {
  running = false;
  paused = false;
  gameState = 'menu';
  hideAllOverlays();
  document.getElementById('startOverlay').classList.add('active');
  updateUI();
}

function showStartScreen() {
  quitToMenu();
}

function hideAllOverlays() {
  document.querySelectorAll('.overlay').forEach(el => el.classList.remove('active'));
}

function updateUI() {

</script>
</body>
