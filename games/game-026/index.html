<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Sokoban - Day 26</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
  body { background:#0a0a12; color:#0ff; font-family:'Courier New', monospace; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; overflow:hidden; }
  canvas { display:block; box-shadow:0 0 30px #0ff, 0 0 60px #00f, inset 0 0 30px #001a1a; border:2px solid #0ff; border-radius:4px; }
  #ui { position:absolute; top:10px; left:10px; right:10px; display:flex; justify-content:space-between; pointer-events:none; color:#0ff; text-shadow:0 0 5px #0ff, 0 0 10px #00f; font-size:1.2rem; }
  #msg { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; pointer-events:none; color:#f0f; text-shadow:0 0 10px #f0f, 0 0 20px #f00; font-size:2rem; display:none; }
  @media (max-width:600px) { canvas { width:95vw; height:95vw; max-width:95vw; max-height:95vh; } #ui { font-size:1rem; } }

.overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.95);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    gap: 20px;
    padding: 20px;
}
.overlay.hidden { display: none; }
.overlay h1 { font-size: clamp(32px, 8vw, 64px); text-shadow: 0 0 30px #00ffea; letter-spacing: 4px; }
.overlay p { color: #00ffea88; font-size: 14px; text-align: center; max-width: 400px; line-height: 1.6; }
.btn {
    padding: 12px 32px;
    font-size: 16px;
    font-family: 'Courier New', monospace;
    background: transparent;
    color: #00ffea;
    border: 2px solid #00ffea;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
}
.btn:hover { background: #00ffea; color: #0a0a0f; box-shadow: 0 0 20px #00ffea; }
.mobile-hint { color: #ff6b00; font-size: 12px; }
</style>
</head>
<body>
<div id="ui">
  <div>LEVEL: <span id="levelNum">1</span></div>
  <div>MOVES: <span id="moves">0</span></div>
  <div>SCORE: <span id="score">0</span></div>
  <div>BEST: <span id="best">0</span></div>
</div>
<canvas id="game"></canvas>
<div id="msg"></div>


    <div class="overlay hidden" id="pauseOverlay">
        <h1>PAUSED</h1>
        <p>Wave <span id="pauseWave">1</span> • Score <span id="pauseScore">0</span></p>
        <button class="btn" id="resumeBtn">RESUME</button>
        <button class="btn" id="quitBtn">QUIT TO MENU</button>
    </div>

    <div class="overlay hidden" id="gameOverOverlay">
        <h1 style="color: #ff3366;">GAME OVER</h1>
        <p>Final Score: <span id="finalScore" style="color: #00ffea;">0</span></p>
        <p id="highScoreMsg" style="color: #ffd700;"></p>
        <button class="btn" id="retryBtn">RETRY</button>
        <button class="btn" id="menuBtn">MAIN MENU</button>
    </div>

<script>
/**
 * Neon Sokoban - A cyberpunk puzzle game
 * Features: keyboard/touch controls, increasing difficulty, high score persistence, neon glow effects.
 */

// ===== CONFIG =====
const CELL_SIZE = 40;          // base cell size (px)
const GLOW_COLOR = '#0ff';     // primary neon color
const COLORS = {
  wall:   '#0044ff',
  floor:  '#0a0a1a',
  target: '#ff0',
  player: '#0ff',
  box:    '#f0f',
  boxOnTarget: '#ff0',
  playerOnTarget: '#0ff'
};
const LEVELS = [
  // Level 1 - 5x5
  [
    "#####",
    "#   #",
    "# $ #",
    "#.@.#",
    "#####"
  ],
  // Level 2 - 6x6
  [
    "######",
    "#    #",
    "# $ $#",
    "# .. #",
    "# @  #",
    "######"
  ],
  // Level 3 - 7x7
  [
    "#######",
    "#     #",
    "# $ $ #",
    "#  $  #",
    "# ... #",
    "#  @  #",
    "#######"
  ],
  // Level 4 - 8x8
  [
    "########",
    "#      #",
    "# $ $ $#",
    "#  $   #",
    "# .... #",
    "#   @  #",
    "#      #",
    "########"
  ],
  // Level 5 - 9x9 (more boxes)
  [
    "#########",
    "#       #",
    "# $ $ $ #",
    "#  $ $  #",
    "#  ...  #",
    "#   @   #",
    "#       #",
    "#       #",
    "#########"
  ]
];

// ===== STATE =====
let canvas = document.getElementById('game');
let ctx = canvas.getContext('2d');
let grid = [];          // 2D array of current level state
let player = {x:0,y:0};
let moves = 0;
let levelIndex = 0;
let score = 0;
let bestScore = parseInt(localStorage.getItem('neonSokobanBest') || '0', 10);
let gameState = 'playing'; // 'playing', 'won', 'transition'
let touchStart = null;

// ===== INIT =====
function resize() {
  // Canvas size based on current level grid dimensions
  const rows = grid.length, cols = grid[0].length;
  canvas.width = cols * CELL_SIZE;
  canvas.height = rows * CELL_SIZE;
  // UI updates
  document.getElementById('levelNum').textContent = levelIndex + 1;
  document.getElementById('moves').textContent = moves;
  document.getElementById('score').textContent = score;
  document.getElementById('best').textContent = bestScore;
}
function initLevel(idx) {
  const raw = LEVELS[idx];
  grid = raw.map(row => row.split(''));
  // Find player
  for (let y=0; y<grid.length; y++) {
    for (let x=0; x<grid[y].length; x++) {
      if (grid[y][x] === '@' || grid[y][x] === '+') {
        player = {x, y};
        grid[y][x] = grid[y][x] === '+' ? '.' : ' ';
      }
    }
  }
  moves = 0;
  gameState = 'playing';
  resize();
  draw();
}
function nextLevel() {
  levelIndex++;
  if (levelIndex >= LEVELS.length) {
    // Game complete - loop back with bonus
    levelIndex = 0;
    score += 5000; // completion bonus
  }
  initLevel(levelIndex);
}

// ===== INPUT =====
window.addEventListener('keydown', e => {
  if (gameState !== 'playing') return;
  let dx=0, dy=0;
  if (e.key === 'ArrowUp' || e.key === 'w') dy = -1;
  else if (e.key === 'ArrowDown' || e.key === 's') dy = 1;
  else if (e.key === 'ArrowLeft' || e.key === 'a') dx = -1;
  else if (e.key === 'ArrowRight' || e.key === 'd') dx = 1;
  else return;
  e.preventDefault();
  attemptMove(dx, dy);

        if (e.code === 'Escape' || e.key === 'Escape') {
            if (!document.getElementById('pauseOverlay').classList.contains('hidden')) {
                resumeGame();
            } else {
                pauseGame();
            }
            return;
        }});

canvas.addEventListener('touchstart', e => {
  touchStart = {x:e.touches[0].clientX, y:e.touches[0].clientY};
}, {passive:true});
canvas.addEventListener('touchend', e => {
  if (!touchStart || gameState !== 'playing') return;
  const dx = e.changedTouches[0].clientX - touchStart.x;
  const dy = e.changedTouches[0].clientY - touchStart.y;
  touchStart = null;
  if (Math.abs(dx) > Math.abs(dy)) {
    if (Math.abs(dx) > 30) attemptMove(dx > 0 ? 1 : -1, 0);
  } else {
    if (Math.abs(dy) > 30) attemptMove(0, dy > 0 ? 1 : -1);
  }
}, {passive:true});

// ===== GAME LOGIC =====
function attemptMove(dx, dy) {
  const nx = player.x + dx, ny = player.y + dy;
  if (ny < 0 || ny >= grid.length || nx < 0 || nx >= grid[0].length) return;
  const targetCell = grid[ny][nx];
  if (targetCell === '#') return; // wall
  if (targetCell === '$' || targetCell === '*') {
    // try push box
    const bx = nx + dx, by = ny + dy;
    if (by < 0 || by >= grid.length || bx < 0 || bx >= grid[0].length) return;
    const beyond = grid[by][bx];
    if (beyond === '#' || beyond === '$' || beyond === '*') return;
    // push
    grid[by][bx] = (beyond === '.') ? '*' : '$';
    grid[ny][nx] = (targetCell === '*') ? '.' : ' ';
    moves++;
  } else {
    // simple move
    moves++;
  }
  player.x = nx; player.y = ny;
  checkWin();
  draw();
}
function checkWin() {
  // win if no '$' left (all boxes on targets)
  for (let row of grid) {
    if (row.includes('$')) return;
  }
  // level won
  gameState = 'won';
  const levelScore = Math.max(1000 - moves * 10, 100);
  score += levelScore;
  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem('neonSokobanBest', bestScore);
  }
  showMessage(`LEVEL COMPLETE! +${levelScore}`, () => nextLevel());
}
function showMessage(text, callback) {
  const msg = document.getElementById('msg');
  msg.textContent = text;
  msg.style.display = 'block';
  setTimeout(() => {
    msg.style.display = 'none';
    if (callback) callback();
  }, 1500);
}

// ===== RENDER =====
function draw() {
  const rows = grid.length, cols = grid[0].length;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  // Background
  ctx.fillStyle = '#050510';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  // Grid glow lines
  ctx.strokeStyle = '#001122';
  ctx.lineWidth = 1;
  for (let y=0; y<=rows; y++) {
    ctx.beginPath();
    ctx.moveTo(0, y*CELL_SIZE);
    ctx.lineTo(canvas.width, y*CELL_SIZE);
    ctx.stroke();
  }
  for (let x=0; x<=cols; x++) {
    ctx.beginPath();
    ctx.moveTo(x*CELL_SIZE, 0);
    ctx.lineTo(x*CELL_SIZE, canvas.height);
    ctx.stroke();
  }
  // Draw cells
  for (let y=0; y<rows; y++) {
    for (let x=0; x<cols; x++) {
      const cell = grid[y][x];
      const px = x*CELL_SIZE, py = y*CELL_SIZE;
      const centerX = px + CELL_SIZE/2, centerY = py + CELL_SIZE/2;
      const radius = CELL_SIZE/2 - 4;
      // Floor
      ctx.fillStyle = COLORS.floor;
      ctx.fillRect(px+2, py+2, CELL_SIZE-4, CELL_SIZE-4);
      // Wall
      if (cell === '#') {
        drawNeonRect(px+2, py+2, CELL_SIZE-4, CELL_SIZE-4, COLORS.wall, 10);
      }
      // Target
      if (cell === '.' || cell === '*' || cell === '+') {
        drawNeonCircle(centerX, centerY, radius*0.6, COLORS.target, 15);
      }
      // Box
      if (cell === '$' || cell === '*') {
        const boxColor = cell === '*' ? COLORS.boxOnTarget : COLORS.box;
        drawNeonRect(centerX - radius*0.7, centerY - radius*0.7, radius*1.4, radius*1.4, boxColor, 12);
      }
    }
  }
  // Player (draw last)
  const px = player.x * CELL_SIZE + CELL_SIZE/2;
  const py = player.y * CELL_SIZE + CELL_SIZE/2;
  const onTarget = (grid[player.y][player.x] === '.');
  drawNeonCircle(px, py, CELL_SIZE/2 - 6, onTarget ? COLORS.playerOnTarget : COLORS.player, 20);
  // Player direction indicator (small triangle)
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(px, py - 10);
  ctx.lineTo(px - 7, py + 2);
  ctx.lineTo(px + 7, py + 2);
  ctx.closePath();
  ctx.fill();
  // UI updates
  document.getElementById('moves').textContent = moves;
  document.getElementById('score').textContent = score;
  document.getElementById('best').textContent = bestScore;
}
function drawNeonRect(x, y, w, h, color, blur) {
  ctx.shadowColor = color;
  ctx.shadowBlur = blur;
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, h);
  ctx.shadowBlur = 0;
}
function drawNeonCircle(x, y, r, color, blur) {
  ctx.shadowColor = color;
  ctx.shadowBlur = blur;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

// ===== START =====
initLevel(0);

// --- Pause/Resume/Quit Functions for game-026 ---
function pauseGame() {
    if (gameState !== 'playing') return;
    gameState = 'paused';
    document.getElementById('pauseOverlay').classList.remove('hidden');
}

function resumeGame() {
    if (gameState !== 'paused') return;
    gameState = 'playing';
    document.getElementById('pauseOverlay').classList.add('hidden');
}

function quitToMenu() {
    gameState = 'gameOver';
    document.getElementById('pauseOverlay').classList.add('hidden');
    document.getElementById('gameOverOverlay').classList.add('hidden');
    showStartScreen();
}

function showStartScreen() {
    gameState = 'playing';
    document.getElementById('pauseOverlay').classList.add('hidden');
    document.getElementById('gameOverOverlay').classList.add('hidden');
    // No start screen found
}
</script>
</body>
</html>
