<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Match-3</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0a0a12;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', 'Courier New', monospace;
    color: #00ffcc;
    overflow: hidden;
    touch-action: none;
}
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

#gameContainer {
    position: relative;
    border: 3px solid #00ffcc;
    border-radius: 8px;
    box-shadow: 
        0 0 30px #00ffcc,
        0 0 60px #cc00ff,
        inset 0 0 30px rgba(0, 255, 204, 0.1);
    background: #050510;
}
canvas { display: block; }

#ui {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    padding: 16px;
}
#topBar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}
.statBox {
    background: rgba(0, 20, 30, 0.85);
    border: 1px solid #00ffcc44;
    border-radius: 6px;
    padding: 8px 16px;
    backdrop-filter: blur(4px);
}
.statLabel { font-size: 10px; color: #00ffcc88; text-transform: uppercase; letter-spacing: 1px; }
.statValue { font-size: 22px; font-weight: 700; color: #00ffcc; text-shadow: 0 0 10px #00ffcc; font-variant-numeric: tabular-nums; }
#highScore .statValue { color: #ffcc00; text-shadow: 0 0 10px #ffcc00; }
#level .statValue { color: #cc00ff; text-shadow: 0 0 10px #cc00ff; }

#bottomBar { margin-top: auto; display: flex; justify-content: center; gap: 12px; }
.controlHint {
    background: rgba(0, 20, 30, 0.85);
    border: 1px solid #00ffcc44;
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 11px;
    color: #00ffccaa;
    display: flex;
    align-items: center;
    gap: 6px;
}
.controlHint kbd {
    background: #001122;
    border: 1px solid #00ffcc66;
    border-radius: 4px;
    padding: 2px 8px;
    font-family: inherit;
    font-size: 10px;
    color: #00ffcc;
}

#startScreen, #gameOverScreen {
    position: absolute;
    inset: 0;
    background: rgba(5, 5, 16, 0.98);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    z-index: 10;
    backdrop-filter: blur(8px);
}
#startScreen.hidden, #gameOverScreen.hidden { display: none; }
.title {
    font-size: clamp(32px, 8vw, 56px);
    font-weight: 900;
    background: linear-gradient(135deg, #00ffcc, #cc00ff, #ffcc00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    letter-spacing: 4px;
    animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.3); } }
.subtitle { font-size: 14px; color: #00ffcc88; letter-spacing: 3px; text-transform: uppercase; }
.btn {
    background: linear-gradient(135deg, #003344, #001122);
    border: 2px solid #00ffcc;
    color: #00ffcc;
    padding: 14px 48px;
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
    border-radius: 4px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 2px;
    transition: all 0.2s;
    box-shadow: 0 0 20px #00ffcc44;
}
.btn:hover, .btn:focus { background: linear-gradient(135deg, #00ffcc, #cc00ff); color: #000; box-shadow: 0 0 30px #00ffcc, 0 0 60px #cc00ff; outline: none; }
.btn:active { transform: scale(0.96); }

#finalScore { font-size: 28px; font-weight: 700; color: #00ffcc; text-shadow: 0 0 15px #00ffcc; }
#bestScore { font-size: 16px; color: #ffcc00; text-shadow: 0 0 10px #ffcc00; }

@media (max-width: 600px) {
    #gameContainer { border-width: 2px; border-radius: 0; width: 100vw; height: 100vh; max-width: 100%; max-height: 100%; }
    body { align-items: stretch; justify-content: stretch; }
    #ui { padding: 12px; }
    .statValue { font-size: 18px; }
    .controlHint { padding: 5px 10px; font-size: 10px; }
}
</style>
</head>
<body>
<div id="gameContainer">
    <canvas id="canvas"></canvas>
    <div id="ui">
        <div id="topBar">
            <div class="statBox" id="score">
                <div class="statLabel">Score</div>
                <div class="statValue" id="scoreVal">0</div>
            </div>
            <div class="statBox" id="highScore">
                <div class="statLabel">Best</div>
                <div class="statValue" id="highScoreVal">0</div>
            </div>
            <div class="statBox" id="level">
                <div class="statLabel">Level</div>
                <div class="statValue" id="levelVal">1</div>
            </div>
        </div>
        <div id="bottomBar">
            <div class="controlHint"><kbd>Click</kbd> / <kbd>Tap</kbd> to Swap</div>
            <div class="controlHint">Match 3+ Gems</div>
        </div>
    </div>

    <div id="startScreen">
        <div class="title">NEON MATCH-3</div>
        <div class="subtitle">Neon Gem Puzzle</div>
        <button class="btn" id="startBtn">Start Game</button>
    </div>

    <div id="gameOverScreen" class="hidden">
        <div class="title">GAME OVER</div>
        <div id="finalScore">Score: 0</div>
        <div id="bestScore">Best: 0</div>
        <button class="btn" id="restartBtn">Play Again</button>
    </div>
</div>



    <div class="overlay hidden" id="pauseOverlay">
        <h1>PAUSED</h1>
        <p>Wave <span id="pauseWave">1</span> • Score <span id="pauseScore">0</span></p>
        <button class="btn" id="resumeBtn">RESUME</button>
        <button class="btn" id="quitBtn">QUIT TO MENU</button>
    </div>


    <div class="overlay hidden" id="gameOverOverlay">
        <h1 style="color: #ff3366;">GAME OVER</h1>
        <p>Final Score: <span id="finalScore" style="color: #00ffea;">0</span></p>
        <p id="highScoreMsg" style="color: #ffd700;"></p>
        <button class="btn" id="retryBtn">RETRY</button>
        <button class="btn" id="menuBtn">MAIN MENU</button>
    </div>


<script>
// ============================================
// NEON MATCH-3 - Gem Matching Puzzle
// ============================================

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// --- Config ---
const CONFIG = {
    baseWidth: 600,
    baseHeight: 700,
    board: { cols: 8, rows: 8, gemSize: 64, padding: 4 },
    gemTypes: 6,
    matchMin: 3,
    fallSpeed: 1200,
    swapTime: 200,
    clearTime: 300,
    newGemDelay: 100,
    particleColors: ['#00ffcc', '#ff006e', '#ffbe0b', '#cc00ff', '#00ff88', '#ffbe0b'],
    bgColors: ['#00ffcc', '#ff006e', '#ffbe0b', '#cc00ff', '#00ff88', '#ffbe0b']
};

const GEM_COLORS = [
    { main: '#00ffcc', glow: '#00ffff' },   // Cyan
    { main: '#ff006e', glow: '#ff3388' },   // Pink
    { main: '#ffbe0b', glow: '#ffcc00' },   // Gold
    { main: '#cc00ff', glow: '#cc66ff' },   // Purple
    { main: '#00ff88', glow: '#00ffcc' },   // Green
    { main: '#ffbe0b', glow: '#ffcc00' }    // Amber
];

// --- Utility ---
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const random = (min, max) => Math.random() * (max - min) + min;
const randomInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const choose = (arr) => arr[Math.floor(Math.random() * arr.length)];

// --- Gem Class ---
class Gem {
    constructor(type, col, row) {
        this.type = type;
        this.col = col;
        this.row = row;
        this.x = 0;
        this.y = 0;
        this.targetX = 0;
        this.targetY = 0;
        this.scale = 1;
        this.alpha = 1;
        this.matched = false;
        this.clearing = false;
        this.clearProgress = 0;
        this.updatePosition();
    }
    updatePosition() {
        const { cols, rows, gemSize, padding } = CONFIG.board;
        const boardWidth = cols * (gemSize + padding) - padding;
        const boardHeight = rows * (gemSize + padding) - padding;
        const offsetX = (canvas.width - boardWidth) / 2;
        const offsetY = (canvas.height - boardHeight) / 2;
        this.targetX = offsetX + this.col * (CONFIG.board.gemSize + CONFIG.board.padding) + CONFIG.board.gemSize / 2;
        this.targetY = offsetY + this.row * (CONFIG.board.gemSize + CONFIG.board.padding) + CONFIG.board.gemSize / 2;
        if (this.x === 0 && this.y === 0) {
            this.x = this.targetX;
            this.y = this.targetY;
        }
    }
    getCenterX() { return this.x; }
    getCenterY() { return this.y; }
    update(dt) {
        // Smooth movement to target position
        const speed = 15;
        this.x += (this.targetX - this.x) * speed * dt;
        this.y += (this.targetY - this.y) * speed * dt;
        
        if (this.clearing) {
            this.clearProgress += dt / (CONFIG.clearTime / 1000);
            this.scale = 1 - this.clearProgress;
            this.alpha = 1 - this.clearProgress;
            if (this.clearProgress >= 1) this.alpha = 0;
        }
    }
    draw(ctx) {
        if (this.alpha <= 0) return;
        
        const color = GEM_COLORS[this.type];
        const size = CONFIG.board.gemSize * 0.85 * this.scale;
        const half = size / 2;
        
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.globalAlpha = this.alpha;
        
        // Glow
        ctx.shadowColor = color.glow;
        ctx.shadowBlur = 20;
        
        // Gem shape (octagon)
        ctx.fillStyle = color.main;
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
            const angle = (i * Math.PI * 2) / 8 - Math.PI / 8;
            const r = i % 2 === 0 ? half : half * 0.6;
            const x = Math.cos(angle) * r;
            const y = Math.sin(angle) * r;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fill();
        
        // Inner highlight
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
            const angle = (i * Math.PI * 2) / 8 - Math.PI / 8;
            const r = i % 2 === 0 ? half * 0.5 : half * 0.3;
            const x = Math.cos(angle) * r;
            const y = Math.sin(angle) * r;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fill();
        
        ctx.restore();
    }
}

// --- Particle System ---
class Particle {
    constructor(x, y, color, size, life, velocity, gravity = 0) {
        this.x = x; this.y = y;
        this.vx = velocity.x; this.vy = velocity.y;
        this.color = color;
        this.size = size;
        this.maxSize = size;
        this.life = life;
        this.maxLife = life;
        this.gravity = gravity;
    }
    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.vy += this.gravity * dt;
        this.life -= dt;
    }
    draw(ctx) {
        if (this.life <= 0) return;
        const alpha = this.life / this.maxLife;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * (this.life / this.maxLife), 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

class ParticleSystem {
    constructor() { this.particles = []; }
    emit(x, y, color, count, options = {}) {
        for (let i = 0; i < count; i++) {
            const angle = random(0, Math.PI * 2);
            const speed = random(options.minSpeed || 50, options.maxSpeed || 200);
            const vx = Math.cos(angle) * speed;
            const vy = Math.sin(angle) * speed;
            this.particles.push(new Particle(
                x, y, color,
                random(options.minSize || 2, options.maxSize || 6),
                random(options.minLife || 0.2, options.maxLife || 0.8),
                { x: vx, y: vy },
                options.gravity || 0
            ));
        }
    }
    update(dt) {
        for (let i = this.particles.length - 1; i >= 0; i--) {
            this.particles[i].update(dt);
            if (this.particles[i].life <= 0) this.particles.splice(i, 1);
        }
    }
    draw(ctx) { this.particles.forEach(p => p.draw(ctx)); }
}

// --- Board State ---
const CONFIG_BOARD = { cols: 8, rows: 8, gemSize: 64, padding: 4 };

const state = {
    board: [],
    selectedGem: null,
    swapping: false,
    swapProgress: 0,
    swapGem1: null,
    swapGem2: null,
    swapDir: null,
    clearing: false,
    clearingMatches: [],
    score: 0,
    highScore: 0,
    level: 1,
    targetScore: 1000,
    particles: null,
    gameState: 'start', // start, playing, gameOver
    combo: 0,
    lastMatchTime: 0
};

function createBoard() {
    const board = [];
    for (let row = 0; row < CONFIG_BOARD.rows; row++) {
        for (let col = 0; col < CONFIG_BOARD.cols; col++) {
            let type;
            // Avoid initial matches
            do {
                type = randomInt(0, CONFIG.gemTypes - 1);
            } while (
                (col >= 2 && state.board[row * CONFIG_BOARD.cols + (col-1)]?.type === type && 
                 state.board[row * CONFIG_BOARD.cols + (col-2)]?.type === type) ||
                (row >= 2 && state.board[(row-1) * CONFIG_BOARD.cols + col]?.type === type && 
                 state.board[(row-2) * CONFIG_BOARD.cols + col]?.type === type)
            );
            const gem = new Gem(type, col, row);
            board.push(gem);
        }
    }
    return board;
}

function getGem(col, row) {
    if (col < 0 || col >= CONFIG_BOARD.cols || row < 0 || row >= CONFIG_BOARD.rows) return null;
    return state.board[row * CONFIG_BOARD.cols + col];
}

function setGem(col, row, gem) {
    state.board[row * CONFIG_BOARD.cols + col] = gem;
    if (gem) { gem.col = col; gem.row = row; gem.updatePosition(); }
}

function swapGems(col1, row1, col2, row2) {
    const idx1 = row1 * CONFIG_BOARD.cols + col1;
    const idx2 = row2 * CONFIG_BOARD.cols + col2;
    [state.board[idx1], state.board[idx2]] = [state.board[idx2], state.board[idx1]];
    if (state.board[idx1]) { state.board[idx1].col = col1; state.board[idx1].row = row1; state.board[idx1].updatePosition(); }
    if (state.board[idx2]) { state.board[idx2].col = col2; state.board[idx2].row = row2; state.board[idx2].updatePosition(); }
}

function findMatches() {
    const matches = [];
    
    // Horizontal matches
    for (let row = 0; row < CONFIG_BOARD.rows; row++) {
        let matchStart = 0;
        let matchType = -1;
        let matchLength = 0;
        
        for (let col = 0; col <= CONFIG_BOARD.cols; col++) {
            const gem = col < CONFIG_BOARD.cols ? getGem(col, row) : null;
            const type = gem ? gem.type : -1;
            
            if (type === matchType && type !== -1) {
                matchLength++;
            } else {
                if (matchLength >= CONFIG.matchMin) {
                    const matchGems = [];
                    for (let i = 0; i < matchLength; i++) {
                        matchGems.push(getGem(matchStart + i, row));
                    }
                    matches.push({ gems: matchGems, type: matchType, direction: 'horizontal' });
                }
                matchStart = col;
                matchType = type;
                matchLength = type !== -1 ? 1 : 0;
            }
        }
    }
    
    // Vertical matches
    for (let col = 0; col < CONFIG_BOARD.cols; col++) {
        let matchStart = 0;
        let matchType = -1;
        let matchLength = 0;
        
        for (let row = 0; row <= CONFIG_BOARD.rows; row++) {
            const gem = row < CONFIG_BOARD.rows ? getGem(col, row) : null;
            const type = gem ? gem.type : -1;
            
            if (type === matchType && type !== -1) {
                matchLength++;
            } else {
                if (matchLength >= CONFIG.matchMin) {
                    const matchGems = [];
                    for (let i = 0; i < matchLength; i++) {
                        matchGems.push(getGem(col, matchStart + i));
                    }
                    matches.push({ gems: matchGems, type: matchType, direction: 'vertical' });
                }
                matchStart = row;
                matchType = type;
                matchLength = type !== -1 ? 1 : 0;
            }
        }
    }
    
    return matches;
}

function removeMatches(matches) {
    const clearedGems = new Set();
    for (const match of matches) {
        for (const gem of match.gems) {
            if (gem && !clearedGems.has(gem)) {
                gem.matched = true;
                gem.clearing = true;
                gem.clearProgress = 0;
                clearedGems.add(gem);
                
                // Particles
                const color = GEM_COLORS[gem.type].glow;
                state.particles.emit(gem.getCenterX(), gem.getCenterY(), color, 12, {
                    minSpeed: 100, maxSpeed: 300, minSize: 3, maxSize: 8,
                    minLife: 0.3, maxLife: 0.8
                });
            }
        }
    }
}

function applyGravity() {
    for (let col = 0; col < CONFIG_BOARD.cols; col++) {
        let writeRow = CONFIG_BOARD.rows - 1;
        for (let row = CONFIG_BOARD.rows - 1; row >= 0; row--) {
            const gem = getGem(col, row);
            if (gem && !gem.matched) {
                if (writeRow !== row) {
                    setGem(col, writeRow, gem);
                }
                writeRow--;
            }
        }
        // Fill empty spots with new gems
        for (let row = writeRow; row >= 0; row--) {
            const type = randomInt(0, CONFIG.gemTypes - 1);
            const newGem = new Gem(type, col, row);
            // Start from above
            newGem.y = -CONFIG.board.gemSize * (writeRow - row + 1);
            newGem.x = newGem.targetX;
            newGem.alpha = 0;
            setGem(col, row, newGem);
        }
    }
}

function checkValidSwap(col1, row1, col2, row2) {
    // Simulate swap
    swapGems(col1, row1, col2, row2);
    const matches = findMatches();
    swapGems(col1, row1, col2, row2); // Swap back
    return matches.length > 0;
}

function startSwap(gem1, gem2) {
    state.swapping = true;
    state.swapProgress = 0;
    state.swapGem1 = gem1;
    state.swapGem2 = gem2;
    state.swapDir = { 
        x: gem2.targetX - gem1.targetX, 
        y: gem2.targetY - gem1.targetY 
    };
}

function updateSwap(dt) {
    state.swapProgress += dt / (CONFIG.swapTime / 1000);
    if (state.swapProgress >= 1) {
        state.swapProgress = 1;
        state.swapping = false;
        
        // Complete swap
        const g1 = state.swapGem1, g2 = state.swapGem2;
        swapGems(g1.col, g1.row, g2.col, g2.row);
        state.swapGem1 = null;
        state.swapGem2 = null;
        state.swapDir = null;
        
        // Check for matches
        const matches = findMatches();
        if (matches.length > 0) {
            state.clearing = true;
            state.clearingMatches = matches;
            removeMatches(matches);
            state.combo++;
            state.lastMatchTime = Date.now();
        } else {
            // Invalid swap - swap back
            state.swapping = true;
            state.swapProgress = 0;
            state.swapGem1 = getGem(gem2.col, gem2.row);
            state.swapGem2 = getGem(gem1.col, gem1.row);
            state.swapDir = { 
                x: -state.swapDir.x, 
                y: -state.swapDir.y 
            };
        }
    }
    
    // Animate swap
    if (state.swapGem1 && state.swapGem2) {
        const progress = state.swapProgress;
        const ease = progress < 0.5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;
        const dx = state.swapDir.x * ease;
        const dy = state.swapDir.y * ease;
        state.swapGem1.x = state.swapGem1.targetX + dx;
        state.swapGem1.y = state.swapGem1.targetY + dy;
        state.swapGem2.x = state.swapGem2.targetX - dx;
        state.swapGem2.y = state.swapGem2.targetY - dy;
    }
}

function updateClearing(dt) {
    let allDone = true;
    for (const match of state.clearingMatches) {
        for (const gem of match.gems) {
            if (gem) {
                gem.clearProgress += dt / (CONFIG.clearTime / 1000);
                if (gem.clearProgress < 1) allDone = false;
            }
        }
    }
    
    if (allDone) {
        state.clearing = false;
        // Remove cleared gems
        for (const match of state.clearingMatches) {
            for (const gem of match.gems) {
                if (gem) gem.matched = true;
            }
        }
        state.clearingMatches = [];
        applyGravity();
        
        // Check for cascade matches
        setTimeout(() => {
            const newMatches = findMatches();
            if (newMatches.length > 0) {
                state.clearing = true;
                state.clearingMatches = newMatches;
                removeMatches(newMatches);
                state.combo++;
            } else {
                state.combo = 0;
            }
        }, CONFIG.newGemDelay);
    }
}

function updateGems(dt) {
    for (const gem of state.board) {
        if (gem) gem.update(dt);
    }
}

function drawBoard() {
    // Draw gems
    for (const gem of state.board) {
        if (gem) gem.draw(ctx);
    }
    
    // Draw selection highlight
    if (state.selectedGem && !state.swapping && !state.clearing) {
        const gem = state.selectedGem;
        ctx.save();
        ctx.translate(gem.x, gem.y);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        ctx.shadowColor = '#fff';
        ctx.shadowBlur = 10;
        ctx.setLineDash([10, 5]);
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
            const angle = (i * Math.PI * 2) / 8 - Math.PI / 8;
            const r = i % 2 === 0 ? CONFIG.board.gemSize * 0.55 : CONFIG.board.gemSize * 0.33;
            const x = Math.cos(angle) * r;
            const y = Math.sin(angle) * r;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
        ctx.restore();
    }
    
    // Draw swapping gems on top
    if (state.swapping && state.swapGem1 && state.swapGem2) {
        state.swapGem1.draw(ctx);
        state.swapGem2.draw(ctx);
    }
}

function drawParticles() {
    state.particles.draw(ctx);
}

function drawBackground() {
    // Animated grid background
    ctx.fillStyle = '#050510';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    const time = Date.now() * 0.0005;
    ctx.strokeStyle = '#003333';
    ctx.lineWidth = 0.5;
    const gridSize = 50;
    for (let i = 0; i <= canvas.width / gridSize; i++) {
        const x = i * gridSize + Math.sin(time + i) * 2;
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let i = 0; i <= canvas.height / gridSize; i++) {
        const y = i * gridSize + Math.cos(time + i) * 2;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }
}

function drawUI() {
    // UI is handled by HTML
    document.getElementById('scoreVal').textContent = state.score;
    document.getElementById('highScoreVal').textContent = state.highScore;
    document.getElementById('levelVal').textContent = state.level;
}

function update(dt) {
    if (state.gameState === 'playing') {
        state.particles.update(dt);
        
        if (state.swapping) {
            updateSwap(dt);
        } else if (state.clearing) {
            updateClearing(dt);
        } else {
            updateGems(dt);
        }
        
        // Check win condition
        if (state.score >= state.targetScore) {
            state.level++;
            state.targetScore += 1000 * state.level;
            document.getElementById('levelVal').textContent = state.level;
            // Bonus
            state.score += 500 * state.level;
        }
    }
    
    drawUI();
}

function draw() {
    drawBackground();
    drawBoard();
    drawParticles();
}

function gameLoop(timestamp) {
    const dt = 1/60;
    update(dt);
    draw();
    requestAnimationFrame(gameLoop);
}

// --- Input ---
function getBoardPos(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const { cols, rows, gemSize, padding } = CONFIG_BOARD;
    const boardWidth = cols * (gemSize + padding) - padding;
    const boardHeight = rows * (gemSize + padding) - padding;
    const offsetX = (canvas.width - boardWidth) / 2;
    const offsetY = (canvas.height - boardHeight) / 2;
    
    const x = (clientX - rect.left - offsetX) / (gemSize + padding);
    const y = (clientY - rect.top - offsetY) / (gemSize + padding);
    return { col: Math.floor(x), row: Math.floor(y) };
}

function onClick(e) {
    if (state.gameState !== 'playing') return;
    if (state.swapping || state.clearing) return;
    
    const pos = getBoardPos(e.clientX, e.clientY);
    if (pos.col < 0 || pos.col >= CONFIG_BOARD.cols || pos.row < 0 || pos.row >= CONFIG_BOARD.rows) return;
    
    const gem = getGem(pos.col, pos.row);
    if (!gem) return;
    
    if (!state.selectedGem) {
        state.selectedGem = gem;
    } else if (state.selectedGem === gem) {
        state.selectedGem = null;
    } else {
        // Check if adjacent
        const dc = Math.abs(gem.col - state.selectedGem.col);
        const dr = Math.abs(gem.row - state.selectedGem.row);
        if ((dc === 1 && dr === 0) || (dc === 0 && dr === 1)) {
            if (checkValidSwap(state.selectedGem.col, state.selectedGem.row, gem.col, gem.row)) {
                startSwap(state.selectedGem, gem);
            }
        }
        state.selectedGem = null;
    }
}

function onTouchStart(e) {
    e.preventDefault();
    const touch = e.touches[0];
    const pos = getBoardPos(touch.clientX, touch.clientY);
    // Same logic as click
    if (pos.col < 0 || pos.col >= CONFIG_BOARD.cols || pos.row < 0 || pos.row >= CONFIG_BOARD.rows) return;
    const gem = getGem(pos.col, pos.row);
    if (!gem) return;
    if (!state.selectedGem) state.selectedGem = gem;
    else if (state.selectedGem === gem) state.selectedGem = null;
    else {
        const dc = Math.abs(gem.col - state.selectedGem.col);
        const dr = Math.abs(gem.row - state.selectedGem.row);
        if ((dc === 1 && dr === 0) || (dc === 0 && dr === 1)) {
            if (checkValidSwap(state.selectedGem.col, state.selectedGem.row, gem.col, gem.row)) {
                startSwap(state.selectedGem, gem);
            }
        }
        state.selectedGem = null;
    }
}

function onTouchMove(e) { e.preventDefault(); }
function onTouchEnd(e) { e.preventDefault(); }

function startGame() {
    state.gameState = 'playing';
    state.score = 0;
    state.level = 1;
    state.targetScore = 1000;
    state.combo = 0;
    state.board = createBoard();
    state.selectedGem = null;
    state.swapping = false;
    state.clearing = false;
    state.particles = new ParticleSystem();
    
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('gameOverScreen').classList.add('hidden');
    document.getElementById('scoreVal').textContent = '0';
    document.getElementById('levelVal').textContent = '1';
    document.getElementById('highScoreVal').textContent = state.highScore;
}

function gameOver() {
    state.gameState = 'gameOver';
    if (state.score > state.highScore) {
        state.highScore = state.score;
        localStorage.setItem('neonMatch3HighScore', state.highScore);
    }
    document.getElementById('finalScore').textContent = 'Score: ' + state.score;
    document.getElementById('bestScore').textContent = 'Best: ' + state.highScore;
    document.getElementById('gameOverScreen').classList.remove('hidden');
}

function init() {
    resize();
    window.addEventListener('resize', resize);
    
    state.highScore = parseInt(localStorage.getItem('neonMatch3HighScore')) || 0;
    document.getElementById('highScoreVal').textContent = state.highScore;
    
    canvas.addEventListener('click', onClick);
    canvas.addEventListener('touchstart', onTouchStart, { passive: false });
    canvas.addEventListener('touchmove', onTouchMove, { passive: false });
    canvas.addEventListener('touchend', onTouchEnd, { passive: false });
    
    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('restartBtn').addEventListener('click', startGame);
    
    state.particles = new ParticleSystem();
    
    // Background particles
    for (let i = 0; i < 30; i++) {
        state.particles.emit(
            random(0, canvas.width), random(0, canvas.height),
            choose(CONFIG.particleColors), 1,
            { minSpeed: 5, maxSpeed: 15, minSize: 1, maxSize: 3, minLife: 5, maxLife: 15 }
        );
    }
    
    showStartScreen();
    requestAnimationFrame(gameLoop);

    
    // Keyboard support for pause
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Escape' || e.key === 'Escape') {
            if (state.running && !document.getElementById('pauseOverlay').classList.contains('hidden')) {
                resumeGame();
            } else if (state.running) {
                pauseGame();
            }
            return;
        }
    });

    
    
    // Keyboard support for pause
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Escape' || e.key === 'Escape') {
            if (state.running && !document.getElementById('pauseOverlay').classList.contains('hidden')) {
                resumeGame();
            } else if (state.running) {
                pauseGame();
            }
            return;
        }
    });

    }

function showStartScreen() {
    state.gameState = 'start';
    document.getElementById('startScreen').classList.remove('hidden');
    document.getElementById('gameOverScreen').classList.add('hidden');
}

function resize() {
    const container = document.getElementById('gameContainer');
    const maxW = Math.min(window.innerWidth * 0.95, CONFIG.baseWidth);
    const maxH = Math.min(window.innerHeight * 0.9, CONFIG.baseHeight);
    const scale = Math.min(maxW / CONFIG.baseWidth, maxH / CONFIG.baseHeight);
    
    canvas.width = CONFIG.baseWidth * scale;
    canvas.height = CONFIG.baseHeight * scale;
    canvas.style.width = (CONFIG.baseWidth * scale) + 'px';
    canvas.style.height = (CONFIG.baseHeight * scale) + 'px';
    
    // Update all gem positions
    for (const gem of state.board) {
        if (gem) gem.updatePosition();
    }
}

function gameLoop(timestamp) {
    const dt = 1/60;
    update(dt);
    draw();
    requestAnimationFrame(gameLoop);
}

function update(dt) {
    if (state.gameState === 'playing') {
        state.particles.update(dt);
        if (state.swapping) updateSwap(dt);
        else if (state.clearing) updateClearing(dt);
        else updateGems(dt);
        
        // Check win condition
        if (state.score >= state.targetScore) {
            state.level++;
            state.targetScore += 1000 * state.level;
            document.getElementById('levelVal').textContent = state.level;
            state.score += 500 * state.level;
        }
    }
    drawUI();
}

function draw() {
    drawBackground();
    drawBoard();
    drawParticles();
}

function drawBackground() {
    ctx.fillStyle = '#050510';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    const time = Date.now() * 0.0005;
    ctx.strokeStyle = '#003333';
    ctx.lineWidth = 0.5;
    const gridSize = 50;
    for (let i = 0; i <= canvas.width / gridSize; i++) {
        const x = i * gridSize + Math.sin(time + i) * 2;
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let i = 0; i <= canvas.height / gridSize; i++) {
        const y = i * gridSize + Math.cos(time + i) * 2;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }
}

// Start
init();


// --- Pause/Resume/Quit Functions for Neon Match-3 ---
function pauseGame() {
    if (!state.running) return;
    state.running = false;
    document.getElementById('pauseOverlay').classList.remove('hidden');
}

function resumeGame() {
    if (state.running) return;
    state.running = true;
    document.getElementById('pauseOverlay').classList.add('hidden');
}

function quitToMenu() {
    state.running = false;
    document.getElementById('pauseOverlay').classList.add('hidden');
    document.getElementById('gameOverOverlay').classList.add('hidden');
    showStartScreen();
}

function showStartScreen() {
    state.running = false;
    document.getElementById('startScreen').classList.remove('hidden');
    document.getElementById('pauseOverlay').classList.add('hidden');
    document.getElementById('gameOverOverlay').classList.add('hidden');
}
</script>
