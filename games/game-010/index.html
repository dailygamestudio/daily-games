<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Match-3 - Day 10</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0a0a12;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', 'Segoe UI', sans-serif;
    color: #00ffcc;
    overflow: hidden;
    touch-action: none;
}
#gameCanvas { 
    display: block; 
    box-shadow: 
        0 0 30px #00ffcc44,
        0 0 60px #0066ff22,
        inset 0 0 30px #00ffcc11;
    border-radius: 8px;
    border: 2px solid #00ffcc;
}
.ui-layer {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    padding: 16px 24px;
    pointer-events: none;
    z-index: 10;
}
.ui-panel {
    background: linear-gradient(135deg, #0a0a12cc, #001122cc);
    border: 1px solid #00ffcc44;
    border-radius: 8px;
    padding: 12px 20px;
    backdrop-filter: blur(10px);
    pointer-events: auto;
    text-align: center;
    min-width: 140px;
}
.ui-label { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.6; margin-bottom: 4px; }
.ui-value { font-size: 24px; font-weight: 700; text-shadow: 0 0 10px #00ffcc, 0 0 20px #0066ff; font-variant-numeric: tabular-nums; }
#highScore { color: #ffcc00; text-shadow: 0 0 10px #ffcc00, 0 0 20px #ff8800; }
#level { color: #ff4488; text-shadow: 0 0 10px #ff4488, 0 0 20px #ff0066; }
#timeBarContainer { position: absolute; top: 90px; left: 50%; transform: translateX(-50%); width: 300px; height: 8px; background: #001122; border-radius: 4px; border: 1px solid #00ffcc44; overflow: hidden; box-shadow: inset 0 0 10px #00000088, 0 0 10px #00ffcc22; }
#timeBar { height: 100%; background: linear-gradient(90deg, #00ffcc, #0088ff, #ff00cc); border-radius: 3px; transition: width 0.1s linear; box-shadow: 0 0 15px #00ffcc, 0 0 30px #0066ff; }
.overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.9);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(5px);
}
.overlay.hidden { display: none; }
.overlay h1 { font-size: 48px; font-weight: 900; background: linear-gradient(135deg, #00ffcc, #0088ff, #ff00cc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: none; margin-bottom: 8px; letter-spacing: 4px; }
.overlay p { color: #88ffdd; margin-bottom: 24px; font-size: 16px; letter-spacing: 1px; }
.btn {
    background: linear-gradient(135deg, #002233, #001122);
    border: 2px solid #00ffcc;
    color: #00ffcc;
    padding: 16px 48px;
    font-size: 18px;
    font-family: inherit;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 3px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 0 20px #00ffcc44, inset 0 0 20px #00ffcc11;
}
.btn:hover, .btn:active { background: linear-gradient(135deg, #00ffcc22, #0088ff22); box-shadow: 0 0 30px #00ffcc88, inset 0 0 30px #00ffcc33; transform: scale(1.02); }
.btn:active { transform: scale(0.98); }
#finalScore { font-size: 36px; color: #00ffcc; text-shadow: 0 0 20px #00ffcc; margin: 16px 0; font-variant-numeric: tabular-nums; }
#comboPopup { position: absolute; pointer-events: none; z-index: 50; font-weight: 900; text-shadow: 0 0 10px currentColor; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
.particles { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; overflow: hidden; }
.particle { position: absolute; border-radius: 50%; pointer-events: none; }
@keyframes scanline { 0% { transform: translateY(-100%); } 100% { transform: translateY(100vh); } }
.scanlines::after {
    content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,255,204,0.02) 2px, rgba(0,255,204,0.02) 4px);
    pointer-events: none; z-index: 1000; animation: scanline 8s linear infinite;
}
@media (max-width: 600px) {
    .ui-panel { padding: 8px 12px; min-width: 100px; }
    .ui-value { font-size: 18px; }
    .overlay h1 { font-size: 32px; }
    .btn { padding: 14px 32px; font-size: 14px; }
    #timeBarContainer { width: 90vw; top: 80px; }
}
</style>
</head>
<body>
<div class="scanlines"></div>
<canvas id="gameCanvas"></canvas>
<div class="ui-layer">
    <div class="ui-panel">
        <div class="ui-label">Score</div>
        <div class="ui-value" id="score">0</div>
    </div>
    <div class="ui-panel">
        <div class="ui-label">Best</div>
        <div class="ui-value" id="highScore">0</div>
    </div>
    <div class="ui-panel">
        <div class="ui-label">Level</div>
        <div class="ui-value" id="level">1</div>
    </div>
</div>
<div id="timeBarContainer"><div id="timeBar" style="width: 100%"></div></div>
<div class="particles" id="particles"></div>
<div id="comboPopup" class="combo-popup" style="opacity: 0; transform: scale(0.5)"></div>

<div id="startOverlay" class="overlay">
    <h1>NEON MATCH-3</h1>
    <p>Swap adjacent gems to match 3+<br>Clear matches to gain time &amp; score<br>Chain combos for massive bonuses</p>
    <button class="btn" id="startBtn">BEGIN</button>
    <p style="margin-top: 24px; font-size: 12px; opacity: 0.5;">Click/Drag or Swap to play</p>
</div>
<div id="gameOverOverlay" class="overlay hidden">
    <h1>GAME OVER</h1>
    <div id="finalScore">0</div>
    <p id="comboStats"></p>
    <button class="btn" id="restartBtn">RETRY</button>
</div>
<div id="pauseOverlay" class="overlay hidden">
    <h1>PAUSED</h1>
    <p>Time frozen</p>
    <button class="btn" id="resumeBtn">RESUME</button>
</div>

<script>
// ============================================
// NEON MATCH-3 - Day 10 Daily Game Studio
// Cyberpunk match-3 puzzle with combos, levels, time pressure
// ============================================

// ----- CONFIGURATION -----
const CONFIG = {
    gridSize: 8,
    gemTypes: 5,           // increases with level
    baseGemTypes: 5,
    maxGemTypes: 8,
    cellSize: 0,           // calculated at runtime
    padding: 0,            // calculated at runtime
    swapTime: 150,         // ms for swap animation
    fallTime: 100,         // ms per row fall
    clearTime: 200,        // ms for clear animation
    spawnTime: 100,        // ms for new gem spawn
    baseTime: 120,         // seconds
    timePerMatch: 2,       // seconds added per match
    timePerCombo: 1,       // extra seconds per combo level
    comboMultiplier: 1.5,  // score multiplier per combo
    levelTimeReduce: 5,    // seconds less per level
    minTime: 30,           // minimum level time
    particleCount: 12,     // particles per match
    shakeIntensity: 8,     // screen shake on big combos
};

// ----- GEM COLORS (Neon Cyberpunk Palette) -----
const GEM_COLORS = [
    { main: '#00ffcc', glow: '#00ffcc', name: 'CYAN' },    // 0 - Cyan
    { main: '#ff00cc', glow: '#ff00cc', name: 'MAGENTA' }, // 1 - Magenta
    { main: '#ffcc00', glow: '#ffcc00', name: 'GOLD' },    // 2 - Gold
    { main: '#0088ff', glow: '#0088ff', name: 'BLUE' },    // 3 - Blue
    { main: '#ccff00', glow: '#ccff00', name: 'LIME' },    // 4 - Lime
    { main: '#ff4488', glow: '#ff4488', name: 'PINK' },    // 5 - Pink
    { main: '#8844ff', glow: '#8844ff', name: 'PURPLE' },  // 6 - Purple
    { main: '#ff6600', glow: '#ff6600', name: 'ORANGE' },  // 7 - Orange
];

// ----- GAME STATE -----
const state = {
    grid: [],              // 2D array of gem objects
    selected: null,        // {r, c} of selected gem
    swapping: false,       // swap animation in progress
    clearing: false,       // clear animation in progress
    falling: false,        // gems falling
    spawning: false,       // new gems spawning
    score: 0,
    highScore: 0,
    level: 1,
    timeLeft: CONFIG.baseTime,
    maxTime: CONFIG.baseTime,
    combo: 0,
    maxCombo: 0,
    totalMatches: 0,
    gameOver: false,
    paused: false,
    animQueue: [],         // animation queue
    shakeTime: 0,          // screen shake timer
    lastTime: 0,           // for delta time
};

// ----- CANVAS SETUP -----
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const particlesContainer = document.getElementById('particles');
const comboPopup = document.getElementById('comboPopup');
const timeBar = document.getElementById('timeBar');
const scoreEl = document.getElementById('score');
const highScoreEl = document.getElementById('highScore');
const levelEl = document.getElementById('level');
const finalScoreEl = document.getElementById('finalScore');
const comboStatsEl = document.getElementById('comboStats');

// ----- UTILITY FUNCTIONS -----
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const randFloat = (min, max) => Math.random() * (max - min) + min;

// ----- GEM CLASS -----
class Gem {
    constructor(type, row, col) {
        this.type = type;           // gem type index
        this.row = row;             // grid row (target)
        this.col = col;             // grid col (target)
        this.x = col;               // visual x (lerped)
        this.y = row;               // visual y (lerped)
        this.scale = 1;             // for pop/spawn animation
        this.alpha = 1;             // for fade out
        this.rotation = 0;          // for clear animation
        this.clearing = false;      // marked for clearing
        this.newGem = true;         // just spawned
        this.matchLevel = 0;        // part of combo level
    }
    
    // Get screen position
    getScreenX() { return this.x * CONFIG.cellSize + CONFIG.padding; }
    getScreenY() { return this.y * CONFIG.cellSize + CONFIG.padding; }
    getCenterX() { return this.getScreenX() + CONFIG.cellSize / 2; }
    getCenterY() { return this.getScreenY() + CONFIG.cellSize / 2; }
    
    // Draw gem
    draw(ctx, shakeX = 0, shakeY = 0) {
        const cx = this.getCenterX() + shakeX;
        const cy = this.getCenterY() + shakeY;
        const size = (CONFIG.cellSize * 0.85 * this.scale) / 2;
        if (size <= 0) return;
        
        const color = GEM_COLORS[this.type % GEM_COLORS.length];
        
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(this.rotation);
        ctx.scale(this.scale, this.scale);
        ctx.globalAlpha = this.alpha;
        
        // Outer glow
        const glowSize = size * 1.4;
        const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, glowSize);
        gradient.addColorStop(0, color.glow + '88');
        gradient.addColorStop(0.5, color.glow + '44');
        gradient.addColorStop(1, color.glow + '00');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(0, 0, glowSize, 0, Math.PI * 2);
        ctx.fill();
        
        // Gem shape (rounded hexagon)
        const radius = size * 0.95;
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
            const angle = (i / 6) * Math.PI * 2 - Math.PI / 6;
            const x = Math.cos(angle) * radius;
            const y = Math.sin(angle) * radius;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.closePath();
        
        // Gem fill gradient
        const fillGrad = ctx.createRadialGradient(-radius * 0.3, -radius * 0.3, 0, 0, 0, radius);
        fillGrad.addColorStop(0, '#ffffff');
        fillGrad.addColorStop(0.3, color.main);
        fillGrad.addColorStop(1, this.darkenColor(color.main, 0.4));
        ctx.fillStyle = fillGrad;
        ctx.fill();
        
        // Inner highlight
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
            const angle = (i / 6) * Math.PI * 2 - Math.PI / 6;
            const x = Math.cos(angle) * radius * 0.6;
            const y = Math.sin(angle) * radius * 0.6;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.fill();
        
        // Type indicator (small symbol)
        ctx.font = `${size * 0.5}px Orbitron`;
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.globalAlpha = this.alpha * 0.8;
        const symbols = ['◆', '●', '▲', '■', '★', '♥', '♦', '♣'];
        ctx.fillText(symbols[this.type % symbols.length], 0, size * 0.05);
        
        // Selection ring
        if (this === state.selected && !this.clearing && !state.swapping) {
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3 / this.scale;
            ctx.globalAlpha = 0.8 + Math.sin(Date.now() / 100) * 0.2;
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = (i / 6) * Math.PI * 2 - Math.PI / 6;
                const x = Math.cos(angle) * radius * 1.15;
                const y = Math.sin(angle) * radius * 1.15;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.stroke();
        }
        
        ctx.restore();
    }
    
    darkenColor(hex, factor) {
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return `rgb(${Math.floor(r * factor)}, ${Math.floor(g * factor)}, ${Math.floor(b * factor)})`;
    }
}

// ----- PARTICLE SYSTEM -----
function createParticles(x, y, color, count = CONFIG.particleCount) {
    for (let i = 0; i < count; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        const size = randFloat(4, 12);
        const angle = randFloat(0, Math.PI * 2);
        const velocity = randFloat(80, 200);
        const life = randFloat(400, 800);
        
        particle.style.cssText = `
            width: ${size}px;
            height: ${size}px;
            left: ${x}px;
            top: ${y}px;
            background: ${color};
            box-shadow: 0 0 ${size}px ${color}, 0 0 ${size * 2}px ${color};
            animation: particleLife ${life}ms ease-out forwards;
            --tx: ${Math.cos(angle) * velocity}px;
            --ty: ${Math.sin(angle) * velocity}px;
        `;
        
        particlesContainer.appendChild(particle);
        setTimeout(() => particle.remove(), life);
    }
}

// Add particle animation CSS dynamically
const style = document.createElement('style');
style.textContent = `
@keyframes particleLife {
    0% { transform: translate(0, 0) scale(1); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
}`;
document.head.appendChild(style);

// ----- GRID MANAGEMENT -----
function createEmptyGrid() {
    const grid = [];
    for (let r = 0; r < CONFIG.gridSize; r++) {
        grid[r] = [];
        for (let c = 0; c < CONFIG.gridSize; c++) {
            grid[r][c] = null;
        }
    }
    return grid;
}

function fillGrid(grid) {
    const types = Math.min(CONFIG.baseGemTypes + state.level - 1, CONFIG.maxGemTypes);
    for (let r = 0; r < CONFIG.gridSize; r++) {
        for (let c = 0; c < CONFIG.gridSize; c++) {
            let type;
            // Avoid initial matches
            do {
                type = randInt(0, types - 1);
            } while (
                (c >= 2 && grid[r][c-1] && grid[r][c-1].type === type && grid[r][c-2] && grid[r][c-2].type === type) ||
                (r >= 2 && grid[r-1][c] && grid[r-1][c].type === type && grid[r-2][c] && grid[r-2][c].type === type)
            );
            const gem = new Gem(type, r, c);
            gem.x = c;
            gem.y = r - CONFIG.gridSize; // spawn from top
            gem.scale = 0;
            grid[r][c] = gem;
        }
    }
    return grid;
}

function getGem(r, c) {
    if (r < 0 || r >= CONFIG.gridSize || c < 0 || c >= CONFIG.gridSize) return null;
    return state.grid[r][c];
}

// ----- MATCH DETECTION -----
function findMatches(grid = state.grid) {
    const matches = [];
    const matched = new Set();
    
    // Horizontal matches
    for (let r = 0; r < CONFIG.gridSize; r++) {
        let count = 1;
        for (let c = 1; c <= CONFIG.gridSize; c++) {
            const curr = getGem(r, c);
            const prev = getGem(r, c - 1);
            if (curr && prev && curr.type === prev.type && !curr.clearing && !prev.clearing) {
                count++;
            } else {
                if (count >= 3) {
                    const match = { gems: [], row: r, col: c - count, horizontal: true, length: count };
                    for (let i = 0; i < count; i++) {
                        const g = getGem(r, c - 1 - i);
                        if (g) { match.gems.push(g); matched.add(`${r},${c - 1 - i}`); }
                    }
                    matches.push(match);
                }
                count = 1;
            }
        }
    }
    
    // Vertical matches
    for (let c = 0; c < CONFIG.gridSize; c++) {
        let count = 1;
        for (let r = 1; r <= CONFIG.gridSize; r++) {
            const curr = getGem(r, c);
            const prev = getGem(r - 1, c);
            if (curr && prev && curr.type === prev.type && !curr.clearing && !prev.clearing) {
                count++;
            } else {
                if (count >= 3) {
                    const match = { gems: [], row: r - count, col: c, horizontal: false, length: count };
                    for (let i = 0; i < count; i++) {
                        const g = getGem(r - 1 - i, c);
                        if (g) { match.gems.push(g); matched.add(`${r - 1 - i},${c}`); }
                    }
                    matches.push(match);
                }
                count = 1;
            }
        }
    }
    
    return matches;
}

// ----- SWAP LOGIC -----
function canSwap(r1, c1, r2, c2) {
    const gem1 = getGem(r1, c1);
    const gem2 = getGem(r2, c2);
    if (!gem1 || !gem2 || gem1.clearing || gem2.clearing) return false;
    if (state.swapping || state.clearing || state.falling || state.spawning) return false;
    // Must be adjacent
    return (Math.abs(r1 - r2) === 1 && c1 === c2) || (Math.abs(c1 - c2) === 1 && r1 === r2);
}

function trySwap(r1, c1, r2, c2) {
    if (!canSwap(r1, c1, r2, c2)) return false;
    
    const gem1 = state.grid[r1][c1];
    const gem2 = state.grid[r2][c2];
    
    // Perform swap in grid
    state.grid[r1][c1] = gem2;
    state.grid[r2][c2] = gem1;
    
    // Update gem positions
    gem1.row = r2; gem1.col = c2;
    gem2.row = r1; gem2.col = c1;
    
    // Check for matches
    const matches = findMatches();
    
    if (matches.length > 0) {
        // Valid swap - animate
        state.swapping = true;
        state.selected = null;
        
        // Animate swap
        animateSwap(gem1, gem2, () => {
            state.swapping = false;
            startClear(matches);
        });
        return true;
    } else {
        // Invalid swap - revert
        state.grid[r1][c1] = gem1;
        state.grid[r2][c2] = gem2;
        gem1.row = r1; gem1.col = c1;
        gem2.row = r2; gem2.col = c2;
        
        // Animate failed swap (wobble)
        animateFailedSwap(gem1, gem2);
        return false;
    }
}

function animateSwap(gem1, gem2, callback) {
    const start1 = { x: gem1.x, y: gem1.y };
    const start2 = { x: gem2.x, y: gem2.y };
    const target1 = { x: gem2.col, y: gem2.row };
    const target2 = { x: gem1.col, y: gem1.row };
    const duration = CONFIG.swapTime;
    const startTime = performance.now();
    
    function animate(now) {
        const t = clamp((now - startTime) / duration, 0, 1);
        const eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        
        gem1.x = lerp(start1.x, target1.x, eased);
        gem1.y = lerp(start1.y, target1.y, eased);
        gem2.x = lerp(start2.x, target2.x, eased);
        gem2.y = lerp(start2.y, target2.y, eased);
        
        if (t < 1) {
            requestAnimationFrame(animate);
        } else {
            gem1.x = target1.x; gem1.y = target1.y;
            gem2.x = target2.x; gem2.y = target2.y;
            callback();
        }
    }
    requestAnimationFrame(animate);
}

function animateFailedSwap(gem1, gem2) {
    const orig1 = { x: gem1.x, y: gem1.y };
    const orig2 = { x: gem2.x, y: gem2.y };
    const mid1 = { x: (gem1.x + gem2.x) / 2, y: (gem1.y + gem2.y) / 2 };
    const mid2 = { x: (gem2.x + gem1.x) / 2, y: (gem2.y + gem1.y) / 2 };
    const duration = CONFIG.swapTime;
    const startTime = performance.now();
    
    function animate(now) {
        const t = clamp((now - startTime) / duration, 0, 1);
        // Go to middle and back
        const phase = t < 0.5 ? t * 2 : (1 - t) * 2;
        const eased = phase < 0.5 ? 2 * phase * phase : 1 - Math.pow(-2 * phase + 2, 2) / 2;
        
        gem1.x = lerp(orig1.x, mid1.x, eased);
        gem1.y = lerp(orig1.y, mid1.y, eased);
        gem2.x = lerp(orig2.x, mid2.x, eased);
        gem2.y = lerp(orig2.y, mid2.y, eased);
        
        if (t < 1) requestAnimationFrame(animate);
        else { gem1.x = orig1.x; gem1.y = orig1.y; gem2.x = orig2.x; gem2.y = orig2.y; }
    }
    requestAnimationFrame(animate);
}

// ----- CLEAR & FALL LOGIC -----
function startClear(matches) {
    state.clearing = true;
    state.combo++;
    state.maxCombo = Math.max(state.maxCombo, state.combo);
    state.totalMatches += matches.length;
    
    // Mark gems for clearing
    let totalGems = 0;
    matches.forEach((match, mi) => {
        match.gems.forEach((gem, gi) => {
            gem.clearing = true;
            gem.matchLevel = state.combo;
            totalGems++;
        });
    });
    
    // Score calculation
    const basePoints = 10;
    const lengthBonus = matches.reduce((sum, m) => sum + (m.length - 3) * 5, 0);
    const comboMult = Math.pow(CONFIG.comboMultiplier, state.combo - 1);
    const points = Math.floor((matches.length * basePoints + lengthBonus) * comboMult);
    state.score += points;
    updateScore();
    
    // Time bonus
    const timeGain = matches.length * CONFIG.timePerMatch + (state.combo - 1) * CONFIG.timePerCombo;
    state.timeLeft = Math.min(state.maxTime, state.timeLeft + timeGain);
    updateTimeBar();
    
    // Screen shake for big combos
    if (state.combo >= 3) {
        state.shakeTime = 300 + state.combo * 100;
    }
    
    // Show combo popup
    if (state.combo > 1) {
        showComboPopup(state.combo, points);
    }
    
    // Create particles for each match
    matches.forEach(match => {
        const gem = match.gems[0];
        const color = GEM_COLORS[gem.type].glow;
        createParticles(gem.getCenterX(), gem.getCenterY(), color);
    });
    
    // Animate clear
    animateClear(matches, () => {
        state.clearing = false;
        applyGravity();
    });
}
