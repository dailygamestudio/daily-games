<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Neon Tron - Day 54</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a12; 
            color: #00ffff; 
            font-family: 'Courier New', monospace; 
            overflow: hidden; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
        }
        canvas { 
            border: 2px solid #00ffff; 
            box-shadow: 0 0 20px #00ffff, inset 0 0 20px rgba(0,255,255,0.1); 
            background: #050510; 
            display: block; 
        }
        #ui { 
            position: fixed; 
            top: 10px; 
            left: 50%; 
            transform: translateX(-50%); 
            display: flex; 
            gap: 30px; 
            z-index: 10; 
            pointer-events: none; 
        }
        .stat { 
            text-shadow: 0 0 5px #00ffff; 
            font-size: 1.2rem; 
        }
        .stat span { color: #ff00ff; }
        #overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.9); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            z-index: 100; 
            opacity: 0; 
            pointer-events: none; 
            transition: opacity 0.3s; 
        }
        #overlay.visible { opacity: 1; pointer-events: auto; }
        #overlay h1 { 
            font-size: 3rem; 
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff; 
            margin-bottom: 10px; 
            background: linear-gradient(90deg, #00ffff, #ff00ff, #00ffff); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            animation: pulse 2s infinite; 
        }
        @keyframes pulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.5); } }
        #overlay p { color: #aaa; margin-bottom: 30px; font-size: 1.1rem; }
        .btn { 
            padding: 15px 40px; 
            font-size: 1.2rem; 
            border: 2px solid #00ffff; 
            background: transparent; 
            color: #00ffff; 
            cursor: pointer; 
            margin: 10px; 
            transition: all 0.2s; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            font-family: inherit; 
        }
        .btn:hover { background: #00ffff; color: #000; box-shadow: 0 0 20px #00ffff; }
        .btn:active { transform: scale(0.95); }
        .btn.quit { border-color: #ff0066; color: #ff0066; }
        .btn.quit:hover { background: #ff0066; box-shadow: 0 0 20px #ff0066; }
        #controlsHint { 
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #666;
            font-size: 0.9rem;
            text-align: center;
            pointer-events: none;
            z-index: 5;
        }
        #pauseOverlay, #gameOverOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        #pauseOverlay.visible, #gameOverOverlay.visible { opacity: 1; pointer-events: auto; }
        #pauseOverlay h1, #gameOverOverlay h1 {
            font-size: 3rem;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00ffff, #ff00ff, #00ffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #gameOverOverlay h1 { background: linear-gradient(90deg, #ff0066, #ffcc00, #ff0066); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #pauseOverlay p, #gameOverOverlay p { color: #aaa; margin-bottom: 30px; font-size: 1.1rem; }
        #finalScore { color: #ff00ff; font-size: 1.5rem; margin-bottom: 20px; text-shadow: 0 0 10px #ff00ff; }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="ui">
        <div class="stat">SCORE: <span id="score">0</span></div>
        <div class="stat">HIGH: <span id="highScore">0</span></div>
    </div>
    <div id="controlsHint">ARROWS / WASD to move | ESC / P to pause | Swipe on mobile</div>
    <div id="overlay" class="visible">
        <h1>NEON TRON</h1>
        <p>Survive the grid. Don't hit the trails.</p>
        <button class="btn" id="startBtn">START GAME</button>
    </div>
    <div id="pauseOverlay">
        <h1>PAUSED</h1>
        <p>Game is paused</p>
        <button class="btn" id="resumeBtn">RESUME</button>
        <button class="btn quit" id="quitPauseBtn">QUIT TO MENU</button>
    </div>
    <div id="gameOverOverlay">
        <h1>GAME OVER</h1>
        <p>You crashed into the neon void</p>
        <div id="finalScore">Score: 0</div>
        <button class="btn" id="retryBtn">RETRY</button>
        <button class="btn quit" id="menuBtn">MAIN MENU</button>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const GRID_SIZE = 20;
        const COLS = canvas.width / GRID_SIZE;
        const ROWS = canvas.height / GRID_SIZE;
        
        let player = null;
        let trails = [];
        let score = 0;
        let highScore = parseInt(localStorage.getItem('tronHighScore')) || 0;
        let gameLoop = null;
        let isPaused = false;
        let isGameOver = false;
        let lastTime = 0;
        const GAME_SPEED = 100; // ms per move
        
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const overlay = document.getElementById('overlay');
        const pauseOverlay = document.getElementById('pauseOverlay');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const finalScoreEl = document.getElementById('finalScore');
        
        highScoreEl.textContent = highScore;
        
        function initPlayer() {
            return {
                x: Math.floor(COLS / 2),
                y: Math.floor(ROWS / 2),
                dx: 1,
                dy: 0,
                color: '#00ffff',
                trail: [],
                nextDir: {x: 1, y: 0}
            };
        }
        
        function startGame() {
            player = initPlayer();
            trails = [player];
            score = 0;
            scoreEl.textContent = score;
            isGameOver = false;
            isPaused = false;
            overlay.classList.remove('visible');
            pauseOverlay.classList.remove('visible');
            gameOverOverlay.classList.remove('visible');
            if (gameLoop) cancelAnimationFrame(gameLoop);
            lastTime = performance.now();
            gameLoop = requestAnimationFrame(update);
        }
        
        function pauseGame() {
            if (isGameOver || isPaused) return;
            isPaused = true;
            pauseOverlay.classList.add('visible');
        }
        
        function resumeGame() {
            if (!isPaused) return;
            isPaused = false;
            pauseOverlay.classList.remove('visible');
            lastTime = performance.now();
            gameLoop = requestAnimationFrame(update);
        }
        
        function quitToMenu() {
            isPaused = false;
            isGameOver = true;
            pauseOverlay.classList.remove('visible');
            gameOverOverlay.classList.remove('visible');
            overlay.classList.add('visible');
            if (gameLoop) cancelAnimationFrame(gameLoop);
        }
        
        function showStartScreen() {
            quitToMenu();
        }
        
        function gameOver() {
            isGameOver = true;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('tronHighScore', highScore);
                highScoreEl.textContent = highScore;
            }
            finalScoreEl.textContent = `Score: ${score}`;
            gameOverOverlay.classList.add('visible');
        }
        
        function update(time) {
            if (isGameOver || isPaused) return;
            
            const delta = time - lastTime;
            if (delta >= GAME_SPEED) {
                movePlayer();
                checkCollisions();
                draw();
                lastTime = time;
            }
            gameLoop = requestAnimationFrame(update);
        }
        
        function movePlayer() {
            // Apply queued direction change
            player.dx = player.nextDir.x;
            player.dy = player.nextDir.y;
            
            // Move
            player.x += player.dx;
            player.y += player.dy;
            
            // Add current position to trail
            player.trail.push({x: player.x, y: player.y});
            score++;
            scoreEl.textContent = score;
        }
        
        function checkCollisions() {
            // Wall collision
            if (player.x < 0 || player.x >= COLS || player.y < 0 || player.y >= ROWS) {
                gameOver();
                return;
            }
            
            // Trail collision (check all trails including own)
            for (const p of trails) {
                for (const segment of p.trail) {
                    if (segment.x === player.x && segment.y === player.y) {
                        // Allow hitting the very last segment (head) of own trail? No, instant death.
                        // But we just added current position to trail, so we'll hit ourselves immediately.
                        // So we should check against trail excluding the last added segment? 
                        // Actually in Tron, you die if you hit any trail including your own.
                        // Since we add current position to trail BEFORE checking, we'll always collide with ourselves.
                        // Fix: check collision BEFORE adding to trail, or check against trail excluding the newest segment.
                        // Let's change: check collision first, then add to trail.
                        // But we already added in movePlayer. Let's restructure: check collision in movePlayer before adding.
                        // We'll move the trail addition after collision check.
                        gameOver();
                        return;
                    }
                }
            }
        }
        
        function draw() {
            // Clear with slight trail fade effect
            ctx.fillStyle = 'rgba(5,5,16,0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw grid lines
            ctx.strokeStyle = 'rgba(0,255,255,0.05)';
            ctx.lineWidth = 1;
            for (let x = 0; x <= canvas.width; x += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y <= canvas.height; y += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            
            // Draw trails
            for (const p of trails) {
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 10;
                for (const segment of p.trail) {
                    const px = segment.x * GRID_SIZE;
                    const py = segment.y * GRID_SIZE;
                    ctx.fillRect(px + 1, py + 1, GRID_SIZE - 2, GRID_SIZE - 2);
                }
                ctx.shadowBlur = 0;
            }
            
            // Draw player head (brighter)
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = player.color;
            ctx.shadowBlur = 15;
            ctx.fillRect(player.x * GRID_SIZE + 1, player.y * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2);
            ctx.shadowBlur = 0;
        }
        
        // Input handling
        document.addEventListener('keydown', (e) => {
            if (isGameOver) return;
            
            const key = e.key.toLowerCase();
            if (key === 'escape' || key === 'p') {
                if (isPaused) resumeGame();
                else pauseGame();
                return;
            }
            
            if (isPaused) return;
            
            let newDir = null;
            if (key === 'arrowup' || key === 'w') newDir = {x: 0, y: -1};
            else if (key === 'arrowdown' || key === 's') newDir = {x: 0, y: 1};
            else if (key === 'arrowleft' || key === 'a') newDir = {x: -1, y: 0};
            else if (key === 'arrowright' || key === 'd') newDir = {x: 1, y: 0};
            
            if (newDir) {
                // Prevent 180-degree turns
                if (!(newDir.x === -player.dx && newDir.y === -player.dy)) {
                    player.nextDir = newDir;
                }
            }
        });
        
        // Touch controls
        let touchStartX = 0;
        let touchStartY = 0;
        
        canvas.addEventListener('touchstart', (e) => {
            if (isGameOver || isPaused) return;
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, {passive: false});
        
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault(); // Prevent scrolling
        }, {passive: false});
        
        canvas.addEventListener('touchend', (e) => {
            if (isGameOver || isPaused) return;
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;
            
            if (Math.abs(dx) > Math.abs(dy)) {
                // Horizontal swipe
                if (dx > 30 && player.dx !== -1) player.nextDir = {x: 1, y: 0};
                else if (dx < -30 && player.dx !== 1) player.nextDir = {x: -1, y: 0};
            } else {
                // Vertical swipe
                if (dy > 30 && player.dy !== -1) player.nextDir = {x: 0, y: 1};
                else if (dy < -30 && player.dy !== 1) player.nextDir = {x: 0, y: -1};
            }
        }, {passive: false});
        
        // Button events
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('resumeBtn').addEventListener('click', resumeGame);
        document.getElementById('quitPauseBtn').addEventListener('click', quitToMenu);
        document.getElementById('retryBtn').addEventListener('click', startGame);
        document.getElementById('menuBtn').addEventListener('click', showStartScreen);
        
        // Initial draw
        draw();
    </script>
</body>
</html>
