<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Neon Tron - Day 54</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a1a; 
            font-family: 'Orbitron', 'Courier New', monospace; 
            color: #00ffff; 
            overflow: hidden; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #gameCanvas { 
            border: 3px solid #00ffff; 
            box-shadow: 0 0 30px #00ffff, inset 0 0 30px rgba(0,255,255,0.1);
            background: #050515;
            display: block;
        }
        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(10,10,30,0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            backdrop-filter: blur(5px);
        }
        .overlay.hidden { display: none; }
        h1 { 
            font-size: 3rem; 
            font-weight: 900; 
            text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
            margin-bottom: 1rem;
            letter-spacing: 0.2em;
        }
        .score-display {
            font-size: 1.5rem;
            margin: 1rem 0;
            text-shadow: 0 0 10px #00ffff;
        }
        .high-score {
            font-size: 1.2rem;
            color: #ffcc00;
            text-shadow: 0 0 10px #ffcc00;
            margin-bottom: 2rem;
        }
        button {
            background: linear-gradient(135deg, #003333, #006666);
            border: 2px solid #00ffff;
            color: #00ffff;
            padding: 1rem 3rem;
            font-family: 'Orbitron', monospace;
            font-size: 1.2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            margin: 0.5rem;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(0,255,255,0.3);
            min-width: 200px;
        }
        button:hover, button:focus {
            background: linear-gradient(135deg, #006666, #00ffff);
            color: #000;
            box-shadow: 0 0 30px #00ffff;
            transform: scale(1.05);
        }
        button:active { transform: scale(0.98); }
        .controls-hint {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #88ffff;
            text-align: center;
            line-height: 1.8;
        }
        .controls-hint kbd {
            background: rgba(0,255,255,0.1);
            border: 1px solid #00ffff;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            margin: 0 0.2rem;
        }
        #touchControls {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            gap: 10px;
        }
        .touch-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(0,255,255,0.1);
            border: 2px solid #00ffff;
            color: #00ffff;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }
        .touch-row { display: flex; gap: 10px; }
        .touch-row.center { justify-content: center; }
        @media (max-width: 768px) {
            #touchControls { display: flex; flex-direction: column; }
            h1 { font-size: 2rem; }
            button { padding: 0.8rem 2rem; font-size: 1rem; min-width: 180px; }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="startScreen" class="overlay">
        <h1>NEON TRON</h1>
        <div class="high-score">HIGH SCORE: <span id="highScoreDisplay">0</span></div>
        <button id="startBtn">START GAME</button>
        <div class="controls-hint">
            <p>Desktop: <kbd>Arrow Keys</kbd> or <kbd>WASD</kbd> to move | <kbd>ESC</kbd> / <kbd>P</kbd> to pause</p>
            <p>Mobile: Use on-screen controls</p>
        </div>
    </div>

    <div id="pauseOverlay" class="overlay hidden">
        <h1>PAUSED</h1>
        <button id="resumeBtn">RESUME</button>
        <button id="quitPauseBtn">QUIT TO MENU</button>
    </div>

    <div id="gameOverOverlay" class="overlay hidden">
        <h1>GAME OVER</h1>
        <div class="score-display">FINAL SCORE: <span id="finalScore">0</span></div>
        <div class="high-score">HIGH SCORE: <span id="gameOverHighScore">0</span></div>
        <button id="retryBtn">RETRY</button>
        <button id="mainMenuBtn">MAIN MENU</button>
    </div>

    <div id="touchControls">
        <div class="touch-row center"><button class="touch-btn" data-dir="up">▲</button></div>
        <div class="touch-row">
            <button class="touch-btn" data-dir="left">◄</button>
            <button class="touch-btn" data-dir="right">►</button>
        </div>
        <div class="touch-row center"><button class="touch-btn" data-dir="down">▼</button></div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Game constants
        const GRID_SIZE = 20;
        let COLS, ROWS;
        
        // Game state
        let player = { x: 0, y: 0, dx: 1, dy: 0, trail: [], color: '#00ffff', nextDir: null };
        let score = 0;
        let highScore = parseInt(localStorage.getItem('tronHighScore')) || 0;
        let gameLoopId = null;
        let gameSpeed = 100;
        let isPaused = false;
        let isGameOver = false;
        let lastTime = 0;
        
        // DOM elements
        const startScreen = document.getElementById('startScreen');
        const pauseOverlay = document.getElementById('pauseOverlay');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const highScoreDisplay = document.getElementById('highScoreDisplay');
        const finalScoreEl = document.getElementById('finalScore');
        const gameOverHighScore = document.getElementById('gameOverHighScore');
        
        // Initialize high score display
        highScoreDisplay.textContent = highScore;
        gameOverHighScore.textContent = highScore;
        
        // Resize canvas
        function resizeCanvas() {
            const maxWidth = window.innerWidth * 0.95;
            const maxHeight = window.innerHeight * 0.9;
            const size = Math.min(maxWidth, maxHeight, 600);
            
            COLS = Math.floor(size / GRID_SIZE);
            ROWS = Math.floor(size / GRID_SIZE);
            
            canvas.width = COLS * GRID_SIZE;
            canvas.height = ROWS * GRID_SIZE;
            
            // Center player if game not started
            if (!gameLoopId) {
                player.x = Math.floor(COLS / 2);
                player.y = Math.floor(ROWS / 2);
            }
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        
        // Game functions
        function startGame() {
            // Reset game state
            player.x = Math.floor(COLS / 2);
            player.y = Math.floor(ROWS / 2);
            player.dx = 1;
            player.dy = 0;
            player.nextDir = null;
            player.trail = [{ x: player.x, y: player.y }];
            score = 0;
            gameSpeed = 100;
            isGameOver = false;
            isPaused = false;
            lastTime = 0;
            
            // Hide overlays
            startScreen.classList.add('hidden');
            pauseOverlay.classList.add('hidden');
            gameOverOverlay.classList.add('hidden');
            
            // Start game loop
            if (gameLoopId) cancelAnimationFrame(gameLoopId);
            gameLoopId = requestAnimationFrame(gameLoop);
        }
        
        function pauseGame() {
            if (isGameOver || isPaused) return;
            isPaused = true;
            pauseOverlay.classList.remove('hidden');
        }
        
        function resumeGame() {
            if (!isPaused) return;
            isPaused = false;
            pauseOverlay.classList.add('hidden');
            lastTime = 0; // Reset timer to avoid jump
            gameLoopId = requestAnimationFrame(gameLoop);
        }
        
        function quitToMenu() {
            isPaused = false;
            pauseOverlay.classList.add('hidden');
            gameOverOverlay.classList.add('hidden');
            startScreen.classList.remove('hidden');
            if (gameLoopId) cancelAnimationFrame(gameLoopId);
            gameLoopId = null;
        }
        
        function showStartScreen() {
            quitToMenu();
        }
        
        function gameLoop(timestamp) {
            if (isPaused || isGameOver) return;
            
            if (!lastTime) lastTime = timestamp;
            const delta = timestamp - lastTime;
            
            if (delta >= gameSpeed) {
                update();
                draw();
                lastTime = timestamp;
            }
            
            gameLoopId = requestAnimationFrame(gameLoop);
        }
        
        function update() {
            // Apply queued direction change
            if (player.nextDir) {
                const { dx, dy } = player.nextDir;
                // Prevent 180-degree turns
                if (!(dx === -player.dx && dy === -player.dy) && !(dx === player.dx && dy === player.dy)) {
                    player.dx = dx;
                    player.dy = dy;
                }
                player.nextDir = null;
            }
            
            // Move player
            player.x += player.dx;
            player.y += player.dy;
            
            // Check wall collision
            if (player.x < 0 || player.x >= COLS || player.y < 0 || player.y >= ROWS) {
                gameOver();
                return;
            }
            
            // Check self collision (skip head)
            for (let i = 0; i < player.trail.length - 1; i++) {
                if (player.trail[i].x === player.x && player.trail[i].y === player.y) {
                    gameOver();
                    return;
                }
            }
            
            // Add new position to trail
            player.trail.push({ x: player.x, y: player.y });
            
            // Increase score and speed
            score += 10;
            if (score % 500 === 0 && gameSpeed > 50) {
                gameSpeed -= 5;
            }
        }
        
        function draw() {
            // Clear with slight trail effect
            ctx.fillStyle = 'rgba(5,5,21,0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw grid lines
            ctx.strokeStyle = 'rgba(0,255,255,0.03)';
            ctx.lineWidth = 1;
            for (let x = 0; x <= canvas.width; x += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y <= canvas.height; y += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            
            // Draw trail
            player.trail.forEach((segment, index) => {
                const intensity = index / player.trail.length;
                const alpha = 0.3 + intensity * 0.7;
                const size = GRID_SIZE - 2;
                
                ctx.fillStyle = `rgba(0, 255, 255, ${alpha})`;
                ctx.shadowColor = '#00ffff';
                ctx.shadowBlur = 10 * intensity;
                
                const px = segment.x * GRID_SIZE + 1;
                const py = segment.y * GRID_SIZE + 1;
                ctx.fillRect(px, py, size, size);
            });
            
            // Draw head with glow
            const headX = player.x * GRID_SIZE + 1;
            const headY = player.y * GRID_SIZE + 1;
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = '#00ffff';
            ctx.shadowBlur = 20;
            ctx.fillRect(headX, headY, GRID_SIZE - 2, GRID_SIZE - 2);
            ctx.shadowBlur = 0;
        }
        
        function gameOver() {
            isGameOver = true;
            cancelAnimationFrame(gameLoopId);
            gameLoopId = null;
            
            // Update high score
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('tronHighScore', highScore);
                highScoreDisplay.textContent = highScore;
                gameOverHighScore.textContent = highScore;
            }
            
            finalScoreEl.textContent = score;
            gameOverOverlay.classList.remove('hidden');
        }
        
        // Input handling
        function handleKeydown(e) {
            if (isGameOver) return;
            
            const key = e.key.toLowerCase();
            let newDir = null;
            
            switch(key) {
                case 'arrowup': case 'w': newDir = { dx: 0, dy: -1 }; break;
                case 'arrowdown': case 's': newDir = { dx: 0, dy: 1 }; break;
                case 'arrowleft': case 'a': newDir = { dx: -1, dy: 0 }; break;
                case 'arrowright': case 'd': newDir = { dx: 1, dy: 0 }; break;
                case 'escape': case 'p':
                    if (isPaused) resumeGame();
                    else pauseGame();
                    return;
            }
            
            if (newDir) {
                e.preventDefault();
                player.nextDir = newDir;
            }
        }
        
        document.addEventListener('keydown', handleKeydown);
        
        // Touch controls
        const touchButtons = document.querySelectorAll('.touch-btn');
        touchButtons.forEach(btn => {
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (isGameOver || isPaused) return;
                const dir = btn.dataset.dir;
                const dirMap = {
                    up: { dx: 0, dy: -1 },
                    down: { dx: 0, dy: 1 },
                    left: { dx: -1, dy: 0 },
                    right: { dx: 1, dy: 0 }
                };
                if (dirMap[dir]) player.nextDir = dirMap[dir];
            }, { passive: false });
            
            btn.addEventListener('click', (e) => {
                if (isGameOver || isPaused) return;
                const dir = btn.dataset.dir;
                const dirMap = {
                    up: { dx: 0, dy: -1 },
                    down: { dx: 0, dy: 1 },
                    left: { dx: -1, dy: 0 },
                    right: { dx: 1, dy: 0 }
                };
                if (dirMap[dir]) player.nextDir = dirMap[dir];
            });
        });
        
        // Button event listeners
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('resumeBtn').addEventListener('click', resumeGame);
        document.getElementById('quitPauseBtn').addEventListener('click', quitToMenu);
        document.getElementById('retryBtn').addEventListener('click', startGame);
        document.getElementById('mainMenuBtn').addEventListener('click', showStartScreen);
        
        // Prevent scrolling on game area
        canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
        
        // Initial draw
        function drawStartScreen() {
            ctx.fillStyle = '#050515';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw grid
            ctx.strokeStyle = 'rgba(0,255,255,0.05)';
            ctx.lineWidth = 1;
            for (let x = 0; x <= canvas.width; x += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y <= canvas.height; y += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }
        drawStartScreen();
    </script>
</body>
</html>
