<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Neon Tron - Day 54</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a12; 
            color: #00ffff; 
            font-family: 'Courier New', monospace; 
            overflow: hidden; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
        }
        canvas { 
            border: 2px solid #00ffff; 
            box-shadow: 0 0 20px #00ffff, inset 0 0 20px rgba(0,255,255,0.1); 
            background: #050510; 
            display: block; 
        }
        #ui { 
            position: fixed; 
            top: 10px; 
            left: 50%; 
            transform: translateX(-50%); 
            display: flex; 
            gap: 30px; 
            z-index: 10; 
            pointer-events: none; 
        }
        .stat { 
            text-shadow: 0 0 5px #00ffff; 
            font-size: 1.2rem; 
        }
        .stat span { color: #ff00ff; }
        #overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.9); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            z-index: 100; 
            opacity: 0; 
            pointer-events: none; 
            transition: opacity 0.3s; 
        }
        #overlay.visible { opacity: 1; pointer-events: auto; }
        .overlay-content { text-align: center; }
        .overlay-title { font-size: 3rem; color: #00ffff; text-shadow: 0 0 20px #00ffff; margin-bottom: 1rem; }
        .overlay-subtitle { font-size: 1.5rem; color: #ff00ff; text-shadow: 0 0 10px #ff00ff; margin-bottom: 2rem; }
        .btn { 
            background: transparent; 
            border: 2px solid #00ffff; 
            color: #00ffff; 
            padding: 12px 30px; 
            font-size: 1.2rem; 
            font-family: inherit; 
            cursor: pointer; 
            transition: all 0.2s; 
            text-shadow: 0 0 5px #00ffff; 
        }
        .btn:hover { background: #00ffff; color: #000; box-shadow: 0 0 15px #00ffff; }
        .btn:active { transform: scale(0.95); }
        #pauseOverlay, #gameOverOverlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.9); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            z-index: 100; 
            opacity: 0; 
            pointer-events: none; 
            transition: opacity 0.3s; 
        }
        #pauseOverlay.visible, #gameOverOverlay.visible { opacity: 1; pointer-events: auto; }
        .btn-container { display: flex; flex-direction: column; gap: 15px; }
        .btn-secondary { border-color: #ff00ff; color: #ff00ff; text-shadow: 0 0 5px #ff00ff; }
        .btn-secondary:hover { background: #ff00ff; color: #000; box-shadow: 0 0 15px #ff00ff; }
        #finalScore { font-size: 2rem; color: #00ffff; margin-bottom: 1rem; text-shadow: 0 0 10px #00ffff; }
        #highScore { font-size: 1.5rem; color: #ff00ff; margin-bottom: 2rem; text-shadow: 0 0 10px #ff00ff; }
        @media (max-width: 600px) {
            .overlay-title { font-size: 2rem; }
            .overlay-subtitle { font-size: 1.2rem; }
            .btn { padding: 10px 20px; font-size: 1rem; }
            #ui { gap: 15px; top: 5px; }
            .stat { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div id="ui">
        <div class="stat">SCORE: <span id="score">0</span></div>
        <div class="stat">HI-SCORE: <span id="highScoreDisplay">0</span></div>
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <div id="overlay" class="visible">
        <div class="overlay-content">
            <h1 class="overlay-title">NEON TRON</h1>
            <p class="overlay-subtitle">LIGHT CYCLE ARENA</p>
            <button type="button" class="btn" id="startBtn">START GAME</button>
        </div>
    </div>
    
    <div id="pauseOverlay">
        <div class="overlay-content">
            <h1 class="overlay-title">PAUSED</h1>
            <div class="btn-container">
                <button type="button" class="btn" id="resumeBtn">RESUME</button>
                <button type="button" class="btn btn-secondary" id="quitBtn">QUIT TO MENU</button>
            </div>
        </div>
    </div>
    
    <div id="gameOverOverlay">
        <div class="overlay-content">
            <h1 class="overlay-title">GAME OVER</h1>
            <div id="finalScore">SCORE: 0</div>
            <div id="highScore">BEST: 0</div>
            <div class="btn-container">
                <button type="button" class="btn" id="retryBtn">RETRY</button>
                <button type="button" class="btn btn-secondary" id="menuBtn">MAIN MENU</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;
        const GRID_SIZE = 4;
        const COLS = W / GRID_SIZE;
        const ROWS = H / GRID_SIZE;
        
        let grid = [];
        let player = { x: 0, y: 0, dx: 0, dy: 0, trail: [], color: '#00ffff' };
        let score = 0;
        let highScore = parseInt(localStorage.getItem('tronHighScore')) || 0;
        let gameLoop = null;
        let isPaused = false;
        let isGameOver = false;
        let lastTime = 0;
        let speed = 8;
        let frameCount = 0;
        
        const startOverlay = document.getElementById('overlay');
        const pauseOverlay = document.getElementById('pauseOverlay');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const scoreEl = document.getElementById('score');
        const highScoreDisplay = document.getElementById('highScoreDisplay');
        const finalScoreEl = document.getElementById('finalScore');
        const highScoreEl = document.getElementById('highScore');
        
        // Initialize grid
        function initGrid() {
            grid = [];
            for (let x = 0; x < COLS; x++) {
                grid[x] = [];
                for (let y = 0; y < ROWS; y++) {
                    grid[x][y] = 0;
                }
            }
        }
        
        function startGame() {
            // Reset game state
            initGrid();
            player.x = Math.floor(COLS / 4);
            player.y = Math.floor(ROWS / 2);
            player.dx = 1;
            player.dy = 0;
            player.trail = [];
            score = 0;
            speed = 8;
            frameCount = 0;
            isGameOver = false;
            isPaused = false;
            
            // Update UI
            scoreEl.textContent = score;
            highScoreDisplay.textContent = highScore;
            
            // Hide overlays
            startOverlay.classList.remove('visible');
            pauseOverlay.classList.remove('visible');
            gameOverOverlay.classList.remove('visible');
            
            // Start game loop
            if (gameLoop) cancelAnimationFrame(gameLoop);
            lastTime = performance.now();
            gameLoop = requestAnimationFrame(gameLoopFn);
        }
        
        function gameLoopFn(time) {
            if (isGameOver) return;
            
            const delta = time - lastTime;
            const interval = 1000 / speed;
            
            if (delta >= interval) {
                lastTime = time - (delta % interval);
                update();
                draw();
            }
            
            if (!isPaused && !isGameOver) {
                gameLoop = requestAnimationFrame(gameLoopFn);
            }
        }
        
        function update() {
            if (isPaused || isGameOver) return;
            
            frameCount++;
            
            // Move player
            const newX = player.x + player.dx;
            const newY = player.y + player.dy;
            
            // Check collisions
            if (newX < 0 || newX >= COLS || newY < 0 || newY >= ROWS || grid[newX][newY] === 1) {
                gameOver();
                return;
            }
            
            // Update position
            player.x = newX;
            player.y = newY;
            
            // Add to trail
            player.trail.push({ x: player.x, y: player.y });
            grid[player.x][player.y] = 1;
            
            // Increase score
            score++;
            scoreEl.textContent = score;
            
            // Increase speed every 100 points
            if (score % 100 === 0 && speed < 30) {
                speed += 1;
            }
        }
        
        function draw() {
            // Clear with slight trail effect
            ctx.fillStyle = 'rgba(5,5,16,0.3)';
            ctx.fillRect(0, 0, W, H);
            
            // Draw grid lines
            ctx.strokeStyle = 'rgba(0,255,255,0.03)';
            ctx.lineWidth = 1;
            for (let x = 0; x <= W; x += GRID_SIZE * 10) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, H);
                ctx.stroke();
            }
            for (let y = 0; y <= H; y += GRID_SIZE * 10) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(W, y);
                ctx.stroke();
            }
            
            // Draw trail
            ctx.fillStyle = player.color;
            ctx.shadowColor = player.color;
            ctx.shadowBlur = 10;
            
            for (let i = 0; i < player.trail.length; i++) {
                const segment = player.trail[i];
                const alpha = 0.3 + (i / player.trail.length) * 0.7;
                ctx.globalAlpha = alpha;
                ctx.fillRect(
                    segment.x * GRID_SIZE,
                    segment.y * GRID_SIZE,
                    GRID_SIZE - 1,
                    GRID_SIZE - 1
                );
            }
            
            // Draw player head
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 15;
            ctx.fillRect(
                player.x * GRID_SIZE,
                player.y * GRID_SIZE,
                GRID_SIZE,
                GRID_SIZE
            );
            
            ctx.shadowBlur = 0;
        }
        
        function gameOver() {
            isGameOver = true;
            cancelAnimationFrame(gameLoop);
            
            // Update high score
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('tronHighScore', highScore);
                highScoreDisplay.textContent = highScore;
            }
            
            finalScoreEl.textContent = `SCORE: ${score}`;
            highScoreEl.textContent = `BEST: ${highScore}`;
            gameOverOverlay.classList.add('visible');
        }
        
        function pauseGame() {
            if (isGameOver) return;
            isPaused = true;
            pauseOverlay.classList.add('visible');
        }
        
        function resumeGame() {
            isPaused = false;
            pauseOverlay.classList.remove('visible');
            lastTime = performance.now();
            gameLoop = requestAnimationFrame(gameLoopFn);
        }
        
        function quitToMenu() {
            isPaused = false;
            isGameOver = true;
            cancelAnimationFrame(gameLoop);
            pauseOverlay.classList.remove('visible');
            showStartScreen();
        }
        
        function showStartScreen() {
            startOverlay.classList.add('visible');
            gameOverOverlay.classList.remove('visible');
        }
        
        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (isGameOver) return;
            
            // Pause
            if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
                if (isPaused) {
                    resumeGame();
                } else {
                    pauseGame();
                }
                return;
            }
            
            if (isPaused) return;
            
            // Movement
            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (player.dy !== 1) { player.dx = 0; player.dy = -1; }
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (player.dy !== -1) { player.dx = 0; player.dy = 1; }
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (player.dx !== 1) { player.dx = -1; player.dy = 0; }
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (player.dx !== -1) { player.dx = 1; player.dy = 0; }
                    break;
            }
        });
        
        // Touch controls
        let touchStartX = 0;
        let touchStartY = 0;
        
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: false });
        
        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (isGameOver || isPaused) return;
            
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;
            
            if (Math.abs(dx) > Math.abs(dy)) {
                // Horizontal swipe
                if (dx > 30 && player.dx !== -1) { player.dx = 1; player.dy = 0; }
                else if (dx < -30 && player.dx !== 1) { player.dx = -1; player.dy = 0; }
            } else {
                // Vertical swipe
                if (dy > 30 && player.dy !== -1) { player.dx = 0; player.dy = 1; }
                else if (dy < -30 && player.dy !== 1) { player.dx = 0; player.dy = -1; }
            }
        }, { passive: false });
        
        // Button event listeners
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('resumeBtn').addEventListener('click', resumeGame);
        document.getElementById('quitBtn').addEventListener('click', quitToMenu);
        document.getElementById('retryBtn').addEventListener('click', startGame);
        document.getElementById('menuBtn').addEventListener('click', showStartScreen);
        
        // Initialize high score display
        highScoreDisplay.textContent = highScore;
    </script>
</body>
</html>
