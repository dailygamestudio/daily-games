<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Neon Tron - Day 54</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a1a; 
            font-family: 'Orbitron', 'Courier New', monospace; 
            color: #00ffff; 
            overflow: hidden; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #gameCanvas { 
            border: 3px solid #00ffff; 
            box-shadow: 0 0 30px #00ffff, inset 0 0 30px rgba(0,255,255,0.1);
            background: #050515;
            display: block;
            max-width: 100%;
            max-height: 100%;
        }
        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(10,10,26,0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            backdrop-filter: blur(5px);
        }
        .overlay.hidden { display: none !important; }
        .overlay h1 { 
            font-size: 3rem; 
            font-weight: 900; 
            text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #00ffff, #ff00ff, #ffff00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .overlay p { font-size: 1.2rem; margin-bottom: 2rem; opacity: 0.8; }
        .btn {
            padding: 1rem 3rem;
            font-family: 'Orbitron', monospace;
            font-size: 1.2rem;
            font-weight: 700;
            border: 2px solid #00ffff;
            background: rgba(0,255,255,0.1);
            color: #00ffff;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0.5rem;
        }
        .btn:hover { 
            background: #00ffff; 
            color: #0a0a1a; 
            box-shadow: 0 0 20px #00ffff;
            transform: scale(1.05);
        }
        .btn:active { transform: scale(0.95); }
        .btn.secondary { border-color: #ff00ff; color: #ff00ff; }
        .btn.secondary:hover { background: #ff00ff; color: #0a0a1a; box-shadow: 0 0 20px #ff00ff; }
        .score-display { 
            position: fixed; 
            top: 20px; 
            left: 50%; 
            transform: translateX(-50%);
            font-size: 1.5rem; 
            font-weight: 700;
            text-shadow: 0 0 10px #00ffff;
            z-index: 5;
        }
        .high-score { 
            position: fixed; 
            top: 20px; 
            right: 20px; 
            font-size: 1rem; 
            opacity: 0.7;
        }
        .controls-hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.9rem;
            opacity: 0.6;
            display: flex;
            gap: 2rem;
        }
        .touch-controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: 1rem;
        }
        .touch-btn {
            width: 60px;
            height: 60px;
            border: 2px solid #00ffff;
            background: rgba(0,255,255,0.1);
            color: #00ffff;
            font-size: 1.5rem;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .touch-btn:active { background: #00ffff; color: #0a0a1a; }
        @media (max-width: 768px) {
            .touch-controls { display: flex; }
            .controls-hint { display: none; }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <div class="score-display">SCORE: <span id="score">0</span></div>
    <div class="high-score">HIGH: <span id="highScore">0</span></div>
    <div class="controls-hint">ARROWS/WASD to move | ESC/P to pause</div>
    <div class="touch-controls">
        <button class="touch-btn" data-dir="up">▲</button>
        <button class="touch-btn" data-dir="left">◄</button>
        <button class="touch-btn" data-dir="right">►</button>
        <button class="touch-btn" data-dir="down">▼</button>
    </div>

    <div id="startOverlay" class="overlay">
        <h1>NEON TRON</h1>
        <p>Survive the grid. Don't hit walls or trails.</p>
        <button class="btn" id="startBtn">START GAME</button>
    </div>

    <div id="pauseOverlay" class="overlay hidden">
        <h1>PAUSED</h1>
        <button class="btn" id="resumeBtn">RESUME</button>
        <button class="btn secondary" id="quitBtn">QUIT TO MENU</button>
    </div>

    <div id="gameOverOverlay" class="overlay hidden">
        <h1>GAME OVER</h1>
        <p>Final Score: <span id="finalScore">0</span></p>
        <button class="btn" id="retryBtn">RETRY</button>
        <button class="btn secondary" id="menuBtn">MAIN MENU</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const GRID_SIZE = 20;
        const COLS = canvas.width / GRID_SIZE;
        const ROWS = canvas.height / GRID_SIZE;
        
        let player = { x: 0, y: 0, dx: 1, dy: 0, trail: [], color: '#00ffff' };
        let score = 0;
        let highScore = parseInt(localStorage.getItem('tronHighScore')) || 0;
        let animationId = null;
        let isPaused = false;
        let isGameOver = false;
        let nextDirection = { dx: 1, dy: 0 };
        let trailMap = [];
        let lastUpdateTime = 0;
        const GAME_SPEED = 100; // ms per move
        
        document.getElementById('highScore').textContent = highScore;
        
        function hideOverlay(id) {
            const overlay = document.getElementById(id);
            if (overlay) {
                overlay.classList.add('hidden');
            }
        }
        
        function showOverlay(id) {
            const overlay = document.getElementById(id);
            if (overlay) {
                overlay.classList.remove('hidden');
            }
        }
        
        function initTrailMap() {
            trailMap = new Array(COLS);
            for (let i = 0; i < COLS; i++) {
                trailMap[i] = new Array(ROWS).fill(false);
            }
        }
        
        function startGame() {
            // Reset game state
            player.x = Math.floor(COLS / 2);
            player.y = Math.floor(ROWS / 2);
            player.dx = 1;
            player.dy = 0;
            player.trail = [];
            nextDirection = { dx: 1, dy: 0 };
            score = 0;
            isGameOver = false;
            isPaused = false;
            
            initTrailMap();
            document.getElementById('score').textContent = score;
            
            hideOverlay('startOverlay');
            hideOverlay('pauseOverlay');
            hideOverlay('gameOverOverlay');
            
            lastUpdateTime = performance.now();
            if (animationId) cancelAnimationFrame(animationId);
            requestAnimationFrame(gameLoop);
        }
        
        function pauseGame() {
            if (isGameOver) return;
            isPaused = true;
            showOverlay('pauseOverlay');
        }
        
        function resumeGame() {
            isPaused = false;
            hideOverlay('pauseOverlay');
            lastUpdateTime = performance.now();
            requestAnimationFrame(gameLoop);
        }
        
        function quitToMenu() {
            isGameOver = true;
            isPaused = false;
            if (animationId) cancelAnimationFrame(animationId);
            hideOverlay('pauseOverlay');
            hideOverlay('gameOverOverlay');
            showOverlay('startOverlay');
        }
        
        function showStartScreen() {
            quitToMenu();
        }
        
        function gameLoop(timestamp) {
            if (isGameOver) return;
            
            if (!isPaused) {
                if (timestamp === undefined) timestamp = performance.now();
                const deltaTime = timestamp - lastUpdateTime;
                if (deltaTime >= GAME_SPEED) {
                    update();
                    lastUpdateTime = timestamp;
                }
                draw();
            }
            
            animationId = requestAnimationFrame(gameLoop);
        }
        
        function update() {
            // Apply next direction (prevent 180-degree turns)
            if ((nextDirection.dx !== -player.dx || nextDirection.dy !== -player.dy) &&
                (nextDirection.dx !== 0 || nextDirection.dy !== 0)) {
                player.dx = nextDirection.dx;
                player.dy = nextDirection.dy;
            }
