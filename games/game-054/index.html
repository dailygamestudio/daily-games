<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Neon Tron - Day 54</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a1a; 
            font-family: 'Orbitron', 'Courier New', monospace; 
            color: #00ffff; 
            overflow: hidden; 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        #gameContainer { position: relative; width: 100%; max-width: 800px; aspect-ratio: 4/3; }
        canvas { 
            display: block; 
            width: 100%; 
            height: 100%; 
            background: #050510; 
            border: 2px solid #00ffff; 
            box-shadow: 0 0 20px #00ffff, inset 0 0 20px #00ffff; 
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 16, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border: 2px solid #00ffff;
            box-shadow: 0 0 20px #00ffff, inset 0 0 20px #00ffff;
        }
        .overlay.hidden { display: none; }
        .overlay h1 { font-size: 3rem; margin-bottom: 1rem; text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff; }
        .overlay p { font-size: 1.2rem; margin-bottom: 2rem; color: #88ffff; }
        .btn {
            background: transparent;
            border: 2px solid #00ffff;
            color: #00ffff;
            padding: 1rem 2.5rem;
            font-family: 'Orbitron', monospace;
            font-size: 1.2rem;
            cursor: pointer;
            margin: 0.5rem;
            transition: all 0.2s;
            text-shadow: 0 0 5px #00ffff;
            box-shadow: 0 0 10px #00ffff;
        }
        .btn:hover, .btn:focus { background: #00ffff; color: #050510; box-shadow: 0 0 20px #00ffff, inset 0 0 10px #00ffff; }
        .score-display { position: absolute; top: 10px; left: 10px; z-index: 5; font-size: 1.2rem; text-shadow: 0 0 5px #00ffff; }
        .high-score-display { position: absolute; top: 10px; right: 10px; z-index: 5; font-size: 1.2rem; text-shadow: 0 0 5px #00ffff; color: #ffcc00; }
        .controls-hint { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 5; font-size: 0.9rem; color: #66ccff; text-shadow: 0 0 5px #00ffff; }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div class="score-display">SCORE: <span id="score">0</span></div>
        <div class="high-score-display">HIGH: <span id="highScore">0</span></div>
        <div class="controls-hint">ARROWS/WASD to move | ESC/P to pause | Swipe on mobile</div>
        
        <div id="startOverlay" class="overlay">
            <h1>NEON TRON</h1>
            <p>Survive the grid. Don't hit the trails.</p>
            <button class="btn" id="startBtn">START GAME</button>
        </div>
        
        <div id="pauseOverlay" class="overlay hidden">
            <h1>PAUSED</h1>
            <button class="btn" id="resumeBtn">RESUME</button>
            <button class="btn" id="quitPauseBtn">QUIT TO MENU</button>
        </div>
        
        <div id="gameOverOverlay" class="overlay hidden">
            <h1>GAME OVER</h1>
            <p>Final Score: <span id="finalScore">0</span></p>
            <button class="btn" id="retryBtn">RETRY</button>
            <button class="btn" id="mainMenuBtn">MAIN MENU</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const startOverlay = document.getElementById('startOverlay');
        const pauseOverlay = document.getElementById('pauseOverlay');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const startBtn = document.getElementById('startBtn');
        const resumeBtn = document.getElementById('resumeBtn');
        const quitPauseBtn = document.getElementById('quitPauseBtn');
        const retryBtn = document.getElementById('retryBtn');
        const mainMenuBtn = document.getElementById('mainMenuBtn');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const finalScoreEl = document.getElementById('finalScore');

        // Game constants
        const GRID_SIZE = 20;
        const COLS = 40;
        const ROWS = 30;
        const INITIAL_SPEED = 120;
        const SPEED_INCREMENT = 2;
        const MIN_SPEED = 50;

        // Game state
        let player = { x: 0, y: 0, dx: 1, dy: 0, trail: [], color: '#00ffff' };
        let enemies = [];
        let score = 0;
        let highScore = parseInt(localStorage.getItem('tronHighScore')) || 0;
        let gameSpeed = INITIAL_SPEED;
        let gameLoopId = null;
        let isPaused = false;
        let isGameOver = false;
        let lastTime = 0;
        let touchStartX = 0;
        let touchStartY = 0;

        highScoreEl.textContent = highScore;

        function resizeCanvas() {
            const container = document.getElementById('gameContainer');
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }

        function initGame() {
            resizeCanvas();
            player = {
                x: Math.floor(COLS / 2),
                y: Math.floor(ROWS / 2),
                dx: 1,
                dy: 0,
                trail: [],
                color: '#00ffff'
            };
            enemies = [];
            spawnEnemies(3);
            score = 0;
            gameSpeed = INITIAL_SPEED;
            isGameOver = false;
            isPaused = false;
            scoreEl.textContent = score;
            lastTime = performance.now();
        }

        function spawnEnemies(count) {
            const colors = ['#ff0066', '#ffcc00', '#00ff66', '#ff6600', '#cc00ff'];
            for (let i = 0; i < count; i++) {
                let x, y;
                do {
                    x = Math.floor(Math.random() * COLS);
                    y = Math.floor(Math.random() * ROWS);
                } while (x === player.x && y === player.y);
                
                const dirs = [{dx:1,dy:0}, {dx:-1,dy:0}, {dx:0,dy:1}, {dx:0,dy:-1}];
                const dir = dirs[Math.floor(Math.random() * dirs.length)];
                
                enemies.push({
                    x, y,
                    dx: dir.dx,
                    dy: dir.dy,
                    trail: [],
                    color: colors[i % colors.length],
                    turnTimer: 0
                });
            }
        }

        function startGame() {
            initGame();
            startOverlay.classList.add('hidden');
            pauseOverlay.classList.add('hidden');
            gameOverOverlay.classList.add('hidden');
            if (gameLoopId) cancelAnimationFrame(gameLoopId);
            gameLoopId = requestAnimationFrame(gameLoop);
        }

        function pauseGame() {
            if (isGameOver) return;
            isPaused = true;
            pauseOverlay.classList.remove('hidden');
        }

        function resumeGame() {
            isPaused = false;
            pauseOverlay.classList.add('hidden');
            lastTime = performance.now();
            gameLoopId = requestAnimationFrame(gameLoop);
        }

        function quitToMenu() {
            isPaused = false;
            isGameOver = true;
            pauseOverlay.classList.add('hidden');
            showStartScreen();
        }

        function showStartScreen() {
            startOverlay.classList.remove('hidden');
            gameOverOverlay.classList.add('hidden');
            if (gameLoopId) cancelAnimationFrame(gameLoopId);
        }

        function gameOver() {
            isGameOver = true;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('tronHighScore', highScore);
                highScoreEl.textContent = highScore;
            }
            finalScoreEl.textContent = score;
            gameOverOverlay.classList.remove('hidden');
        }

        function gameLoop(timestamp) {
            if (isGameOver) return;
            
            const delta = timestamp - lastTime;
            if (delta >= gameSpeed) {
                if (!isPaused) {
                    update();
                    draw();
                }
                lastTime = timestamp;
            }
            gameLoopId = requestAnimationFrame(gameLoop);
        }

        function update() {
            // Update player
            const nextX = player.x + player.dx;
            const nextY = player.y + player.dy;
            
            // Check wall collision
            if (nextX < 0 || nextX >= COLS || nextY < 0 || nextY >= ROWS) {
                gameOver();
                return;
            }
            
            // Check trail collision
            if (isTrailAt(nextX, nextY)) {
                gameOver();
                return;
            }
            
            // Add current position to trail
            player.trail.push({x: player.x, y: player.y});
            player.x = nextX;
            player.y = nextY;
            
            // Update enemies
            for (let enemy of enemies) {
                updateEnemy(enemy);
            }
            
            // Increase score
            score++;
            scoreEl.textContent = score;
            
            // Increase speed slightly
            if (gameSpeed > MIN_SPEED && score % 50 === 0) {
                gameSpeed -= SPEED_INCREMENT;
            }
        }

        function updateEnemy(enemy) {
            // Randomly decide to turn
            enemy.turnTimer++;
            if (enemy.turnTimer > 30 + Math.random() * 60) {
                enemy.turnTimer = 0;
                const possibleDirs = [];
                const dirs = [{dx:1,dy:0}, {dx:-1,dy:0}, {dx:0,dy:1}, {dx:0,dy:-1}];
                
                for (let dir of dirs) {
                    // Don't allow 180 degree turns
                    if (dir.dx === -enemy.dx && dir.dy === -enemy.dy) continue;
                    
                    const nx = enemy.x + dir.dx;
                    const ny = enemy.y + dir.dy;
                    
                    if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && !isTrailAt(nx, ny)) {
                        possibleDirs.push(dir);
                    }
                }
                
                if (possibleDirs.length > 0) {
                    const newDir = possibleDirs[Math.floor(Math.random() * possibleDirs.length)];
                    enemy.dx = newDir.dx;
                    enemy.dy = newDir.dy;
                }
            }
            
            const nextX = enemy.x + enemy.dx;
            const nextY = enemy.y + enemy.dy;
            
            // Check if enemy hits wall or trail
            if (nextX < 0 || nextX >= COLS || nextY < 0 || nextY >= ROWS || isTrailAt(nextX, nextY)) {
                // Enemy dies - respawn
                enemy.trail = [];
                let x, y;
                do {
                    x = Math.floor(Math.random() * COLS);
                    y = Math.floor(Math.random() * ROWS);
                } while (isTrailAt(x, y) || (x === player.x && y === player.y));
                enemy.x = x;
                enemy.y = y;
                const dirs = [{dx:1,dy:0}, {dx:-1,dy:0}, {dx:0,dy:1}, {dx:0,dy:-1}];
                const dir = dirs[Math.floor(Math.random() * dirs.length)];
                enemy.dx = dir.dx;
                enemy.dy = dir.dy;
                return;
            }
            
            enemy.trail.push({x: enemy.x, y: enemy.y});
            enemy.x = nextX;
            enemy.y = nextY;
        }

        function isTrailAt(x, y) {
            // Check player trail
            for (let segment of player.trail) {
                if (segment.x === x && segment.y === y) return true;
            }
            // Check enemy trails
            for (let enemy of enemies) {
                for (let segment of enemy.trail) {
                    if (segment.x === x && segment.y === y) return true;
                }
            }
            return false;
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#050510';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const cellWidth = canvas.width / COLS;
            const cellHeight = canvas.height / ROWS;
            
            // Draw grid lines
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= COLS; i++) {
                ctx.beginPath();
                ctx.moveTo(i * cellWidth, 0);
                ctx.lineTo(i * cellWidth, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i <= ROWS; i++) {
                ctx.beginPath();
                ctx.moveTo(0, i * cellHeight);
                ctx.lineTo(canvas.width, i * cellHeight);
                ctx.stroke();
            }
            
            // Draw trails
            drawTrail(player.trail, player.color, cellWidth, cellHeight);
            for (let enemy of enemies) {
                drawTrail(enemy.trail, enemy.color, cellWidth, cellHeight);
            }
            
            // Draw player head
            drawHead(player.x, player.y, player.dx, player.dy, player.color, cellWidth, cellHeight);
            
            // Draw enemy heads
            for (let enemy of enemies) {
                drawHead(enemy.x, enemy.y, enemy.dx, enemy.dy, enemy.color, cellWidth, cellHeight);
            }
        }

        function drawTrail(trail, color, cellWidth, cellHeight) {
            if (trail.length === 0) return;
            
            ctx.fillStyle = color;
            ctx.shadowColor = color;
            ctx.shadowBlur = 10;
            
            for (let i = 0; i < trail.length; i++) {
                const segment = trail[i];
                const alpha = 0.3 + (i / trail.length) * 0.7;
                ctx.globalAlpha = alpha;
                
                const x = segment.x * cellWidth + cellWidth / 2;
                const y = segment.y * cellHeight + cellHeight / 2;
                const size = Math.min(cellWidth, cellHeight) * 0.6;
                
                ctx.beginPath();
                ctx.arc(x, y, size / 2, 0, Math.PI * 2);
                ctx.fill();
            }
            
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
        }

        function drawHead(x, y, dx, dy, color, cellWidth, cellHeight) {
            const centerX = x * cellWidth + cellWidth / 2;
            const centerY = y * cellHeight + cellHeight / 2;
            const size = Math.min(cellWidth, cellHeight) * 0.7;
            
            ctx.fillStyle = color;
            ctx.shadowColor = color;
            ctx.shadowBlur = 15;
            
            ctx.beginPath();
            // Draw triangle pointing in movement direction
            if (dx === 1) { // right
                ctx.moveTo(centerX + size/2, centerY);
                ctx.lineTo(centerX - size/2, centerY - size/2);
                ctx.lineTo(centerX - size/2, centerY + size/2);
            } else if (dx === -1) { // left
                ctx.moveTo(centerX - size/2, centerY);
                ctx.lineTo(centerX + size/2, centerY - size/2);
                ctx.lineTo(centerX + size/2, centerY + size/2);
            } else if (dy === 1) { // down
                ctx.moveTo(centerX, centerY + size/2);
                ctx.lineTo(centerX - size/2, centerY - size/2);
                ctx.lineTo(centerX + size/2, centerY - size/2);
            } else { // up
                ctx.moveTo(centerX, centerY - size/2);
                ctx.lineTo(centerX - size/2, centerY + size/2);
                ctx.lineTo(centerX + size/2, centerY + size/2);
            }
            ctx.closePath();
            ctx.fill();
            
            ctx.shadowBlur = 0;
        }

        // Input handling
        function handleKeydown(e) {
            if (isGameOver) return;
            
            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (player.dy !== 1) { player.dx = 0; player.dy = -1; }
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (player.dy !== -1) { player.dx = 0; player.dy = 1; }
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (player.dx !== 1) { player.dx = -1; player.dy = 0; }
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (player.dx !== -1) { player.dx = 1; player.dy = 0; }
                    break;
                case 'Escape':
                case 'p':
                case 'P':
                    if (isPaused) resumeGame();
                    else pauseGame();
                    break;
            }
        }

        function handleTouchStart(e) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }

        function handleTouchEnd(e) {
            if (isGameOver || isPaused) return;
            
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            
            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;
            
            // Minimum swipe distance
            if (Math.abs(dx) < 30 && Math.abs(dy) < 30) return;
            
            if (Math.abs(dx) > Math.abs(dy)) {
                // Horizontal swipe
                if (dx > 0 && player.dx !== -1) { player.dx = 1; player.dy = 0; }
                else if (dx < 0 && player.dx !== 1) { player.dx = -1; player.dy = 0; }
            } else {
                // Vertical swipe
                if (dy > 0 && player.dy !== -1) { player.dx = 0; player.dy = 1; }
                else if (dy < 0 && player.dy !== 1) { player.dx = 0; player.dy = -1; }
            }
        }

        // Event listeners
        startBtn.addEventListener('click', startGame);
        resumeBtn.addEventListener('click', resumeGame);
        quitPauseBtn.addEventListener('click', quitToMenu);
        retryBtn.addEventListener('click', startGame);
        mainMenuBtn.addEventListener('click', showStartScreen);
        
        document.addEventListener('keydown', handleKeydown);
        canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
        canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
        window.addEventListener('resize', resizeCanvas);

        // Prevent scrolling on touch
        document.addEventListener('touchmove', (e) => {
            if (e.target === canvas) e.preventDefault();
        }, { passive: false });

        // Initialize
        resizeCanvas();
        showStartScreen();
    </script>
</body>
</html>
