<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Dash - Day 28</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0f; font-family: 'Courier New', monospace; color: #0ff; overflow: hidden; touch-action: none; }
canvas { display: block; }
#ui { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 30px; z-index: 10; pointer-events: none; }
.stat { text-align: center; text-shadow: 0 0 10px #0ff; }
.stat-label { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 1px; }
.stat-value { font-size: 24px; font-weight: bold; }
#highscore { color: #f0f; text-shadow: 0 0 10px #f0f; }
#message { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; z-index: 20; }
#message h1 { font-size: 48px; text-shadow: 0 0 20px #0ff, 0 0 40px #0ff; margin-bottom: 10px; }
#message p { color: #888; font-size: 14px; margin-bottom: 20px; }
#message button { background: #111; border: 2px solid #0ff; color: #0ff; padding: 12px 32px; font-size: 16px; font-family: inherit; cursor: pointer; border-radius: 4px; transition: all 0.2s; text-shadow: 0 0 10px #0ff; }
#message button:hover { background: #0a0a1a; box-shadow: 0 0 20px rgba(0,255,255,0.3); }
.hidden { display: none !important; }
@media (max-width: 600px) {
  #message h1 { font-size: 32px; }
  .stat-value { font-size: 18px; }
  #ui { gap: 15px; }
}
</style>
</head>
<body>
<div id="ui">
  <div class="stat">
    <div class="stat-label">Score</div>
    <div class="stat-value" id="score">0</div>
  </div>
  <div class="stat">
    <div class="stat-label">High Score</div>
    <div class="stat-value" id="highscore">0</div>
  </div>
  <div class="stat">
    <div class="stat-label">Speed</div>
    <div class="stat-value" id="speed">1.0x</div>
  </div>
</div>
<div id="message" class="hidden">
  <h1>NEON DASH</h1>
  <p>Tap / Click / Space to jump<br>Dodge the neon obstacles</p>
  <button id="startBtn">START</button>
</div>
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const highscoreEl = document.getElementById('highscore');
const speedEl = document.getElementById('speed');
const messageEl = document.getElementById('message');
const startBtn = document.getElementById('startBtn');

let width, height, dpr;
let running = false;
let score = 0;
let highScore = parseInt(localStorage.getItem('neonDashHighScore') || '0');
let gameSpeed = 1;
let frames = 0;

const player = { x: 0, y: 0, w: 40, h: 40, vy: 0, grounded: false, color: '#0ff', glow: '#0ff' };
const obstacles = [];
const particles = [];
const bgStars = [];

const GRAVITY = 0.6;
const JUMP_FORCE = -14;
const BASE_SPEED = 5;
const OBSTACLE_SPAWN_RATE = 120;
const SPEED_INCREASE_INTERVAL = 3000;

highscoreEl.textContent = highScore;

function resize() {
  dpr = window.devicePixelRatio || 1;
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  canvas.style.width = width + 'px';
  canvas.style.height = height + 'px';
  ctx.scale(dpr, dpr);
  
  player.x = 60;
  player.y = height - 80 - player.h;
  
  // Generate background stars
  bgStars.length = 0;
  for (let i = 0; i < 80; i++) {
    bgStars.push({
      x: Math.random() * width,
      y: Math.random() * height,
      size: Math.random() * 2 + 0.5,
      speed: Math.random() * 0.5 + 0.1,
      hue: Math.random() * 60 + 180
    });
  }
}
window.addEventListener('resize', resize);

function spawnObstacle() {
  const types = ['block', 'spike', 'wall'];
  const type = types[Math.floor(Math.random() * types.length)];
  let h, w, y;
  
  if (type === 'block') {
    w = 40 + Math.random() * 40;
    h = 40 + Math.random() * 60;
    y = height - 80 - h;
  } else if (type === 'spike') {
    w = 30;
    h = 50;
    y = height - 80 - h;
  } else {
    w = 20;
    h = height - 80;
    y = 80;
  }
  
  obstacles.push({
    x: width + w,
    y: y,
    w: w,
    h: h,
    type: type,
    hue: 180 + Math.random() * 60,
    passed: false
  });
}

function createParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x: x,
      y: y,
      vx: (Math.random() - 0.5) * 8,
      vy: (Math.random() - 0.5) * 8 - 2,
      size: Math.random() * 4 + 2,
      life: 1,
      decay: 0.02 + Math.random() * 0.03,
      color: color
    });
  }
}

function jump() {
  if (player.grounded) {
    player.vy = JUMP_FORCE;
    player.grounded = false;
    createParticles(player.x + player.w/2, player.y + player.h, player.glow, 8);
  }
}

function startGame() {
  running = true;
  score = 0;
  gameSpeed = 1;
  frames = 0;
  obstacles.length = 0;
  particles.length = 0;
  player.y = height - 80 - player.h;
  player.vy = 0;
  player.grounded = true;
  scoreEl.textContent = '0';
  speedEl.textContent = '1.0x';
  messageEl.classList.add('hidden');
}

function gameOver() {
  running = false;
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('neonDashHighScore', highScore);
    highscoreEl.textContent = highScore;
  }
  messageEl.innerHTML = `
    <h1>GAME OVER</h1>
    <p>Score: ${score}<br>Best: ${highScore}</p>
    <button id="restartBtn">RETRY</button>
  `;
  document.getElementById('restartBtn').addEventListener('click', startGame);
  messageEl.classList.remove('hidden');
  createParticles(player.x + player.w/2, player.y + player.h/2, '#f00', 30);
}

function update() {
  if (!running) return;
  
  frames++;
  
  // Increase speed over time
  if (frames % SPEED_INCREASE_INTERVAL === 0) {
    gameSpeed += 0.15;
    speedEl.textContent = gameSpeed.toFixed(1) + 'x';
  }
  
  // Player physics
  player.vy += GRAVITY;
  player.y += player.vy;
  
  const groundY = height - 80 - player.h;
  if (player.y >= groundY) {
    player.y = groundY;
    player.vy = 0;
    if (!player.grounded) {
      createParticles(player.x + player.w/2, player.y + player.h, player.glow, 4);
    }
    player.grounded = true;
  }
  
  // Spawn obstacles
  if (frames % Math.max(30, OBSTACLE_SPAWN_RATE - gameSpeed * 10) === 0) {
    spawnObstacle();
  }
  
  // Update obstacles
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const obs = obstacles[i];
    obs.x -= BASE_SPEED * gameSpeed;
    
    // Check collision
    if (player.x < obs.x + obs.w &&
        player.x + player.w > obs.x &&
        player.y < obs.y + obs.h &&
        player.y + player.h > obs.y) {
      gameOver();
      return;
    }
    
    // Score for passing
    if (!obs.passed && obs.x + obs.w < player.x) {
      obs.passed = true;
      score++;
      scoreEl.textContent = score;
      createParticles(obs.x, obs.y + obs.h/2, `hsl(${obs.hue}, 100%, 50%)`, 6);
    }
    
    // Remove off-screen
    if (obs.x + obs.w < 0) {
      obstacles.splice(i, 1);
    }
  }
  
  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
  
  // Update background stars
  for (const star of bgStars) {
    star.x -= star.speed * gameSpeed;
    if (star.x < 0) star.x = width;
  }
}

function draw() {
  // Clear with dark background
  ctx.fillStyle = '#050508';
  ctx.fillRect(0, 0, width, height);
  
  // Grid lines
  ctx.strokeStyle = 'rgba(0, 255, 255, 0.03)';
  ctx.lineWidth = 1;
  const gridSize = 40;
  for (let x = -frames * BASE_SPEED * gameSpeed % gridSize; x < width; x += gridSize) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, height);
    ctx.stroke();
  }
  for (let y = 0; y < height; y += gridSize) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(width, y);
    ctx.stroke();
  }
  
  // Background stars
  for (const star of bgStars) {
    ctx.fillStyle = `hsla(${star.hue}, 100%, 50%, ${0.3 + Math.sin(frames * 0.05 + star.x) * 0.2})`;
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // Ground
  const groundY = height - 80;
  const gradient = ctx.createLinearGradient(0, groundY, 0, height);
  gradient.addColorStop(0, '#111');
  gradient.addColorStop(1, '#0a0a0f');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, groundY, width, 80);
  
  // Ground glow line
  ctx.strokeStyle = '#0ff';
  ctx.lineWidth = 3;
  ctx.shadowColor = '#0ff';
  ctx.shadowBlur = 15;
  ctx.beginPath();
  ctx.moveTo(0, groundY);
  ctx.lineTo(width, groundY);
  ctx.stroke();
  ctx.shadowBlur = 0;
  
  // Ground pattern
  ctx.strokeStyle = 'rgba(0, 255, 255, 0.1)';
  ctx.lineWidth = 1;
  for (let x = -frames * BASE_SPEED * gameSpeed % 20; x < width; x += 20) {
    ctx.beginPath();
    ctx.moveTo(x, groundY);
    ctx.lineTo(x, height);
    ctx.stroke();
  }
  
  // Obstacles
  for (const obs of obstacles) {
    const obsGradient = ctx.createLinearGradient(obs.x, obs.y, obs.x + obs.w, obs.y + obs.h);
    obsGradient.addColorStop(0, `hsl(${obs.hue}, 100%, 60%)`);
    obsGradient.addColorStop(1, `hsl(${obs.hue}, 100%, 30%)`);
    ctx.fillStyle = obsGradient;
    
    ctx.shadowColor = `hsl(${obs.hue}, 100%, 50%)`;
    ctx.shadowBlur = 15;
    
    if (obs.type === 'block') {
      ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
      // Neon edges
      ctx.strokeStyle = `hsl(${obs.hue}, 100%, 70%)`;
      ctx.lineWidth = 2;
      ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
    } else if (obs.type === 'spike') {
      ctx.beginPath();
      ctx.moveTo(obs.x, obs.y + obs.h);
      ctx.lineTo(obs.x + obs.w/2, obs.y);
      ctx.lineTo(obs.x + obs.w, obs.y + obs.h);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    } else {
      ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
      // Vertical lines
      ctx.strokeStyle = `hsl(${obs.hue}, 100%, 70%)`;
      ctx.lineWidth = 1;
      for (let i = 1; i < 4; i++) {
        const lx = obs.x + obs.w * i / 4;
        ctx.beginPath();
        ctx.moveTo(lx, obs.y);
        ctx.lineTo(lx, obs.y + obs.h);
        ctx.stroke();
      }
    }
    ctx.shadowBlur = 0;
  }
  
  // Player
  const playerGradient = ctx.createLinearGradient(player.x, player.y, player.x, player.y + player.h);
  playerGradient.addColorStop(0, player.color);
  playerGradient.addColorStop(1, '#088');
  ctx.fillStyle = playerGradient;
  ctx.shadowColor = player.glow;
  ctx.shadowBlur = 20;
  ctx.fillRect(player.x, player.y, player.w, player.h);
  ctx.shadowBlur = 0;
  
  // Player neon outline
  ctx.strokeStyle = player.glow;
  ctx.lineWidth = 2;
  ctx.strokeRect(player.x, player.y, player.w, player.h);
  
  // Player core
  ctx.fillStyle = '#fff';
  ctx.shadowColor = '#fff';
  ctx.shadowBlur = 10;
  ctx.fillRect(player.x + 8, player.y + 8, player.w - 16, player.h - 16);
  ctx.shadowBlur = 0;
  
  // Particles
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;
  
  // Speed lines effect when fast
  if (gameSpeed > 2) {
    ctx.strokeStyle = 'rgba(0, 255, 255, 0.1)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 5; i++) {
      const x = (frames * 20 + i * 150) % width;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x - 50, height);
      ctx.stroke();
    }
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

function handleInput(e) {
  if (e.type === 'keydown' && e.code !== 'Space') return;
  e.preventDefault();
  if (!running) {
    if (messageEl.classList.contains('hidden')) return;
    return;
  }
  jump();
}

window.addEventListener('keydown', handleInput);
window.addEventListener('click', handleInput);
window.addEventListener('touchstart', handleInput);

startBtn.addEventListener('click', startGame);

resize();
loop();
</script>
</body>
</html>
