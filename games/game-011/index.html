<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Asteroids</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0a0a12;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', 'Courier New', monospace;
    color: #00ffea;
    overflow: hidden;
    touch-action: none;
}
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

#gameContainer {
    position: relative;
    border: 3px solid #00ffea;
    border-radius: 8px;
    box-shadow: 
        0 0 30px #00ffea,
        0 0 60px #cc00ff,
        inset 0 0 30px rgba(0, 255, 234, 0.1);
    background: #050510;
}
canvas { display: block; }

#ui {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    padding: 16px;
}
#topBar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}
.statBox {
    background: rgba(0, 20, 30, 0.85);
    border: 1px solid #00ffea44;
    border-radius: 6px;
    padding: 8px 16px;
    backdrop-filter: blur(4px);
}
.statLabel { font-size: 10px; color: #00ffea88; text-transform: uppercase; letter-spacing: 1px; }
.statValue { font-size: 22px; font-weight: 700; color: #00ffea; text-shadow: 0 0 10px #00ffea; font-variant-numeric: tabular-nums; }
#highScore .statValue { color: #ffcc00; text-shadow: 0 0 10px #ffcc00; }
#wave .statValue { color: #cc00ff; text-shadow: 0 0 10px #cc00ff; }
#lives .statValue { color: #ff3366; text-shadow: 0 0 10px #ff3366; }

#bottomBar { margin-top: auto; display: flex; justify-content: center; gap: 12px; }
.controlHint {
    background: rgba(0, 20, 30, 0.85);
    border: 1px solid #00ffea44;
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 11px;
    color: #00ffea88;
    display: flex;
    align-items: center;
    gap: 6px;
}
.controlHint kbd {
    background: #001122;
    border: 1px solid #00ffea66;
    border-radius: 4px;
    padding: 2px 8px;
    font-family: inherit;
    font-size: 10px;
    color: #00ffea;
}

#startScreen, #gameOverScreen {
    position: absolute;
    inset: 0;
    background: rgba(5, 5, 16, 0.98);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    z-index: 10;
    backdrop-filter: blur(8px);
}
#startScreen.hidden, #gameOverScreen.hidden { display: none; }
.title {
    font-size: clamp(32px, 8vw, 56px);
    font-weight: 900;
    background: linear-gradient(135deg, #00ffea, #cc00ff, #ffcc00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    letter-spacing: 4px;
    animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.3); } }
.subtitle { font-size: 14px; color: #00ffea88; letter-spacing: 3px; text-transform: uppercase; }
.btn {
    background: linear-gradient(135deg, #003344, #001122);
    border: 2px solid #00ffea;
    color: #00ffea;
    padding: 14px 48px;
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
    border-radius: 4px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 2px;
    transition: all 0.2s;
    box-shadow: 0 0 20px #00ffea44;
}
.btn:hover, .btn:focus { background: linear-gradient(135deg, #00ffea, #cc00ff); color: #000; box-shadow: 0 0 30px #00ffea, 0 0 60px #cc00ff; outline: none; }
.btn:active { transform: scale(0.96); }

#finalScore { font-size: 28px; font-weight: 700; color: #00ffea; text-shadow: 0 0 15px #00ffea; }
#bestScore { font-size: 16px; color: #ffcc00; text-shadow: 0 0 10px #ffcc00; }

@media (max-width: 600px) {
    #gameContainer { border-width: 2px; border-radius: 0; width: 100vw; height: 100vh; max-width: 100%; max-height: 100%; }
    body { align-items: stretch; justify-content: stretch; }
    #ui { padding: 12px; }
    .statValue { font-size: 18px; }
    .controlHint { padding: 5px 10px; font-size: 10px; }
}
</style>
</head>
<body>
<div id="gameContainer">
    <canvas id="canvas"></canvas>
    <div id="ui">
        <div id="topBar">
            <div class="statBox" id="score">
                <div class="statLabel">Score</div>
                <div class="statValue" id="scoreVal">0</div>
            </div>
            <div class="statBox" id="highScore">
                <div class="statLabel">Best</div>
                <div class="statValue" id="highScoreVal">0</div>
            </div>
            <div class="statBox" id="wave">
                <div class="statLabel">Wave</div>
                <div class="statValue" id="waveVal">1</div>
            </div>
            <div class="statBox" id="lives">
                <div class="statLabel">Lives</div>
                <div class="statValue" id="livesVal">3</div>
            </div>
        </div>
        <div id="bottomBar">
            <div class="controlHint"><kbd>←</kbd> <kbd>→</kbd> Rotate</div>
            <div class="controlHint"><kbd>↑</kbd> / <kbd>W</kbd> Thrust</div>
            <div class="controlHint"><kbd>Space</kbd> Fire</div>
        </div>
    </div>

    <div id="startScreen">
        <div class="title">NEON ASTEROIDS</div>
        <div class="subtitle">Classic Arcade Action</div>
        <button class="btn" id="startBtn">Start Game</button>
    </div>

    <div id="gameOverScreen" class="hidden">
        <div class="title">GAME OVER</div>
        <div id="finalScore">Score: 0</div>
        <div id="bestScore">Best: 0</div>
        <button class="btn" id="restartBtn">Play Again</button>
    </div>
</div>

<script>
// ============================================
// NEON ASTEROIDS - Classic Arcade Recreation
// ============================================

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// --- Config ---
const CONFIG = {
    baseWidth: 800,
    baseHeight: 600,
    ship: {
        radius: 16,
        turnSpeed: 0.08,
        thrustPower: 0.3,
        maxSpeed: 8,
        friction: 0.99,
        fireRate: 200,
        bulletSpeed: 12,
        lives: 3
    },
    asteroid: {
        minSize: 20,
        maxSize: 60,
        speeds: { large: 1.5, medium: 2.5, small: 4 },
        vertices: { min: 7, max: 12 },
        points: { large: 20, medium: 50, small: 100 }
    },
    ufo: {
        spawnChance: 0.001,
        speed: 2,
        fireRate: 1500,
        bulletSpeed: 5,
        points: 200
    },
    bullet: {
        speed: 12,
        life: 60,
        maxBullets: 8
    },
    particle: {
        max: 200,
        colors: ['#00ffea', '#ff006e', '#ffbe0b', '#cc00ff', '#00ff88', '#ffbe0b']
    },
    starCount: 100
};

// --- Utility ---
const wrap = (pos, size) => {
    if (pos < 0) return size;
    if (pos > size) return 0;
    return pos;
};
const rand = (min, max) => Math.random() * (max - min) + min;
const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const angle = (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1);

// --- State ---
let state = {
    running: false,
    score: 0,
    highScore: 0,
    lives: 3,
    level: 1,
    ship: null,
    bullets: [],
    asteroids: [],
    ufo: null,
    ufoBullets: [],
    particles: [],
    stars: [],
    screenShake: 0,
    gameTime: 0,
    lastFire: 0,
    ufoSpawnTimer: 0
};

// --- Starfield ---
function initStars() {
    state.stars = [];
    for (let i = 0; i < CONFIG.starCount; i++) {
        state.stars.push({
            x: Math.random() * CONFIG.baseWidth,
            y: Math.random() * CONFIG.baseHeight,
            size: Math.random() * 1.5 + 0.5,
            speed: Math.random() * 0.5 + 0.1,
            brightness: Math.random() * 0.5 + 0.5
        });
    }
}

// --- Ship Class ---
class Ship {
    constructor() {
        this.x = CONFIG.baseWidth / 2;
        this.y = CONFIG.baseHeight / 2;
        this.angle = -Math.PI / 2;
        this.vx = 0;
        this.vy = 0;
        this.radius = CONFIG.ship.radius;
        this.invuln = 0;
        this.blinkTimer = 0;
        this.thrusting = false;
    }
    
    update(dt) {
        // Thrust
        if (this.thrusting) {
            const ax = Math.cos(this.angle) * CONFIG.ship.thrustPower;
            const ay = Math.sin(this.angle) * CONFIG.ship.thrustPower;
            this.vx += Math.cos(this.angle) * CONFIG.ship.thrustPower;
            this.vy += Math.sin(this.angle) * CONFIG.ship.thrustPower;
            
            // Thrust particles
            const px = this.x - Math.cos(this.angle) * this.radius;
            const py = this.y - Math.sin(this.angle) * this.radius;
            for (let i = 0; i < 2; i++) {
                const angle = this.angle + Math.PI + (Math.random() - 0.5) * 0.5;
                const speed = Math.random() * 2 + 1;
                state.particles.push({
                    x: this.x, y: this.y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    color: '#ff6600',
                    size: Math.random() * 3 + 1,
                    life: 0.2,
                    maxLife: 0.2
                });
            }
        }
        
        // Velocity
        this.x += this.vx;
        this.vy += this.vy;
        this.vx *= 0.99;
        this.vy *= 0.99;
        
        // Wrap
        this.x = wrap(this.x, CONFIG.baseWidth);
        this.y = wrap(this.y, CONFIG.baseHeight);
        
        // Invulnerability
        if (this.invuln > 0) this.invuln -= 1/60;
    }
    
    rotate(dir) { this.angle += dir * CONFIG.ship.turnSpeed; }
    
    thrust(on) { this.thrusting = on; }
    
    fire() {
        const now = Date.now();
        if (now - state.lastFire < CONFIG.ship.fireRate) return;
        state.lastFire = now;
        
        const bx = this.x + Math.cos(this.angle) * (this.radius + 10);
        const by = this.y + Math.sin(this.angle) * (this.radius + 10);
        const bvx = Math.cos(this.angle) * CONFIG.bullet.speed;
        const bvy = Math.sin(this.angle) * CONFIG.bullet.speed;
        
        state.bullets.push({ x: bx, y: by, vx: bvx, vy: bvy, life: CONFIG.bullet.life });
        
        // Limit bullets
        if (state.bullets.length > CONFIG.bullet.maxBullets) state.bullets.shift();
    }
    
    draw(ctx) {
        if (this.invuln > 0 && Math.floor(this.blinkTimer * 10) % 2 === 0) return;
        
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        
        // Ship body
        ctx.strokeStyle = '#00ffea';
        ctx.lineWidth = 2;
        ctx.shadowColor = '#00ffea';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.moveTo(this.radius, 0);
        ctx.lineTo(-this.radius, this.radius * 0.7);
        ctx.lineTo(-this.radius * 0.3, 0);
        ctx.lineTo(-this.radius, -this.radius * 0.7);
        ctx.closePath();
        ctx.stroke();
        ctx.shadowBlur = 0;
        
        // Cockpit
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(0, 0, 3, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.restore();
    }
    
    respawn() {
        this.x = CONFIG.baseWidth / 2;
        this.y = CONFIG.baseHeight / 2;
        this.angle = -Math.PI / 2;
        this.vx = 0;
        this.vy = 0;
        this.invuln = 3;
    }
}

// --- Asteroid Class ---
class Asteroid {
    constructor(x, y, size, level) {
        this.x = x;
        this.y = y;
        this.size = size;
        this.level = level; // 0=large, 1=medium, 2=small
        this.radius = CONFIG.asteroid.maxSize - level * 15;
        this.angle = Math.random() * Math.PI * 2;
        this.rotation = (Math.random() - 0.5) * 0.02;
        this.vx = (Math.random() - 0.5) * CONFIG.asteroid.speeds[['large', 'medium', 'small'][level]];
        this.vy = (Math.random() - 0.5) * CONFIG.asteroid.speeds[['large', 'medium', 'small'][level]];
        this.vertices = randInt(CONFIG.asteroid.vertices.min, CONFIG.asteroid.vertices.max);
        this.shape = [];
        for (let i = 0; i < this.vertices; i++) {
            const angle = (i / this.vertices) * Math.PI * 2;
            const variance = 0.7 + Math.random() * 0.3;
            this.shape.push({
                x: Math.cos(angle) * this.radius * variance,
                y: Math.sin(angle) * this.radius * variance
            });
        }
    }
    
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.angle += this.rotation;
        
        // Wrap
        this.x = wrap(this.x, CONFIG.baseWidth);
        this.y = wrap(this.y, CONFIG.baseHeight);
    }
    
    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        
        ctx.strokeStyle = '#00ffea';
        ctx.lineWidth = 2;
        ctx.shadowColor = '#00ffea';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        this.shape.forEach((v, i) => {
            if (i === 0) ctx.moveTo(v.x, v.y);
            else ctx.lineTo(v.x, v.y);
        }
        ctx.closePath();
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.restore();
    }
    
    split() {
        if (this.level >= 2) return [];
        const newLevel = this.level + 1;
        const newSize = this.radius * 0.6;
        const count = 2 + Math.floor(Math.random() * 2);
        const asteroids = [];
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const a = new Asteroid(this.x, this.y, newSize, newLevel);
            a.vx = Math.cos(angle) * 2 + this.vx * 0.5;
            a.vy = Math.sin(angle) * 2 + this.vy * 0.5;
            asteroids.push(a);
        }
        return asteroids;
    }
}

// --- UFO ---
class UFO {
    constructor() {
        this.x = Math.random() < 0.5 ? -50 : CONFIG.baseWidth + 50;
        this.y = Math.random() * (CONFIG.baseHeight * 0.3) + 50;
        this.direction = this.x < 0 ? 1 : -1;
        this.speed = 2;
        this.fireTimer = 0;
        this.radius = 20;
        this.health = 1;
    }
    
    update(dt) {
        this.x += this.direction * this.speed;
        if (this.x < -50 || this.x > CONFIG.baseWidth + 50) {
            this.active = false;
            return;
        }
        
        // Aim at ship
        const dx = state.ship.x - this.x;
        const dy = state.ship.y - this.y;
        const dist = Math.hypot(dx, dy);
        
        this.fireTimer += 1/60 * 1000;
        if (this.fireTimer >= 1500) {
            this.fireTimer = 0;
            const angle = Math.atan2(state.ship.y - this.y, state.ship.x - this.x);
            const bvx = Math.cos(angle) * 5;
            const bvy = Math.sin(angle) * 5;
            state.ufoBullets.push({ x: this.x, y: this.y, vx: bvx, vy: bvy, life: 60 });
        }
        
        // Wrap
        if (this.x < -50 || this.x > CONFIG.baseWidth + 50) this.active = false;
    }
    
    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.strokeStyle = '#ff3366';
        ctx.lineWidth = 2;
        ctx.shadowColor = '#ff3366';
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.ellipse(0, 0, 20, 10, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-20, 0);
        ctx.lineTo(20, 0);
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.restore();
    }
}

// --- Particles ---
function createExplosion(x, y, color, count, speedMult = 1) {
    for (let i = 0; i < count; i++) {
        const angle = rand(0, Math.PI * 2);
        const speed = rand(1, 4) * speedMult;
        state.particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            color: color,
            size: rand(1, 3),
            life: rand(0.3, 0.8),
            maxLife: 1
        });
    }
}

// --- Init ---
function init() {
    canvas = document.getElementById('canvas');
    ctx = canvas.getContext('2d');
    resize();
    window.addEventListener('resize', resize);
    
    state.highScore = parseInt(localStorage.getItem('neonAsteroidsHS')) || 0;
    document.getElementById('highScoreVal').textContent = state.highScore;
    
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);
    canvas.addEventListener('touchstart', onTouchStart, { passive: false });
    canvas.addEventListener('touchmove', onTouchMove, { passive: false });
    canvas.addEventListener('touchend', onTouchEnd, { passive: false });
    
    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('restartBtn').addEventListener('click', startGame);
    
    initStars();
    showStartScreen();
    requestAnimationFrame(gameLoop);
}

function resize() {
    const maxW = Math.min(window.innerWidth * 0.95, CONFIG.baseWidth);
    const maxH = Math.min(window.innerHeight * 0.9, CONFIG.baseHeight);
    const scale = Math.min(maxW / CONFIG.baseWidth, maxH / CONFIG.baseHeight);
    canvas.width = CONFIG.baseWidth;
    canvas.height = CONFIG.baseHeight;
    canvas.style.width = (CONFIG.baseWidth) + 'px';
    canvas.style.height = (CONFIG.baseHeight) + 'px';
}

function onKeyDown(e) {
    if (!state.running) return;
    if (e.code === 'ArrowLeft') state.ship.rotate(-CONFIG.ship.turnSpeed);
    else if (e.code === 'ArrowRight') state.ship.rotate(CONFIG.ship.turnSpeed);
    else if (e.code === 'ArrowUp' || e.code === 'KeyW') state.ship.thrust(true);
    else if (e.code === 'Space') { e.preventDefault(); state.ship.fire(); }
}

function onKeyUp(e) {
    if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') { /* handled in keydown */ }
}

function onTouchStart(e) { e.preventDefault(); }
function onTouchMove(e) { e.preventDefault(); }
function onTouchEnd(e) { e.preventDefault(); }

function startGame() {
    state.running = true;
    state.score = 0;
    state.lives = CONFIG.ship.lives;
    state.level = 1;
    state.ship = new Ship();
    state.bullets = [];
    state.asteroids = [];
    state.ufo = null;
    state.ufoBullets = [];
    state.particles = [];
    state.screenShake = 0;
    state.gameTime = 0;
    state.lastFire = 0;
    state.ufoSpawnTimer = 0;
    
    spawnAsteroids(4 + state.level);
    
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('gameOverScreen').classList.add('hidden');
    document.getElementById('scoreVal').textContent = '0';
    document.getElementById('waveVal').textContent = '1';
    document.getElementById('livesVal').textContent = state.lives;
    document.getElementById('scoreVal').textContent = '0';
}

function spawnAsteroids(count) {
    for (let i = 0; i < count; i++) {
        let x, y;
        do {
            x = rand(50, CONFIG.baseWidth - 50);
            y = rand(50, CONFIG.baseHeight - 50);
        } while (Math.hypot(x - state.ship.x, y - state.ship.y) < 200);
        state.asteroids.push(new Asteroid(x, y, CONFIG.asteroid.maxSize, 0));
    }
}

function spawnUFO() {
    if (state.ufo) return;
    state.ufo = { x: Math.random() < 0.5 ? -50 : CONFIG.baseWidth + 50, y: rand(50, 200), direction: Math.random() < 0.5 ? 1 : -1, speed: 2, fireTimer: 0, radius: 20, active: true };
}

function update(dt) {
    if (!state.running) return;
    
    // Ship
    state.ship.update(dt);
    
    // Bullets
    for (let i = state.bullets.length - 1; i >= 0; i--) {
        const b = state.bullets[i];
        b.x += b.vx; b.y += b.vy;
        b.life--;
        b.x = wrap(b.x, CONFIG.baseWidth);
        b.y = wrap(b.y, CONFIG.baseHeight);
        if (b.life <= 0) state.bullets.splice(i, 1);
    }
    
    // Asteroids
    for (let i = state.asteroids.length - 1; i >= 0; i--) {
        const a = state.asteroids[i];
        a.update();
        
        // Bullet collision
        for (let j = state.bullets.length - 1; j >= 0; j--) {
            const b = state.bullets[j];
            if (Math.hypot(a.x - b.x, a.y - b.y) < a.radius + 4) {
                state.bullets.splice(j, 1);
                
                // Points
                const pts = [20, 50, 100][a.level];
                state.score += pts;
                document.getElementById('scoreVal').textContent = state.score;
                
                // Explosion
                createExplosion(a.x, a.y, '#00ffea', 15);
                
                // Split
                const split = a.split();
                state.asteroids.push(...split);
                state.asteroids.splice(i, 1);
                break;
            }
        }
        
        // Ship collision
        if (state.ship.invuln <= 0 && Math.hypot(a.x - state.ship.x, a.y - state.ship.y) < a.radius + state.ship.radius) {
            shipHit();
            return;
        }
    }
    
    // UFO
    if (state.ufo && state.ufo.active) {
        state.ufo.update(1/60);
        if (!state.ufo.active) state.ufo = null;
        
        // UFO bullets
        for (let i = state.ufoBullets.length - 1; i >= 0; i--) {
            const b = state.ufoBullets[i];
            b.x += b.vx; b.y += b.vy;
            b.life--;
            if (b.life <= 0) state.ufoBullets.splice(i, 1);
            else if (Math.hypot(b.x - state.ship.x, b.y - state.ship.y) < state.ship.radius + 4) {
                if (state.ship.invuln <= 0) shipHit();
            }
        }
        
        // Bullet vs UFO
        for (let j = state.bullets.length - 1; j >= 0; j--) {
            const b = state.bullets[j];
            if (Math.hypot(b.x - state.ufo.x, b.y - state.ufo.y) < state.ufo.radius) {
                state.bullets.splice(j, 1);
                state.ufo.active = false;
                state.score += 200;
                document.getElementById('scoreVal').textContent = state.score;
                createExplosion(state.ufo.x, state.ufo.y, '#ff3366', 30);
                state.ufo = null;
                break;
            }
        }
    } else if (Math.random() < 0.0005 && state.asteroids.length > 0) {
        spawnUFO();
    }
    
    // UFO bullets
    for (let i = state.ufoBullets.length - 1; i >= 0; i--) {
        const b = state.ufoBullets[i];
        b.x += b.vx; b.y += b.vy;
        b.life--;
        if (b.life <= 0) state.ufoBullets.splice(i, 1);
    }
    
    // Particles
    for (let i = state.particles.length - 1; i >= 0; i--) {
        const p = state.particles[i];
        p.x += p.vx; p.y += p.vy;
        p.life -= 1/60;
        if (p.life <= 0) state.particles.splice(i, 1);
    }
    
    // Stars
    state.stars.forEach(s => { s.y += s.speed; if (s.y > CONFIG.baseHeight) s.y = 0; });
    
    // Spawn asteroids if all destroyed
    if (state.asteroids.length === 0) {
        state.level++;
        spawnAsteroids(4 + state.level);
        document.getElementById('waveVal').textContent = state.level;
    }
    
    // Spawn UFO occasionally
    if (!state.ufo && state.asteroids.length > 0 && Math.random() < 0.0005) {
        spawnUFO();
    }
}

    state.lives--;
    state.screenShake = 10;

function spawnAsteroids(count) {
    for (let i = 0; i < count; i++) {
        let x, y;
        do {
            x = rand(50, CONFIG.baseWidth - 50);
            y = rand(50, CONFIG.baseHeight - 50);
        } while (Math.hypot(x - state.ship.x, y - state.ship.y) < 200);
        state.asteroids.push(new Asteroid(x, y, CONFIG.asteroid.maxSize, 0));
    }
}

function spawnUFO() {
    if (state.ufo) return;
    state.ufo = { x: Math.random() < 0.5 ? -50 : CONFIG.baseWidth + 50, y: rand(50, 200), direction: Math.random() < 0.5 ? 1 : -1, speed: 2, fireTimer: 0, radius: 20, active: true };
}

function createExplosion(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = rand(0, Math.PI * 2);
        const speed = rand(1, 4);
        state.particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            color: color,
            size: rand(1, 3),
            life: rand(0.3, 0.8),
            maxLife: 1
        });
    }
}

function update(dt) {
    if (!state.running) return;
    
    state.ship.update(dt);
    
    // Bullets
    for (let i = state.bullets.length - 1; i >= 0; i--) {
        const b = state.bullets[i];
        b.x += b.vx; b.y += b.vy;
        b.life--;
        b.x = wrap(b.x, CONFIG.baseWidth);
        b.y = wrap(b.y, CONFIG.baseHeight);
        if (b.life <= 0) state.bullets.splice(i, 1);
    }
    
    // Asteroids
    for (let i = state.asteroids.length - 1; i >= 0; i--) {
        const a = state.asteroids[i];
        a.update();
        
        // Bullet collision
        for (let j = state.bullets.length - 1; j >= 0; j--) {
            const b = state.bullets[j];
            if (Math.hypot(a.x - b.x, a.y - b.y) < a.radius + 4) {
                state.bullets.splice(j, 1);
                
                const pts = [20, 50, 100][a.level];
                state.score += pts;
                document.getElementById('scoreVal').textContent = state.score.toLocaleString();
                
                createExplosion(a.x, a.y, '#00ffea', 15);
                
                const split = a.split();
                state.asteroids.push(...split);
                state.asteroids.splice(i, 1);
                break;
            }
        }
        
        // Ship collision
        if (state.ship.invuln <= 0 && Math.hypot(a.x - state.ship.x, a.y - state.ship.y) < a.radius + state.ship.radius) {
            shipHit();
            return;
        }
    }
    
    // UFO
    if (state.ufo && state.ufo.active) {
        state.ufo.update(1/60);
        if (!state.ufo.active) state.ufo = null;
        
        // UFO bullets
        for (let i = state.ufoBullets.length - 1; i >= 0; i--) {
            const b = state.ufoBullets[i];
            b.x += b.vx; b.y += b.vy;
            b.life--;
            if (b.life <= 0) state.ufoBullets.splice(i, 1);
            else if (Math.hypot(b.x - state.ship.x, b.y - state.ship.y) < state.ship.radius + 4) {
                if (state.ship.invuln <= 0) shipHit();
            }
        }
        
        // Bullet vs UFO
        for (let j = state.bullets.length - 1; j >= 0; j--) {
            const b = state.bullets[j];
            if (Math.hypot(b.x - state.ufo.x, b.y - state.ufo.y) < state.ufo.radius) {
                state.bullets.splice(j, 1);
                state.ufo.active = false;
                state.score += 200;
                document.getElementById('scoreVal').textContent = state.score.toLocaleString();
                createExplosion(state.ufo.x, state.ufo.y, '#ff3366', 30);
                state.ufo = null;
                break;
            }
        }
    } else if (Math.random() < 0.0005 && state.asteroids.length > 0) {
        spawnUFO();
    }
    
    // UFO bullets
    for (let i = state.ufoBullets.length - 1; i >= 0; i--) {
        const b = state.ufoBullets[i];
        b.x += b.vx; b.y += b.vy;
        b.life--;
        if (b.life <= 0) state.ufoBullets.splice(i, 1);
    }
    
    // Particles
    for (let i = state.particles.length - 1; i >= 0; i--) {
        const p = state.particles[i];
        p.x += p.vx; p.y += p.vy;
        p.life -= 1/60;
        if (p.life <= 0) state.particles.splice(i, 1);
    }
    
    // Stars
    state.stars.forEach(s => { s.y += s.speed; if (s.y > CONFIG.baseHeight) s.y = 0; });
    
    // Spawn asteroids if all destroyed
    if (state.asteroids.length === 0) {
        state.level++;
        spawnAsteroids(4 + state.level);
        document.getElementById('waveVal').textContent = state.level;
    }
    
    // Spawn UFO occasionally
    if (!state.ufo && state.asteroids.length > 0 && Math.random() < 0.0005) {
        spawnUFO();
    }
}
