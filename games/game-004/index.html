<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Arena</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0a0a12;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', 'Courier New', monospace;
    color: #00ffea;
    overflow: hidden;
    touch-action: none;
}
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

#gameCanvas {
    display: block;
    border: 2px solid #00ffea;
    box-shadow: 0 0 30px #00ffea, inset 0 0 30px rgba(0,255,234,0.1);
    border-radius: 4px;
    background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a12 70%);
}
.ui-layer {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 20px;
    z-index: 10;
}
.ui-top { display: flex; justify-content: space-between; width: 100%; max-width: 900px; }
.ui-bottom { display: flex; justify-content: center; gap: 15px; width: 100%; max-width: 900px; }
.stat-box {
    background: rgba(0,20,30,0.8);
    border: 1px solid #00ffea;
    padding: 8px 16px;
    border-radius: 4px;
    text-align: center;
    min-width: 100px;
    box-shadow: 0 0 15px rgba(0,255,234,0.2);
}
.stat-label { font-size: 10px; color: #00ffea88; text-transform: uppercase; letter-spacing: 1px; }
.stat-value { font-size: 20px; font-weight: 700; color: #00ffea; text-shadow: 0 0 10px #00ffea; }
#waveDisplay { color: #ff6b00; text-shadow: 0 0 10px #ff6b00; }
#highScoreDisplay { color: #ffd700; text-shadow: 0 0 10px #ffd700; }
.btn {
    background: transparent;
    border: 2px solid #00ffea;
    color: #00ffea;
    padding: 12px 28px;
    font-family: inherit;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 2px;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.2s;
    pointer-events: auto;
}
.btn:hover, .btn:focus { background: #00ffea; color: #0a0a12; box-shadow: 0 0 20px #00ffea; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
#startBtn { display: none; }
.overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.95);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    gap: 20px;
    padding: 20px;
}
.overlay.hidden { display: none; }
.overlay h1 { font-size: clamp(32px, 8vw, 64px); text-shadow: 0 0 30px #00ffea; letter-spacing: 4px; }
.overlay p { color: #00ffea88; font-size: 14px; text-align: center; max-width: 400px; line-height: 1.6; }
.controls-hint { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
.control-group { text-align: center; }
.control-group h3 { font-size: 12px; color: #00ffea88; margin-bottom: 8px; text-transform: uppercase; }
.control-group .keys { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.key { background: rgba(0,255,234,0.1); border: 1px solid #00ffea; padding: 6px 12px; border-radius: 4px; font-size: 12px; min-width: 40px; }
.mobile-hint { color: #ff6b00; font-size: 12px; }
.joystick-zone {
    position: fixed;
    bottom: 20px;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: rgba(0,255,234,0.05);
    border: 2px solid #00ffea44;
    pointer-events: auto;
}
.joystick-knob {
    position: absolute;
    top: 50%; left: 50%;
    width: 50px; height: 50px;
    border-radius: 50%;
    background: rgba(0,255,234,0.2);
    border: 2px solid #00ffea;
    transform: translate(-50%, -50%);
    transition: transform 0.05s linear;
    pointer-events: none;
}
</style>
</head>
<body>
<canvas id="gameCanvas" width="800" height="600"></canvas>
<div class="ui-layer">
    <div class="ui-top">
        <div class="stat-box"><div class="stat-label">SCORE</div><div class="stat-value" id="scoreDisplay">0</div></div>
        <div class="stat-box"><div class="stat-label">WAVE</div><div class="stat-value" id="waveDisplay">1</div></div>
        <div class="stat-box"><div class="stat-label">HIGH</div><div class="stat-value" id="highScoreDisplay">0</div></div>
    </div>
    <div class="ui-bottom">
        <div class="stat-box"><div class="stat-label">HEALTH</div><div class="stat-value" id="healthDisplay">100</div></div>
    </div>
</div>

<div class="overlay" id="startOverlay">
    <h1>NEON ARENA</h1>
    <p>Survive waves of enemies. Collect power-ups. Upgrade your ship.</p>
    <div class="controls-hint">
        <div class="control-group">
            <h3>Desktop</h3>
            <div class="keys"><span class="key">WASD</span> / <span class="key">Arrows</span> - Move</div>
            <div class="keys"><span class="key">Mouse</span> - Aim & Auto-fire</div>
            <div class="keys"><span class="key">Space</span> / <span class="key">Shift</span> - Dash</div>
        </div>
        <div class="control-group">
            <h3>Mobile</h3>
            <div class="keys"><span class="key">Left Zone</span> - Move</div>
            <div class="keys" style="margin-top:8px;"><span class="key">Right Zone</span> - Aim & Fire</div>
        </div>
    </div>
    <button class="btn" id="beginBtn" style="padding: 16px 40px; font-size: 16px;">ENTER ARENA</button>
</div>

<div class="overlay hidden" id="pauseOverlay">
    <h1>PAUSED</h1>
    <p>Wave <span id="pauseWave">1</span> • Score <span id="pauseScore">0</span></p>
    <button class="btn" id="resumeBtn">RESUME</button>
    <button class="btn" id="quitBtn">QUIT TO MENU</button>
</div>

<div class="overlay hidden" id="gameOverOverlay">
    <h1 style="color: #ff3366;">SYSTEM FAILURE</h1>
    <p>Final Score: <span id="finalScore" style="color: #00ffea;">0</span></p>
    <p id="highScoreMsg" style="color: #ffd700;"></p>
    <button class="btn" id="retryBtn">RETRY</button>
    <button class="btn" id="menuBtn">MAIN MENU</button>
</div>

<div class="joystick-zone left" id="moveZone"><div class="joystick-knob" id="moveKnob"></div></div>
<div class="joystick-zone right" id="aimZone"><div class="joystick-knob" id="aimKnob"></div></div>

<script>
// ============================================
// NEON ARENA - Twin-Stick Arena Survival
// ============================================

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// ===== CONFIG =====
const CONFIG = {
    canvasWidth: 800,
    canvasHeight: 600,
    player: {
        radius: 16,
        speed: 5,
        fireRate: 120,
        bulletSpeed: 12,
        bulletDamage: 1,
        maxHealth: 100,
        regenRate: 0.05,
        dashCooldown: 1500,
        dashDistance: 120,
        dashDuration: 150
    },
    enemy: {
        baseSpeed: 1.5,
        baseHealth: 3,
        baseDamage: 10,
        spawnRate: 2000,
        maxEnemies: 50
    },
    wave: {
        enemiesPerWave: 15,
        enemyIncrease: 5,
        healthMultiplier: 1.15,
        speedMultiplier: 1.05,
        newTypeEvery: 3
    },
    pickup: {
        radius: 10,
        lifetime: 10000,
        types: ['health', 'score', 'rapid', 'spread', 'pierce', 'shield']
    },
    colors: {
        player: '#00ffea',
        playerGlow: '#00ffff',
        enemy: '#ff3366',
        enemyGlow: '#ff0044',
        bullet: '#00ffea',
        bulletGlow: '#00ffff',
        pickup: '#ffd700',
        pickupGlow: '#ffff00',
        bgGrid: '#00ffea22',
        particle: '#00ffea'
    }
};

// ===== UTILITIES =====
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const angle = (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1);
const rand = (min, max) => Math.random() * (max - min) + min;
const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const choose = (arr) => arr[Math.floor(Math.random() * arr.length)];

// ===== VEC2 =====
class Vec2 {
    constructor(x = 0, y = 0) { this.x = x; this.y = y; }
    set(x, y) { this.x = x; this.y = y; return this; }
    copy(v) { this.x = v.x; this.y = v.y; return this; }
    add(v) { this.x += v.x; this.y += v.y; return this; }
    sub(v) { this.x -= v.x; this.y -= v.y; return this; }
    mul(s) { this.x *= s; this.y *= s; return this; }
    div(s) { this.x /= s; this.y /= s; return this; }
    len() { return Math.hypot(this.x, this.y); }
    lenSq() { return this.x * this.x + this.y * this.y; }
    normalize() { const l = this.len(); if (l > 0) this.div(l); return this; }
    limit(max) { const l = this.len(); if (l > max) this.mul(max / l); return this; }
    angle() { return Math.atan2(this.y, this.x); }
    rotate(a) { const c = Math.cos(a), s = Math.sin(a); const x = this.x * c - this.y * s; this.y = this.x * s + this.y * c; this.x = x; return this; }
    clone() { return new Vec2(this.x, this.y); }
    static fromAngle(a) { return new Vec2(Math.cos(a), Math.sin(a)); }
}

// ===== PARTICLES =====
class Particle {
    constructor(x, y, color, size, life, velocity, gravity = 0, fade = true) {
        this.pos = new Vec2(x, y);
        this.vel = velocity || new Vec2();
        this.color = color;
        this.size = size;
        this.maxSize = size;
        this.life = life;
        this.maxLife = life;
        this.gravity = gravity;
        this.fade = fade;
    }
    update(dt) {
        this.pos.add(this.vel.mul(dt));
        this.vel.y += this.gravity * dt;
        this.life -= dt;
        if (this.fade) this.size = this.maxSize * (this.life / this.maxLife);
    }
    draw(ctx) {
        if (this.life <= 0) return;
        ctx.save();
        ctx.translate(this.pos.x, this.pos.y);
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 10;
        ctx.globalAlpha = this.life / this.maxLife;
        ctx.beginPath();
        ctx.arc(0, 0, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

class ParticleSystem {
    constructor() { this.particles = []; }
    emit(x, y, color, count, options = {}) {
        for (let i = 0; i < count; i++) {
            const angle = rand(0, Math.PI * 2);
            const speed = rand(options.minSpeed || 50, options.maxSpeed || 150);
            const vel = new Vec2(Math.cos(angle), Math.sin(angle)).mul(speed);
            this.particles.push(new Particle(
                x, y, color,
                rand(options.minSize || 2, options.maxSize || 5),
                rand(options.minLife || 0.1, options.maxLife || 0.3),
                vel,
                options.gravity || 0,
                options.fade !== false
            ));
        }
    }
    update(dt) {
        for (let i = this.particles.length - 1; i >= 0; i--) {
            this.particles[i].update(dt);
            if (this.particles[i].life <= 0) this.particles.splice(i, 1);
        }
    }
    draw(ctx) { this.particles.forEach(p => p.draw(ctx)); }
}

// ===== ENTITY BASE =====
class Entity {
    constructor(x, y, radius) {
        this.pos = new Vec2(x, y);
        this.vel = new Vec2();
        this.radius = radius;
        this.active = true;
        this.color = '#fff';
        this.glowColor = '#fff';
    }
    update(dt) { this.pos.add(this.vel.mul(dt)); }
    draw(ctx) {
        ctx.save();
        ctx.translate(this.pos.x, this.pos.y);
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.glowColor;
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
    destroy() { this.active = false; }
}

// ===== PLAYER =====
class Player extends Entity {
    constructor() {
        super(canvas.width / 2, canvas.height / 2, CONFIG.player.radius);
        this.color = CONFIG.colors.player;
        this.glowColor = CONFIG.colors.playerGlow;
        this.health = CONFIG.player.maxHealth;
        this.maxHealth = CONFIG.player.maxHealth;
        this.fireTimer = 0;
        this.dashTimer = 0;
        this.dashing = false;
        this.dashDir = new Vec2();
        this.invulnTimer = 0;
        this.spread = false;
        this.rapid = false;
        this.pierce = false;
        this.shield = 0;
        this.shieldTimer = 0;
    }
    update(dt, input, aimDir) {
        if (!this.dashing) {
            const moveDir = new Vec2(input.x, input.y);
            if (moveDir.lenSq() > 0) {
                moveDir.normalize().mul(CONFIG.player.speed);
                this.vel.copy(moveDir);
            } else {
                this.vel.set(0, 0);
            }
        }
        if (this.dashing) {
            this.dashTimer -= dt;
            this.vel.copy(this.dashDir).mul(CONFIG.player.dashDistance / CONFIG.player.dashDuration);
            if (this.dashTimer <= 0) {
                this.dashing = false;
                this.vel.set(0, 0);
            }
        }
        if (this.dashTimer > 0 && !this.dashing) this.dashTimer -= dt;
        if (this.invulnTimer > 0) this.invulnTimer -= dt;
        if (this.shieldTimer > 0) { this.shieldTimer -= dt; if (this.shieldTimer <= 0) this.shield = 0; }
        if (this.health < this.maxHealth) this.health = Math.min(this.maxHealth, this.health + CONFIG.player.regenRate * dt);
        this.pos.x = clamp(this.pos.x, this.radius, canvas.width - this.radius);
        this.pos.y = clamp(this.pos.y, this.radius, canvas.height - this.radius);
        super.update(dt);
    }
    canDash() { return this.dashTimer <= 0 && !this.dashing; }
    dash(dir) { this.dashing = true; this.dashTimer = CONFIG.player.dashDuration / 1000; this.dashDir.copy(dir).normalize(); this.invulnTimer = 0.3; }
    shoot(aimDir) {
        const now = Date.now();
        const rate = this.rapid ? CONFIG.player.fireRate * 0.4 : CONFIG.player.fireRate;
        if (now - this.fireTimer < rate) return null;
        this.fireTimer = now;
        const bullets = [];
        const baseAngle = aimDir.angle();
        const spread = this.spread ? 0.3 : 0;
        const count = this.spread ? 3 : 1;
        for (let i = 0; i < count; i++) {
            const angle = baseAngle + (i - (count-1)/2) * spread;
            const dir = Vec2.fromAngle(angle);
            bullets.push(new Bullet(this.pos.x, this.pos.y, dir, CONFIG.player.bulletSpeed, CONFIG.player.bulletDamage, this.pierce));
        }
        return bullets;
    }
    takeDamage(amount) {
        if (this.invulnTimer > 0) return false;
        if (this.shield > 0) { this.shield = 0; this.shieldTimer = 0; return false; }
        this.health -= amount;
        this.invulnTimer = 0.5;
        if (this.health <= 0) { this.active = false; return true; }
        return false;
    }
    draw(ctx) {
        ctx.save();
        ctx.translate(this.pos.x, this.pos.y);
        if (this.shield > 0) {
            ctx.strokeStyle = '#00ffff88';
            ctx.lineWidth = 3;
            ctx.shadowColor = '#00ffff';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(0, 0, this.radius + 8, 0, Math.PI * 2);
            ctx.stroke();
        }
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.glowColor;
        ctx.shadowBlur = this.dashing ? 30 : 20;
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(0, 0, this.radius * 0.4, 0, Math.PI * 2);
        ctx.fill();
        if (this.dashing) {
            ctx.strokeStyle = '#00ffff88';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(-this.vel.x * 0.1, -this.vel.y * 0.1);
            ctx.lineTo(-this.vel.x * 0.5, -this.vel.y * 0.5);
            ctx.stroke();
        }
        ctx.restore();
    }
}

// ===== BULLET =====
class Bullet extends Entity {
    constructor(x, y, dir, speed, damage, pierce) {
        super(x, y, 4);
        this.vel.copy(dir).mul(speed);
        this.damage = damage;
        this.pierce = pierce;
        this.hitEnemies = new Set();
        this.life = 2000;
    }
    update(dt) {
        super.update(dt);
        this.life -= dt * 1000;
        if (this.life <= 0) this.active = false;
    }
    draw(ctx) {
        ctx.save();
        ctx.translate(this.pos.x, this.pos.y);
        ctx.rotate(this.vel.angle());
        ctx.fillStyle = CONFIG.colors.bullet;
        ctx.shadowColor = CONFIG.colors.bulletGlow;
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.moveTo(this.radius * 2, 0);
        ctx.lineTo(-this.radius * 2, this.radius);
        ctx.lineTo(-this.radius, 0);
        ctx.lineTo(-this.radius * 2, -this.radius);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }
}

// ===== ENEMY TYPES =====
const ENEMY_TYPES = {
    basic: {
        radius: 14, health: 2, speed: 1.5, damage: 10, score: 10, color: '#ff3366', glow: '#ff0044',
        draw: (ctx, r, t) => {
            ctx.beginPath();
            for (let i = 0; i < 5; i++) {
                const a = t * 2 + i * Math.PI * 0.4;
                const r2 = r * (i % 2 === 0 ? 1 : 0.6);
                const x = Math.cos(a) * r2, y = Math.sin(a) * r2;
                i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
            }
            ctx.closePath(); ctx.fill();
        }
    },
    tank: {
        radius: 22, health: 6, speed: 0.8, damage: 20, score: 30, color: '#ff8800', glow: '#ffaa00',
        draw: (ctx, r, t) => {
            ctx.beginPath();
            ctx.roundRect(-r, -r, r*2, r*2, 4);
            ctx.fill();
            ctx.strokeStyle = '#ffaa00'; ctx.lineWidth = 2; ctx.stroke();
        }
    },
    shooter: {
        radius: 16, health: 3, speed: 1.2, damage: 15, score: 20, color: '#cc00ff', glow: '#aa00ff',
        shootInterval: 1500,
        draw: (ctx, r, t) => {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const a = t * 3 + i * Math.PI / 3;
                const r2 = r * (0.7 + 0.3 * Math.sin(t * 5 + i));
                ctx.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
            }
            ctx.closePath(); ctx.fill();
        }
    },
    splitter: {
        radius: 18, health: 4, speed: 1.0, damage: 15, score: 25, color: '#00ff88', glow: '#00ffaa',
        draw: (ctx, r, t) => {
            ctx.beginPath();
            for (let i = 0; i < 8; i++) {
                const a = t * 1.5 + i * Math.PI / 4;
                const r2 = r * (0.8 + 0.2 * Math.sin(t * 4 + i));
                ctx.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
            }
            ctx.closePath(); ctx.fill();
        },
        onDeath: (enemy, state) => {
            for (let i = 0; i < 3; i++) {
                state.enemies.push(new Enemy(
                    enemy.pos.x + rand(-20,20), enemy.pos.y + rand(-20,20),
                    'basic', state.wave
                ));
            }
        }
    }
};

// ===== ENEMY =====
class Enemy extends Entity {
    constructor(x, y, type, wave) {
        super(x, y, 14);
        this.type = type;
        this.config = ENEMY_TYPES[type];
        this.health = this.config.health * Math.pow(CONFIG.wave.healthMultiplier, wave - 1);
        this.maxHealth = this.health;
        this.speed = this.config.speed * Math.pow(CONFIG.wave.speedMultiplier, wave - 1);
        this.damage = this.config.damage;
        this.scoreValue = this.config.score;
        this.color = this.config.color;
        this.glowColor = this.config.glow;
        this.behaviorTimer = 0;
        this.shootTimer = this.config.shootInterval || 0;
        this.angle = 0;
        this.pattern = randInt(0, 2);
    }
    update(dt, player) {
        this.behaviorTimer += dt;
        this.config.update(this, dt, player);
        const toPlayer = new Vec2(player.pos.x - this.pos.x, player.pos.y - this.pos.y);
        const dist = toPlayer.len();
        if (dist > 0) {
            toPlayer.div(dist).mul(this.speed);
            this.vel.add(toPlayer.mul(dt));
            if (this.vel.len() > this.speed) this.vel.limit(this.speed);
        }
        if (this.config.shootInterval) {
            this.shootTimer -= dt;
            if (this.shootTimer <= 0) {
                this.shootTimer = this.config.shootInterval / 1000;
                const dir = new Vec2(player.pos.x - this.pos.x, player.pos.y - this.pos.y).normalize();
                state.enemyBullets.push(new EnemyBullet(this.pos.x, this.pos.y, dir, 8, this.config.damage));
            }
        }
        this.pos.x = clamp(this.pos.x, this.radius, canvas.width - this.radius);
        this.pos.y = clamp(this.pos.y, this.radius, canvas.height - this.radius);
    }
    draw(ctx) {
        ctx.save();
        ctx.translate(this.pos.x, this.pos.y);
        ctx.rotate(this.angle);
        this.config.draw(ctx, this.radius, this.behaviorTimer);
        ctx.restore();
        if (this.health < this.maxHealth) {
            ctx.save();
            ctx.translate(this.pos.x, this.pos.y);
            const barW = this.radius * 2, barH = 3;
            ctx.fillStyle = '#330000';
            ctx.fillRect(-barW/2, -this.radius - 10, barW, barH);
            ctx.fillStyle = '#ff3300';
            ctx.shadowColor = '#ff3300'; ctx.shadowBlur = 10;
            ctx.fillRect(-barW/2, -this.radius - 10, barW * (this.health/this.maxHealth), barH);
            ctx.restore();
        }
    }
    takeDamage(amount, bulletId) {
        this.health -= amount;
        particles.emit(this.pos.x, this.pos.y, this.color, 5, { minSpeed: 50, maxSpeed: 150, minSize: 2, maxSize: 5, minLife: 0.1, maxLife: 0.3 });
        if (this.health <= 0) {
            if (this.config.onDeath) this.config.onDeath(this, state);
            this.destroy();
            return true;
        }
        return false;
    }
}

// ===== ENEMY BULLET =====
class EnemyBullet extends Entity {
    constructor(x, y, dir, speed, damage) {
        super(x, y, 6);
        this.vel.copy(dir).mul(speed);
        this.damage = damage;
        this.life = 3000;
    }
    update(dt) {
        super.update(dt);
        this.life -= dt * 1000;
        if (this.life <= 0) this.active = false;
    }
    draw(ctx) {
        ctx.save();
        ctx.translate(this.pos.x, this.pos.y);
        ctx.rotate(this.vel.angle());
        ctx.fillStyle = '#ff3366';
        ctx.shadowColor = '#ff0044'; ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.moveTo(this.radius * 2, 0);
        ctx.lineTo(-this.radius, this.radius);
        ctx.lineTo(-this.radius, -this.radius);
        ctx.closePath(); ctx.fill();
        ctx.restore();
    }
}

// ===== PICKUP =====
class Pickup extends Entity {
    constructor(x, y, type) {
        super(x, y, 10);
        this.type = type;
        this.lifetime = CONFIG.pickup.lifetime;
        this.bobOffset = rand(0, Math.PI * 2);
        this.setupType();
    }
    setupType() {
        const configs = {
            health: { color: '#00ff44', glow: '#00ff88', effect: p => { p.health = Math.min(p.maxHealth, p.health + 25); }},
            rapid: { color: '#ff8800', glow: '#ffcc00', effect: p => { p.rapid = true; setTimeout(() => p.rapid = false, 10000); }},
            spread: { color: '#ff00ff', glow: '#ff00ff', effect: p => { p.spread = true; setTimeout(() => p.spread = false, 10000); }},
            pierce: { color: '#00ffff', glow: '#00ffff', effect: p => { p.pierce = true; setTimeout(() => p.pierce = false, 10000); }},
            shield: { color: '#00ffff', glow: '#00ffff', effect: p => { p.shield = 1; p.shieldTimer = 10; }},
            score: { color: '#ffd700', glow: '#ffaa00', effect: p => { state.score += 500; }}
        };
        const c = configs[this.type];
        this.color = c.color; this.glowColor = c.glow; this.effect = c.effect;
    }
    update(dt) {
        this.lifetime -= dt * 1000;
        this.bobOffset += dt * 3;
        this.pos.y += Math.sin(this.bobOffset) * 0.5;
        if (this.lifetime <= 0) this.active = false;
    }
    draw(ctx) {
        ctx.save();
        ctx.translate(this.pos.x, this.pos.y);
        const pulse = 1 + Math.sin(this.bobOffset * 2) * 0.15;
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.glowColor; ctx.shadowBlur = 20;
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
            const a = i * Math.PI * 0.4;
            const r = this.radius * pulse * (i % 2 === 0 ? 1 : 0.5);
            ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
        }
        ctx.closePath(); ctx.fill();
        ctx.restore();
    }
}

// ===== STATE =====
const state = {
    running: false,
    score: 0,
    highScore: 0,
    wave: 1,
    enemiesPerWave: CONFIG.wave.enemiesPerWave,
    enemiesSpawned: 0,
    player: null,
    bullets: [],
    enemyBullets: [],
    enemies: [],
    pickups: [],
    particles: null,
    gameTime: 0
};

// ===== INPUT =====
const input = { x: 0, y: 0 };
const aimDir = new Vec2(1, 0);
const keys = { left: false, right: false, up: false, down: false, space: false, dash: false };
const touchState = { move: null, aim: null };

// ===== INIT =====
function init() {
    resize();
    window.addEventListener('resize', resize);
    state.highScore = parseInt(localStorage.getItem('neonArenaHighScore')) || 0;
    document.getElementById('highScoreDisplay').textContent = state.highScore;
    document.getElementById('healthDisplay').textContent = '100';
    
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);
    canvas.addEventListener('touchstart', onTouchStart, { passive: false });
    canvas.addEventListener('touchmove', onTouchMove, { passive: false });
    canvas.addEventListener('touchend', onTouchEnd, { passive: false });
    
    document.getElementById('beginBtn').addEventListener('click', startGame);
    document.getElementById('resumeBtn').addEventListener('click', resumeGame);
    document.getElementById('quitBtn').addEventListener('click', quitToMenu);
    document.getElementById('retryBtn').addEventListener('click', startGame);

        state.particles.emit(rand(0, canvas.width), rand(0, canvas.height), CONFIG.colors.particle, 1, { minSpeed: 5, maxSpeed: 15, minSize: 1, maxSize: 3, minLife: 5, maxLife: 15 });
    }
    showStartScreen();
    requestAnimationFrame(gameLoop);
}

function resize() {
    const maxW = Math.min(window.innerWidth * 0.95, CONFIG.canvasWidth);
    const maxH = Math.min(window.innerHeight * 0.9, CONFIG.canvasHeight);
    const scale = Math.min(maxW / CONFIG.canvasWidth, maxH / CONFIG.canvasHeight);
    canvas.width = CONFIG.canvasWidth * scale;
    canvas.height = CONFIG.canvasHeight * scale;
    canvas.style.width = (CONFIG.canvasWidth * scale) + 'px';
    canvas.style.height = (CONFIG.canvasHeight * scale) + 'px';
}

function onKeyDown(e) {
    if (e.code === 'Escape') {
        if (state.running && !document.getElementById('pauseOverlay').classList.contains('hidden')) {
            resumeGame();
        } else if (state.running) {
            pauseGame();
        }
        return;
    }
    if (e.code === 'KeyW' || e.code === 'ArrowUp') input.y = -1;
    else if (e.code === 'KeyS' || e.code === 'ArrowDown') input.y = 1;
    else if (e.code === 'KeyA' || e.code === 'ArrowLeft') input.x = -1;
    else if (e.code === 'KeyD' || e.code === 'ArrowRight') input.x = 1;
    else if (e.code === 'Space' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') { e.preventDefault(); state.player?.dash(aimDir.clone().normalize() || new Vec2(1,0)); }
}

function onKeyUp(e) {
    if (e.code === 'KeyW' || e.code === 'ArrowUp') input.y = 0;
    else if (e.code === 'KeyS' || e.code === 'ArrowDown') input.y = 0;
    else if (e.code === 'KeyA' || e.code === 'ArrowLeft') input.x = 0;
    else if (e.code === 'KeyD' || e.code === 'ArrowRight') input.x = 0;
}

const touchState = { move: null, aim: null };
function onTouchStart(e) {
    e.preventDefault();
    for (let t of e.changedTouches) {
        const x = t.clientX;
        const y = t.clientY;
        if (x < window.innerWidth / 2) {
            touchState.move = { id: t.identifier, startX: x, startY: y };
        } else {
            touchState.aim = { id: t.identifier, x, y };
        }
    }
}
function onTouchMove(e) {
    e.preventDefault();
    for (let t of e.changedTouches) {
        const x = t.clientX;
        const y = t.clientY;
        if (touchState.move && touchState.move.id === t.identifier) {
            const dx = clamp((x - touchState.move.startX) / 50, -1, 1);
            const dy = clamp((y - touchState.move.startY) / 50, -1, 1);
            input.x = dx; input.y = dy;
        }
        if (touchState.aim && touchState.aim.id === t.identifier) {
            touchState.aim.x = x; touchState.aim.y = y;
        }
    }
}
function onTouchEnd(e) {
    e.preventDefault();
    for (let t of e.changedTouches) {
        if (touchState.move && touchState.move.id === t.identifier) { touchState.move = null; input.x = 0; input.y = 0; }
        if (touchState.aim && touchState.aim.id === t.identifier) { touchState.aim = null; }
    }
}

function showStartScreen() {
    state.running = false;
    document.getElementById('startOverlay').classList.remove('hidden');
    document.getElementById('pauseOverlay').classList.add('hidden');
    document.getElementById('gameOverOverlay').classList.add('hidden');
}

function startGame() {
    state.running = true;
    state.score = 0;
    state.wave = 1;
    state.enemiesPerWave = CONFIG.wave.enemiesPerWave;
    state.enemiesSpawned = 0;
    state.bullets = [];
    state.enemyBullets = [];
    state.enemies = [];
    state.pickups = [];
    state.particles.particles = [];
    state.gameTime = 0;
    state.player = new Player();
    state.player.pos.set(canvas.width / 2, canvas.height / 2);
    document.getElementById('startOverlay').classList.add('hidden');
    document.getElementById('pauseOverlay').classList.add('hidden');
    document.getElementById('gameOverOverlay').classList.add('hidden');
    document.getElementById('scoreDisplay').textContent = '0';
    document.getElementById('waveDisplay').textContent = '1';
    document.getElementById('healthDisplay').textContent = '100';
}

function resumeGame() {
    if (!state.running && state.player && state.player.health > 0) {
        state.running = true;
        document.getElementById('pauseOverlay').classList.add('hidden');
    }
}
function pauseGame() {
    if (!state.running) return;
    state.running = false;
    document.getElementById('pauseOverlay').classList.remove('hidden');
    document.getElementById('pauseWave').textContent = state.wave || state.level || 1;
    document.getElementById('pauseScore').textContent = state.score;
}



function quitToMenu() {
    state.running = false;
    document.getElementById('pauseOverlay').classList.add('hidden');
    document.getElementById('gameOverOverlay').classList.add('hidden');
    showStartScreen();
}

function spawnEnemy() {
    const types = ['basic'];
    if (state.wave >= 2) types.push('tank');
    if (state.wave >= 3) types.push('shooter');
    if (state.wave >= 4) types.push('splitter');
    const side = randInt(0, 3);
    let x, y;
    const margin = 50;
    if (side === 0) { x = rand(0, canvas.width); y = -margin; }
    else if (side === 1) { x = canvas.width + margin; y = rand(0, canvas.height); }
    else if (side === 2) { x = rand(0, canvas.width); y = canvas.height + margin; }
    else { x = -margin; y = rand(0, canvas.height); }
    const type = choose(types);
    state.enemies.push(new Enemy(x, y, type, state.wave));
}

function spawnPickup(x, y) {
    if (rand() < 0.15) {
        const type = choose(CONFIG.pickup.types);
        state.pickups.push(new Pickup(x, y, type));
    }
}

function update(dt) {
    if (!state.running) return;
    state.gameTime += dt;
    state.player.update(dt, input, aimDir);
    
    // Aim direction
    if (touchState.aim) {
        const cx = canvas.width / 2, cy = canvas.height / 2;
        aimDir.set(touchState.aim.x - cx, touchState.aim.y - cy).normalize();
    } else {
        let nearest = null, minDist = Infinity;
        for (const e of state.enemies) {
            const d = dist(state.player.pos.x, state.player.pos.y, e.pos.x, e.pos.y);
            if (d < minDist) { minDist = d; nearest = e; }
        }
        if (nearest) {
            aimDir.set(nearest.pos.x - state.player.pos.x, nearest.pos.y - state.player.pos.y).normalize();
        }
    }
    
    // Auto-fire
    const bullets = state.player.shoot(aimDir);
    if (bullets) state.bullets.push(...bullets);
    
    // Bullets
    for (let i = state.bullets.length - 1; i >= 0; i--) {
        const b = state.bullets[i];
        b.update(dt);
        if (!b.active) { state.bullets.splice(i, 1); continue; }
        for (let j = state.enemies.length - 1; j >= 0; j--) {
            const e = state.enemies[j];
            if (dist(b.pos.x, b.pos.y, e.pos.x, e.pos.y) < b.radius + e.radius) {
                if (e.takeDamage(b.damage, b)) {
                    state.score += e.scoreValue;
                    particles.emit(e.pos.x, e.pos.y, e.color, 15, { minSpeed: 50, maxSpeed: 200, minSize: 2, maxSize: 6, minLife: 0.2, maxLife: 0.6 });
                    spawnPickup(e.pos.x, e.pos.y);
                }
                if (!b.pierce) { b.active = false; break; }
                b.hitEnemies.add(e);
            }
        }
        if (!b.active) state.bullets.splice(i, 1);
    }
    
    // Enemy bullets
    for (let i = state.enemyBullets.length - 1; i >= 0; i--) {
        const b = state.enemyBullets[i];
        b.update(dt);
        if (!b.active) { state.enemyBullets.splice(i, 1); continue; }
        if (dist(b.pos.x, b.pos.y, state.player.pos.x, state.player.pos.y) < b.radius + state.player.radius) {
            if (state.player.takeDamage(b.damage)) { gameOver(); return; }
            particles.emit(b.pos.x, b.pos.y, '#ff3366', 8, { minSpeed: 50, maxSpeed: 150, minSize: 2, maxSize: 4, minLife: 0.1, maxLife: 0.3 });
            b.active = false;
        }
        if (!b.active) state.enemyBullets.splice(i, 1);
    }
    
    // Enemies
    for (let i = state.enemies.length - 1; i >= 0; i--) {
        const e = state.enemies[i];
        e.update(dt, state.player);
        if (!e.active) { state.enemies.splice(i, 1); continue; }
        if (dist(e.pos.x, e.pos.y, state.player.pos.x, state.player.pos.y) < e.radius + state.player.radius) {
            if (state.player.takeDamage(e.damage)) { gameOver(); return; }
            particles.emit(e.pos.x, e.pos.y, e.color, 10, { minSpeed: 50, maxSpeed: 150, minSize: 2, maxSize: 5, minLife: 0.1, maxLife: 0.3 });
        }
    }
    
    // Pickups
    for (let i = state.pickups.length - 1; i >= 0; i--) {
        const p = state.pickups[i];
        p.update(dt);
        if (!p.active) { state.pickups.splice(i, 1); continue; }
        if (dist(p.pos.x, p.pos.y, state.player.pos.x, state.player.pos.y) < p.radius + state.player.radius) {
            p.effect(state.player);
            particles.emit(p.pos.x, p.pos.y, p.color, 12, { minSpeed: 50, maxSpeed: 150, minSize: 3, maxSize: 8, minLife: 0.3, maxLife: 0.6 });
            p.active = false;
        }
    }
    
    state.particles.update(dt);
    
    // Wave spawning
    if (state.enemiesSpawned < state.enemiesPerWave) {
        if (!state.spawnTimer) state.spawnTimer = 0;
        state.spawnTimer += 1/60;
        const spawnInterval = Math.max(0.5, 2.0 - state.wave * 0.1);
        if (state.spawnTimer >= spawnInterval) {
            state.spawnTimer = 0;
            spawnEnemy();
            state.enemiesSpawned++;
        }
    }
    
    if (state.enemies.length === 0 && state.enemiesSpawned >= state.enemiesPerWave) {
        state.wave++;
        state.enemiesPerWave += CONFIG.wave.enemyIncrease;
        state.enemiesSpawned = 0;
        document.getElementById('waveDisplay').textContent = state.wave;
        state.score += 100 * state.wave;
    }
    
    document.getElementById('scoreDisplay').textContent = state.score;
    document.getElementById('healthDisplay').textContent = Math.max(0, Math.floor(state.player.health));
}

function gameOver() {
    state.running = false;
    if (state.score > state.highScore) {
        state.highScore = state.score;
        localStorage.setItem('neonArenaHighScore', state.highScore);
    }
    document.getElementById('finalScore').textContent = state.score;
    document.getElementById('highScoreMsg').textContent = state.score > state.highScore ? 'NEW HIGH SCORE!' : '';
    document.getElementById('gameOverOverlay').classList.remove('hidden');
}

function draw() {
    ctx.fillStyle = '#050510';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Grid
    ctx.strokeStyle = CONFIG.colors.bgGrid;
    ctx.lineWidth = 1;
    const gridSize = 50;
    for (let x = 0; x <= canvas.width; x += gridSize) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let y = 0; y <= canvas.height; y += gridSize) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }
    
    state.particles.draw(ctx);
    for (const p of state.pickups) p.draw(ctx);
    for (const b of state.bullets) b.draw(ctx);
    for (const b of state.enemyBullets) b.draw(ctx);
    for (const e of state.enemies) e.draw(ctx);
    state.player.draw(ctx);
}

function gameLoop() {
    const dt = 1/60;
    update(dt);
    draw();
    requestAnimationFrame(gameLoop);
}
