<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Tetris - Day 12</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0a0a12;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', 'Courier New', monospace;
    color: #00ffff;
    overflow: hidden;
    touch-action: none;
}
canvas { display: block; box-shadow: 0 0 30px #00ffff80, inset 0 0 30px #00ffff20; border-radius: 8px; }
#ui {
    position: fixed;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 40px;
    z-index: 10;
    pointer-events: none;
}
.stat { text-align: center; text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff80; }
.stat-label { font-size: 10px; opacity: 0.7; letter-spacing: 2px; }
.stat-value { font-size: 24px; font-weight: 700; }
#highScore { color: #ffcc00; text-shadow: 0 0 10px #ffcc00, 0 0 20px #ffcc0080; }
#controls {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    pointer-events: none;
    z-index: 10;
}
.btn-row { display: flex; gap: 10px; }
.touch-btn {
    width: 60px;
    height: 60px;
    background: linear-gradient(135deg, #1a1a2e, #0f0f1a);
    border: 2px solid #00ffff60;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #00ffff;
    font-size: 24px;
    pointer-events: auto;
    touch-action: manipulation;
    user-select: none;
    transition: all 0.1s;
    box-shadow: 0 0 15px #00ffff30;
}
.touch-btn:active, .touch-btn.active {
    background: linear-gradient(135deg, #00ffff40, #0088ff40);
    border-color: #00ffff;
    box-shadow: 0 0 25px #00ffff, inset 0 0 20px #00ffff40;
    transform: scale(0.95);
}
.touch-btn.rotate { width: 130px; font-size: 14px; }
#startScreen, #gameOverScreen, #pauseScreen {
    position: fixed;
    inset: 0;
    background: rgba(10, 10, 18, 0.95);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    z-index: 100;
    backdrop-filter: blur(10px);
}
#startScreen.hidden, #gameOverScreen.hidden, #pauseScreen.hidden { display: none; }
h1 { font-size: 48px; font-weight: 900; background: linear-gradient(90deg, #00ffff, #ff00ff, #00ffff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 40px #00ffff80; letter-spacing: 4px; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.5); } }
.btn {
    padding: 16px 48px;
    font-size: 18px;
    font-family: inherit;
    font-weight: 700;
    background: linear-gradient(135deg, #00ffff, #0088ff);
    border: none;
    border-radius: 8px;
    color: #000;
    cursor: pointer;
    pointer-events: auto;
    touch-action: manipulation;
    transition: all 0.2s;
    text-transform: uppercase;
    letter-spacing: 2px;
    box-shadow: 0 0 20px #00ffff80;
}
.btn:hover, .btn:active { transform: scale(1.05); box-shadow: 0 0 30px #00ffff, 0 0 60px #00ffff60; }
.btn-secondary {
    background: linear-gradient(135deg, #333, #1a1a2e);
    border: 2px solid #00ffff60;
    color: #00ffff;
    box-shadow: 0 0 15px #00ffff30;
}
.btn-secondary:hover, .btn-secondary:active {
    background: linear-gradient(135deg, #00ffff20, #0088ff20);
    border-color: #00ffff;
    box-shadow: 0 0 25px #00ffff, inset 0 0 20px #00ffff20;
}
#finalScore { font-size: 32px; color: #ffcc00; text-shadow: 0 0 20px #ffcc00; }
#levelDisplay { font-size: 18px; opacity: 0.8; }
@media (max-width: 600px) {
    h1 { font-size: 32px; }
    .stat-value { font-size: 18px; }
    #ui { gap: 20px; }
    .touch-btn { width: 50px; height: 50px; }
    .touch-btn.rotate { width: 110px; }
}
</style>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
<div id="ui">
    <div class="stat">
        <div class="stat-label">SCORE</div>
        <div class="stat-value" id="score">0</div>
    </div>
    <div class="stat">
        <div class="stat-label">LEVEL</div>
        <div class="stat-value" id="levelDisplay">1</div>
    </div>
    <div class="stat">
        <div class="stat-label">HIGH</div>
        <div class="stat-value" id="highScore">0</div>
    </div>
</div>
<canvas id="game"></canvas>
<div id="controls">
    <div class="btn-row">
        <button class="touch-btn left" data-dir="left">&#9664;</button>
        <button class="touch-btn down" data-dir="down">&#9660;</button>
        <button class="touch-btn right" data-dir="right">&#9654;</button>
    </div>
    <button class="touch-btn rotate" data-dir="rotate">ROTATE</button>
</div>
<div id="startScreen">
    <h1>NEON TETRIS</h1>
    <p style="color:#888; font-size:14px; letter-spacing:2px;">DAY 12 - DAILY GAME STUDIO</p>
    <button class="btn" id="startBtn">START GAME</button>
</div>
<div id="pauseScreen" class="hidden">
    <h1>PAUSED</h1>
    <button class="btn" id="resumeBtn">RESUME</button>
    <button class="btn btn-secondary" id="quitBtn">QUIT TO MENU</button>
</div>
<div id="gameOverScreen" class="hidden">
    <h1>GAME OVER</h1>
    <div id="finalScore">SCORE: 0</div>
    <div id="finalLevel">LEVEL: 1</div>
    <button class="btn" id="retryBtn">RETRY</button>
    <button class="btn btn-secondary" id="mainMenuBtn">MAIN MENU</button>
</div>
<script>
// Neon Tetris - Day 12
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const COLS = 10, ROWS = 20;
let BLOCK_SIZE, OFFSET_X, OFFSET_Y;
const COLORS = [
    null,
    '#00ffff', // I - cyan
    '#ff00ff', // T - magenta
    '#ffff00', // O - yellow
    '#ff8800', // L - orange
    '#00ff88', // J - green
    '#ff0088', // S - pink
    '#8800ff'  // Z - purple
];
const GLOW_COLORS = [
    null,
    'rgba(0,255,255,',
    'rgba(255,0,255,',
    'rgba(255,255,0,',
    'rgba(255,136,0,',
    'rgba(0,255,136,',
    'rgba(255,0,136,',
    'rgba(136,0,255,'
];
const SHAPES = [
    [],
    [[1,1,1,1]], // I
    [[0,1,0],[1,1,1]], // T
    [[1,1],[1,1]], // O
    [[0,0,1],[1,1,1]], // L
    [[1,0,0],[1,1,1]], // J
    [[0,1,1],[1,1,0]], // S
    [[1,1,0],[0,1,1]]  // Z
];
const KICKS = [
    [[0,0]], // 0->R
    [[0,0],[-1,0],[1,0],[-2,0],[2,0]], // R->2
    [[0,0],[1,0],[-1,0],[2,0],[-2,0]], // 2->R
    [[0,0]]  // 2->0 (180)
];

let board, currentPiece, nextPiece, holdPiece, canHold;
let score, level, lines, highScore;
let dropCounter, dropInterval, lastTime;
let running = false;
let paused = false;
let animationId = null;

function resize() {
    const maxWidth = window.innerWidth * 0.9;
    const maxHeight = window.innerHeight * 0.85;
    BLOCK_SIZE = Math.min(maxWidth / COLS, maxHeight / ROWS);
    BLOCK_SIZE = Math.max(20, Math.min(35, BLOCK_SIZE));
    canvas.width = COLS * BLOCK_SIZE;
    canvas.height = ROWS * BLOCK_SIZE;
    OFFSET_X = (window.innerWidth - canvas.width) / 2;
    OFFSET_Y = (window.innerHeight - canvas.height) / 2;
    canvas.style.left = OFFSET_X + 'px';
    canvas.style.top = OFFSET_Y + 'px';
    canvas.style.position = 'fixed';
}

function createBoard() {
    return Array.from({length: ROWS}, () => Array(COLS).fill(0));
}

function randomPiece() {
    const pieces = [1,2,3,4,5,6,7];
    const idx = Math.floor(Math.random() * pieces.length);
    return {
        type: pieces[idx],
        shape: SHAPES[pieces[idx]],
        x: Math.floor(COLS / 2) - Math.ceil(SHAPES[pieces[idx]][0].length / 2),
        y: 0,
        rotation: 0
    };
}

function rotate(matrix) {
    const N = matrix.length;
    const M = matrix[0].length;
    const result = Array.from({length: M}, () => Array(N).fill(0));
    for (let y = 0; y < N; y++) {
        for (let x = 0; x < M; x++) {
            result[x][N - 1 - y] = matrix[y][x];
        }
    }
    return result;
}

function collide(piece, board, offsetX = 0, offsetY = 0) {
    for (let y = 0; y < piece.shape.length; y++) {
        for (let x = 0; x < piece.shape[y].length; x++) {
            if (piece.shape[y][x]) {
                const newX = piece.x + x + offsetX;
                const newY = piece.y + y + offsetY;
                if (newX < 0 || newX >= COLS || newY >= ROWS) return true;
                if (newY >= 0 && board[newY][newX]) return true;
            }
        }
    }
    return false;
}

function merge(piece, board) {
    for (let y = 0; y < piece.shape.length; y++) {
        for (let x = 0; x < piece.shape[y].length; x++) {
            if (piece.shape[y][x]) {
                const boardY = piece.y + y;
                const boardX = piece.x + x;
                if (boardY >= 0 && boardY < ROWS && boardX >= 0 && boardX < COLS) {
                    board[boardY][boardX] = piece.type;
                }
            }
        }
    }
}

function clearLines() {
    let linesCleared = 0;
    outer: for (let y = ROWS - 1; y >= 0; y--) {
        for (let x = 0; x < COLS; x++) {
            if (!board[y][x]) continue outer;
        }
        board.splice(y, 1);
        board.unshift(Array(COLS).fill(0));
        linesCleared++;
        y++;
    }
    return linesCleared;
}

function getGhostY() {
    let ghostY = currentPiece.y;
    while (!collide(currentPiece, board, 0, ghostY - currentPiece.y + 1)) {
        ghostY++;
    }
    return ghostY;
}

function updateScore(lines) {
    const points = [0, 100, 300, 500, 800];
    score += points[lines] * level;
    if (lines > 0) {
        lines += lines;
        const newLevel = Math.floor(lines / 10) + 1;
        if (newLevel > level) {
            level = newLevel;
            dropInterval = Math.max(100, 1000 - (level - 1) * 80);
            document.getElementById('levelDisplay').textContent = level;
        }
    }
    document.getElementById('score').textContent = score;
    if (score > highScore) {
        highScore = score;
        document.getElementById('highScore').textContent = highScore;
        localStorage.setItem('neonTetrisHighScore', highScore);
    }
}

function pieceDrop() {
    if (!running || paused) return;
    if (collide(currentPiece, board, 0, 1)) {
        merge(currentPiece, board);
        const cleared = clearLines();
        updateScore(cleared);
        currentPiece = nextPiece;
        nextPiece = randomPiece();
        canHold = true;
        if (collide(currentPiece, board, 0, 0)) {
            gameOver();
            return;
        }
    } else {
        currentPiece.y++;
    }
    dropCounter = 0;
}

function move(dir) {
    if (!running || paused) return;
    if (dir === 'left' && !collide(currentPiece, board, -1, 0)) currentPiece.x--;
    else if (dir === 'right' && !collide(currentPiece, board, 1, 0)) currentPiece.x++;
    else if (dir === 'down') {
        if (!collide(currentPiece, board, 0, 1)) {
            currentPiece.y++;
            score += 1;
            document.getElementById('score').textContent = score;
        }
    }
}

function rotatePiece() {
    if (!running || paused) return;
    const originalShape = currentPiece.shape;
    const originalRotation = currentPiece.rotation;
    const newShape = rotate(currentPiece.shape);
    const newRotation = (currentPiece.rotation + 1) % 4;
    
    const kickIndex = originalRotation === 0 ? 0 : originalRotation === 1 ? 1 : originalRotation === 2 ? 2 : 3;
    const kicks = KICKS[kickIndex] || [[0,0]];
    
    for (const [kx, ky] of kicks) {
        currentPiece.shape = newShape;
        currentPiece.rotation = newRotation;
        if (!collide(currentPiece, board, kx, ky)) {
            currentPiece.x += kx;
            currentPiece.y += ky;
            return;
        }
    }
    currentPiece.shape = originalShape;
    currentPiece.rotation = originalRotation;
}

function holdPieceFunc() {
    if (!running || paused || !canHold) return;
    if (holdPiece === null) {
        holdPiece = currentPiece.type;
        currentPiece = nextPiece;
        nextPiece = randomPiece();
    } else {
        const temp = holdPiece;
        holdPiece = currentPiece.type;
        currentPiece = { ...createPiece(temp), x: Math.floor(COLS / 2) - 1, y: 0, rotation: 0 };
    }
    canHold = false;
    drawHold();
}

function createPiece(type) {
    return {
        type,
        shape: SHAPES[type],
        x: Math.floor(COLS / 2) - Math.ceil(SHAPES[type][0].length / 2),
        y: 0,
        rotation: 0
    };
}

function drawBlock(x, y, color, glow, alpha = 1, isGhost = false) {
    const px = x * BLOCK_SIZE;
    const py = y * BLOCK_SIZE;
    const size = BLOCK_SIZE - 2;
    
    if (isGhost) {
        ctx.strokeStyle = glow + '0.3)';
        ctx.lineWidth = 2;
        ctx.strokeRect(px + 1, py + 1, size, size);
        ctx.fillStyle = glow + '0.1)';
        ctx.fillRect(px + 1, py + 1, size, size);
        return;
    }
    
    const gradient = ctx.createLinearGradient(px, py, px + BLOCK_SIZE, py + BLOCK_SIZE);
    gradient.addColorStop(0, color);
    gradient.addColorStop(1, glow + '0.8)');
    
    ctx.fillStyle = gradient;
    ctx.fillRect(px + 1, py + 1, size, size);
    
    ctx.strokeStyle = glow + '0.6)';
    ctx.lineWidth = 1;
    ctx.strokeRect(px + 1, py + 1, size, size);
    
    ctx.fillStyle = glow + '0.4)';
    ctx.fillRect(px + 1, py + 1, size, 2);
    ctx.fillRect(px + 1, py + 1, 2, size);
}

function draw() {
    ctx.fillStyle = '#0a0a12';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.strokeStyle = '#00ffff20';
    ctx.lineWidth = 0.5;
    for (let x = 0; x <= COLS; x++) {
        ctx.beginPath();
        ctx.moveTo(x * BLOCK_SIZE, 0);
        ctx.lineTo(x * BLOCK_SIZE, canvas.height);
        ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
        ctx.beginPath();
        ctx.moveTo(0, y * BLOCK_SIZE);
        ctx.lineTo(canvas.width, y * BLOCK_SIZE);
        ctx.stroke();
    }
    
    for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
            if (board[y][x]) {
                const color = COLORS[board[y][x]];
                const glow = GLOW_COLORS[board[y][x]];
                drawBlock(x, y, color, glow);
            }
        }
    }
    
    const ghostY = getGhostY();
    if (ghostY > currentPiece.y) {
        for (let y = 0; y < currentPiece.shape.length; y++) {
            for (let x = 0; x < currentPiece.shape[y].length; x++) {
                if (currentPiece.shape[y][x]) {
                    const color = COLORS[currentPiece.type];
                    const glow = GLOW_COLORS[currentPiece.type];
                    drawBlock(currentPiece.x + x, ghostY + y, color, glow, 1, true);
                }
            }
        }
    }
    
    for (let y = 0; y < currentPiece.shape.length; y++) {
        for (let x = 0; x < currentPiece.shape[y].length; x++) {
            if (currentPiece.shape[y][x]) {
                const color = COLORS[currentPiece.type];
                const glow = GLOW_COLORS[currentPiece.type];
                drawBlock(currentPiece.x + x, currentPiece.y + y, color, glow);
            }
        }
    }
    
    drawNext();
    drawHold();
}

function drawNext() {
    const nextCanvas = document.createElement('canvas');
    nextCanvas.width = 4 * BLOCK_SIZE;
    nextCanvas.height = 4 * BLOCK_SIZE;
    const nctx = nextCanvas.getContext('2d');
    nctx.fillStyle = '#0a0a12';
    nctx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
    
    const shape = nextPiece.shape;
    const offsetX = (4 - shape[0].length) / 2;
    const offsetY = (4 - shape.length) / 2;
    
    for (let y = 0; y < shape.length; y++) {
        for (let x = 0; x < shape[y].length; x++) {
            if (shape[y][x]) {
                const color = COLORS[nextPiece.type];
                const glow = GLOW_COLORS[nextPiece.type];
                const px = (offsetX + x) * BLOCK_SIZE;
                const py = (offsetY + y) * BLOCK_SIZE;
                const size = BLOCK_SIZE - 2;
                const gradient = nctx.createLinearGradient(px, py, px + BLOCK_SIZE, py + BLOCK_SIZE);
                gradient.addColorStop(0, color);
                gradient.addColorStop(1, glow + '0.8)');
                nctx.fillStyle = gradient;
                nctx.fillRect(px + 1, py + 1, size, size);
            }
        }
    }
}

function drawHold() {
    if (holdPiece === null) return;
    const shape = SHAPES[holdPiece];
    const color = COLORS[holdPiece];
    const glow = GLOW_COLORS[holdPiece];
}

function gameLoop(time = 0) {
    if (!running) return;
    
    const deltaTime = time - lastTime;
    lastTime = time;
    
    if (!paused) {
        dropCounter += deltaTime;
        if (dropCounter > dropInterval) {
            pieceDrop();
        }
    }
    
    draw();
    animationId = requestAnimationFrame(gameLoop);
}

function startGame() {
    board = createBoard();
    currentPiece = randomPiece();
    nextPiece = randomPiece();
    holdPiece = null;
    canHold = true;
    score = 0;
    level = 1;
    lines = 0;
    dropCounter = 0;
    dropInterval = 1000;
    lastTime = 0;
    running = true;
    paused = false;
    
    document.getElementById('score').textContent = '0';
    document.getElementById('levelDisplay').textContent = '1';
    
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('gameOverScreen').classList.add('hidden');
    document.getElementById('pauseScreen').classList.add('hidden');
    
    if (animationId) cancelAnimationFrame(animationId);
    gameLoop();
}

function pauseGame() {
    if (!running || paused) return;
    paused = true;
    document.getElementById('pauseScreen').classList.remove('hidden');
}

function resumeGame() {
    if (!running || !paused) return;
    paused = false;
    document.getElementById('pauseScreen').classList.add('hidden');
    lastTime = performance.now();
    gameLoop();
}

function quitToMenu() {
    running = false;
    paused = false;
    if (animationId) cancelAnimationFrame(animationId);
    document.getElementById('pauseScreen').classList.add('hidden');
    document.getElementById('gameOverScreen').classList.add('hidden');
    showStartScreen();
}

function showStartScreen() {
    document.getElementById('startScreen').classList.remove('hidden');
}

function gameOver() {
    running = false;
    paused = false;
    if (animationId) cancelAnimationFrame(animationId);
    document.getElementById('finalScore').textContent = 'SCORE: ' + score;
    document.getElementById('finalLevel').textContent = 'LEVEL: ' + level;
    document.getElementById('gameOverScreen').classList.remove('hidden');
}

function handleKeyDown(e) {
    if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
        if (running && !paused) pauseGame();
        else if (running && paused) resumeGame();
        return;
    }
    if (!running || paused) return;
    
    switch(e.key) {
        case 'ArrowLeft': move('left'); break;
        case 'ArrowRight': move('right'); break;
        case 'ArrowDown': move('down'); break;
        case 'ArrowUp': rotatePiece(); break;
        case ' ': 
            e.preventDefault();
            while (!collide(currentPiece, board, 0, 1)) {
                currentPiece.y++;
                score += 2;
            }
            pieceDrop();
            break;
        case 'c':
        case 'C': holdPieceFunc(); break;
    }
}

function handleTouch(e) {
    const btn = e.target.closest('.touch-btn');
    if (!btn) return;
    e.preventDefault();
    const dir = btn.dataset.dir;
    if (dir === 'rotate') rotatePiece();
    else move(dir);
}

window.addEventListener('keydown', handleKeyDown);
window.addEventListener('resize', resize);
document.getElementById('controls').addEventListener('touchstart', handleTouch, {passive: false});
document.getElementById('controls').addEventListener('click', handleTouch);

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('resumeBtn').addEventListener('click', resumeGame);
document.getElementById('quitBtn').addEventListener('click', quitToMenu);
document.getElementById('retryBtn').addEventListener('click', startGame);
document.getElementById('mainMenuBtn').addEventListener('click', quitToMenu);

highScore = parseInt(localStorage.getItem('neonTetrisHighScore')) || 0;
document.getElementById('highScore').textContent = highScore;

resize();
showStartScreen();
</script>
</body>
</html>
