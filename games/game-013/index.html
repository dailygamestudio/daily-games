<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Surge - Day 13</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
    background: #0a0a12; 
    min-height: 100vh; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    font-family: 'Orbitron', 'Segoe UI', sans-serif; 
    overflow: hidden;
    touch-action: none;
}
canvas { 
    display: block; 
    box-shadow: 0 0 30px #00ffff88, 0 0 60px #ff00ff44, inset 0 0 60px #000000aa;
    border-radius: 4px;
    border: 2px solid #00ffff44;
}
#ui {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 32px;
    color: #00ffff;
    text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
    font-size: 1.1rem;
    letter-spacing: 2px;
    z-index: 10;
    pointer-events: none;
}
#ui span { 
    background: rgba(0, 20, 30, 0.8); 
    padding: 6px 16px; 
    border-radius: 4px; 
    border: 1px solid #00ffff44;
    min-width: 100px;
    text-align: center;
}
#ui .label { color: #ff00ff; text-shadow: 0 0 10px #ff00ff; }
#highScore { color: #ffff00; text-shadow: 0 0 10px #ffff00; }
#startScreen, #gameOverOverlay, #pauseOverlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.95);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    z-index: 100;
    color: #00ffff;
    text-align: center;
    padding: 20px;
}
#startScreen h1, #gameOverOverlay h1, #pauseOverlay h1 {
    font-size: clamp(2.5rem, 8vw, 4rem);
    font-weight: 900;
    background: linear-gradient(90deg, #00ffff, #ff00ff, #ffff00, #00ffff);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: gradientShift 3s linear infinite;
    text-shadow: none;
}
@keyframes gradientShift { 0% { background-position: 0% 50%; } 100% { background-position: 300% 50%; } }
#startScreen p, #gameOverOverlay p, #pauseOverlay p { 
    color: #88ffff; 
    font-size: clamp(1rem, 3vw, 1.3rem); 
    max-width: 80%;
    line-height: 1.6;
}
#startScreen .controls, #gameOverOverlay .controls, #pauseOverlay .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    margin-top: 8px;
    color: #aaa;
    font-size: 0.9rem;
}
#startScreen .controls kbd, #gameOverOverlay .controls kbd, #pauseOverlay .controls kbd {
    background: #112233;
    border: 1px solid #00ffff44;
    padding: 4px 10px;
    border-radius: 4px;
    color: #00ffff;
    box-shadow: 0 0 8px #00ffff22;
}
.btn {
    padding: 14px 48px;
    font-size: 1.2rem;
    font-family: inherit;
    font-weight: 700;
    letter-spacing: 3px;
    background: linear-gradient(135deg, #003344, #001122);
    border: 2px solid #00ffff;
    color: #00ffff;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    box-shadow: 0 0 20px #00ffff44, inset 0 0 20px #00ffff22;
}
.btn:hover, .btn:active { 
    background: linear-gradient(135deg, #005566, #003344);
    box-shadow: 0 0 30px #00ffff88, inset 0 0 30px #00ffff44;
    transform: scale(1.02);
}
.btn:focus { outline: 2px solid #ff00ff; outline-offset: 3px; }
.hidden { display: none !important; }
#finalScore { color: #ffff00; font-size: 2rem; font-weight: 700; text-shadow: 0 0 20px #ffff00; }
#newHigh { color: #ff00ff; font-size: 1.5rem; animation: pulse 1s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
@media (max-width: 600px) {
    #ui { top: 8px; gap: 12px; font-size: 0.85rem; }
    #ui span { padding: 4px 10px; min-width: 80px; }
    canvas { border-width: 1px; }
}
</style>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
<div id="ui">
    <span><span class="label">SCORE</span><br><span id="score">0</span></span>
    <span><span class="label">BEST</span><br><span id="highScore">0</span></span>
    <span><span class="label">SPEED</span><br><span id="speedDisplay">1.0x</span></span>
    <span><span class="label">PHASE</span><br><span id="phaseDisplay">CYAN</span></span>
</div>
<canvas id="game"></canvas>

<div id="startScreen">
    <h1>NEON SURGE</h1>
    <p>Surf the data stream. Shift phase to pass barriers. Survive the surge.</p>
    <div class="controls">
        <kbd>SPACE</kbd> / <kbd>TAP</kbd> = Jump
        <kbd>SHIFT</kbd> / <kbd>SWIPE DOWN</kbd> = Slide
        <kbd>←/→</kbd> / <kbd>SWIPE L/R</kbd> = Shift Phase
    </div>
    <button class="btn" id="startBtn">INITIALIZE</button>
</div>

<div id="gameOverOverlay" class="hidden">
    <h1>CONNECTION LOST</h1>
    <div id="finalScore">0</div>
    <div id="newHigh" class="hidden">NEW RECORD</div>
    <div style="display:flex; gap:16px; flex-wrap:wrap; justify-content:center;">
        <button class="btn" id="retryBtn">RETRY</button>
        <button class="btn" id="mainMenuBtn">MAIN MENU</button>
    </div>
</div>

<div id="pauseOverlay" class="hidden">
    <h1>PAUSED</h1>
    <p>Data stream suspended</p>
    <div style="display:flex; gap:16px; flex-wrap:wrap; justify-content:center;">
        <button class="btn" id="resumeBtn">RESUME</button>
        <button class="btn" id="quitBtn">QUIT TO MENU</button>
    </div>
</div>

<script>
// ===== NEON SURGE - Day 13 =====
// Endless runner with phase-shifting mechanic
// Neon/cyberpunk aesthetic, keyboard + touch controls, localStorage high score

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// ----- CONFIG -----
const CONFIG = {
    baseWidth: 800,
    baseHeight: 400,
    playerWidth: 40,
    playerHeight: 60,
    playerX: 100,
    groundY: 320,
    jumpForce: -18,
    gravity: 0.9,
    slideHeight: 30,
    slideDuration: 300,
    phases: [
        { name: 'CYAN', color: '#00ffff', glow: '#00ffff', bg: '#001122' },
        { name: 'MAGENTA', color: '#ff00ff', glow: '#ff00ff', bg: '#220022' },
        { name: 'YELLOW', color: '#ffff00', glow: '#ffff00', bg: '#222200' },
        { name: 'GREEN', color: '#00ff88', glow: '#00ff88', bg: '#002211' }
    ],
    initialSpeed: 6,
    maxSpeed: 18,
    speedIncrease: 0.0008,
    spawnInterval: 1500,
    minSpawnInterval: 600,
    phaseShiftCooldown: 200,
    particleCount: 150,
    trailLength: 8,
    screenShakeMax: 8
};

// ----- STATE -----
let state = {
    running: false,
    gameOver: false,
    score: 0,
    highScore: 0,
    speed: CONFIG.initialSpeed,
    time: 0,
    lastSpawn: 0,
    phaseIndex: 0,
    lastPhaseShift: 0,
    playerY: CONFIG.groundY - CONFIG.playerHeight,
    playerVY: 0,
    isJumping: false,
    isSliding: false,
    slideTimer: 0,
    trail: [],
    obstacles: [],
    particles: [],
    backgroundStars: [],
    screenShake: 0,
    screenShakeX: 0,
    screenShakeY: 0,
    keys: {},
    touchStart: null,
    lastTime: 0
};

// ----- INIT -----
function init() {
    resize();
    window.addEventListener('resize', resize);
    
    state.highScore = parseInt(localStorage.getItem('neonSurgeHighScore') || '0', 10);
    document.getElementById('highScore').textContent = state.highScore;
    
    for (let i = 0; i < 80; i++) {
        state.backgroundStars.push({
            x: Math.random() * CONFIG.baseWidth,
            y: Math.random() * CONFIG.baseHeight,
            size: Math.random() * 2 + 0.5,
            speed: Math.random() * 0.5 + 0.1,
            brightness: Math.random()
        });
    }
    
    for (let i = 0; i < CONFIG.particleCount; i++) {
        spawnAmbientParticle();
    }
    
    window.addEventListener('keydown', e => { 
        state.keys[e.code] = true; 
        preventGameKeys(e);
        if (e.code === 'Escape' || e.key === 'Escape') {
            if (!document.getElementById('pauseOverlay').classList.contains('hidden')) {
                resumeGame();
            } else if (state.running && !state.gameOver) {
                pauseGame();
            }
            return;
        }
    });
    window.addEventListener('keyup', e => { state.keys[e.code] = false; });
    
    canvas.addEventListener('touchstart', onTouchStart, { passive: false });
    canvas.addEventListener('touchmove', onTouchMove, { passive: false });
    canvas.addEventListener('touchend', onTouchEnd, { passive: false });
    
    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('retryBtn').addEventListener('click', startGame);
    document.getElementById('mainMenuBtn').addEventListener('click', showStartScreen);
    document.getElementById('resumeBtn').addEventListener('click', resumeGame);
    document.getElementById('quitBtn').addEventListener('click', quitToMenu);
    
    requestAnimationFrame(gameLoop);
}

function preventGameKeys(e) {
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ShiftLeft', 'ShiftRight'].includes(e.code)) {
        e.preventDefault();
    }
}

// ----- RESIZE -----
function resize() {
    const maxWidth = window.innerWidth - 32;
    const maxHeight = window.innerHeight - 120;
    const scale = Math.min(maxWidth / CONFIG.baseWidth, maxHeight / CONFIG.baseHeight, 1);
    canvas.width = CONFIG.baseWidth * scale;
    canvas.height = CONFIG.baseHeight * scale;
    canvas.style.width = `${canvas.width}px`;
    canvas.style.height = `${canvas.height}px`;
}

// ----- GAME CONTROL -----
function startGame() {
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('gameOverOverlay').classList.add('hidden');
    document.getElementById('pauseOverlay').classList.add('hidden');
    
    state.running = true;
    state.gameOver = false;
    state.score = 0;
    state.speed = CONFIG.initialSpeed;
    state.time = 0;
    state.lastSpawn = 0;
    state.phaseIndex = 0;
    state.lastPhaseShift = 0;
    state.playerY = CONFIG.groundY - CONFIG.playerHeight;
    state.playerVY = 0;
    state.isJumping = false;
    state.isSliding = false;
    state.slideTimer = 0;
    state.trail = [];
    state.obstacles = [];
    state.particles = [];
    state.screenShake = 0;
    
    document.getElementById('score').textContent = '0';
    document.getElementById('speedDisplay').textContent = '1.0x';
    updatePhaseDisplay();
}

function endGame() {
    state.running = false;
    state.gameOver = true;
    
    const isNewHigh = state.score > state.highScore;
    if (isNewHigh) {
        state.highScore = state.score;
        localStorage.setItem('neonSurgeHighScore', state.highScore.toString());
        document.getElementById('highScore').textContent = state.highScore;
    }
    
    document.getElementById('finalScore').textContent = Math.floor(state.score);
    document.getElementById('newHigh').classList.toggle('hidden', !isNewHigh);
    document.getElementById('gameOverOverlay').classList.remove('hidden');
    
    triggerScreenShake(12);
}

function pauseGame() {
    if (!state.running) return;
    state.running = false;
    document.getElementById('pauseOverlay').classList.remove('hidden');
}

function resumeGame() {
    if (state.running) return;
    state.running = true;
    document.getElementById('pauseOverlay').classList.add('hidden');
}

function quitToMenu() {
    state.running = false;
    state.gameOver = false;
    document.getElementById('pauseOverlay').classList.add('hidden');
    document.getElementById('gameOverOverlay').classList.add('hidden');
    showStartScreen();
}

function showStartScreen() {
    state.running = false;
    state.gameOver = false;
    document.getElementById('pauseOverlay').classList.add('hidden');
    document.getElementById('gameOverOverlay').classList.add('hidden');
    document.getElementById('startScreen').classList.remove('hidden');
}

// ----- INPUT -----
function onTouchStart(e) {
    e.preventDefault();
    if (!state.running) return;
    const touch = e.touches[0];
    state.touchStart = { x: touch.clientX, y: touch.clientY, time: Date.now() };
}

function onTouchMove(e) {
    e.preventDefault();
}

function onTouchEnd(e) {
    if (!state.running || !state.touchStart) return;
    e.preventDefault();
    
    const touch = e.changedTouches[0];
    const dx = touch.clientX - state.touchStart.x;
    const dy = touch.clientY - state.touchStart.y;
    const dt = Date.now() - state.touchStart.time;
    const absX = Math.abs(dx), absY = Math.abs(dy);
    
    if (absX < 30 && absY < 30 && dt < 300) {
        jump();
    }
    else if (dy < -50 && absY > absX) {
        jump();
    }
    else if (dy > 50 && absY > absX) {
        slide();
    }
    else if (dx < -50 && absX > absY) {
        shiftPhase(-1);
    }
    else if (dx > 50 && absX > absY) {
        shiftPhase(1);
    }
    
    state.touchStart = null;
}

function handleKeyboardInput() {
    if (!state.running) return;
    
    if ((state.keys['Space'] || state.keys['ArrowUp'] || state.keys['KeyW']) && !state.isJumping && !state.isSliding) {
        jump();
    }
    if ((state.keys['ShiftLeft'] || state.keys['ShiftRight'] || state.keys['ArrowDown'] || state.keys['KeyS']) && !state.isSliding && !state.isJumping) {
        slide();
    }
    const now = Date.now();
    if (now - state.lastPhaseShift > CONFIG.phaseShiftCooldown) {
        if (state.keys['ArrowLeft'] || state.keys['KeyA']) {
            shiftPhase(-1);
            state.lastPhaseShift = now;
        } else if (state.keys['ArrowRight'] || state.keys['KeyD']) {
            shiftPhase(1);
            state.lastPhaseShift = now;
        }
    }
}

function jump() {
    if (state.isJumping || state.isSliding) return;
    state.playerVY = CONFIG.jumpForce;
    state.isJumping = true;
    createJumpParticles();
}

function slide() {
    if (state.isSliding || state.isJumping) return;
    state.isSliding = true;
    state.slideTimer = CONFIG.slideDuration;
    createSlideParticles();
}

function shiftPhase(dir) {
    state.phaseIndex = (state.phaseIndex + dir + CONFIG.phases.length) % CONFIG.phases.length;
    updatePhaseDisplay();
    createPhaseShiftParticles();
}

function updatePhaseDisplay() {
    const phase = CONFIG.phases[state.phaseIndex];
    document.getElementById('phaseDisplay').textContent = phase.name;
    document.getElementById('phaseDisplay').style.color = phase.color;
    document.getElementById('phaseDisplay').style.textShadow = `0 0 10px ${phase.glow}`;
}

// ----- PARTICLES -----
function spawnAmbientParticle() {
    const phase = CONFIG.phases[state.phaseIndex];
    state.particles.push({
        x: Math.random() * CONFIG.baseWidth,
        y: Math.random() * CONFIG.baseHeight,
        vx: (Math.random() - 0.5) * 0.5,
        vy: (Math.random() - 0.5) * 0.5 - 0.2,
        size: Math.random() * 3 + 1,
        color: phase.color,
        glow: phase.glow,
        life: Math.random() * 100 + 50,
        maxLife: 100,
        type: 'ambient'
    });
}

function createJumpParticles() {
    const phase = CONFIG.phases[state.phaseIndex];
    for (let i = 0; i < 12; i++) {
        state.particles.push({
            x: state.playerX + CONFIG.playerWidth / 2,
            y: state.playerY + CONFIG.playerHeight,
            vx: (Math.random() - 0.5) * 6,
            vy: Math.random() * 3 + 1,
            size: Math.random() * 4 + 2,
            color: phase.color,
            glow: phase.glow,
            life: 30,
            maxLife: 30,
            type: 'burst',
            gravity: 0.15
        });
    }
}

function createSlideParticles() {
    const phase = CONFIG.phases[state.phaseIndex];
    for (let i = 0; i < 8; i++) {
        state.particles.push({
            x: state.playerX + Math.random() * CONFIG.playerWidth,
            y: state.playerY + CONFIG.playerHeight - 5,
            vx: (Math.random() - 0.5) * 4,
            vy: (Math.random() - 0.5) * 2 - 1,
            size: Math.random() * 3 + 1,
            color: phase.color,
            glow: phase.glow,
            life: 20,
            maxLife: 20,
            type: 'slide'
        });
    }
}

function createPhaseShiftParticles() {
    const phase = CONFIG.phases[state.phaseIndex];
    for (let i = 0; i < 20; i++) {
        const angle = (Math.PI * 2 * i) / 20;
        state.particles.push({
            x: state.playerX + CONFIG.playerWidth / 2,
            y: state.playerY + CONFIG.playerHeight / 2,
            vx: Math.cos(angle) * 5,
            vy: Math.sin(angle) * 5,
            size: Math.random() * 5 + 2,
            color: phase.color,
            glow: phase.glow,
            life: 40,
            maxLife: 40,
            type: 'phaseshift'
        });
    }
}

function createCrashParticles(x, y, color) {
    for (let i = 0; i < 30; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 8 + 4;
        state.particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: Math.random() * 6 + 3,
            color,
            glow: color,
            life: 60,
            maxLife: 60,
            type: 'crash',
            gravity: 0.2
        });
    }
}

function createScoreParticles(x, y) {
    for (let i = 0; i < 8; i++) {
        state.particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 3,
            vy: -Math.random() * 3 - 1,
            size: Math.random() * 3 + 1,
            color: '#ffff00',
            glow: '#ffff00',
            life: 40,
            maxLife: 40,
            type: 'score'
        });
    }
}

// ----- OBSTACLES -----
function spawnObstacle() {
    const types = ['barrier', 'spike', 'block', 'gate'];
    const type = types[Math.floor(Math.random() * types.length)];
    const phaseIdx = Math.floor(Math.random() * CONFIG.phases.length);
    const phase = CONFIG.phases[phaseIdx];
    
    let obstacle = {
        x: CONFIG.baseWidth + 50,
        type,
        phaseIndex: phaseIdx,
        color: phase.color,
        glow: phase.glow,
        passed: false
    };
    
    if (type === 'barrier') {
        obstacle.width = 20;
        obstacle.height = 80;
        obstacle.y = CONFIG.groundY - obstacle.height;
    } else if (type === 'spike') {
        obstacle.width = 30;
        obstacle.height = 40;
        obstacle.y = CONFIG.groundY - obstacle.height;
    } else if (type === 'block') {
        obstacle.width = 50;
        obstacle.height = 50;
        obstacle.y = CONFIG.groundY - obstacle.height;
    } else if (type === 'gate') {
        obstacle.width = 60;
        obstacle.height = 120;
        obstacle.y = CONFIG.groundY - obstacle.height;
        obstacle.gap = 80;
        obstacle.gapY = CONFIG.groundY - obstacle.height - obstacle.gap;
    }
    
    state.obstacles.push(obstacle);
}

// ----- SCREEN SHAKE -----
function triggerScreenShake(intensity) {
    state.screenShake = Math.min(intensity, CONFIG.screenShakeMax);
}

function updateScreenShake() {
    if (state.screenShake > 0) {
        state.screenShakeX = (Math.random() - 0.5) * state.screenShake * 2;
        state.screenShakeY = (Math.random() - 0.5) * state.screenShake * 2;
        state.screenShake *= 0.9;
        if (state.screenShake < 0.5) state.screenShake = 0;
    } else {
        state.screenShakeX = 0;
        state.screenShakeY = 0;
    }
}

// ----- UPDATE -----
function update(dt) {
    if (!state.running) return;
    
    state.time += dt;
    
    // Speed increase
    state.speed = Math.min(CONFIG.maxSpeed, state.speed + CONFIG.speedIncrease * dt);
    document.getElementById('speedDisplay').textContent = state.speed.toFixed(1) + 'x';
    
    // Score
    state.score += dt * 0.05 * state.speed;
    document.getElementById('score').textContent = Math.floor(state.score);
    
    // Spawn obstacles
    const spawnInterval = Math.max(CONFIG.minSpawnInterval, CONFIG.spawnInterval - state.score * 0.5);
    if (state.time - state.lastSpawn > spawnInterval) {
        spawnObstacle();
        state.lastSpawn = state.time;
    }
    
    // Player physics
    if (state.isJumping) {
        state.playerVY += CONFIG.gravity * (dt / 16.67);
        state.playerY += state.playerVY * (dt / 16.67);
        
        if (state.playerY >= CONFIG.groundY - CONFIG.playerHeight) {
            state.playerY = CONFIG.groundY - CONFIG.playerHeight;
            state.playerVY = 0;
            state.isJumping = false;
        }
    }
    
    // Slide timer
    if (state.isSliding) {
        state.slideTimer -= dt;
        if (state.slideTimer <= 0) {
            state.isSliding = false;
        }
    }
    
    // Trail
    const currentHeight = state.isSliding ? CONFIG.slideHeight : CONFIG.playerHeight;
    state.trail.unshift({ x: state.playerX, y: state.playerY, height: currentHeight, phase: state.phaseIndex });
    if (state.trail.length > CONFIG.trailLength) state.trail.pop();
    
    // Update obstacles
    for (let i = state.obstacles.length - 1; i >= 0; i--) {
        const obs = state.obstacles[i];
        obs.x -= state.speed * (dt / 16.67);
        
        // Check collision
        const playerH = state.isSliding ? CONFIG.slideHeight : CONFIG.playerHeight;
        const playerY = state.isSliding ? state.playerY + (CONFIG.playerHeight - CONFIG.slideHeight) : state.playerY;
        
        let collision = false;
        if (obs.type === 'gate') {
            // Gate has a gap
            if (state.playerX + CONFIG.playerWidth > obs.x && state.playerX < obs.x + obs.width) {
                // Check if player is in the gap
                const inGap = playerY < obs.gapY + obs.gap && playerY + playerH > obs.gapY;
                if (!inGap && state.phaseIndex !== obs.phaseIndex) {
                    collision = true;
                }
            }
        } else {
            // Normal obstacle
            if (state.playerX + CONFIG.playerWidth > obs.x && state.playerX < obs.x + obs.width &&
                playerY + playerH > obs.y && playerY < obs.y + obs.height) {
                if (state.phaseIndex !== obs.phaseIndex) {
                    collision = true;
                }
            }
        }
        
        if (collision) {
            createCrashParticles(state.playerX + CONFIG.playerWidth/2, state.playerY + playerH/2, obs.color);
            triggerScreenShake(10);
            endGame();
            return;
        }
        
        // Score for passing obstacle
        if (!obs.passed && obs.x + obs.width < state.playerX) {
            obs.passed = true;
            state.score += 100;
            createScoreParticles(obs.x, obs.y);
        }
        
        // Remove off-screen obstacles
        if (obs.x + obs.width < -50) {
            state.obstacles.splice(i, 1);
        }
    }
    
    // Update particles
    for (let i = state.particles.length - 1; i >= 0; i--) {
        const p = state.particles[i];
        p.x += p.vx * (dt / 16.67);
        p.y += p.vy * (dt / 16.67);
        if (p.gravity) p.vy += p.gravity * (dt / 16.67);
        p.life -= dt;
        if (p.life <= 0) {
            state.particles.splice(i, 1);
            if (p.type === 'ambient') spawnAmbientParticle();
        }
    }
    
    // Update background stars
    for (const star of state.backgroundStars) {
        star.x -= star.speed * state.speed * (dt / 16.67);
        if (star.x < 0) {
            star.x = CONFIG.baseWidth;
            star.y = Math.random() * CONFIG.baseHeight;
        }
    }
    
    updateScreenShake();
    handleKeyboardInput();
}
