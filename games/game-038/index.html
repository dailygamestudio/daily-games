<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NEON SNAKE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a12; 
            color: #00ffcc; 
            font-family: 'Courier New', monospace; 
            overflow: hidden; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
        }
        #gameCanvas { 
            border: 2px solid #00ffcc; 
            box-shadow: 0 0 20px #00ffcc, inset 0 0 20px rgba(0,255,204,0.1); 
            background: #050510; 
            display: block; 
        }
        #ui { 
            position: fixed; 
            top: 10px; 
            left: 50%; 
            transform: translateX(-50%); 
            display: flex; 
            gap: 30px; 
            font-size: 1.2rem; 
            text-shadow: 0 0 10px #00ffcc; 
            z-index: 10; 
        }
        .stat { display: flex; flex-direction: column; align-items: center; }
        .stat-label { font-size: 0.7rem; opacity: 0.7; letter-spacing: 2px; }
        .stat-value { font-size: 1.5rem; font-weight: bold; }
        .overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(5,5,16,0.95); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            z-index: 100; 
            gap: 20px;
        }
        .overlay.hidden { display: none !important; }
        .overlay h1 { 
            font-size: 3rem; 
            text-shadow: 0 0 20px #00ffcc, 0 0 40px #00ffcc; 
            letter-spacing: 4px; 
            margin-bottom: 10px;
        }
        .overlay p { 
            font-size: 1.2rem; 
            opacity: 0.8; 
            letter-spacing: 1px; 
        }
        .btn { 
            background: transparent; 
            border: 2px solid #00ffcc; 
            color: #00ffcc; 
            padding: 15px 40px; 
            font-family: inherit; 
            font-size: 1.2rem; 
            letter-spacing: 2px; 
            cursor: pointer; 
            transition: all 0.3s; 
            text-transform: uppercase; 
            box-shadow: 0 0 10px rgba(0,255,204,0.3); 
        }
        .btn:hover { 
            background: #00ffcc; 
            color: #050510; 
            box-shadow: 0 0 20px #00ffcc, 0 0 40px #00ffcc; 
        }
        .btn:active { transform: scale(0.95); }
        .controls-hint { 
            font-size: 0.9rem; 
            opacity: 0.6; 
            margin-top: 20px; 
            text-align: center;
            line-height: 1.8;
        }
        @media (max-width: 600px) {
            .overlay h1 { font-size: 2rem; }
            .btn { padding: 12px 30px; font-size: 1rem; }
            #ui { font-size: 1rem; gap: 15px; }
            .stat-value { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div id="ui">
        <div class="stat">
            <span class="stat-label">SCORE</span>
            <span class="stat-value" id="score">0</span>
        </div>
        <div class="stat">
            <span class="stat-label">HIGH SCORE</span>
            <span class="stat-value" id="highScore">0</span>
        </div>
        <div class="stat">
            <span class="stat-label">LEVEL</span>
            <span class="stat-value" id="level">1</span>
        </div>
    </div>

    <div id="startOverlay" class="overlay">
        <h1>NEON SNAKE</h1>
        <p>Classic arcade action with cyberpunk style</p>
        <button class="btn" id="startBtn">START GAME</button>
        <div class="controls-hint">
            <p><strong>DESKTOP:</strong> Arrow Keys / WASD to move | ESC / P to pause</p>
            <p><strong>MOBILE:</strong> Swipe to control direction</p>
        </div>
    </div>

    <div id="pauseOverlay" class="overlay hidden">
        <h1>PAUSED</h1>
        <button class="btn" id="resumeBtn">RESUME</button>
        <button class="btn" id="quitBtn">QUIT TO MENU</button>
    </div>

    <div id="gameOverOverlay" class="overlay hidden">
        <h1>GAME OVER</h1>
        <p>Final Score: <span id="finalScore">0</span></p>
        <button class="btn" id="retryBtn">RETRY</button>
        <button class="btn" id="menuBtn">MAIN MENU</button>
    </div>

    <script>
        // Game constants
        const GRID_SIZE = 20;
        const INITIAL_SPEED = 150;
        const SPEED_INCREMENT = 5;
        const MIN_SPEED = 50;
        const MIN_GRID_DIM = 3; // minimum grid cells in each dimension
        const FOOD_TYPES = [
            { color: '#00ffcc', points: 10, glow: '#00ffcc' },
            { color: '#ff0066', points: 20, glow: '#ff0066' },
            { color: '#ffcc00', points: 30, glow: '#ffcc00' }
        ];

        // Game state
        let canvas, ctx;
        let gridWidth = 0, gridHeight = 0;
        let snake = [];
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let food = null;
        let score = 0;
        let highScore = 0;
        let level = 1;
        let gameSpeed = INITIAL_SPEED;
        let gameLoop = null;
        let isPaused = false;
        let isGameOver = false;
        let touchStartX = 0;
        let touchStartY = 0;

        // DOM elements
        let startOverlay, pauseOverlay, gameOverOverlay;
        let scoreEl, highScoreEl, levelEl, finalScoreEl;
        let startBtn, resumeBtn, quitBtn, retryBtn, menuBtn;

        // Polyfill for roundRect if not supported
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (w < 2 * r) r = w / 2;
                if (h < 2 * r) r = h / 2;
                this.beginPath();
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                this.closePath();
                return this;
            };
        }

        // Initialize when DOM is ready
        function init() {
            canvas = document.getElementById('gameCanvas');
            if (!canvas) {
                console.error('Canvas element not found!');
                return;
            }
            ctx = canvas.getContext('2d');
            if (!ctx) {
                console.error('Could not get canvas context!');
                return;
            }
            
            // Cache DOM elements
            startOverlay = document.getElementById('startOverlay');
            pauseOverlay = document.getElementById('pauseOverlay');
            gameOverOverlay = document.getElementById('gameOverOverlay');
            scoreEl = document.getElementById('score');
            highScoreEl = document.getElementById('highScore');
            levelEl = document.getElementById('level');
            finalScoreEl = document.getElementById('finalScore');
            startBtn = document.getElementById('startBtn');
            resumeBtn = document.getElementById('resumeBtn');
            quitBtn = document.getElementById('quitBtn');
            retryBtn = document.getElementById('retryBtn');
            menuBtn = document.getElementById('menuBtn');

            // Verify all elements exist
            if (!startOverlay || !pauseOverlay || !gameOverOverlay || !scoreEl || !highScoreEl || !levelEl || !finalScoreEl || !startBtn || !resumeBtn || !quitBtn || !retryBtn || !menuBtn) {
                console.error('One or more DOM elements not found!');
                return;
            }

            // Load high score from localStorage
            highScore = parseInt(localStorage.getItem('neonSnakeHighScore')) || 0;
            highScoreEl.textContent = highScore;

            // Set up event listeners
            startBtn.addEventListener('click', startGame);
            resumeBtn.addEventListener('click', resumeGame);
            quitBtn.addEventListener('click', quitToMenu);
            retryBtn.addEventListener('click', startGame);
            menuBtn.addEventListener('click', showStartScreen);

            // Keyboard controls
            document.addEventListener('keydown', handleKeydown);

            // Touch controls
            canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
            canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
            canvas.addEventListener('touchend', handleTouchEnd, { passive: false });

            // Prevent scrolling on touch
            document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

            // Resize canvas
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            // Show start screen initially
            showStartScreen();
        }

        function resizeCanvas() {
            const maxWidth = window.innerWidth * 0.95;
            const maxHeight = window.innerHeight * 0
