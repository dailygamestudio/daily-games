<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NEON SNAKE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a12; 
            color: #00ffcc; 
            font-family: 'Courier New', monospace; 
            overflow: hidden; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
        }
        #gameCanvas { 
            border: 2px solid #00ffcc; 
            box-shadow: 0 0 20px #00ffcc, inset 0 0 20px #00ffcc33;
            background: #05050a;
            display: block;
        }
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 18, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            gap: 20px;
        }
        .overlay.hidden { display: none; }
        h1 { 
            font-size: 3rem; 
            text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc;
            letter-spacing: 0.2em;
            margin-bottom: 10px;
        }
        .score-display { 
            font-size: 1.5rem; 
            color: #ffcc00;
            text-shadow: 0 0 10px #ffcc00;
        }
        button {
            background: transparent;
            border: 2px solid #00ffcc;
            color: #00ffcc;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        button:hover, button:focus {
            background: #00ffcc;
            color: #0a0a12;
            box-shadow: 0 0 20px #00ffcc;
            outline: none;
        }
        .btn-group { display: flex; gap: 20px; }
        .controls-hint {
            font-size: 0.9rem;
            color: #668888;
            margin-top: 20px;
            text-align: center;
            line-height: 1.8;
        }
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            button { padding: 12px 30px; font-size: 1rem; }
            .btn-group { flex-direction: column; width: 80%; }
            .btn-group button { width: 100%; }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="startOverlay" class="overlay">
        <h1>NEON SNAKE</h1>
        <div class="score-display">HIGH SCORE: <span id="highScoreStart">0</span></div>
        <button id="startBtn">START GAME</button>
        <div class="controls-hint">
            <div>ARROWS / WASD - MOVE</div>
            <div>ESC / P - PAUSE</div>
            <div>SWIPE - MOVE (MOBILE)</div>
        </div>
    </div>

    <div id="pauseOverlay" class="overlay hidden">
        <h1>PAUSED</h1>
        <div class="btn-group">
            <button id="resumeBtn">RESUME</button>
            <button id="quitBtn">QUIT TO MENU</button>
        </div>
    </div>

    <div id="gameOverOverlay" class="overlay hidden">
        <h1>GAME OVER</h1>
        <div class="score-display">SCORE: <span id="finalScore">0</span></div>
        <div class="score-display">HIGH SCORE: <span id="highScoreEnd">0</span></div>
        <div class="btn-group">
            <button id="retryBtn">RETRY</button>
            <button id="menuBtn">MAIN MENU</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const GRID_SIZE = 20;
        let gridWidth, gridHeight;
        
        let snake = [];
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let food = { x: 0, y: 0 };
        let score = 0;
        let highScore = parseInt(localStorage.getItem('neonSnakeHighScore')) || 0;
        let gameSpeed = 120;
        let gameLoopId = null;
        let gameState = 'start'; // start, playing, paused, gameover
        let lastTime = 0;
        let touchStartX = 0;
        let touchStartY = 0;

        const startOverlay = document.getElementById('startOverlay');
        const pauseOverlay = document.getElementById('pauseOverlay');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const highScoreStart = document.getElementById('highScoreStart');
        const highScoreEnd = document.getElementById('highScoreEnd');
        const finalScoreEl = document.getElementById('finalScore');

        function resizeCanvas() {
            const maxWidth = window.innerWidth * 0.95;
            const maxHeight = window.innerHeight * 0.9;
            const size = Math.min(maxWidth, maxHeight);
            const gridSize = Math.floor(size / GRID_SIZE) * GRID_SIZE;
            canvas.width = gridSize;
            canvas.height = gridSize;
            gridWidth = canvas.width / GRID_SIZE;
            gridHeight = canvas.height / GRID_SIZE;
        }

        function initGame() {
            resizeCanvas();
            snake = [
                { x: Math.floor(gridWidth / 2), y: Math.floor(gridHeight / 2) },
                { x: Math.floor(gridWidth / 2) - 1, y: Math.floor(gridHeight / 2) },
                { x: Math.floor(gridWidth / 2) - 2, y: Math.floor(gridHeight / 2) }
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            spawnFood();
            highScoreStart.textContent = highScore;
            highScoreEnd.textContent = highScore;
        }

        function spawnFood() {
            let newFood;
            do {
                newFood = {
                    x: Math.floor(Math.random() * gridWidth),
                    y: Math.floor(Math.random() * gridHeight)
                };
            } while (snake.some(seg => seg.x === newFood.x && seg.y === newFood.y));
            food = newFood;
        }

        function drawNeonRect(x, y, color, glowColor, size = GRID_SIZE - 2) {
            const px = x * GRID_SIZE + 1;
            const py = y * GRID_SIZE + 1;
            ctx.shadowColor = glowColor;
            ctx.shadowBlur = 10;
            ctx.fillStyle = color;
            ctx.fillRect(px, py, size, size);
            ctx.shadowBlur = 0;
        }

        function draw() {
            ctx.fillStyle = '#05050a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Grid lines
            ctx.strokeStyle = '#00ffcc11';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= gridWidth; i++) {
                ctx.beginPath();
                ctx.moveTo(i * GRID_SIZE, 0);
                ctx.lineTo(i * GRID_SIZE, canvas.height);
                ctx.stroke();
            }
            for (let j = 0; j <= gridHeight; j++) {
                ctx.beginPath();
                ctx.moveTo(0, j * GRID_SIZE);
                ctx.lineTo(canvas.width, j * GRID_SIZE);
                ctx.stroke();
            }

            // Food
            drawNeonRect(food.x, food.y, '#ff0066', '#ff0066', GRID_SIZE - 4);
            ctx.shadowColor = '#ff0066';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(food.x * GRID_SIZE + GRID_SIZE/2, food.y * GRID_SIZE + GRID_SIZE/2, GRID_SIZE/3, 0, Math.PI * 2);
            ctx.fillStyle = '#ff3388';
            ctx.fill();
            ctx.shadowBlur = 0;

            // Snake
            snake.forEach((seg, i) => {
                const isHead = i === 0;
                const color = isHead ? '#00ffcc' : `#00cc${Math.floor(200 - i * 5).toString(16).padStart(2, '0')}`;
                const glow = isHead ? '#00ffcc' : '#0088aa';
                const size = isHead ? GRID_SIZE - 2 : GRID_SIZE - 4;
                drawNeonRect(seg.x, seg.y, color, glow, size);
            });
        }

        function update() {
            direction = { ...nextDirection };
            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

            // Wall collision
            if (head.x < 0 || head.x >= gridWidth || head.y < 0 || head.y >= gridHeight) {
                gameOver();
                return;
            }

            // Self collision
            if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
                gameOver();
                return;
            }

            snake.unshift(head);

            // Food collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                spawnFood();
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('neonSnakeHighScore', highScore);
                    highScoreEnd.textContent = highScore;
                }
            } else {
                snake.pop();
            }
        }

        function gameLoop(timestamp) {
            if (gameState !== 'playing') return;
            
            if (timestamp - lastTime >= gameSpeed) {
                update();
                draw();
                lastTime = timestamp;
            }
            gameLoopId = requestAnimationFrame(gameLoop);
        }

        function startGame() {
            initGame();
            gameState = 'playing';
            startOverlay.classList.add('hidden');
            pauseOverlay.classList.add('hidden');
            gameOverOverlay.classList.add('hidden');
            lastTime = performance.now();
            if (gameLoopId) cancelAnimationFrame(gameLoopId);
            gameLoopId = requestAnimationFrame(gameLoop);
        }

        function pauseGame() {
            if (gameState !== 'playing') return;
            gameState = 'paused';
            pauseOverlay.classList.remove('hidden');
            cancelAnimationFrame(gameLoopId);
        }

        function resumeGame() {
            if (gameState !== 'paused') return;
            gameState = 'playing';
            pauseOverlay.classList.add('hidden');
            lastTime = performance.now();
            gameLoopId = requestAnimationFrame(gameLoop);
        }

        function quitToMenu() {
            gameState = 'start';
            pauseOverlay.classList.add('hidden');
            gameOverOverlay.classList.add('hidden');
            startOverlay.classList.remove('hidden');
            cancelAnimationFrame(gameLoopId);
        }

        function gameOver() {
            gameState = 'gameover';
            finalScoreEl.textContent = score;
            highScoreEnd.textContent = highScore;
            gameOverOverlay.classList.remove('hidden');
            cancelAnimationFrame(gameLoopId);
        }

        function showStartScreen() {
            quitToMenu();
        }

        function handleKeydown(e) {
            const key = e.key.toLowerCase();
            
            if (gameState === 'playing') {
                if (key === 'escape' || key === 'p') {
                    pauseGame();
                    return;
                }
                if ((key === 'arrowup' || key === 'w') && direction.y !== 1) nextDirection = { x: 0, y: -1 };
                else if ((key === 'arrowdown' || key === 's') && direction.y !== -1) nextDirection = { x: 0, y: 1 };
                else if ((key === 'arrowleft' || key === 'a') && direction.x !== 1) nextDirection = { x: -1, y: 0 };
                else if ((key === 'arrowright' || key === 'd') && direction.x !== -1) nextDirection = { x: 1, y: 0 };
            } else if (gameState === 'paused') {
                if (key === 'escape' || key === 'p') resumeGame();
            }
        }

        function handleTouchStart(e) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }

        function handleTouchEnd(e) {
            if (gameState !== 'playing') return;
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 30 && direction.x !== -1) nextDirection = { x: 1, y: 0 };
                else if (dx < -30 && direction.x !== 1) nextDirection = { x: -1, y: 0 };
            } else {
                if (dy > 30 && direction.y !== -1) nextDirection = { x: 0, y: 1 };
                else if (dy < -30 && direction.y !== 1) nextDirection = { x: 0, y: -1 };
            }
        }

        // Event listeners
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('resumeBtn').addEventListener('click', resumeGame);
        document.getElementById('quitBtn').addEventListener('click', quitToMenu);
        document.getElementById('retryBtn').addEventListener('click', startGame);
        document.getElementById('menuBtn').addEventListener('click', showStartScreen);

        document.addEventListener('keydown', handleKeydown);
        canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
        canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
        window.addEventListener('resize', () => {
            if (gameState === 'playing' || gameState === 'paused') {
                const wasPlaying = gameState === 'playing';
                if (wasPlaying) pauseGame();
                resizeCanvas();
                draw();
                if (wasPlaying) resumeGame();
            } else {
                resizeCanvas();
                draw();
            }
        });

        // Initial setup
        initGame();
        draw();
    </script>
</body>
</html>
