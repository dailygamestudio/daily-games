<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NEON SNAKE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a12; 
            color: #00ffcc; 
            font-family: 'Courier New', monospace; 
            overflow: hidden; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
        }
        #gameCanvas { 
            border: 2px solid #00ffcc; 
            box-shadow: 0 0 20px #00ffcc, inset 0 0 20px rgba(0,255,204,0.1); 
            background: #050510; 
            display: block; 
        }
        #ui { 
            position: fixed; 
            top: 10px; 
            left: 50%; 
            transform: translateX(-50%); 
            display: flex; 
            gap: 30px; 
            font-size: 1.2rem; 
            text-shadow: 0 0 10px #00ffcc; 
            z-index: 10; 
        }
        .stat { display: flex; flex-direction: column; align-items: center; }
        .stat-label { font-size: 0.7rem; opacity: 0.7; letter-spacing: 2px; }
        .stat-value { font-size: 1.5rem; font-weight: bold; }
        .overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(5,5,16,0.95); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            z-index: 100; 
            gap: 20px;
        }
        .overlay.hidden { display: none !important; }
        .overlay h1 { 
            font-size: 3rem; 
            text-shadow: 0 0 20px #00ffcc, 0 0 40px #00ffcc; 
            letter-spacing: 4px; 
            margin-bottom: 10px;
        }
        .overlay p { 
            font-size: 1.2rem; 
            opacity: 0.8; 
            letter-spacing: 1px; 
        }
        .btn { 
            background: transparent; 
            border: 2px solid #00ffcc; 
            color: #00ffcc; 
            padding: 15px 40px; 
            font-family: inherit; 
            font-size: 1.2rem; 
            letter-spacing: 2px; 
            cursor: pointer; 
            transition: all 0.3s; 
            text-transform: uppercase; 
            box-shadow: 0 0 10px rgba(0,255,204,0.3); 
        }
        .btn:hover { 
            background: #00ffcc; 
            color: #050510; 
            box-shadow: 0 0 20px #00ffcc, 0 0 40px #00ffcc; 
        }
        .btn:active { transform: scale(0.95); }
        .controls-hint { 
            font-size: 0.9rem; 
            opacity: 0.6; 
            margin-top: 20px; 
            text-align: center;
            line-height: 1.8;
        }
        @media (max-width: 600px) {
            .overlay h1 { font-size: 2rem; }
            .btn { padding: 12px 30px; font-size: 1rem; }
            #ui { font-size: 1rem; gap: 15px; }
            .stat-value { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div id="ui">
        <div class="stat">
            <span class="stat-label">SCORE</span>
            <span class="stat-value" id="score">0</span>
        </div>
        <div class="stat">
            <span class="stat-label">HIGH SCORE</span>
            <span class="stat-value" id="highScore">0</span>
        </div>
        <div class="stat">
            <span class="stat-label">LEVEL</span>
            <span class="stat-value" id="level">1</span>
        </div>
    </div>

    <div id="startOverlay" class="overlay">
        <h1>NEON SNAKE</h1>
        <p>Classic arcade action with cyberpunk style</p>
        <button class="btn" id="startBtn">START GAME</button>
        <div class="controls-hint">
            <p><strong>DESKTOP:</strong> Arrow Keys / WASD to move | ESC / P to pause</p>
            <p><strong>MOBILE:</strong> Swipe to control direction</p>
        </div>
    </div>

    <div id="pauseOverlay" class="overlay hidden">
        <h1>PAUSED</h1>
        <button class="btn" id="resumeBtn">RESUME</button>
        <button class="btn" id="quitBtn">QUIT TO MENU</button>
    </div>

    <div id="gameOverOverlay" class="overlay hidden">
        <h1>GAME OVER</h1>
        <p>Final Score: <span id="finalScore">0</span></p>
        <button class="btn" id="retryBtn">RETRY</button>
        <button class="btn" id="menuBtn">MAIN MENU</button>
    </div>

    <script>
        // Game constants
        const GRID_SIZE = 20;
        const INITIAL_SPEED = 150;
        const SPEED_INCREMENT = 5;
        const MIN_SPEED = 50;
        const FOOD_TYPES = [
            { color: '#00ffcc', points: 10, glow: '#00ffcc' },
            { color: '#ff0066', points: 20, glow: '#ff0066' },
            { color: '#ffcc00', points: 30, glow: '#ffcc00' }
        ];

        // Game state
        let canvas, ctx;
        let gridWidth, gridHeight;
        let snake = [];
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let food = null;
        let score = 0;
        let highScore = 0;
        let level = 1;
        let gameSpeed = INITIAL_SPEED;
        let gameLoop = null;
        let isPaused = false;
        let isGameOver = false;
        let touchStartX = 0;
        let touchStartY = 0;

        // DOM elements
        let startOverlay, pauseOverlay, gameOverOverlay;
        let scoreEl, highScoreEl, levelEl, finalScoreEl;
        let startBtn, resumeBtn, quitBtn, retryBtn, menuBtn;

        // Initialize
        function init() {
            canvas = document.getElementById('gameCanvas');
            if (!canvas) {
                console.error('Canvas element not found!');
                return;
            }
            ctx = canvas.getContext('2d');
            if (!ctx) {
                console.error('Could not get canvas context!');
                return;
            }
            
            // Cache DOM elements
            startOverlay = document.getElementById('startOverlay');
            pauseOverlay = document.getElementById('pauseOverlay');
            gameOverOverlay = document.getElementById('gameOverOverlay');
            scoreEl = document.getElementById('score');
            highScoreEl = document.getElementById('highScore');
            levelEl = document.getElementById('level');
            finalScoreEl = document.getElementById('finalScore');
            startBtn = document.getElementById('startBtn');
            resumeBtn = document.getElementById('resumeBtn');
            quitBtn = document.getElementById('quitBtn');
            retryBtn = document.getElementById('retryBtn');
            menuBtn = document.getElementById('menuBtn');
            
            if (!startBtn) {
                console.error('Start button not found!');
                return;
            }
            
            // Load high score
            highScore = parseInt(localStorage.getItem('neonSnakeHighScore')) || 0;
            highScoreEl.textContent = highScore;
            
            // Setup event listeners
            setupEventListeners();
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            // Show start screen
            showStartScreen();
        }

        function resizeCanvas() {
            const maxWidth = Math.min(window.innerWidth - 20, 800);
            const maxHeight = Math.min(window.innerHeight - 120, 600);
            const size = Math.min(maxWidth, maxHeight);
            
            // Make canvas dimensions multiples of GRID_SIZE
            canvas.width = Math.floor(size / GRID_SIZE) * GRID_SIZE;
            canvas.height = Math.floor(size / GRID_SIZE) * GRID_SIZE;
            
            gridWidth = canvas.width / GRID_SIZE;
            gridHeight = canvas.height / GRID_SIZE;
        }

        function setupEventListeners() {
            // Keyboard controls
            document.addEventListener('keydown', handleKeydown);
            
            // Touch controls
            canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
            canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
            canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
            
            // Button events
            if (startBtn) startBtn.addEventListener('click', startGame);
            if (resumeBtn) resumeBtn.addEventListener('click', resumeGame);
            if (quitBtn) quitBtn.addEventListener('click', quitToMenu);
            if (retryBtn) retryBtn.addEventListener('click', startGame);
            if (menuBtn) menuBtn.addEventListener('click', quitToMenu);
        }

        function handleKeydown(e) {
            // Pause handling
            if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
                if (!isGameOver && startOverlay && !startOverlay.classList.contains('hidden')) return;
                if (isPaused) resumeGame();
                else pauseGame();
                return;
            }
            
            if (isPaused || isGameOver || (startOverlay && !startOverlay.classList.contains('hidden'))) return;
            
            // Direction controls
            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
                    break;
            }
        }

        function handleTouchStart(e) {
            e.preventDefault();
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }

        function handleTouchMove(e) {
            e.preventDefault();
        }

        function handleTouchEnd(e) {
            if (isPaused || isGameOver || (startOverlay && !startOverlay.classList.contains('hidden'))) return;
            
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            
            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;
            
            // Minimum swipe distance
            if (Math.abs(dx) < 30 && Math.abs(dy) < 30) return;
            
            if (Math.abs(dx) > Math.abs(dy)) {
                // Horizontal swipe
                if (dx > 0 && direction.x !== -1) nextDirection = { x: 1, y: 0 };
                else if (dx < 0 && direction.x !== 1) nextDirection = { x: -1, y: 0 };
            } else {
                // Vertical swipe
                if (dy > 0 && direction.y !== -1) nextDirection = { x: 0, y: 1 };
                else if (dy < 0 && direction.y !== 1) nextDirection = { x: 0, y: -1 };
            }
        }

        function showStartScreen() {
            resetGameState();
            startOverlay.classList.remove('hidden');
            pauseOverlay.classList.add('hidden');
            gameOverOverlay.classList.add('hidden');
        }

        function startGame() {
            // Hide start overlay
            startOverlay.classList.add('hidden');
            pauseOverlay.classList.add('hidden');
            gameOverOverlay.classList.add('hidden');
            
            resetGameState();
            spawnFood();
            isGameOver = false;
            isPaused = false;
            
            // Start game loop
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(gameStep, gameSpeed);
        }

        function resetGameState() {
            snake = [
                { x: Math.floor(gridWidth / 2), y: Math.floor(gridHeight / 2) },
                { x: Math.floor(gridWidth / 2) - 1, y: Math.floor(gridHeight / 2) },
                { x: Math.floor(gridWidth / 2) - 2, y: Math.floor(gridHeight / 2) }
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            level = 1;
            gameSpeed = INITIAL_SPEED;
            scoreEl.textContent = score;
            levelEl.textContent = level;
        }

        function pauseGame() {
            if (isGameOver) return;
            isPaused = true;
            clearInterval(gameLoop);
            pauseOverlay.classList.remove('hidden');
        }

        function resumeGame() {
            if (isGameOver) return;
            isPaused = false;
            pauseOverlay.classList.add('hidden');
            gameLoop = setInterval(gameStep, gameSpeed);
        }

        function quitToMenu() {
            clearInterval(gameLoop);
            gameLoop = null;
            isPaused = false;
            isGameOver = false;
            showStartScreen();
        }

        function gameStep() {
            if (isPaused || isGameOver) return;
            
            // Update direction
            direction = { ...nextDirection };
            
            // Calculate new head position
            const head = { 
                x: snake[0].x + direction.x, 
                y: snake[0].y + direction.y 
            };
            
            // Check wall collision
            if (head.x < 0 || head.x >= gridWidth || head.y < 0 || head.y >= gridHeight) {
                gameOver();
                return;
            }
            
            // Check self collision
            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) {
                    gameOver();
                    return;
                }
            }
            
            // Add new head
            snake.unshift(head);
            
            // Check food collision
            if (head.x === food.x && head.y === food.y) {
                eatFood();
            } else {
                // Remove tail if no food eaten
                snake.pop();
            }
            
            draw();
        }

        function spawnFood() {
            let newFood;
            let validPosition = false;
            
            while (!validPosition) {
                newFood = {
                    x: Math.floor(Math.random() * gridWidth),
                    y: Math.floor(Math.random() * gridHeight),
                    type: FOOD_TYPES[Math.floor(Math.random() * FOOD_TYPES.length)]
                };
                
                // Check if food spawns on snake
                validPosition = true;
                for (let segment of snake) {
                    if (segment.x === newFood.x && segment.y === newFood.y) {
                        validPosition = false;
                        break;
                    }
                }
            }
            
            food = newFood;
        }

        function eatFood() {
            // Add score
            score += food.type.points;
            scoreEl.textContent = score;
            
            // Update high score
            if (score > highScore) {
                highScore = score;
                highScoreEl.textContent = highScore;
                localStorage.setItem('neonSnakeHighScore', highScore.toString());
            }
            
            // Level up every 100 points
            const newLevel = Math.floor(score / 100) + 1;
            if (newLevel > level) {
                level = newLevel;
                levelEl.textContent = level;
                gameSpeed = Math.max(MIN_SPEED, INITIAL_SPEED - (level - 1) * SPEED_INCREMENT);
                clearInterval(gameLoop);
                gameLoop = setInterval(gameStep, gameSpeed);
            }
            
            // Spawn new food
            spawnFood();
        }

        function gameOver() {
            isGameOver = true;
            clearInterval(gameLoop);
            gameLoop = null;
            
            finalScoreEl.textContent = score;
            gameOverOverlay.classList.remove('hidden');
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#050510';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw grid lines (subtle)
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.03)';
            ctx.lineWidth = 1;
            for (let x = 0; x <= canvas.width; x += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y <= canvas.height; y += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            
            // Draw food with glow
            const foodX = food.x * GRID_SIZE;
            const foodY = food.y * GRID_SIZE;
            const centerX = foodX + GR
