<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NEON SNAKE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a12; 
            color: #00ffcc; 
            font-family: 'Courier New', monospace; 
            overflow: hidden; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
        }
        #gameCanvas { 
            border: 2px solid #00ffcc; 
            box-shadow: 0 0 20px #00ffcc, inset 0 0 20px rgba(0,255,204,0.1); 
            background: #050510; 
            display: block; 
        }
        #ui { 
            position: fixed; 
            top: 10px; 
            left: 50%; 
            transform: translateX(-50%); 
            display: flex; 
            gap: 30px; 
            font-size: 1.2rem; 
            text-shadow: 0 0 10px #00ffcc; 
            z-index: 10; 
        }
        .stat { display: flex; flex-direction: column; align-items: center; }
        .stat-label { font-size: 0.7rem; opacity: 0.7; letter-spacing: 2px; }
        .stat-value { font-size: 1.5rem; font-weight: bold; }
        .overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(5,5,16,0.95); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            z-index: 100; 
            backdrop-filter: blur(5px); 
        }
        .overlay.hidden { display: none; }
        .overlay-content { 
            text-align: center; 
            max-width: 90%; 
            padding: 20px; 
        }
        h1 { 
            font-size: clamp(2rem, 8vw, 4rem); 
            margin-bottom: 10px; 
            background: linear-gradient(90deg, #00ffcc, #ff00cc, #00ffcc); 
            background-size: 200% auto; 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            animation: neonShift 3s linear infinite; 
            text-shadow: none; 
        }
        @keyframes neonShift { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }
        .subtitle { 
            font-size: 1rem; 
            opacity: 0.7; 
            margin-bottom: 30px; 
            letter-spacing: 3px; 
        }
        .btn { 
            background: transparent; 
            border: 2px solid #00ffcc; 
            color: #00ffcc; 
            padding: 12px 30px; 
            font-family: inherit; 
            font-size: 1rem; 
            letter-spacing: 2px; 
            cursor: pointer; 
            margin: 10px; 
            transition: all 0.2s; 
            text-transform: uppercase;
        }
        .btn:hover { 
            background: #00ffcc; 
            color: #050510; 
            box-shadow: 0 0 20px #00ffcc; 
        }
        .btn:active { transform: scale(0.95); }
        .controls-hint { 
            margin-top: 20px; 
            font-size: 0.8rem; 
            opacity: 0.6; 
            line-height: 1.8; 
        }
        .final-score { 
            font-size: 2rem; 
            margin: 20px 0; 
            color: #ff00cc; 
            text-shadow: 0 0 10px #ff00cc; 
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="ui">
        <div class="stat">
            <span class="stat-label">SCORE</span>
            <span class="stat-value" id="score">0</span>
        </div>
        <div class="stat">
            <span class="stat-label">HIGH SCORE</span>
            <span class="stat-value" id="highScore">0</span>
        </div>
    </div>

    <div id="startOverlay" class="overlay">
        <div class="overlay-content">
            <h1>NEON SNAKE</h1>
            <p class="subtitle">CLASSIC ARCADE REIMAGINED</p>
            <button class="btn" id="startBtn">START GAME</button>
            <div class="controls-hint">
                <p>ARROW KEYS / WASD / SWIPE TO MOVE</p>
                <p>ESC / P TO PAUSE</p>
            </div>
        </div>
    </div>

    <div id="pauseOverlay" class="overlay hidden">
        <div class="overlay-content">
            <h1>PAUSED</h1>
            <button class="btn" id="resumeBtn">RESUME</button>
            <button class="btn" id="quitBtn">QUIT TO MENU</button>
        </div>
    </div>

    <div id="gameOverOverlay" class="overlay hidden">
        <div class="overlay-content">
            <h1>GAME OVER</h1>
            <div class="final-score" id="finalScore">0</div>
            <button class="btn" id="retryBtn">RETRY</button>
            <button class="btn" id="menuBtn">MAIN MENU</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const startOverlay = document.getElementById('startOverlay');
        const pauseOverlay = document.getElementById('pauseOverlay');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const finalScoreEl = document.getElementById('finalScore');

        const GRID_SIZE = 20;
        let canvasSize, gridWidth, gridHeight;
        let snake, direction, nextDirection, food, score, highScore, gameSpeed, gameLoop, isPaused, isGameOver;

        function resizeCanvas() {
            const maxWidth = window.innerWidth * 0.95;
            const maxHeight = window.innerHeight * 0.85;
            canvasSize = Math.min(maxWidth, maxHeight, 600);
            canvasSize = Math.floor(canvasSize / GRID_SIZE) * GRID_SIZE;
            canvas.width = canvasSize;
            canvas.height = canvasSize;
            gridWidth = canvas.width / GRID_SIZE;
            gridHeight = canvas.height / GRID_SIZE;
        }

        function initGame() {
            resizeCanvas();
            snake = [{ x: Math.floor(gridWidth / 2), y: Math.floor(gridHeight / 2) }];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            gameSpeed = 120;
            isPaused = false;
            isGameOver = false;
            spawnFood();
            updateUI();
        }

        function spawnFood() {
            let newFood;
            do {
                newFood = {
                    x: Math.floor(Math.random() * gridWidth),
                    y: Math.floor(Math.random() * gridHeight)
                };
            } while (snake.some(seg => seg.x === newFood.x && seg.y === newFood.y));
            food = newFood;
        }

        function updateUI() {
            scoreEl.textContent = score;
            highScoreEl.textContent = highScore;
        }

        function gameStep() {
            if (isPaused || isGameOver) return;

            direction = { ...nextDirection };
            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

            if (head.x < 0 || head.x >= gridWidth || head.y < 0 || head.y >= gridHeight ||
                snake.some(seg => seg.x === head.x && seg.y === head.y)) {
                gameOver();
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('neonSnakeHighScore', highScore);
                }
                updateUI();
                spawnFood();
                if (gameSpeed > 50) gameSpeed -= 1;
            } else {
                snake.pop();
            }

            draw();
        }

        function draw() {
            ctx.fillStyle = '#050510';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(0,255,204,0.05)';
            ctx.lineWidth = 1;
            for (let x = 0; x <= canvas.width; x += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y <= canvas.height; y += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            ctx.shadowColor = '#00ffcc';
            ctx.shadowBlur = 10;
            snake.forEach((seg, i) => {
                const hue = 180 - (i * 2);
                ctx.fillStyle = `hsl(${hue}, 100%, 50%)`;
                ctx.fillRect(seg.x * GRID_SIZE + 1, seg.y * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2);
            });
            ctx.shadowBlur = 0;

            ctx.shadowColor = '#ff00cc';
            ctx.shadowBlur = 15;
            ctx.fillStyle = '#ff00cc';
            ctx.beginPath();
            ctx.arc(
                food.x * GRID_SIZE + GRID_SIZE / 2,
                food.y * GRID_SIZE + GRID_SIZE / 2,
                GRID_SIZE / 2 - 2,
                0, Math.PI * 2
            );
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function gameOver() {
            isGameOver = true;
            clearInterval(gameLoop);
            finalScoreEl.textContent = score;
            gameOverOverlay.classList.remove('hidden');
        }

        function startGame() {
            initGame();
            startOverlay.classList.add('hidden');
            pauseOverlay.classList.add('hidden');
            gameOverOverlay.classList.add('hidden');
            gameLoop = setInterval(gameStep, gameSpeed);
        }

        function pauseGame() {
            if (isGameOver) return;
            isPaused = true;
            clearInterval(gameLoop);
            pauseOverlay.classList.remove('hidden');
        }

        function resumeGame() {
            if (isGameOver) return;
            isPaused = false;
            pauseOverlay.classList.add('hidden');
            gameLoop = setInterval(gameStep, gameSpeed);
        }

        function quitToMenu() {
            clearInterval(gameLoop);
            isPaused = false;
            isGameOver = false;
            pauseOverlay.classList.add('hidden');
            gameOverOverlay.classList.add('hidden');
            startOverlay.classList.remove('hidden');
        }

        function showStartScreen() {
            quitToMenu();
        }

        function handleKeyDown(e) {
            const key = e.key.toLowerCase();
            if (key === 'escape' || key === 'p') {
                if (isPaused) resumeGame();
                else pauseGame();
                return;
            }
            if (isPaused || isGameOver) return;

            const dirMap = {
                'arrowup': { x: 0, y: -1 }, 'w': { x: 0, y: -1 },
                'arrowdown': { x: 0, y: 1 }, 's': { x: 0, y: 1 },
                'arrowleft': { x: -1, y: 0 }, 'a': { x: -1, y: 0 },
                'arrowright': { x: 1, y: 0 }, 'd': { x: 1, y: 0 }
            };
            if (dirMap[key]) {
                const newDir = dirMap[key];
                if (newDir.x !== -direction.x || newDir.y !== -direction.y) {
                    nextDirection = newDir;
                }
            }
        }

        let touchStartX = 0, touchStartY = 0;
        function handleTouchStart(e) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }
        function handleTouchEnd(e) {
            if (isPaused || isGameOver) return;
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 30 && direction.x !== -1) nextDirection = { x: 1, y: 0 };
                else if (dx < -30 && direction.x !== 1) nextDirection = { x: -1, y: 0 };
            } else {
                if (dy > 30 && direction.y !== -1) nextDirection = { x: 0, y: 1 };
                else if (dy < -30 && direction.y !== 1) nextDirection = { x: 0, y: -1 };
            }
        }

        window.addEventListener('keydown', handleKeyDown);
        canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
        canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
        canvas.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('resumeBtn').addEventListener('click', resumeGame);
        document.getElementById('quitBtn').addEventListener('click', quitToMenu);
        document.getElementById('retryBtn').addEventListener('click', startGame);
        document.getElementById('menuBtn').addEventListener('click', showStartScreen);

        window.addEventListener('resize', () => {
            if (!isGameOver && !startOverlay.classList.contains('hidden')) return;
            resizeCanvas();
            draw();
        });

        highScore = parseInt(localStorage.getItem('neonSnakeHighScore')) || 0;
        highScoreEl.textContent = highScore;
        draw();
    </script>
</body>
</html>
