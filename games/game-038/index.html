<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Lights Out - Day 38</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a12; color: #e0e0ff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
  canvas { display: block; margin: 0 auto; background: #05050a; box-shadow: 0 0 30px #00ffff, 0 0 60px #ff00ff, inset 0 0 60px rgba(0,255,255,0.1); touch-action: none; }
  #ui { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; z-index: 10; pointer-events: none; }
  .stat { background: rgba(0,20,40,0.8); border: 1px solid #00ffff; padding: 5px 15px; border-radius: 4px; font-size: 14px; text-shadow: 0 0 5px #00ffff; }
  .stat span { color: #ffcc00; font-weight: bold; }
  #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 20px; z-index: 100; pointer-events: none; }
  #overlay.overlay-visible { display: flex; pointer-events: auto; }
  #overlay h1 { font-size: 2.5rem; text-shadow: 0 0 10px #00ffff, 0 0 20px #ff00ff; margin-bottom: 10px; }
  #overlay p { font-size: 1.2rem; color: #aaa; }
  .btn { background: linear-gradient(135deg, #004466, #002244); border: 2px solid #00ffff; color: #e0e0ff; padding: 12px 40px; font-size: 1.1rem; border-radius: 6px; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; transition: all 0.2s; box-shadow: 0 0 10px #00ffff; pointer-events: auto; }
  .btn:hover, .btn:focus { background: linear-gradient(135deg, #006699, #004466); box-shadow: 0 0 20px #00ffff, 0 0 30px #ff00ff; transform: scale(1.05); }
  .btn:active { transform: scale(0.98); }
  #controlsHint { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); color: #666; font-size: 0.85rem; text-align: center; pointer-events: none; text-shadow: 0 0 3px #00ffff; }
  @media (max-width: 600px) {
    #ui { flex-direction: column; align-items: center; top: 5px; gap: 5px; }
    .stat { font-size: 12px; padding: 4px 10px; }
    #overlay h1 { font-size: 1.8rem; }
    .btn { padding: 10px 30px; font-size: 1rem; }
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="ui">
  <div class="stat">LEVEL: <span id="levelDisplay">1</span></div>
  <div class="stat">MOVES: <span id="movesDisplay">0</span></div>
  <div class="stat">SCORE: <span id="scoreDisplay">0</span></div>
  <div class="stat">BEST: <span id="highScoreDisplay">0</span></div>
</div>
<div id="overlay">
  <h1 id="overlayTitle">NEON LIGHTS OUT</h1>
  <p id="overlayMessage">Tap a cell to toggle it and its neighbors. Turn all lights off.</p>
  <button class="btn" id="btnResume" type="button">RESUME</button>
  <button class="btn" id="btnStart" type="button">START GAME</button>
  <button class="btn" id="btnNextLevel" type="button">NEXT LEVEL</button>
  <button class="btn" id="btnRetry" type="button">RETRY</button>
  <button class="btn" id="btnQuit" type="button">QUIT TO MENU</button>
  <button class="btn" id="btnMainMenu" type="button">MAIN MENU</button>
</div>
<div id="controlsHint">Arrows/WASD: Move Cursor | Space/Enter: Toggle | ESC/P: Pause | Touch: Tap Cell</div>
<script>
/* ===== NEON LIGHTS OUT - DAY 38 =====
   Puzzle game: toggle lights to turn all off.
   Increasing grid size, move limits, neon aesthetic.
   Pause/Resume/Quit, touch & keyboard, high score.
*/

// ===== CONSTANTS & CONFIG =====
const MIN_GRID = 3;
const MAX_GRID = 8;
const BASE_MOVE_MULTIPLIER = 2;
const COLORS = {
  bg: '#05050a',
  gridLine: '#003344',
  gridLineGlow: '#00ffff',
  lightOn: ['#00ffff', '#ff00ff', '#ffff00', '#ff4400', '#44ff00', '#ff00aa'],
  lightOff: '#111122',
  cursor: '#ffcc00',
  cursorGlow: '#ffff00',
  text: '#e0e0ff',
  uiBorder: '#00ffff'
};

// ===== GAME STATE =====
let canvas, ctx;
let width, height;
let cellSize, gridOriginX, gridOriginY;

let gameState = 'start';
let running = false;

let gridSize = MIN_GRID;
let grid = [];
let solutionSteps = 0;
let moves = 0;
let level = 1;
let score = 0;
let highScore = 0;
let maxMoves = 0;
let cursor = { x: 0, y: 0 };
let pendingNextLevel = false;

let animationId = null;
let lastTime = 0;

// ===== DOM ELEMENTS =====
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlayTitle');
const overlayMessage = document.getElementById('overlayMessage');
const btnResume = document.getElementById('btnResume');
const btnStart = document.getElementById('btnStart');
const btnNextLevel = document.getElementById('btnNextLevel');
const btnRetry = document.getElementById('btnRetry');
const btnQuit = document.getElementById('btnQuit');
const btnMainMenu = document.getElementById('btnMainMenu');
const levelDisplay = document.getElementById('levelDisplay');
const movesDisplay = document.getElementById('movesDisplay');
const scoreDisplay = document.getElementById('scoreDisplay');
const highScoreDisplay = document.getElementById('highScoreDisplay');

// ===== ROUNDRECT POLYFILL =====
function drawRoundRect(ctx, x, y, w, h, r) {
  if (w < 2 * r) r = w / 2;
  if (h < 2 * r) r = h / 2;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ===== INITIALIZATION =====
function init() {
  canvas = document.getElementById('gameCanvas');
  ctx = canvas.getContext('2d');
  resize();
  window.addEventListener('resize', resize);
  
  // Load high score
  highScore = parseInt(localStorage.getItem('neonLightsOutHighScore')) || 0;
  highScoreDisplay.textContent = highScore;
  
  // Button event listeners
  btnStart.addEventListener('click', () => {
    hideOverlay();
    startGame();
  });
  btnResume.addEventListener('click', () => {
    hideOverlay();
    resumeGame();
  });
  btnNextLevel.addEventListener('click', () => {
    hideOverlay();
    nextLevel();
  });
  btnRetry.addEventListener('click', () => {
    hideOverlay();
    startGame(); // restart current level
  });
  btnQuit.addEventListener('click', () => {
    hideOverlay();
    quitToMenu();
  });
  btnMainMenu.addEventListener('click', () => {
    hideOverlay();
    showStartScreen();
  });
  
  // Keyboard controls
  window.addEventListener('keydown', handleKeydown);
  
  // Touch controls
  canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
  canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
  canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
  
  // Show start screen initially
  showStartScreen();
}

// ===== RESIZE & LAYOUT =====
function resize() {
  const padding = 20;
  const maxWidth = window.innerWidth - padding * 2;
  const maxHeight = window.innerHeight - padding * 2 - 100; // space for UI and hints
  const size = Math.min(maxWidth, maxHeight, 600);
  width = size;
  height = size;
  canvas.width = width;
  canvas.height = height;
  
  cellSize = Math.floor(width / gridSize);
  gridOriginX = (width - cellSize * gridSize) / 2;
  gridOriginY = (height - cellSize * gridSize) / 2;
}

// ===== OVERLAY MANAGEMENT =====
function showOverlay(title, message, buttons) {
  overlayTitle.textContent = title;
  overlayMessage.textContent = message;
  // Hide all buttons first
  const allButtons = [btnResume, btnStart, btnNextLevel, btnRetry, btnQuit, btnMainMenu];
  allButtons.forEach(btn => btn.style.display = 'none');
  // Show only the specified buttons
  buttons.forEach(btnId => {
    const btn = document.getElementById(btnId);
    if (btn) btn.style.display = 'inline-block';
  });
  overlay.classList.add('overlay-visible');
}

function hideOverlay() {
  overlay.classList.remove('overlay-visible');
}

function showStartScreen() {
  gameState = 'start';
  showOverlay('NEON LIGHTS OUT', 'Tap a cell to toggle it and its neighbors. Turn all lights off.', ['btnStart']);
}

function showPauseScreen() {
  gameState = 'paused';
  showOverlay('PAUSED', `Level ${level} - Moves: ${moves}/${maxMoves}`, ['btnResume', 'btnQuit']);
}

function showGameOverScreen(won) {
  gameState = won ? 'levelcomplete' : 'gameover';
  if (won) {
    showOverlay('LEVEL COMPLETE!', `Score: ${score} | Moves: ${moves}`, ['btnNextLevel', 'btnMainMenu']);
  } else {
    showOverlay('GAME OVER', `Out of moves! Final Score: ${score}`, ['btnRetry', 'btnMainMenu']);
  }
}

// ===== GAME LOGIC =====
function startGame() {
  level = 1;
  score = 0;
  gridSize = MIN_GRID;
  newLevel();
  gameState = 'playing';
  running = true;
  lastTime = performance.now();
  animationId = requestAnimationFrame(gameLoop);
}

function newLevel() {
  gridSize = Math.min(MIN_GRID + level - 1, MAX_GRID);
  maxMoves = gridSize * gridSize * BASE_MOVE_MULTIPLIER;
  moves = 0;
  cursor = { x: 0, y: 0 };
  generateGrid();
  updateUI();
  resize(); // recalc cellSize and origins
}

function generateGrid() {
  // Create a solvable grid by starting from all off and applying random toggles
  grid = Array(gridSize).fill(null).map(() => Array(gridSize).fill(0));
  solutionSteps = 0;
  // Apply random moves to create a puzzle
  const numToggles = Math.floor(gridSize * gridSize * 1.5);
  for (let i = 0; i < numToggles; i++) {
    const rx = Math.floor(Math.random() * gridSize);
    const ry = Math.floor(Math.random() * gridSize);
    toggleCell(rx, ry, false); // don't count as player move
  }
  // Ensure it's not already solved
  if (checkWin()) {
    // If solved by chance, toggle one more
    toggleCell(0, 0, false);
  }
}

function toggleCell(x, y, countMove = true) {
  if (x < 0 || x >= gridSize || y < 0 || y >= gridSize) return;
  const dirs = [[0,0], [1,0], [-1,0], [0,1], [0,-1]];
  dirs.forEach(([dx, dy]) => {
    const nx = x + dx, ny = y + dy;
    if (nx >= 0 && nx < gridSize && ny >= 0 && ny < gridSize) {
      grid[ny][nx] = 1 - grid[ny][nx];
    }
  });
  if (countMove) {
    moves++;
    updateUI();
    checkGameState();
  }
}

function checkWin() {
  return grid.every(row => row.every(cell => cell === 0));
}

function checkGameState() {
  if (checkWin()) {
    // Level complete
    const levelScore = Math.max(100, (maxMoves - moves) * 10 + gridSize * 50);
    score += levelScore;
    running = false;
    cancelAnimationFrame(animationId);
    showGameOverScreen(true);
  } else if (moves >= maxMoves) {
    // Game over
    running = false;
    cancelAnimationFrame(animationId);
    showGameOverScreen(false);
  }
}

function nextLevel() {
  level++;
  newLevel();
  gameState = 'playing';
  running = true;
  lastTime = performance.now();
  animationId = requestAnimationFrame(gameLoop);
}

function pauseGame() {
  if (gameState !== 'playing') return;
  running = false;
  cancelAnimationFrame(animationId);
  showPauseScreen();
}

function resumeGame() {
  if (gameState !== 'paused') return;
  gameState = 'playing';
  running = true;
  lastTime = performance.now();
  animationId = requestAnimationFrame(gameLoop);
}

function quitToMenu() {
  running = false;
  cancelAnimationFrame(animationId);
  showStartScreen();
}

// ===== INPUT HANDLING =====
function handleKeydown(e) {
  if (gameState !== 'playing' && gameState !== 'paused') return;
  
  const key = e.key.toLowerCase();
  
  if (key === 'escape' || key === 'p') {
    if (gameState === 'playing') pauseGame();
    else if (gameState === 'paused') resumeGame();
    return;
  }
  
  if (gameState !== 'playing') return;
  
  let moved = false;
  switch (key) {
    case 'arrowup': case 'w': cursor.y = Math.max(0, cursor.y - 1); moved = true; break;
    case 'arrowdown': case 's': cursor.y = Math.min(gridSize - 1, cursor.y + 1); moved = true; break;
    case 'arrowleft': case 'a': cursor.x = Math.max(0, cursor.x - 1); moved = true; break;
    case 'arrowright': case 'd': cursor.x = Math.min(gridSize - 1, cursor.x + 1); moved = true; break;
    case ' ': case 'enter': toggleCell(cursor.x, cursor.y); break;
  }
  if (moved) e.preventDefault();
}

let touchStartX = 0, touchStartY = 0;
function handleTouchStart(e) {
  if (gameState !== 'playing') return;
  e.preventDefault();
  const touch = e.touches[0];
  touchStartX = touch.clientX;
  touchStartY = touch.clientY;
}

function handleTouchMove(e) {
  if (gameState !== 'playing') return;
  e.preventDefault();
}

function handleTouchEnd(e) {
  if (gameState !== 'playing') return;
  e.preventDefault();
  const touch = e.changedTouches[0];
  const dx = touch.clientX - touchStartX;
  const dy = touch.clientY - touchStartY;
  
  // Determine if it's a tap or swipe
  if (Math.abs(dx) < 20 && Math.abs(dy) < 20) {
    // Tap - convert to grid coordinates
    const rect = canvas.getBoundingClientRect();
    const x = touch.clientX - rect.left;
    const y = touch.clientY - rect.top;
    const gx = Math.floor((x - gridOriginX) / cellSize);
    const gy = Math.floor((y - gridOriginY) / cellSize);
    if (gx >= 0 && gx < gridSize && gy >= 0 && gy < gridSize) {
      cursor.x = gx;
      cursor.y = gy;
      toggleCell(gx, gy);
    }
  } else {
    // Swipe - move cursor
    if (Math.abs(dx) > Math.abs(dy)) {
      cursor.x = Math.max(0, Math.min(gridSize - 1, cursor.x + (dx > 0 ? 1 : -1)));
    } else {
      cursor.y = Math.max(0, Math.min(gridSize - 1, cursor.y + (dy > 0 ? 1 : -1)));
    }
  }
}

// ===== RENDERING =====
function gameLoop(timestamp) {
  if (!running) return;
  const dt = timestamp - lastTime;
  lastTime = timestamp;
  
  update(dt);
  render();
  
  animationId = requestAnimationFrame(gameLoop);
}

function update(dt) {
  // No continuous update needed for this turn-based game
}

function render() {
  // Clear
  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(0, 0, width, height);
  
  // Draw grid background glow
  const gridWidth = cellSize * gridSize;
  const gridHeight = cellSize * gridSize;
  const gradient = ctx.createRadialGradient(
    gridOriginX + gridWidth/2, gridOriginY + gridHeight/2, 0,
    gridOriginX + gridWidth/2, gridOriginY + gridHeight/2, Math.max(gridWidth, gridHeight)/2
  );
  gradient.addColorStop(0, 'rgba(0,255,255,0.03)');
  gradient.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gradient;
  ctx.fillRect(gridOriginX, gridOriginY, gridWidth, gridHeight);
  
  // Draw cells
  for (let y = 0; y < gridSize; y++) {
    for (let x = 0; x < gridSize; x++) {
      const cx = gridOriginX + x * cellSize;
      const cy = gridOriginY + y * cellSize;
      const padding = 2;
      const r = 8;
      
      // Cell background
      if (grid[y][x] === 1) {
        const colorIndex = (x + y * gridSize) % COLORS.lightOn.length;
        const glowColor = COLORS.lightOn[colorIndex];
        ctx.shadowColor = glowColor;
        ctx.shadowBlur = 15;
        ctx.fillStyle = glowColor;
      } else {
        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;
        ctx.fillStyle = COLORS.lightOff;
      }
      drawRoundRect(ctx, cx + padding, cy + padding, cellSize - padding * 2, cellSize - padding * 2, r);
      ctx.fill();
      ctx.shadowBlur = 0;
      
      // Cell border
      ctx.strokeStyle = COLORS.gridLine;
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }
  
  // Draw cursor
  const cx = gridOriginX + cursor.x * cellSize;
  const cy = gridOriginY + cursor.y * cellSize;
  const padding = 2;
  ctx.shadowColor = COLORS.cursorGlow;
  ctx.shadowBlur = 10;
  ctx.strokeStyle = COLORS.cursor;
  ctx.lineWidth = 3;
  drawRoundRect(ctx, cx + padding + 1.5, cy + padding + 1.5, cellSize - padding * 2 - 3, cellSize - padding * 2 - 3, 6);
  ctx.stroke();
  ctx.shadowBlur = 0;
  
  // Draw grid lines (subtle)
  ctx.strokeStyle = COLORS.gridLine;
  ctx.lineWidth = 1;
  for (let i = 0; i <= gridSize; i++) {
    ctx.beginPath();
    ctx.moveTo(gridOriginX + i * cellSize, gridOriginY);
    ctx.lineTo(gridOriginX + i * cellSize, gridOriginY + gridHeight);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(gridOriginX, gridOriginY + i * cellSize);
    ctx.lineTo(gridOriginX + gridWidth, gridOriginY + i * cellSize);
    ctx.stroke();
  }
}

function updateUI() {
  levelDisplay.textContent = level;
  movesDisplay.textContent = `${moves}/${maxMoves}`;
  scoreDisplay.textContent = score;
  if (score > highScore) {
    highScore = score;
    highScoreDisplay.textContent = highScore;
    localStorage.setItem('neonLightsOutHighScore', highScore);
  }
}

// ===== START =====
init();
</script>
</body>
</html>
