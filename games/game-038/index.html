<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NEON SNAKE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a12; 
            color: #00ffcc; 
            font-family: 'Courier New', monospace; 
            overflow: hidden; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
        }
        #gameCanvas { 
            border: 2px solid #00ffcc; 
            box-shadow: 0 0 20px #00ffcc, inset 0 0 20px rgba(0,255,204,0.1); 
            background: #050510; 
            display: block; 
        }
        #ui { 
            position: fixed; 
            top: 10px; 
            left: 50%; 
            transform: translateX(-50%); 
            display: flex; 
            gap: 30px; 
            font-size: 1.2rem; 
            text-shadow: 0 0 10px #00ffcc; 
            z-index: 10; 
        }
        .stat { display: flex; flex-direction: column; align-items: center; }
        .stat-label { font-size: 0.7rem; opacity: 0.7; letter-spacing: 2px; }
        .stat-value { font-size: 1.5rem; font-weight: bold; }
        .overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(5,5,16,0.95); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            z-index: 100; 
            gap: 20px;
        }
        .overlay.hidden { display: none !important; }
        .overlay h1 { 
            font-size: 3rem; 
            text-shadow: 0 0 20px #00ffcc, 0 0 40px #00ffcc; 
            letter-spacing: 4px; 
            margin-bottom: 10px;
        }
        .overlay p { 
            font-size: 1.2rem; 
            opacity: 0.8; 
            letter-spacing: 1px; 
        }
        .btn { 
            background: transparent; 
            border: 2px solid #00ffcc; 
            color: #00ffcc; 
            padding: 15px 40px; 
            font-family: inherit; 
            font-size: 1.2rem; 
            letter-spacing: 2px; 
            cursor: pointer; 
            transition: all 0.3s; 
            text-transform: uppercase; 
            box-shadow: 0 0 10px rgba(0,255,204,0.3); 
        }
        .btn:hover { 
            background: #00ffcc; 
            color: #050510; 
            box-shadow: 0 0 20px #00ffcc, 0 0 40px #00ffcc; 
        }
        .btn:active { transform: scale(0.95); }
        .controls-hint { 
            font-size: 0.9rem; 
            opacity: 0.6; 
            margin-top: 20px; 
            text-align: center;
            line-height: 1.8;
        }
        @media (max-width: 600px) {
            .overlay h1 { font-size: 2rem; }
            .btn { padding: 12px 30px; font-size: 1rem; }
            #ui { font-size: 1rem; gap: 15px; }
            .stat-value { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="ui">
        <div class="stat">
            <span class="stat-label">SCORE</span>
            <span class="stat-value" id="score">0</span>
        </div>
        <div class="stat">
            <span class="stat-label">HIGH SCORE</span>
            <span class="stat-value" id="highScore">0</span>
        </div>
        <div class="stat">
            <span class="stat-label">LEVEL</span>
            <span class="stat-value" id="level">1</span>
        </div>
    </div>

    <div id="startOverlay" class="overlay">
        <h1>NEON SNAKE</h1>
        <p>Classic arcade action with cyberpunk style</p>
        <button class="btn" id="startBtn">START GAME</button>
        <div class="controls-hint">
            <p><strong>DESKTOP:</strong> Arrow Keys / WASD to move | ESC / P to pause</p>
            <p><strong>MOBILE:</strong> Swipe to control direction</p>
        </div>
    </div>

    <div id="pauseOverlay" class="overlay hidden">
        <h1>PAUSED</h1>
        <button class="btn" id="resumeBtn">RESUME</button>
        <button class="btn" id="quitBtn">QUIT TO MENU</button>
    </div>

    <div id="gameOverOverlay" class="overlay hidden">
        <h1>GAME OVER</h1>
        <p>Final Score: <span id="finalScore">0</span></p>
        <button class="btn" id="retryBtn">RETRY</button>
        <button class="btn" id="menuBtn">MAIN MENU</button>
    </div>

    <script>
        // Game constants
        const GRID_SIZE = 20;
        const INITIAL_SPEED = 150;
        const SPEED_INCREMENT = 5;
        const MIN_SPEED = 50;
        const FOOD_TYPES = [
            { color: '#00ffcc', points: 10, glow: '#00ffcc' },
            { color: '#ff0066', points: 20, glow: '#ff0066' },
            { color: '#ffcc00', points: 30, glow: '#ffcc00' }
        ];

        // Game state
        let canvas, ctx;
        let gridWidth, gridHeight;
        let snake = [];
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let food = null;
        let score = 0;
        let highScore = 0;
        let level = 1;
        let gameSpeed = INITIAL_SPEED;
        let gameLoop = null;
        let isPaused = false;
        let isGameOver = false;
        let touchStartX = 0;
        let touchStartY = 0;

        // DOM elements
        let startOverlay, pauseOverlay, gameOverOverlay;
        let scoreEl, highScoreEl, levelEl, finalScoreEl;
        let startBtn, resumeBtn, quitBtn, retryBtn, menuBtn;

        // Initialize
        function init() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            
            // Cache DOM elements
            startOverlay = document.getElementById('startOverlay');
            pauseOverlay = document.getElementById('pauseOverlay');
            gameOverOverlay = document.getElementById('gameOverOverlay');
            scoreEl = document.getElementById('score');
            highScoreEl = document.getElementById('highScore');
            levelEl = document.getElementById('level');
            finalScoreEl = document.getElementById('finalScore');
            startBtn = document.getElementById('startBtn');
            resumeBtn = document.getElementById('resumeBtn');
            quitBtn = document.getElementById('quitBtn');
            retryBtn = document.getElementById('retryBtn');
            menuBtn = document.getElementById('menuBtn');
            
            // Load high score
            highScore = parseInt(localStorage.getItem('neonSnakeHighScore')) || 0;
            highScoreEl.textContent = highScore;
            
            // Setup event listeners
            setupEventListeners();
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            // Show start screen
            showStartScreen();
        }

        function resizeCanvas() {
            const maxWidth = Math.min(window.innerWidth - 20, 800);
            const maxHeight = Math.min(window.innerHeight - 120, 600);
            const size = Math.min(maxWidth, maxHeight);
            
            // Make canvas dimensions multiples of GRID_SIZE
            canvas.width = Math.floor(size / GRID_SIZE) * GRID_SIZE;
            canvas.height = Math.floor(size / GRID_SIZE) * GRID_SIZE;
            
            gridWidth = canvas.width / GRID_SIZE;
            gridHeight = canvas.height / GRID_SIZE;
        }

        function setupEventListeners() {
            // Keyboard controls
            document.addEventListener('keydown', handleKeydown);
            
            // Touch controls
            canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
            canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
            canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
            
            // Button events
            if (startBtn) startBtn.addEventListener('click', startGame);
            if (resumeBtn) resumeBtn.addEventListener('click', resumeGame);
            if (quitBtn) quitBtn.addEventListener('click', quitToMenu);
            if (retryBtn) retryBtn.addEventListener('click', startGame);
            if (menuBtn) menuBtn.addEventListener('click', quitToMenu);
        }

        function handleKeydown(e) {
            // Pause handling
            if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
                if (!isGameOver && startOverlay && !startOverlay.classList.contains('hidden')) return;
                if (isPaused) resumeGame();
                else pauseGame();
                return;
            }
            
            if (isPaused || isGameOver || (startOverlay && !startOverlay.classList.contains('hidden'))) return;
            
            // Direction controls
            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
                    break;
            }
        }

            e.preventDefault();
            touchStartX = e.touches[0].clientX;
            touchStartY =
