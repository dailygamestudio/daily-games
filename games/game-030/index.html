<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Swing - Day 30</title>
<style>
:root { --bg:#0a0a12; --fg:#e0e0ff; --accent:#00ffea; --accent2:#ff00c8; --warn:#ffcc00; }
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:'Orbitron',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow:hidden}
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
canvas{display:block;background:radial-gradient(ellipse at center,#1a1a2e 0%,#0a0a12 70%);box-shadow:0 0 60px rgba(0,255,234,0.15),inset 0 0 60px rgba(0,0,0,0.5);border:2px solid #00ffea33;border-radius:4px}
.ui{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:10}
.ui>div{pointer-events:auto;background:rgba(10,10,18,0.85);border:1px solid var(--accent);padding:8px 16px;border-radius:4px;text-shadow:0 0 8px var(--accent);font-weight:700;letter-spacing:1px}
.ui .title{font-size:1.2rem;font-weight:900;text-align:center;flex:1;background:none;border:none;padding:0;text-shadow:0 0 12px var(--accent2),0 0 24px var(--accent)}
.btn{background:linear-gradient(135deg,#00ffea22,#ff00c822);border:1px solid var(--accent);color:var(--fg);padding:10px 28px;font-family:inherit;font-size:1rem;font-weight:700;letter-spacing:2px;cursor:pointer;transition:all .2s;text-transform:uppercase;box-shadow:0 0 20px rgba(0,255,234,0.3)}
.btn:hover,.btn:active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;box-shadow:0 0 30px var(--accent),0 0 60px var(--accent2)}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,0.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:20;opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.active{opacity:1;pointer-events:auto}
.overlay h1{font-size:3rem;font-weight:900;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:none;letter-spacing:4px}
.overlay p{font-size:1.2rem;color:var(--warn);text-shadow:0 0 10px var(--warn)}
.overlay .stats{display:flex;gap:30px;text-align:center}
.overlay .stat{display:flex;flex-direction:column}
.overlay .stat span:first-child{font-size:2.5rem;font-weight:900;color:var(--accent);text-shadow:0 0 15px var(--accent)}
.overlay .stat span:last-child{font-size:.8rem;color:#888;text-transform:uppercase;letter-spacing:2px}
.mobile-hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:.75rem;color:#666;text-align:center;pointer-events:none;letter-spacing:1px}
@media (max-width:600px){.ui{top:8px;left:8px;right:8px}.ui>div{padding:6px 10px;font-size:.8rem}.overlay h1{font-size:2rem}.overlay .stats{gap:15px}.overlay .stat span:first-child{font-size:1.8rem}}

.overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.95);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    gap: 20px;
    padding: 20px;
}
.overlay.hidden { display: none; }
.overlay h1 { font-size: clamp(32px, 8vw, 64px); text-shadow: 0 0 30px #00ffea; letter-spacing: 4px; }
.overlay p { color: #00ffea88; font-size: 14px; text-align: center; max-width: 400px; line-height: 1.6; }
.btn {
    padding: 12px 32px;
    font-size: 16px;
    font-family: 'Courier New', monospace;
    background: transparent;
    color: #00ffea;
    border: 2px solid #00ffea;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
}
.btn:hover { background: #00ffea; color: #0a0a0f; box-shadow: 0 0 20px #00ffea; }
.mobile-hint { color: #ff6b00; font-size: 12px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
<div class="title">NEON SWING</div>
<div>SCORE: <span id="score">0</span></div>
<div>BEST: <span id="best">0</span></div>
</div>
<div class="overlay active" id="overlay">
<h1>NEON SWING</h1>
<p>Click / Tap / Space to Grapple</p>
<p>Release to Let Go</p>
<div class="stats">
<div class="stat"><span id="finalScore">0</span><span>SCORE</span></div>
<div class="stat"><span id="finalBest">0</span><span>BEST</span></div>
</div>
<button class="btn" id="startBtn">BEGIN</button>
</div>
<div class="mobile-hint">Swing through the conduit. Avoid the walls.</div>


    <div class="overlay hidden" id="pauseOverlay">
        <h1>PAUSED</h1>
        <p>Wave <span id="pauseWave">1</span> • Score <span id="pauseScore">0</span></p>
        <button class="btn" id="resumeBtn">RESUME</button>
        <button class="btn" id="quitBtn">QUIT TO MENU</button>
    </div>

    <div class="overlay hidden" id="gameOverOverlay">
        <h1 style="color: #ff3366;">GAME OVER</h1>
        <p>Final Score: <span id="finalScore" style="color: #00ffea;">0</span></p>
        <p id="highScoreMsg" style="color: #ffd700;"></p>
        <button class="btn" id="retryBtn">RETRY</button>
        <button class="btn" id="menuBtn">MAIN MENU</button>
    </div>

<script>
/**
 * Neon Swing - Day 30
 * Grappling hook swing game with procedural conduit
 * Neon/cyberpunk aesthetic, mobile + desktop, high score persistence
 */
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
const overlay=document.getElementById('overlay'),startBtn=document.getElementById('startBtn');
const finalScoreEl=document.getElementById('finalScore'),finalBestEl=document.getElementById('finalBest');

let W,H,dpr=1;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);W=Math.min(window.innerWidth,900);H=window.innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.scale(dpr,dpr)}
window.addEventListener('resize',resize);resize();

// Game constants
const GRAVITY=0.45, AIR_DRAG=0.992, ROPE_DRAG=0.995, MAX_ROPE=320, GRAPPLE_SPEED=28;
const PLAYER_R=14, HOOK_R=6;
const CONDUIT_W=120, GAP_MIN=140, GAP_MAX=220, SECTION_H=400;
const COLORS={player:'#00ffea',hook:'#ff00c8',rope:'#00ffea88',wall:'#003344',wallGlow:'#00ffea44',orb:'#ffcc00',orbGlow:'#ffcc0088',bg1:'#0a0a12',bg2:'#1a1a2e',particle:'#00ffea',particle2:'#ff00c8'};

// State
let state='start'; // start, playing, dead
let score=0,best=parseInt(localStorage.getItem('neonSwingBest')||'0',10);
let player,hook,ropeActive,ropeLen,targetHook;
let conduit=[],scrollY=0,spawnY=0;
let particles=[],screenShake=0;
let frame=0;

bestEl.textContent=best;

// Player object
function createPlayer(){return{x:W/2,y:H*0.75,vx:0,vy:0,angle:0,swingDir:0,invincible:0}}

// Conduit generation
function genSection(topY){
const gap=GAP_MIN+Math.random()*(GAP_MAX-GAP_MIN);
const leftW=(W-CONDUIT_W-gap)/2;
const rightX=leftW+CONDUIT_W+gap;
const type=Math.random()<.3?'orb':(Math.random()<.5?'spike':'none');
return{top:topY,leftW,rightX,gap,type,passed:false,orbCollected:false}
}
function initConduit(){conduit=[];for(let i=0;i<6;i++){conduit.push(genSection(-i*SECTION_H))}spawnY=-5*SECTION_H}

// Physics update
function updatePlayer(){
if(!player) return;
player.vy+=GRAVITY;
player.vx*=AIR_DRAG; player.vy*=AIR_DRAG;

if(ropeActive && hook){
const dx=hook.x-player.x, dy=hook.y-player.y;
const dist=Math.hypot(dx,dy);
if(dist>ropeLen){
const factor=(dist-ropeLen)/dist*0.35;
player.vx+=dx*factor; player.vy+=dy*factor;
ropeLen=Math.max(ropeLen,dist);
}
if(ropeLen>MAX_ROPE){releaseHook()}
}

player.x+=player.vx; player.y+=player.vy;

// Wall collision (conduit)
const secIdx=Math.floor((player.y-scrollY)/SECTION_H);
if(conduit[secIdx]){
const sec=conduit[secIdx];
const leftWall=sec.leftW, rightWall=sec.leftW+CONDUIT_W+sec.gap;
if(player.x-PLAYER_R<leftWall){player.x=leftWall+PLAYER_R; player.vx*=-0.3; hitWall()}
if(player.x+PLAYER_R>rightWall){player.x=rightWall-PLAYER_R; player.vx*=-0.3; hitWall()}
}

// Orb collection
if(conduit[secIdx] && conduit[secIdx].type==='orb' && !conduit[secIdx].orbCollected){
const sec=conduit[secIdx];
const orbX=sec.leftW+CONDUIT_W+sec.gap/2;
const orbY=sec.top+SECTION_H/2;
if(Math.hypot(player.x-orbX,player.y-orbY)<PLAYER_R+18){
collectOrb(secIdx);
}
}

// Death check (spikes)
if(conduit[secIdx] && conduit[secIdx].type==='spike' && player.invincible<=0){
const sec=conduit[secIdx];
const spikeY=sec.top+SECTION_H-20;
if(player.y+PLAYER_R>spikeY && player.x>sec.leftW+CONDUIT_W && player.x<sec.leftW+CONDUIT_W+sec.gap){
die();
}
}

if(player.invincible>0) player.invincible--;

// Scroll world
scrollY+=Math.max(1,2+score*0.001);
player.y+=Math.max(1,2+score*0.001);
hook && (hook.y+=Math.max(1,2+score*0.001));

// Score based on scroll
score=Math.floor(-scrollY/15);
scoreEl.textContent=score;

// Generate new sections
while(spawnY<scrollY+H+SECTION_H*2){conduit.push(genSection(spawnY));spawnY+=SECTION_H}
// Remove old
while(conduit.length>0 && conduit[0].top>scrollY+H+SECTION_H){conduit.shift()}

updateParticles();
}

function hitWall(){screenShake=8; spawnParticles(player.x,player.y,COLORS.particle2,8); if(player.invincible<=0){player.invincible=30}}

function collectOrb(idx){conduit[idx].orbCollected=true; score+=50; scoreEl.textContent=score; spawnParticles(conduit[idx].leftW+CONDUIT_W+conduit[idx].gap/2,conduit[idx].top+SECTION_H/2,COLORS.orb,15); screenShake=4}

function releaseHook(){ropeActive=false; hook=null; ropeLen=0}

function tryGrapple(mx,my){
if(ropeActive) return;
const dx=mx-player.x, dy=my-player.y;
const dist=Math.hypot(dx,dy);
if(dist>MAX_ROPE) return;
// Find nearest ceiling point
let bestDist=Infinity, bestPoint=null;
conduit.forEach(sec=>{
if(sec.top<player.y){
const cx=sec.leftW+CONDUIT_W+sec.gap/2;
const d=Math.hypot(cx-player.x,sec.top-player.y);
if(d<bestDist && d<=MAX_ROPE){bestDist=d; bestPoint={x:cx,y:sec.top}}}
});
if(bestPoint){
hook={x:bestPoint.x,y:bestPoint.y}; ropeActive=true; ropeLen=bestDist;
spawnParticles(hook.x,hook.y,COLORS.hook,10);
}
}

function die(){state='dead'; screenShake=20; spawnParticles(player.x,player.y,COLORS.player,30); spawnParticles(player.x,player.y,COLORS.hook,20); if(score>best){best=score; localStorage.setItem('neonSwingBest',best); bestEl.textContent=best;} finalScoreEl.textContent=score; finalBestEl.textContent=best; overlay.classList.add('active')}

function spawnParticles(x,y,color,count){for(let i=0;i<count;i++){particles.push({x,y,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6-1,life:1,decay:0.015+Math.random()*0.02,size:2+Math.random()*3,color})}}

function updateParticles(){for(let i=particles.length-1;i>=0;i--){const p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.08; p.life-=p.decay; if(p.life<=0) particles.splice(i,1)}}

function render(){
ctx.save();
if(screenShake>0){ctx.translate((Math.random()-0.5)*screenShake,(Math.random()-0.5)*screenShake); screenShake*=0.85; if(screenShake<0.5) screenShake=0}

// Background grid
ctx.fillStyle=COLORS.bg1; ctx.fillRect(0,0,W,H);
const gridSize=40, offset=(-scrollY*0.5)%gridSize;
ctx.strokeStyle='#00ffea11'; ctx.lineWidth=1;
for(let x=0;x<=W;x+=gridSize){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
for(let y=offset;y<=H;y+=gridSize){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}

// Conduit
conduit.forEach(sec=>{
const top=sec.top-scrollY, bottom=top+SECTION_H;
if(bottom<0 || top>H) return;
ctx.fillStyle=COLORS.wall;
ctx.fillRect(0,top,sec.leftW,SECTION_H);
ctx.fillRect(sec.leftW+CONDUIT_W+sec.gap,top,W-(sec.leftW+CONDUIT_W+sec.gap),SECTION_H);
// Glow edges
ctx.shadowColor=COLORS.wallGlow; ctx.shadowBlur=15;
ctx.fillRect(sec.leftW-2,top,4,SECTION_H);
ctx.fillRect(sec.leftW+CONDUIT_W+sec.gap-2,top,4,SECTION_H);
ctx.shadowBlur=0;

// Spike indicator
if(sec.type==='spike'){
ctx.fillStyle='#ff0044';
for(let i=0;i<sec.gap;i+=12){
ctx.beginPath();
ctx.moveTo(sec.leftW+CONDUIT_W+i,bottom-20);
ctx.lineTo(sec.leftW+CONDUIT_W+i+6,bottom);
ctx.lineTo(sec.leftW+CONDUIT_W+i+12,bottom-20);
ctx.fill();
}
}
// Orb
if(sec.type==='orb' && !sec.orbCollected){
const ox=sec.leftW+CONDUIT_W+sec.gap/2, oy=top+SECTION_H/2;
ctx.shadowColor=COLORS.orbGlow; ctx.shadowBlur=20;
const grad=ctx.createRadialGradient(ox,oy,0,ox,oy,18);
grad.addColorStop(0,COLORS.orb); grad.addColorStop(1,'#ffcc0000');
ctx.fillStyle=grad; ctx.beginPath(); ctx.arc(ox,oy,18,0,Math.PI*2); ctx.fill();
ctx.shadowBlur=0;
}
});

// Rope
if(ropeActive && hook){
const hx=hook.x, hy=hook.y-scrollY;
ctx.strokeStyle=COLORS.rope; ctx.lineWidth=2;
ctx.shadowColor=COLORS.player; ctx.shadowBlur=10;
ctx.beginPath(); ctx.moveTo(player.x,player.y); ctx.lineTo(hx,hy); ctx.stroke();
ctx.shadowBlur=0;
// Hook
ctx.fillStyle=COLORS.hook; ctx.shadowColor=COLORS.hook; ctx.shadowBlur=15;
ctx.beginPath(); ctx.arc(hx,hy,HOOK_R,0,Math.PI*2); ctx.fill();
ctx.shadowBlur=0;
}

// Player
ctx.shadowColor=COLORS.player; ctx.shadowBlur=20;
const grad=ctx.createRadialGradient(player.x,player.y,0,player.x,player.y,PLAYER_R);
grad.addColorStop(0,'#ffffff'); grad.addColorStop(0.5,COLORS.player); grad.addColorStop(1,'#006666');
ctx.fillStyle=grad;
ctx.beginPath(); ctx.arc(player.x,player.y,PLAYER_R,0,Math.PI*2); ctx.fill();
ctx.shadowBlur=0;

// Particles
particles.forEach(p=>{ctx.globalAlpha=p.life; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1});

ctx.restore();
}

function loop(){
updatePlayer();
render();
frame++;
requestAnimationFrame(loop);
}

// Input
let pressing=false;
function onDown(e){const rect=canvas.getBoundingClientRect(); const x=(e.touches?e.touches[0].clientX:e.clientX)-rect.left; const y=(e.touches?e.touches[0].clientY:e.clientY)-rect.top; pressing=true; if(state==='playing'){tryGrapple(x,y)}}
function onUp(){pressing=false; if(state==='playing'){releaseHook()}}
function onMove(e){if(!pressing) return; const rect=canvas.getBoundingClientRect(); const x=(e.touches?e.touches[0].clientX:e.clientX)-rect.left; const y=(e.touches?e.touches[0].clientY:e.clientY)-rect.top; if(state==='playing' && ropeActive && hook){hook.x=x; hook.y=y+scrollY;}}

canvas.addEventListener('mousedown',onDown);
canvas.addEventListener('mousemove',onMove);
canvas.addEventListener('mouseup',onUp);
canvas.addEventListener('mouseleave',onUp);
canvas.addEventListener('touchstart',e=>{e.preventDefault();onDown(e)},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();onMove(e)},{passive:false});
canvas.addEventListener('touchend',onUp);
window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault(); if(state==='playing'){tryGrapple(player.x,player.y-MAX_ROPE)}else if(state==='start' || state==='dead'){startGame()}}
        if (e.code === 'Escape' || e.key === 'Escape') {
            if (!document.getElementById('pauseOverlay').classList.contains('hidden')) {
                resumeGame();
            } else {
                pauseGame();
            }
            return;
        }});
window.addEventListener('keyup',e=>{if(e.code==='Space'){if(state==='playing') releaseHook()}});

startBtn.addEventListener('click',startGame);

function startGame(){
state='playing'; score=0; scrollY=0; frame=0; particles=[]; screenShake=0;
player=createPlayer(); hook=null; ropeActive=false; ropeLen=0;
initConduit(); overlay.classList.remove('active'); scoreEl.textContent=0;
}

loop();

// --- Pause/Resume/Quit Functions for game-030 ---
function pauseGame() {
    if (!state.running) return;
    state.running = false;
    document.getElementById('pauseOverlay').classList.remove('hidden');
}

function resumeGame() {
    if (state.running) return;
    state.running = true;
    document.getElementById('pauseOverlay').classList.add('hidden');
}

function quitToMenu() {
    state.running = false;
    document.getElementById('pauseOverlay').classList.add('hidden');
    document.getElementById('gameOverOverlay').classList.add('hidden');
    showStartScreen();
}

function showStartScreen() {
    state.running = false;
    // No start screen found
    document.getElementById('pauseOverlay').classList.add('hidden');
    document.getElementById('gameOverOverlay').classList.add('hidden');
}
</script>
</body>
</html>
