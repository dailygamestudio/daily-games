<style>

#overlay h1 { font-size: 2.5rem; margin-bottom: 0.5rem; background: linear-gradient(90deg, #00fff7, #ff00c8, #fffb00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: none; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.5); } }
#overlay p { margin: 0.5rem 0; opacity: 0.8; }
#overlay .btn {
    margin-top: 1.5rem;

    text-transform: uppercase;

}
#overlay .btn:hover, #overlay .btn:active { background: linear-gradient(135deg, #006660, #009990); box-shadow: 0 0 20px #00fff7; transform: scale(1.05); }
#overlay .controls { margin: 1rem 0; display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; font-size: 0.9rem; opacity: 0.7; }
#overlay .controls kbd { background: #111; border: 1px solid #00fff7; padding: 0.2rem 0.5rem; border-radius: 3px; color: #ff00c8; }

@media (max-width: 600px) {

}

.pause-overlay, .game-over-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(5,5,10,0.95);

    align-items: center;
    justify-content: center;

.pause-overlay.hidden, .game-over-overlay.hidden { display: none; }
.pause-overlay h1, .game-over-overlay h1 { font-size: clamp(32px, 8vw, 64px); text-shadow: 0 0 30px #00ffea; letter-spacing: 4px; }
.pause-overlay p, .game-over-overlay p { color: #00ffea88; font-size: 14px; text-align: center; max-width: 400px; line-height: 1.6; }

    border: 2px solid #00ffea;

    cursor: pointer;
    transition: all 0.2s;
}
.btn:hover { background: #00ffea; color: #0a0a0f; box-shadow: 0 0 20px #00ffea; }
.mobile-hint { color: #ff6b00; font-size: 12px; }

<body>
<div id="gameContainer">
    <canvas id="canvas" width="720" height="720"></canvas>
    <div class="ui">
        <div><span class="label">LEVEL</span> <span class="value" id="levelEl">1</span></div>
        <div><span class="label">SCORE</span> <span class="value" id="scoreEl">0</span></div>

    </div>
    <div class="particles" id="particles"></div>
    <div id="overlay">
        <h1>NEON BEAM</h1>
        <p>Guide the laser from <span style="color:#00fff7">SOURCE</span> to <span style="color:#ff00c8">TARGET</span></p>
        <p>Rotate mirrors to reflect the beam</p>
        <div class="controls">
            <span><kbd>Click/Tap</kbd> Tile to rotate</span>
            <span><kbd>Space</kbd> Speed up</span>
            <span><kbd>P</kbd> Pause</span>
        </div>
        <button class="btn" id="startBtn">INITIALIZE</button>

        <p>Beam suspended in quantum state</p>

        <button class="btn" id="quitBtn">QUIT TO MENU</button>
    </div>
    <div id="gameOverOverlay" class="game-over-overlay hidden">
        <h1>SYSTEM OFFLINE</h1>
        <p>Final Score: <span id="finalScore">0</span></p>
        <button class="btn" id="retryBtn">RETRY</button>
        <button class="btn" id="menuBtn">MAIN MENU</button>
    </div>
</div>
<script>
// ===== NEON BEAM - Day 20 =====
// Real-time laser reflection puzzle with increasing complexity

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const pauseOverlay = document.getElementById('pauseOverlay');
const gameOverOverlay = document.getElementById('gameOverOverlay');
const startBtn = document.getElementById('startBtn');
const resumeBtn = document.getElementById('resumeBtn');
const quitBtn = document.getElementById('quitBtn');
const retryBtn = document.getElementById('retryBtn');
const menuBtn = document.getElementById('menuBtn');
const levelEl = document.getElementById('levelEl');
const scoreEl = document.getElementById('scoreEl');
const bestEl = document.getElementById('bestEl');
const hsValue = document.getElementById('hsValue');
const finalScoreEl = document.getElementById('finalScore');
const particlesContainer = document.getElementById('particles');

// ===== CONSTANTS =====
const GRID_SIZE = 8;
const TILE_SIZE = canvas.width / GRID_SIZE;
const TILE_TYPES = {
    EMPTY: 0,
    MIRROR_SLASH: 1,    // /
    MIRROR_BACKSLASH: 2, // \
    SPLITTER: 3,         // splits beam into 4 directions
    PRISM: 4,            // changes beam color
    BLOCK: 5,            // blocks beam
    SOURCE: 6,
    TARGET: 7,
    ROTATING_MIRROR: 8,  // auto-rotates
    PHASE_SHIFTER: 9     // toggles phase
};
const COLORS = {
    CYAN: '#00fff7',
    MAGENTA: '#ff00c8',
    YELLOW: '#fffb00',
    GREEN: '#00ff88',
    ORANGE: '#ff8800',
    WHITE: '#ffffff'
};
const BEAM_SPEED_BASE = 180; // pixels per second
const BEAM_SPEED_FAST = 540;

// ===== GAME STATE =====
let grid = [];
let beams = [];
let score = 0;
let highScore = parseInt(localStorage.getItem('neonBeamHS')) || 0;
let level = 1;
let gameState = 'menu'; // menu, playing, paused, levelComplete, gameOver
let animationId = null;
let lastTime = 0;
let speedMultiplier = 1;
let phase = 0; // 0 or 1 for phase shifter
let phaseTimer = 0;
let combo = 0;
let timeBonus = 0;
let levelStartTime = 0;
let rotatingMirrorTimer = 0;
let phaseShifterTimer = 0;
let keys = {};

hsValue.textContent = highScore;
bestEl.textContent = highScore;

// ===== UTILITIES =====
const rand = (min, max) => Math.random() * (max - min) + min;
const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
const lerp = (a, b, t) => a + (b - a) * t;

// ===== BEAM CLASS =====
class Beam {
    constructor(x, y, dir, color = COLORS.CYAN, intensity = 1) {
        this.x = x;
        this.y = y;
        this.dir = dir; // 0=right, 1=down, 2=left, 3=up
        this.color = color;
        this.intensity = intensity;
        this.alive = true;
        this.trail = [];
        this.maxTrail = 15;
        this.distance = 0;
        this.hits = 0;
    }
    update(dt) {
        if (!this.alive) return;
        const speed = BEAM_SPEED_BASE * speedMultiplier * dt;
        const dx = [1, 0, -1, 0][this.dir];
        const dy = [0, 1, 0, -1][this.dir];
        this.x += dx * speed;
        this.y += dy * speed;
        this.distance += speed;
        this.trail.push({ x: this.x, y: this.y, alpha: 1 });
        if (this.trail.length > this.maxTrail) this.trail.shift();
        this.trail.forEach(p => p.alpha *= 0.92);
    }
    draw(ctx, tileSize) {
        if (!this.alive) return;
        // Trail
        ctx.lineWidth = 3 * this.intensity;
        ctx.lineCap = 'round';
        ctx.strokeStyle = this.color;
        ctx.beginPath();
        let first = true;
        this.trail.forEach((p, i) => {
            const alpha = p.alpha * this.intensity;
            ctx.globalAlpha = alpha;
            if (first) { ctx.moveTo(p.x, p.y); first = false; }
            else ctx.lineTo(p.x, p.y);
        });
        ctx.stroke();
        ctx.globalAlpha = 1;
        // Core beam
        const dx = [1, 0, -1, 0][this.dir];
        const dy = [0, 1, 0, -1][this.dir];
        const len = 20;
        const gradient = ctx.createLinearGradient(
            this.x - dx * len, this.y - dy * len,
            this.x + dx * len, this.y + dy * len
        );
        gradient.addColorStop(0, 'transparent');
        gradient.addColorStop(0.5, this.color);
        gradient.addColorStop(1, 'transparent');
        ctx.strokeStyle = gradient;
        ctx.lineWidth = 6 * this.intensity;
        ctx.beginPath();
        ctx.moveTo(this.x - dx * len, this.y - dy * len);
        ctx.lineTo(this.x + dx * len, this.y + dy * len);
        ctx.stroke();
        // Glow
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 15 * this.intensity;
        ctx.stroke();
        ctx.shadowBlur = 0;
    }
    getTilePos(tileSize) {
        return { tx: Math.floor(this.x / tileSize), ty: Math.floor(this.y / tileSize) };
    }
}

// ===== GRID INITIALIZATION =====
function initGrid() {
    grid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(TILE_TYPES.EMPTY));
    beams = [];
    phase = 0;
    phaseTimer = 0;
    rotatingMirrorTimer = 0;
    phaseShifterTimer = 0;
    
    // Place source and target based on level
    const configs = getLevelConfig(level);
    configs.sources.forEach(s => grid[s.y][s.x] = TILE_TYPES.SOURCE);
    configs.targets.forEach(t => {
        grid[t.y][t.x] = { type: TILE_TYPES.TARGET, hit: false, requiredColor: t.color || null };
    });
    configs.mirrors.forEach(m => {
        if (m.type === TILE_TYPES.ROTATING_MIRROR || m.type === TILE_TYPES.PHASE_SHIFTER) {
            grid[m.y][m.x] = { type: m.type, rotState: 0, phase: 0 };
        } else {
            grid[m.y][m.x] = m.type;
        }
    });
    configs.blocks.forEach(b => grid[b.y][b.x] = TILE_TYPES.BLOCK);
    
    // Spawn initial beams from sources
    for (let y = 0; y < GRID_SIZE; y++) {
        for (let x = 0; x < GRID_SIZE; x++) {
            const cell = grid[y][x];
            const type = typeof cell === 'object' ? cell.type : cell;
            if (type === TILE_TYPES.SOURCE) {
                // Determine initial direction (toward center)
                let dir = 0;
                if (x === 0) dir = 0;
                else if (x === GRID_SIZE - 1) dir = 2;
                else if (y === 0) dir = 1;
                else if (y === GRID_SIZE - 1) dir = 3;
                beams.push(new Beam(
                    (x + 0.5) * TILE_SIZE,
                    (y + 0.5) * TILE_SIZE,
                    dir,
                    COLORS.CYAN
                ));
            }
        }
    }
    levelStartTime = performance.now();
    timeBonus = 10000;
}

function getLevelConfig(lv) {
    const config = { sources: [], targets: [], mirrors: [], blocks: [] };
    const mod = (lv - 1) % 8;
    
    switch(mod) {
        case 0: // Simple reflection
            config.sources.push({x:0, y:3});
            config.targets.push({x:GRID_SIZE-1, y:4});
            config.mirrors.push({x:2, y:3, type: TILE_TYPES.MIRROR_SLASH});
            config.mirrors.push({x:5, y:3, type: TILE_TYPES.MIRROR_BACKSLASH});
            break;
        case 1: // Double bounce
            config.sources.push({x:3, y:0});
            config.targets.push({x:4, y:GRID_SIZE-1});
            config.mirrors.push({x:3, y:2, type: TILE_TYPES.MIRROR_SLASH});
            config.mirrors.push({x:4, y:5, type: TILE_TYPES.MIRROR_BACKSLASH});
            break;
        case 2: // Splitter challenge
            config.sources.push({x:0, y:3});
            config.targets.push({x:GRID_SIZE-1, y:3}, {x:4, y:GRID_SIZE-1});
            config.mirrors.push({x:3, y:3, type: TILE_TYPES.SPLITTER});
            config.mirrors.push({x:5, y:3, type: TILE_TYPES.MIRROR_SLASH});
            break;
        case 3: // Prism color matching
            config.sources.push({x:3, y:0});
            config.targets.push({x:3, y:GRID_SIZE-1, color: COLORS.MAGENTA});
            config.mirrors.push({x:3, y:2, type: TILE_TYPES.PRISM});
            config.mirrors.push({x:3, y:5, type: TILE_TYPES.MIRROR_SLASH});
            break;
        case 4: // Rotating mirrors
            config.sources.push({x:0, y:4});
            config.targets.push({x:GRID_SIZE-1, y:3});
            config.mirrors.push({x:2, y:4, type: TILE_TYPES.ROTATING_MIRROR});
            config.mirrors.push({x:5, y:4, type: TILE_TYPES.ROTATING_MIRROR});
            break;
        case 5: // Phase shifter
            config.sources.push({x:4, y:0});
            config.targets.push({x:3, y:GRID_SIZE-1});
            config.mirrors.push({x:4, y:2, type: TILE_TYPES.PHASE_SHIFTER});
            config.mirrors.push({x:3, y:5, type: TILE_TYPES.MIRROR_BACKSLASH});
            config.blocks.push({x:4, y:4}, {x:3, y:3});
            break;
        case 6: // Multi-source
            config.sources.push({x:0, y:2}, {x:GRID_SIZE-1, y:5});
            config.targets.push({x:GRID_SIZE-1, y:3}, {x:0, y:4});
            config.mirrors.push({x:2, y:2, type: TILE_TYPES.MIRROR_SLASH});
            config.mirrors.push({x:5, y:5, type: TILE_TYPES.MIRROR_BACKSLASH});
            config.mirrors.push({x:3, y:3, type: TILE_TYPES.SPLITTER});
            break;
        case 7: // Chaos mode
            config.sources.push({x:0, y:3}, {x:3, y:0}, {x:GRID_SIZE-1, y:4});
            config.targets.push({x:GRID_SIZE-1, y:3}, {x:4, y:GRID_SIZE-1}, {x:0, y:4});
            config.mirrors.push({x:2, y:3, type: TILE_TYPES.MIRROR_SLASH});
            config.mirrors.push({x:3, y:2, type: TILE_TYPES.MIRROR_BACKSLASH});
            config.mirrors.push({x:5, y:4, type: TILE_TYPES.ROTATING_MIRROR});
            config.mirrors.push({x:4, y:5, type: TILE_TYPES.PRISM});
            config.mirrors.push({x:2, y:5, type: TILE_TYPES.PHASE_SHIFTER});
            config.blocks.push({x:4, y:2}, {x:5, y:2}, {x:2, y:2});
            break;
    }
    
    // Add complexity based on level
    const extraMirrors = Math.min(Math.floor(lv / 4), 4);
    for (let i = 0; i < extraMirrors; i++) {
        let x, y, attempts = 0;
        do {
            x = randInt(1, GRID_SIZE-2);
            y = randInt(1, GRID_SIZE-2);
            attempts++;
        } while (grid[y][x] !== TILE_TYPES.EMPTY && attempts < 50);
        if (attempts < 50) {
            const types = [TILE_TYPES.MIRROR_SLASH, TILE_TYPES.MIRROR_BACKSLASH];
            config.mirrors.push({x, y, type: types[randInt(0,1)]});
        }
    }
    
    return config;
}

// ===== BEAM PHYSICS =====
function reflectBeam(beam, tileX, tileY) {
    const cell = grid[tileY][tileX];
    const actualType = typeof cell === 'object' ? cell.type : cell;
    
    switch(actualType) {
        case TILE_TYPES.MIRROR_SLASH:
            beam.dir = [3, 2, 1, 0][beam.dir];
            beam.hits++;
            break;
        case TILE_TYPES.MIRROR_BACKSLASH:
            beam.dir = [1, 0, 3, 2][beam.dir];
            beam.hits++;
            break;
        case TILE_TYPES.ROTATING_MIRROR:
            const rotState = cell.rotState || 0;
            if (rotState === 0) beam.dir = [3, 2, 1, 0][beam.dir];
            else beam.dir = [1, 0, 3, 2][beam.dir];
            beam.hits++;
            break;
        case TILE_TYPES.SPLITTER:
            const dirs = [0,1,2,3].filter(d => d !== beam.dir);
            dirs.forEach(d => {
                beams.push(new Beam(beam.x, beam.y, d, beam.color, beam.intensity * 0.7));
            });
            beam.hits++;
            break;
        case TILE_TYPES.PRISM:
            const colors = [COLORS.CYAN, COLORS.MAGENTA, COLORS.YELLOW, COLORS.GREEN, COLORS.ORANGE];
            const idx = colors.indexOf(beam.color);
            beam.color = colors[(idx + 1) % colors.length];
            beam.hits++;
            break;
        case TILE_TYPES.PHASE_SHIFTER:
            if (phase !== (cell.phase || 0)) {
                beam.alive = false;
                return;
            }
            beam.hits++;
            break;
        case TILE_TYPES.BLOCK:
            beam.alive = false;
            break;
        case TILE_TYPES.TARGET:
            const targetColor = cell.requiredColor;
            if (!targetColor || targetColor === beam.color) {
                cell.hit = true;
                onTargetHit(beam, tileX, tileY);
            } else {
                beam.alive = false;
            }
            break;
    }
    // Snap to tile center after interaction
    beam.x = (tileX + 0.5) * TILE_SIZE;
    beam.y = (tileY + 0.5) * TILE_SIZE;
}

function onTargetHit(beam, tx, ty) {
    beam.alive = false;
    combo++;
    const basePoints = 100 * level;
    const hitBonus = beam.hits * 50;
    const colorBonus = beam.color !== COLORS.CYAN ? 200 : 0;
    const comboMult = Math.min(combo, 10);
    const points = Math.floor((basePoints + hitBonus + colorBonus) * comboMult);
    score += points;
    scoreEl.textContent = score;
    if (score > highScore) {
        highScore = score;
        localStorage.setItem('neonBeamHS', highScore);
        bestEl.textContent = highScore;
        hsValue.textContent = highScore;
    }
    spawnParticles(beam.x, beam.y, beam.color, 20);
    checkLevelComplete();
}

function checkLevelComplete() {
    let allHit = true;
    for (let y = 0; y < GRID_SIZE; y++) {
        for (let x = 0; x < GRID_SIZE; x++) {
            const cell = grid[y][x];
            if (cell && typeof cell === 'object' && cell.type === TILE_TYPES.TARGET && !cell.hit) {
                allHit = false;
                break;
            }
        }
    }
    if (allHit) {
        levelComplete();
    }
}

function levelComplete() {
    gameState = 'levelComplete';
    const timeTaken = (performance.now() - levelStartTime) / 1000;
    const timeBonusPoints = Math.max(0, Math.floor(timeBonus - timeTaken * 500));
    score += timeBonusPoints;
    scoreEl.textContent = score;
    if (score > highScore) {
        highScore = score;
        localStorage.setItem('neonBeamHS', highScore);
        bestEl.textContent = highScore;
        hsValue.textContent = highScore;
    }
    level++;
    levelEl.textContent = level;
    combo = 0;
    setTimeout(() => {
        initGrid();
        gameState = 'playing';
    }, 1500);
}

function checkGameOver() {
    // Game over if no beams alive and not all targets hit
    const anyBeamAlive = beams.some(b => b.alive);
    if (!anyBeamAlive) {
        let allHit = true;
        for (let y = 0; y < GRID_SIZE; y++) {
            for (let x = 0; x < GRID_SIZE; x++) {
                const cell = grid[y][x];
                if (cell && typeof cell === 'object' && cell.type === TILE_TYPES.TARGET && !cell.hit) {
                    allHit = false;
                    break;
                }
            }
        }
        if (!allHit) {
            gameOver();
        }
    }
}

function gameOver() {
    gameState = 'gameOver';
    finalScoreEl.textContent = score;
    gameOverOverlay.classList.remove('hidden');
}

// ===== PARTICLES =====
function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = rand(2, 6);
        p.style.width = p.style.height = size + 'px';
        p.style.background = color;
        p.style.boxShadow = `0 0 ${size*2}px ${color}`;
        p.style.left = (x + rand(-10,10)) + 'px';
        p.style.top = (y + rand(-10,10)) + 'px';
        particlesContainer.appendChild(p);
        const angle = rand(0, Math.PI * 2);
        const velocity = rand(50, 150);
        const vx = Math.cos(angle) * velocity;
        const vy = Math.sin(angle) * velocity;
        let life = 1;
        const animate = () => {
            life -= 0.02;
            if (life <= 0) {
                p.remove();
                return;
            }
            const currentLeft = parseFloat(p.style.left);
            const currentTop = parseFloat(p.style.top);
            p.style.left = (currentLeft + vx * 0.02) + 'px';
            p.style.top = (currentTop + vy * 0.02) + 'px';
            p.style.opacity = life;
            requestAnimationFrame(animate);
        };
        requestAnimationFrame(animate);
    }
}

// ===== DRAWING =====
function drawMirror(ctx, half, isBackslash, rotState) {
    ctx.strokeStyle = COLORS.CYAN;
    ctx.lineWidth = 4;
    ctx.shadowColor = COLORS.CYAN;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    if (isBackslash) {
        ctx.moveTo(-half, -half);
        ctx.lineTo(half, half);
    } else {
        ctx.moveTo(-half, half);
        ctx.lineTo(half, -half);
    }
    ctx.stroke();
    // Mirror frame
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 2;
    ctx.shadowBlur = 0;
    ctx.strokeRect(-half, -half, half*2, half*2);
    // Rotation indicator for rotating mirrors
    if (rotState !== undefined) {
        ctx.fillStyle = rotState === 0 ? COLORS.CYAN : COLORS.MAGENTA;
        ctx.beginPath();
        ctx.arc(0, -half + 8, 4, 0, Math.PI * 2);
        ctx.fill();
    }
}

        ctx.lineTo(canvas.width, i * TILE_SIZE);
