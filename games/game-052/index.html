<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Blitz - Day 52</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a12; color: #0ff; font-family: 'Courier New', monospace; overflow: hidden; height: 100vh; }
  canvas { display: block; background: #000; }
  .overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    background: rgba(0,0,0,0.9); z-index: 10; pointer-events: none;
  }
  .overlay.hidden { display: none; }
  .overlay h1 { font-size: 3rem; text-shadow: 0 0 10px #0ff, 0 0 20px #0ff; margin-bottom: 1rem; }
  .overlay p { font-size: 1.5rem; margin-bottom: 2rem; color: #aaa; }
  .btn {
    padding: 1rem 2rem; font-size: 1.2rem; background: transparent; border: 2px solid #0ff;
    color: #0ff; cursor: pointer; transition: all 0.2s; text-transform: uppercase;
    box-shadow: 0 0 10px #0ff; margin: 0.5rem;
  }
  .btn:hover, .btn:focus { background: #0ff; color: #000; box-shadow: 0 0 20px #0ff, 0 0 30px #0ff; }
  .score-display { position: absolute; top: 1rem; left: 1rem; font-size: 1.5rem; text-shadow: 0 0 5px #0ff; z-index: 5; pointer-events: none; }
  .high-score-display { position: absolute; top: 1rem; right: 1rem; font-size: 1.5rem; text-shadow: 0 0 5px #f0f; z-index: 5; pointer-events: none; }
  .wave-display { position: absolute; bottom: 1rem; left: 50%; transform: translateX(-50%); font-size: 1.5rem; text-shadow: 0 0 5px #ff0; z-index: 5; pointer-events: none; }
  @media (max-width: 600px) {
    .overlay h1 { font-size: 2rem; }
    .overlay p { font-size: 1rem; }
    .btn { padding: 0.8rem 1.5rem; font-size: 1rem; }
    .score-display, .high-score-display, .wave-display { font-size: 1rem; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="score-display">SCORE: <span id="score">0</span></div>
<div class="high-score-display">BEST: <span id="highScore">0</span></div>
<div class="wave-display">WAVE: <span id="wave">1</span></div>

<div id="startScreen" class="overlay">
  <h1>NEON BLITZ</h1>
  <p>Survive the neon onslaught</p>
  <button class="btn" id="startBtn">START</button>
  <p style="margin-top:2rem;font-size:0.9rem;color:#666;">
    WASD/Arrows: Move | Mouse: Aim | Click: Shoot<br>
    Touch Left: Move | Touch Right: Aim & Shoot<br>
    ESC/P: Pause
  </p>
</div>

<div id="pauseScreen" class="overlay hidden">
  <h1>PAUSED</h1>
  <button class="btn" id="resumeBtn">RESUME</button>
  <button class="btn" id="quitBtn">QUIT TO MENU</button>
</div>

<div id="gameOverScreen" class="overlay hidden">
  <h1>GAME OVER</h1>
  <p>Final Score: <span id="finalScore">0</span></p>
  <button class="btn" id="retryBtn">RETRY</button>
  <button class="btn" id="menuBtn">MAIN MENU</button>
</div>

<script>
/* ===== GAME CONSTANTS ===== */
const CANVAS = document.getElementById('game');
const CTX = CANVAS.getContext('2d');
const PI2 = Math.PI * 2;

// Colors
const NEON_CYAN = '#0ff';
const NEON_PINK = '#f0f';
const NEON_YELLOW = '#ff0';
const NEON_GREEN = '#0f0';
const NEON_ORANGE = '#f80';
const BG_COLOR = '#0a0a12';

/* ===== GAME STATE ===== */
let gameState = 'start'; // 'start', 'playing', 'paused', 'gameover'
let score = 0;
let highScore = parseInt(localStorage.getItem('neonBlitzHighScore')) || 0;
let wave = 1;
let waveTimer = 0;
const WAVE_DURATION = 30000; // 30 seconds per wave
let lastTime = 0;
let animationId = null;

/* ===== ENTITIES ===== */
const player = {
  x: 0, y: 0, radius: 18, color: NEON_CYAN,
  speed: 300, health: 3, maxHealth: 3,
  fireRate: 150, lastFire: 0,
  angle: 0, // aim angle
  invuln: 0
};

const enemies = [];
const bullets = [];
const particles = [];
const pickups = [];

/* ===== INPUT ===== */
const keys = { 
  KeyW: false, KeyA: false, KeyS: false, KeyD: false,
  ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false,
  Escape: false, KeyP: false 
};
let moveTouchId = null;
let aimTouchId = null;
const moveTouchPos = { x: 0, y: 0, active: false, startX: 0, startY: 0 };
const aimTouchPos = { x: 0, y: 0, active: false };

/* ===== UI ELEMENTS ===== */
const startScreen = document.getElementById('startScreen');
const pauseScreen = document.getElementById('pauseScreen');
const gameOverScreen = document.getElementById('gameOverScreen');
const scoreEl = document.getElementById('score');
const highScoreEl = document.getElementById('highScore');
const waveEl = document.getElementById('wave');
const finalScoreEl = document.getElementById('finalScore');

/* ===== INIT ===== */
function resize() {
  CANVAS.width = window.innerWidth;
  CANVAS.height = window.innerHeight;
  player.x = CANVAS.width / 2;
  player.y = CANVAS.height / 2;
}
window.addEventListener('resize', resize);
resize();

/* ===== EVENT LISTENERS ===== */
// Keyboard
window.addEventListener('keydown', e => {
  if (e.code in keys) keys[e.code] = true;
  if (e.code === 'Escape' || e.code === 'KeyP') togglePause();
});
window.addEventListener('keyup', e => { if (e.code in keys) keys[e.code] = false; });

// Mouse aim
CANVAS.addEventListener('mousemove', e => {
  if (gameState !== 'playing') return;
  const rect = CANVAS.getBoundingClientRect();
  player.angle = Math.atan2(e.clientY - rect.top - player.y, e.clientX - rect.left - player.x);
});
// Mouse shoot
CANVAS.addEventListener('mousedown', e => {
  if (gameState === 'playing') player.lastFire = 0; // force immediate shot
});
CANVAS.addEventListener('mouseup', e => {});

// Touch controls
CANVAS.addEventListener('touchstart', e => {
  e.preventDefault();
  if (gameState !== 'playing') return;
  for (const touch of e.changedTouches) {
    const x = touch.clientX;
    if (x < CANVAS.width / 2) {
      if (!moveTouchPos.active) {
        moveTouchPos.active = true;
        moveTouchId = touch.identifier;
        moveTouchPos.startX = CANVAS.width / 4;
        moveTouchPos.startY = CANVAS.height / 2;
        moveTouchPos.x = touch.clientX;
        moveTouchPos.y = touch.clientY;
      }
    } else {
      if (!aimTouchPos.active) {
        aimTouchPos.active = true;
        aimTouchId = touch.identifier;
        aimTouchPos.x = touch.clientX;
        aimTouchPos.y = touch.clientY;
      }
    }
  }
}, { passive: false });

CANVAS.addEventListener('touchmove', e => {
  e.preventDefault();
  if (gameState !== 'playing') return;
  for (const touch of e.changedTouches) {
    if (moveTouchPos.active && touch.identifier === moveTouchId) {
      moveTouchPos.x = touch.clientX;
      moveTouchPos.y = touch.clientY;
    } else if (aimTouchPos.active && touch.identifier === aimTouchId) {
      aimTouchPos.x = touch.clientX;
      aimTouchPos.y = touch.clientY;
      const centerX = CANVAS.width * 3 / 4;
      const centerY = CANVAS.height / 2;
      player.angle = Math.atan2(touch.clientY - centerY, touch.clientX - centerX);
      player.lastFire = 0; // auto-fire while aiming
    }
  }
}, { passive: false });

CANVAS.addEventListener('touchend', e => {
  e.preventDefault();
  for (const touch of e.changedTouches) {
    if (moveTouchPos.active && touch.identifier === moveTouchId) {
      moveTouchPos.active = false;
      moveTouchId = null;
    }
    if (aimTouchPos.active && touch.identifier === aimTouchId) {
      aimTouchPos.active = false;
      aimTouchId = null;
    }
  }
}, { passive: false });

// Buttons
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('resumeBtn').addEventListener('click', resumeGame);
document.getElementById('quitBtn').addEventListener('click', quitToMenu);
document.getElementById('retryBtn').addEventListener('click', startGame);
document.getElementById('menuBtn').addEventListener('click', showStartScreen);

/* ===== GAME FUNCTIONS ===== */
function startGame() {
  gameState = 'playing';
  score = 0;
  wave = 1;
  waveTimer = 0;
  player.x = CANVAS.width / 2;
  player.y = CANVAS.height / 2;
  player.health = player.maxHealth;
  player.invuln = 0;
  player.lastFire = 0;
  enemies.length = 0;
  bullets.length = 0;
  particles.length = 0;
  pickups.length = 0;
  updateUI();
  hideAllScreens();
  lastTime = performance.now();
  if (animationId) cancelAnimationFrame(animationId);
  animationId = requestAnimationFrame(gameLoop);
}

function pauseGame() {
  if (gameState !== 'playing') return;
  gameState = 'paused';
  pauseScreen.classList.remove('hidden');
  cancelAnimationFrame(animationId);
}

function resumeGame() {
  if (gameState !== 'paused') return;
  gameState = 'playing';
  pauseScreen.classList.add('hidden');
  lastTime = performance.now();
  animationId = requestAnimationFrame(gameLoop);
}

function togglePause() {
  if (gameState === 'playing') pauseGame();
  else if (gameState === 'paused') resumeGame();
}

function quitToMenu() {
  gameState = 'start';
  pauseScreen.classList.add('hidden');
  showStartScreen();
}

function showStartScreen() {
  gameState = 'start';
  gameOverScreen.classList.add('hidden');
  startScreen.classList.remove('hidden');
  updateUI();
}

function gameOver() {
  gameState = 'gameover';
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('neonBlitzHighScore', highScore);
  }
  finalScoreEl.textContent = score;
  updateUI();
  gameOverScreen.classList.remove('hidden');
  cancelAnimationFrame(animationId);
}

function hideAllScreens() {
  startScreen.classList.add('hidden');
  pauseScreen.classList.add('hidden');
  gameOverScreen.classList.add('hidden');
}

function updateUI() {
  scoreEl.textContent = score;
  highScoreEl.textContent = highScore;
  waveEl.textContent = wave;
}

/* ===== GAME LOOP ===== */
function gameLoop(time) {
  const dt = Math.min((time - lastTime) / 1000, 0.05); // cap dt
  lastTime = time;

  update(dt);
  render();

  if (gameState === 'playing') {
    animationId = requestAnimationFrame(gameLoop);
  }
}

/* ===== UPDATE ===== */
function update(dt) {
  // Player invulnerability
  if (player.invuln > 0) player.invuln -= dt;

  // Wave timer
  waveTimer += dt * 1000;
  if (waveTimer >= WAVE_DURATION) {
    wave++;
    waveTimer = 0;
    // Increase difficulty
    spawnEnemy(true); // spawn a bonus enemy
  }

  // Player movement
  let dx = 0, dy = 0;
  if (keys.KeyW || keys.ArrowUp) dy -= 1;
  if (keys.KeyS || keys.ArrowDown) dy += 1;
  if (keys.KeyA || keys.ArrowLeft) dx -= 1;
  if (keys.KeyD || keys.ArrowRight) dx += 1;

  // Touch movement
  if (moveTouchPos.active) {
    const dxTouch = moveTouchPos.x - moveTouchPos.startX;
    const dyTouch = moveTouchPos.y - moveTouchPos.startY;
    const dist = Math.hypot(dxTouch, dyTouch);
    if (dist > 10) {
      dx += dxTouch / dist;
      dy += dyTouch / dist;
    }
  }

  if (dx !== 0 || dy !== 0) {
    const len = Math.hypot(dx, dy);
    player.x += (dx / len) * player.speed * dt;
    player.y += (dy / len) * player.speed * dt;
  }

  // Clamp player to screen
  player.x = Math.max(player.radius, Math.min(CANVAS.width - player.radius, player.x));
  player.y = Math.max(player.radius, Math.min(CANVAS.height - player.radius, player.y));

  // Player shooting
  player.lastFire += dt * 1000;
  if (player.lastFire >= player.fireRate) {
    shootBullet(player.x, player.y, player.angle, NEON_CYAN, 600, 8, true);
    player.lastFire = 0;
  }

  // Spawn enemies periodically
  if (Math.random() < 0.02 * wave) spawnEnemy();

  // Update bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += Math.cos(b.angle) * b.speed * dt;
    b.y += Math.sin(b.angle) * b.speed * dt;
    b.life -= dt;
    if (b.life <= 0 || b.x < -50 || b.x > CANVAS.width + 50 || b.y < -50 || b.y > CANVAS.height + 50) {
      bullets.splice(i, 1);
    }
  }

  // Update enemies
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    // Move toward player
    const angle = Math.atan2(player.y - e.y, player.x - e.x);
    e.x += Math.cos(angle) * e.speed * dt;
    e.y += Math.sin(angle) * e.speed * dt;

    // Collision with player
    const dist = Math.hypot(player.x - e.x, player.y - e.y);
    if (dist < player.radius + e.radius && player.invuln <= 0) {
      player.health--;
      player.invuln = 1.5;
      createParticles(e.x, e.y, e.color, 15);
      if (player.health <= 0) {
        gameOver();
        return;
      }
    }

    // Collision with bullets
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if (!b.isPlayer) continue;
      const bDist = Math.hypot(b.x - e.x, b.y - e.y);
      if (bDist < e.radius + b.radius) {
        e.health -= b.damage;
        createParticles(b.x, b.y, NEON_YELLOW, 5);
        bullets.splice(j, 1);
        if (e.health <= 0) {
          score += e.scoreValue;
          createParticles(e.x, e.y, e.color, 20);
          // Chance to drop pickup
          if (Math.random() < 0.1) spawnPickup(e.x, e.y);
          enemies.splice(i, 1);
        }
        break;
      }
    }
  }

  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    p.alpha = p.life / p.maxLife;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Update pickups
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    p.life -= dt;
    p.bobOffset += dt * 5;
    p.y += Math.sin(p.bobOffset) * 0.5;
    const dist = Math.hypot(player.x - p.x, player.y - p.y);
    if (dist < player.radius + p.radius) {
      applyPickup(p.type);
      createParticles(p.x, p.y, NEON_GREEN, 10);
      pickups.splice(i, 1);
    } else if (p.life <= 0) {
      pickups.splice(i, 1);
    }
  }

  updateUI();
}

/* ===== ENTITY CREATION ===== */
function shootBullet(x, y, angle, color, speed, radius, isPlayer, damage = 1) {
  bullets.push({
    x, y, angle, color, speed, radius,
    isPlayer, damage,
    life: 2 // seconds
  });
}

function spawnEnemy(isBonus = false) {
  const side = Math.floor(Math.random() * 4);
  let x, y;
  const margin = 50;
  switch (side) {
    case 0: x = Math.random() * CANVAS.width; y = -margin; break;
    case 1: x = CANVAS.width + margin; y = Math.random() * CANVAS.height; break;
    case 2: x = Math.random() * CANVAS.width; y = CANVAS.height + margin; break;
    case 3: x = -margin; y = Math.random() * CANVAS.height; break;
  }

  const types = [
    { color: NEON_PINK, radius: 15, speed: 80, health: 1, scoreValue: 10 },
    { color: NEON_ORANGE, radius: 20, speed: 60, health: 2, scoreValue: 25 },
    { color: NEON_GREEN, radius: 12, speed: 120, health: 1, scoreValue: 15 }
  ];
  const t = isBonus ? types[1] : types[Math.floor(Math.random() * types.length)];
  enemies.push({
    x, y,
    radius: t.radius,
    color: t.color,
    speed: t.speed + wave * 5,
    health: t.health + Math.floor(wave / 3),
    maxHealth: t.health + Math.floor(wave / 3),
    scoreValue: t.scoreValue * wave
  });
}

function spawnPickup(x, y) {
  const types = ['health', 'fireRate', 'score'];
  const type = types[Math.floor(Math.random() * types.length)];
  pickups.push({
    x, y, radius: 12, type,
    life: 10, // seconds
    bobOffset: 0
  });
}

function applyPickup(type) {
  switch (type) {
    case 'health':
      player.health = Math.min(player.maxHealth, player.health + 1);
      break;
    case 'fireRate':
      player.fireRate = Math.max(50, player.fireRate - 20);
      break;
    case 'score':
      score += 50 * wave;
      break;
  }
}

function createParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * PI2;
    const speed = 50 + Math.random() * 150;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      radius: 2 + Math.random() * 3,
      color,
      life: 0.3 + Math.random() * 0.5,
      maxLife: 0.3 + Math.random() * 0.5,
      alpha: 1
    });
  }
}

/* ===== RENDER ===== */
function render() {
  // Clear
  CTX.fillStyle = BG_COLOR;
  CTX.fillRect(0, 0, CANVAS.width, CANVAS.height);

  // Grid background
  drawGrid();

  // Particles
  for (const p of particles) {
    CTX.globalAlpha = p.alpha;
    CTX.fillStyle = p.color;
    CTX.beginPath();
    CTX.arc(p.x, p.y, p.radius, 0, PI2);
    CTX.fill();
  }
  CTX.globalAlpha = 1;

  // Pickups
  for (const p of pickups) {
    CTX.fillStyle = p.type === 'health' ? NEON_GREEN : p.type === 'fireRate' ? NEON_YELLOW : NEON_PINK;
    CTX.shadowColor = CTX.fillStyle;
    CTX.shadowBlur = 15;
    CTX.beginPath();
    CTX.arc(p.x, p.y, p.radius, 0, PI2);
    CTX.fill();
    CTX.shadowBlur = 0;
  }

  // Bullets
  for (const b of bullets) {
    CTX.fillStyle = b.color;
    CTX.shadowColor = b.color;
    CTX.shadowBlur = 10;
    CTX.beginPath();
    CTX.arc(b.x, b.y, b.radius, 0, PI2);
    CTX.fill();
    CTX.shadowBlur = 0;
  }

  // Enemies
  for (const e of enemies) {
    CTX.fillStyle = e.color;
    CTX.shadowColor = e.color;
    CTX.shadowBlur = 15;
    CTX.beginPath();
    CTX.arc(e.x, e.y, e.radius, 0, PI2);
    CTX.fill();
    // Health bar
    if (e.health < e.maxHealth) {
      CTX.fillStyle = '#333';
      CTX.fillRect(e.x - e.radius, e.y - e.radius - 6, e.radius * 2, 4);
      CTX.fillStyle = NEON_GREEN;
      CTX.fillRect(e.x - e.radius, e.y - e.radius - 6, (e.radius * 2) * (e.health / e.maxHealth), 4);
    }
    CTX.shadowBlur = 0;
  }

  // Player
  CTX.save();
  CTX.translate(player.x, player.y);
  // Invulnerability flash
  if (player.invuln > 0 && Math.floor(player.invuln * 10) % 2 === 0) {
    CTX.globalAlpha = 0.5;
  }
  // Ship body
  CTX.fillStyle = player.color;
  CTX.shadowColor = player.color;
  CTX.shadowBlur = 20;
  CTX.beginPath();
  CTX.moveTo(0, -player.radius);
  CTX.lineTo(player.radius * 0.7, player.radius * 0.7);
  CTX.lineTo(0, player.radius * 0.3);
  CTX.lineTo(-player.radius * 0.7, player.radius * 0.7);
  CTX.closePath();
  CTX.fill();
  // Cockpit
  CTX.fillStyle = '#fff';
  CTX.beginPath();
  CTX.arc(0, -player.radius * 0.2, player.radius * 0.3, 0, PI2);
  CTX.fill();
  CTX.shadowBlur = 0;
  CTX.restore();

  // Aim indicator (mouse/touch)
  if (gameState === 'playing') {
    CTX.strokeStyle = NEON_CYAN;
    CTX.lineWidth = 2;
    CTX.setLineDash([10, 10]);
    CTX.beginPath();
    CTX.moveTo(player.x, player.y);
    CTX.lineTo(
      player.x + Math.cos(player.angle) * 100,
      player.y + Math.sin(player.angle) * 100
    );
    CTX.stroke();
    CTX.setLineDash([]);
  }

  // Health UI
  drawHealth();
}

function drawGrid() {
  CTX.strokeStyle = 'rgba(0, 255, 255, 0.05)';
  CTX.lineWidth = 1;
  const gridSize = 50;
  for (let x = 0; x <= CANVAS.width; x += gridSize) {
    CTX.beginPath();
    CTX.moveTo(x, 0);
    CTX.lineTo(x, CANVAS.height);
    CTX.stroke();
  }
  for (let y = 0; y <= CANVAS.height; y += gridSize) {
    CTX.beginPath();
    CTX.moveTo(0, y);
    CTX.lineTo(CANVAS.width, y);
    CTX.stroke();
  }
}

function drawHealth() {
  const heartRadius = 12;
  const spacing = 30;
  const startX = 20;
  const startY = CANVAS.height - 40;
  for (let i = 0; i < player.maxHealth; i++) {
    const x = startX + i * spacing;
    CTX.fillStyle = i < player.health ? NEON_PINK : '#333';
    CTX.shadowColor = i < player.health ? NEON_PINK : 'transparent';
    CTX.shadowBlur = i < player.health ? 10 : 0;
    CTX.beginPath();
    CTX.moveTo(x, startY);
    CTX.bezierCurveTo(x, startY - heartRadius, x - heartRadius, startY - heartRadius, x - heartRadius, startY);
    CTX.bezierCurveTo(x - heartRadius, startY + heartRadius, x, startY + heartRadius * 1.5, x, startY + heartRadius * 2);
    CTX.bezierCurveTo(x, startY + heartRadius * 1.5, x + heartRadius, startY + heartRadius, x + heartRadius, startY);
    CTX.bezierCurveTo(x + heartRadius, startY - heartRadius, x, startY - heartRadius, x, startY);
    CTX.fill();
  }
  CTX.shadowBlur = 0;
}

/* ===== START ===== */
updateUI();
showStartScreen();
</script>
</body>
</html>
