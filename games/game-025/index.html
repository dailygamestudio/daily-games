<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Cipher - Day 25</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Orbitron', 'Segoe UI', sans-serif; }
body { background:#0a0a12; color:#00ffff; overflow:hidden; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; }
canvas { display:block; background:#05050f; border:2px solid #00ffff44; box-shadow:0 0 30px #00ffff44, inset 0 0 30px #00ffff11; border-radius:8px; }
#ui { position:absolute; top:10px; left:10px; right:10px; display:flex; justify-content:space-between; pointer-events:none; z-index:10; }
.panel { background:rgba(0,20,30,0.9); border:1px solid #00ffff66; padding:8px 16px; border-radius:6px; box-shadow:0 0 15px #00ffff22; pointer-events:auto; font-size:14px; text-shadow:0 0 5px #00ffff; }
#msg { position:absolute; bottom:20px; left:50%; transform:translateX(-50%); text-align:center; font-size:18px; text-shadow:0 0 10px #ff00ff; pointer-events:none; min-height:24px; }
button { background:linear-gradient(135deg,#003344,#006688); border:1px solid #00ffff; color:#00ffff; padding:12px 28px; border-radius:4px; cursor:pointer; font-size:16px; text-transform:uppercase; letter-spacing:2px; transition:all 0.2s; box-shadow:0 0 10px #00ffff44; }
button:hover, button:focus { background:linear-gradient(135deg,#005577,#0088bb); box-shadow:0 0 20px #00ffff, inset 0 0 10px #00ffff44; transform:scale(1.02); }
button:active { transform:scale(0.98); }
#startBtn, #restartBtn { position:absolute; bottom:80px; left:50%; transform:translateX(-50%); z-index:20; }
.hidden { display:none !important; }
#keyboard { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); display:flex; flex-wrap:wrap; justify-content:center; gap:4px; max-width:90%; pointer-events:auto; z-index:15; }
.key { width:36px; height:36px; background:rgba(0,20,30,0.9); border:1px solid #00ffff66; border-radius:4px; color:#00ffff; display:flex; align-items:center; justify-content:center; font-size:14px; user-select:none; touch-action:manipulation; box-shadow:0 0 5px #00ffff22; }
.key.active { background:#00ffff33; border-color:#00ffff; box-shadow:0 0 10px #00ffff; }
.key.wrong { background:#ff004433; border-color:#ff0044; color:#ff0044; box-shadow:0 0 10px #ff0044; }
@media (max-width:600px) { canvas { border-width:1px; } .panel { font-size:12px; padding:6px 10px; } .key { width:30px; height:30px; font-size:12px; } }
</style>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
<div id="ui">
<div class="panel">LEVEL: <span id="levelEl">1</span></div>
<div class="panel">SCORE: <span id="scoreEl">0</span></div>
<div class="panel">BEST: <span id="bestEl">0</span></div>
</div>
<canvas id="c"></canvas>
<div id="msg"></div>
<button id="startBtn">Initialize Cipher</button>
<button id="restartBtn" class="hidden">Recompile</button>
<div id="keyboard"></div>
<script>
/**
 * Neon Cipher - Day 25
 * Cyberpunk substitution cipher puzzle game
 * Decrypt neon symbols to reveal hidden messages
 */
const C = document.getElementById('c');
const CTX = C.getContext('2d');
const MSG = document.getElementById('msg');
const LEVEL_EL = document.getElementById('levelEl');
const SCORE_EL = document.getElementById('scoreEl');
const BEST_EL = document.getElementById('bestEl');
const START_BTN = document.getElementById('startBtn');
const RESTART_BTN = document.getElementById('restartBtn');
const KB_DIV = document.getElementById('keyboard');

// Game constants
const PHRASES = [
"NEON DREAMS NEVER DIE",
"SYNTHWAVE HEARTBEAT",
"CHROME SHADOWS WHISPER",
"DATA FLOWS LIKE BLOOD",
"HACK THE PLANET",
"GHOST IN THE MACHINE",
"REALITY IS A SIMULATION",
"NEURAL LINK ESTABLISHED",
"CYBERPUNK IS NOW",
"ZERO DAY EXPLOIT",
"ICE BREAKER ACTIVE",
"TECHNO SHAMAN RISING",
"VIRTUAL REALITY OVERRIDE",
"SYNTHETIC SOUL AWAKENS",
"DIGITAL GHOST PROTOCOL",
"NEON VEINS PULSATE",
"QUANTUM ENTANGLEMENT",
"ROGUE AI ASCENDANT",
"PIXEL PERFECT CHAOS",
"FUTURE IS WRITTEN IN CODE"
];
const SYMBOL_COUNT = 26;
const COLORS = ['#00ffff','#ff00ff','#ffff00','#00ff88','#ff8800','#8800ff','#ff0088','#00ffcc'];
const BG_COLOR = '#05050f';
const GLOW_COLOR = '#00ffff';

// Game state
let state = 'start'; // start, playing, levelComplete, gameOver
let level = 1;
let score = 0;
let best = parseInt(localStorage.getItem('neonCipherBest')||'0');
let phrase = '';
let cipherMap = {}; // symbolIndex -> letter
let reverseMap = {}; // letter -> symbolIndex
let revealed = {}; // symbolIndex -> letter (pre-revealed)
let selectedSymbol = null; // currently selected symbol index
let symbols = []; // array of symbol drawing functions
let cipherText = []; // array of symbol indices for current phrase
let startTime = 0;
let wrongChecks = 0;
let particles = [];
let shake = 0;

// Canvas sizing
function resize() {
const maxW = Math.min(window.innerWidth - 20, 900);
const maxH = window.innerHeight - 120;
C.width = maxW;
C.height = maxH;
}
window.addEventListener('resize', resize);
resize();
BEST_EL.textContent = best;

// Generate neon symbols (procedural)
function generateSymbols() {
symbols = [];
for (let i=0;i<SYMBOL_COUNT;i++) {
const type = i % 6;
const color = COLORS[i % COLORS.length];
const size = 28 + (i%3)*4;
symbols.push(createSymbolDrawer(type, color, size));
}
}
function createSymbolDrawer(type, color, size) {
return function(ctx, x, y, highlighted, solved) {
ctx.save();
ctx.translate(x, y);
if (highlighted) {
ctx.shadowColor = color;
ctx.shadowBlur = 20;
}
if (solved) {
ctx.shadowColor = '#00ff88';
ctx.shadowBlur = 15;
}
ctx.strokeStyle = color;
ctx.lineWidth = 2;
ctx.lineCap = 'round';
ctx.lineJoin = 'round';
const s = size;
switch(type) {
case 0: // Triangle
ctx.beginPath();
ctx.moveTo(0, -s);
ctx.lineTo(s*0.866, s*0.5);
ctx.lineTo(-s*0.866, s*0.5);
ctx.closePath();
ctx.stroke();
break;
case 1: // Square
ctx.beginPath();
ctx.rect(-s*0.7, -s*0.7, s*1.4, s*1.4);
ctx.stroke();
break;
case 2: // Circle
ctx.beginPath();
ctx.arc(0, 0, s*0.7, 0, Math.PI*2);
ctx.stroke();
break;
case 3: // Diamond
ctx.beginPath();
ctx.moveTo(0, -s);
ctx.lineTo(s, 0);
ctx.lineTo(0, s);
ctx.lineTo(-s, 0);
ctx.closePath();
ctx.stroke();
break;
case 4: // Hexagon
ctx.beginPath();
for(let j=0;j<6;j++) {
const a = j*Math.PI/3 - Math.PI/2;
ctx.lineTo(Math.cos(a)*s, Math.sin(a)*s);
}
ctx.closePath();
ctx.stroke();
break;
case 5: // Star
ctx.beginPath();
for(let j=0;j<5;j++) {
const a = j*Math.PI*2/5 - Math.PI/2;
ctx.lineTo(Math.cos(a)*s, Math.sin(a)*s);
const a2 = (j+0.5)*Math.PI*2/5 - Math.PI/2;
ctx.lineTo(Math.cos(a2)*s*0.4, Math.sin(a2)*s*0.4);
}
ctx.closePath();
ctx.stroke();
break;
}
ctx.restore();
};
}

// Shuffle array
function shuffle(arr) {
for(let i=arr.length-1;i>0;i--) {
const j = Math.floor(Math.random()*(i+1));
[arr[i], arr[j]] = [arr[j], arr[i]];
}
return arr;
}

// Start new level
function newLevel() {
generateSymbols();
phrase = PHRASES[(level-1) % PHRASES.length].toUpperCase();
// Create random substitution
const indices = shuffle([...Array(26).keys()]);
cipherMap = {};
reverseMap = {};
revealed = {};
cipherText = [];
for (let ch of phrase) {
if (ch === ' ') {
cipherText.push(-1); // space marker
continue;
}
const idx = ch.charCodeAt(0) - 65;
const sym = indices[idx];
cipherText.push(sym);
cipherMap[sym] = ch;
reverseMap[ch] = sym;
}
// Reveal 2-3 random letters
const uniqueSyms = [...new Set(cipherText.filter(s=>s>=0))];
const revealCount = Math.min(3, Math.max(2, uniqueSyms.length - 5));
shuffle(uniqueSyms).slice(0, revealCount).forEach(s => revealed[s] = cipherMap[s]);
selectedSymbol = null;
startTime = Date.now();
wrongChecks = 0;
state = 'playing';
MSG.textContent = '';
buildKeyboard();
}

// Build on-screen keyboard
function buildKeyboard() {
KB_DIV.innerHTML = '';
const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
letters.forEach(L => {
const btn = document.createElement('div');
btn.className = 'key';
btn.textContent = L;
btn.dataset.letter = L;
if (Object.values(revealed).includes(L) || Object.values(cipherMap).includes(L)) {
btn.classList.add('active');
}
btn.addEventListener('click', () => onKeyPress(L));
btn.addEventListener('touchstart', e => { e.preventDefault(); onKeyPress(L); }, {passive:false});
KB_DIV.appendChild(btn);
});
}

// Handle key press (physical or virtual)
function onKeyPress(letter) {
if (state !== 'playing' || selectedSymbol === null) return;
if (revealed[selectedSymbol]) return; // can't change revealed
cipherMap[selectedSymbol] = letter;
reverseMap[letter] = selectedSymbol;
selectedSymbol = null;
buildKeyboard();
render();
}

// Check solution
function checkSolution() {
let decoded = '';
for (let sym of cipherText) {
if (sym === -1) decoded += ' ';
else decoded += cipherMap[sym] || '?';
}
if (decoded === phrase) {
levelComplete();
} else {
wrongChecks++;
shake = 15;
MSG.textContent = 'DECRYPTION FAILED - SIGNAL CORRUPTED';
MSG.style.color = '#ff0044';
setTimeout(() => { MSG.textContent = ''; }, 2000);
}
}

// Level complete
function levelComplete() {
const timeTaken = (Date.now() - startTime) / 1000;
const levelScore = Math.max(100, Math.floor(level * 1000 - timeTaken * 10 - wrongChecks * 100));
score += levelScore;
SCORE_EL.textContent = score;
if (score > best) { best = score; localStorage.setItem('neonCipherBest', best); BEST_EL.textContent = best; }
MSG.textContent = `ACCESS GRANTED +${levelScore} CR`;
MSG.style.color = '#00ff88';
state = 'levelComplete';
setTimeout(() => {
level++;
LEVEL_EL.textContent = level;
newLevel();
}, 2000);
}

// Game loop
let lastTime = 0;
function gameLoop(time) {
const dt = (time - lastTime) / 1000;
lastTime = time;
update(dt);
render();
requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);

function update(dt) {
if (shake > 0) shake -= dt * 30;
particles = particles.filter(p => {
p.life -= dt;
p.x += p.vx * dt;
p.y += p.vy * dt;
p.vy += 50 * dt;
return p.life > 0;
});
}

function render() {
const w = C.width, h = C.height;
CTX.fillStyle = BG_COLOR;
CTX.fillRect(0,0,w,h);

// Grid background
CTX.strokeStyle = '#00ffff11';
CTX.lineWidth = 1;
for(let x=0;x<w;x+=40) { CTX.beginPath(); CTX.moveTo(x,0); CTX.lineTo(x,h); CTX.stroke(); }
for(let y=0;y<h;y+=40) { CTX.beginPath(); CTX.moveTo(0,y); CTX.lineTo(w,y); CTX.stroke(); }

// Particles
particles.forEach(p => {
CTX.globalAlpha = p.life / p.maxLife;
CTX.fillStyle = p.color;
CTX.beginPath();
CTX.arc(p.x, p.y, p.size, 0, Math.PI*2);
CTX.fill();
});
CTX.globalAlpha = 1;

// Shake offset
const sx = shake > 0 ? (Math.random()-0.5)*shake : 0;
const sy = shake > 0 ? (Math.random()-0.5)*shake : 0;
CTX.save();
CTX.translate(sx, sy);

// Draw cipher text
const startX = 60;
const startY = 100;
const symbolSize = 36;
const gapX = 48;
const gapY = 70;
let x = startX, y = startY;
const maxWidth = w - 120;

cipherText.forEach((sym, i) => {
if (sym === -1) { // space
x += gapX * 0.5;
return;
}
const isSelected = (selectedSymbol === sym);
const isRevealed = !!revealed[sym];
const isSolved = !!cipherMap[sym] && (cipherMap[sym] === phrase[i] || revealed[sym]);
const drawer = symbols[sym];
drawer(CTX, x, y, isSelected, isSolved);

// Draw assigned letter below
if (cipherMap[sym] || revealed[sym]) {
const letter = revealed[sym] || cipherMap[sym];
CTX.fillStyle = revealed[sym] ? '#00ff88' : '#00ffff';
CTX.font = 'bold 18px Orbitron';
CTX.textAlign = 'center';
CTX.shadowColor = revealed[sym] ? '#00ff88' : '#00ffff';
CTX.shadowBlur = 10;
CTX.fillText(letter, x, y + symbolSize + 22);
CTX.shadowBlur = 0;
}

// Draw original letter (for debugging? no)
// Draw underline for unsolved
if (!cipherMap[sym] && !revealed[sym]) {
CTX.strokeStyle = '#00ffff44';
CTX.lineWidth = 1;
CTX.beginPath();
CTX.moveTo(x - 18, y + symbolSize + 30);
CTX.lineTo(x + 18, y + symbolSize + 30);
CTX.stroke();
}

x += gapX;
if (x > maxWidth) { x = startX; y += gapY; }
});

CTX.restore();

// Draw selection hint
if (selectedSymbol !== null && state === 'playing') {
CTX.fillStyle = '#00ffff';
CTX.font = '14px Orbitron';
CTX.textAlign = 'center';
CTX.fillText('SELECT LETTER FOR SYMBOL', w/2, h - 80);
}

// Draw timer
if (state === 'playing') {
const elapsed = ((Date.now() - startTime)/1000).toFixed(1);
CTX.fillStyle = '#00ffff88';
CTX.font = '16px Orbitron';
CTX.textAlign = 'right';
CTX.fillText(`TIME: ${elapsed}s`, w - 20, 40);
}
}

// Input handling
C.addEventListener('click', onCanvasClick);
C.addEventListener('touchstart', e => {
if (e.target === C) {
e.preventDefault();
const touch = e.touches[0];
onCanvasClick({clientX: touch.clientX, clientY: touch.clientY});
}
}, {passive:false});

function onCanvasClick(e) {
if (state !== 'playing') return;
const rect = C.getBoundingClientRect();
const x = e.clientX - rect.left;
const y = e.clientY - rect.top;

const startX = 60;
const startY = 100;
const gapX = 48;
const gapY = 70;
const maxWidth = C.width - 120;
let cx = startX, cy = startY;

for (let sym of cipherText) {
if (sym === -1) { cx += gapX * 0.5; continue; }
const dx = x - cx;
const dy = y - cy;
if (Math.abs(dx) < 30 && Math.abs(dy) < 50) {
selectedSymbol = sym;
render();
return;
}
cx += gapX;
if (cx > maxWidth) { cx = startX; cy += gapY; }
}
selectedSymbol = null;
render();
}

// Keyboard input
window.addEventListener('keydown', e => {
if (state !== 'playing') return;
const key = e.key.toUpperCase();
if (key.length === 1 && key >= 'A' && key <= 'Z') {
onKeyPress(key);
} else if (key === 'ENTER') {
checkSolution();
} else if (key === 'BACKSPACE' || key === 'DELETE') {
if (selectedSymbol !== null && !revealed[selectedSymbol]) {
const oldLetter = cipherMap[selectedSymbol];
delete cipherMap[selectedSymbol];
if (reverseMap[oldLetter] === selectedSymbol) delete reverseMap[oldLetter];
selectedSymbol = null;
buildKeyboard();
render();
}
}
});

// Button handlers
START_BTN.addEventListener('click', () => {
START_BTN.classList.add('hidden');
level = 1;
score = 0;
SCORE_EL.textContent = '0';
LEVEL_EL.textContent = '1';
newLevel();
});

RESTART_BTN.addEventListener('click', () => {
RESTART_BTN.classList.add('hidden');
START_BTN.classList.remove('hidden');
state = 'start';
MSG.textContent = '';
score = 0;
SCORE_EL.textContent = '0';
level = 1;
LEVEL_EL.textContent = '1';
});

// Spawn particles on level complete
function spawnParticles() {
for(let i=0;i<30;i++) {
particles.push({
x: C.width/2 + (Math.random()-0.5)*200,
y: C.height/2 + (Math.random()-0.5)*100,
vx: (Math.random()-0.5)*200,
vy: -Math.random()*200 - 50,
size: Math.random()*4 + 2,
color: COLORS[Math.floor(Math.random()*COLORS.length)],
life: 2 + Math.random()*2,
maxLife: 3
});
}
}

// Override levelComplete to spawn particles
const originalLevelComplete = levelComplete;
levelComplete = function() {
originalLevelComplete();
spawnParticles();
};

// Initial render
render();
</script>
</body>
</html>
