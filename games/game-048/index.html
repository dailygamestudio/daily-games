<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Bloom - Day 48</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0f; font-family: 'Courier New', monospace; color: #0ff; overflow: hidden; touch-action: none; }
    canvas { display: block; margin: 0 auto; background: #050508; box-shadow: 0 0 30px rgba(0,255,255,0.1); }
    .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5,5,8,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
    .overlay.hidden { display: none; }
    .overlay h1 { font-size: 48px; text-shadow: 0 0 20px #f0f, 0 0 40px #f0f; margin-bottom: 10px; letter-spacing: 4px; }
    .overlay p { color: #888; margin-bottom: 30px; font-size: 16px; }
    .btn { padding: 14px 40px; font-size: 18px; font-family: inherit; background: #111; border: 2px solid #f0f; color: #f0f; border-radius: 4px; cursor: pointer; margin: 8px; transition: all 0.2s; text-transform: uppercase; letter-spacing: 2px; }
    .btn:hover { background: #f0f; color: #000; box-shadow: 0 0 20px #f0f; }
    .btn:active { transform: scale(0.98); }
    .btn.secondary { border-color: #0ff; color: #0ff; }
    .btn.secondary:hover { background: #0ff; color: #000; box-shadow: 0 0 20px #0ff; }
    .stats { position: fixed; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; z-index: 5; pointer-events: none; }
    .stat { background: rgba(5,5,8,0.8); padding: 8px 16px; border-radius: 4px; border: 1px solid #333; font-size: 14px; }
    .stat span { color: #f0f; font-weight: bold; }
    @media (max-width: 600px) { .overlay h1 { font-size: 32px; } .btn { padding: 12px 30px; font-size: 16px; } .stats { top: 10px; left: 10px; right: 10px; } .stat { padding: 6px 12px; font-size: 12px; } }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div class="stats">
    <div class="stat">LEVEL: <span id="levelDisplay">1</span></div>
    <div class="stat">TIME: <span id="timeDisplay">60</span>s</div>
    <div class="stat">MOVES: <span id="movesDisplay">0</span></div>
    <div class="stat">SCORE: <span id="scoreDisplay">0</span></div>
    <div class="stat">BEST: <span id="bestDisplay">0</span></div>
  </div>

  <div id="startScreen" class="overlay">
    <h1>NEON BLOOM</h1>
    <p>Rotate mirrors to guide laser beams to flowers</p>
    <button class="btn" onclick="startGame()">START GAME</button>
    <p style="margin-top:20px; font-size:12px; color:#666;">Arrow keys to move cursor, SPACE to rotate mirror<br>Tap mirror to rotate • ESC/P to pause</p>
  </div>

  <div id="pauseOverlay" class="overlay hidden">
    <h1>PAUSED</h1>
    <button class="btn" onclick="resumeGame()">RESUME</button>
    <button class="btn secondary" onclick="quitToMenu()">QUIT TO MENU</button>
  </div>

  <div id="gameOverOverlay" class="overlay hidden">
    <h1>GAME OVER</h1>
    <p id="finalScoreText">Score: 0</p>
    <button class="btn" onclick="startGame()">RETRY</button>
    <button class="btn secondary" onclick="showStartScreen()">MAIN MENU</button>
  </div>

  <div id="levelCompleteOverlay" class="overlay hidden">
    <h1>LEVEL COMPLETE!</h1>
    <p id="levelScoreText">+500 bonus</p>
    <button class="btn" onclick="nextLevel()">NEXT LEVEL</button>
    <button class="btn secondary" onclick="quitToMenu()">MAIN MENU</button>
  </div>

  <script>
const GRID_SIZE = 10;
const CELL_SIZE = 50;
const CANVAS_W = 800;
const CANVAS_H = 600;
const GRID_W = GRID_SIZE * CELL_SIZE;
const GRID_H = GRID_SIZE * CELL_SIZE;
const OFFSET_X = (CANVAS_W - GRID_W) / 2;
const OFFSET_Y = (CANVAS_H - GRID_H) / 2;

const COLORS = {
  bg: '#050508',
  grid: '#1a1a2e',
  mirror: '#f0f',
  mirrorGlow: '#ff00ff',
  flower: '#0f0',
  flowerGlow: '#00ff00',
  flowerLit: '#ff0',
  flowerLitGlow: '#ffff00',
  laser: '#0ff',
  laserGlow: '#00ffff',
  beam: '#0ff',
  beamGlow: '#00ffff',
  cursor: '#ff0',
  text: '#0ff',
  ui: '#f0f'
};

const DIRS = [[0,-1],[1,0],[0,1],[-1,0]]; // 0=up,1=right,2=down,3=left

let canvas, ctx;
let running = false;
let gameState = 'menu'; // menu, playing, paused, gameover, levelcomplete
let currentLevel = 0;
let score = 0;
let bestScore = 0;
let timeLeft = 60;
let moves = 0;
let lastTime = 0;
let cursor = {x:0, y:0};
let showCursor = true;

let mirrors = [];
let flowers = [];
let lasers = [];

const levels = [
  // Level 1: Simple L-shape
  {
    mirrors: [{x:3,y:4,rot:0}, {x:3,y:1,rot:0}],
    flowers: [{x:9,y:1}],
    lasers: [{x:0,y:4,dir:1}],
    timeLimit: 60,
    parMoves: 1
  },
  // Level 2: Two lasers, two flowers
  {
    mirrors: [{x:2,y:2,rot:0}, {x:2,y:0,rot:0}, {x:2,y:7,rot:0}, {x:2,y:9,rot:0}],
    flowers: [{x:9,y:0}, {x:9,y:9}],
    lasers: [{x:0,y:2,dir:1}, {x:0,y:7,dir:1}],
    timeLimit: 70,
    parMoves: 2
  },
  // Level 3: Cross pattern
  {
    mirrors: [{x:4,y:4,rot:0}, {x:4,y:5,rot:0}, {x:5,y:4,rot:0}, {x:5,y:5,rot:0}],
    flowers: [{x:9,y:4}, {x:9,y:5}, {x:0,y:4}, {x:0,y:5}],
    lasers: [{x:2,y:0,dir:2}, {x:7,y:0,dir:2}, {x:2,y:9,dir:0}, {x:7,y:9,dir:0}],
    timeLimit: 80,
    parMoves: 4
  },
  // Level 4: Zigzag
  {
    mirrors: [
      {x:1,y:1,rot:0}, {x:1,y:3,rot:0}, {x:1,y:5,rot:0},
      {x:8,y:1,rot:0}, {x:8,y:3,rot:0}, {x:8,y:5,rot:0}
    ],
    flowers: [{x:9,y:1}, {x:9,y:3}, {x:9,y:5}],
    lasers: [{x:0,y:1,dir:1}, {x:0,y:3,dir:1}, {x:0,y:5,dir:1}],
    timeLimit: 90,
    parMoves: 6
  },
  // Level 5: Complex
  {
    mirrors: [
      {x:1,y:2,rot:0}, {x:3,y:2,rot:0}, {x:5,y:2,rot:0}, {x:7,y:2,rot:0},
      {x:1,y:7,rot:0}, {x:3,y:7,rot:0}, {x:5,y:7,rot:0}, {x:7,y:7,rot:0}
    ],
    flowers: [{x:9,y:2}, {x:9,y:7}, {x:0,y:2}, {x:0,y:7}],
    lasers: [{x:2,y:0,dir:2}, {x:7,y:0,dir:2}, {x:2,y:9,dir:0}, {x:7,y:9,dir:0}],
    timeLimit: 100,
    parMoves: 8
  }
];

let beams = [];

function init() {
  canvas = document.getElementById('gameCanvas');
  canvas.width = CANVAS_W;
  canvas.height = CANVAS_H;
  ctx = canvas.getContext('2d');
  bestScore = parseInt(localStorage.getItem('neonBloomBest') || '0');
  updateBestDisplay();
  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', onKeyUp);
  canvas.addEventListener('touchstart', onTouch, {passive: false});
  canvas.addEventListener('mousedown', onMouseDown);
  showStartScreen();
  requestAnimationFrame(gameLoop);
}

function showStartScreen() {
  gameState = 'menu';
  running = false;
  document.getElementById('startScreen').classList.remove('hidden');
  document.getElementById('pauseOverlay').classList.add('hidden');
  document.getElementById('gameOverOverlay').classList.add('hidden');
  document.getElementById('levelCompleteOverlay').classList.add('hidden');
}

function startGame() {
  currentLevel = 0;
  score = 0;
  moves = 0;
  loadLevel(currentLevel);
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('pauseOverlay').classList.add('hidden');
  document.getElementById('gameOverOverlay').classList.add('hidden');
  document.getElementById('levelCompleteOverlay').classList.add('hidden');
  gameState = 'playing';
  running = true;
  lastTime = performance.now();
}

function loadLevel(levelIdx) {
  const level = levels[levelIdx % levels.length];
  mirrors = level.mirrors.map(m => ({x:m.x, y:m.y, rot:m.rot}));
  flowers = level.flowers.map(f => ({x:f.x, y:f.y, lit:false}));
  lasers = level.lasers.map(l => ({x:l.x, y:l.y, dir:l.dir}));
  timeLeft = level.timeLimit;
  moves = 0;
  cursor = {x:0, y:0};
  calculateBeams();
  updateDisplays();
}

function nextLevel() {
  currentLevel++;
  score += 500 + timeLeft * 10;
  if (moves <= levels[(currentLevel-1)%levels.length].parMoves) score += 1000;
  loadLevel(currentLevel);
  document.getElementById('levelCompleteOverlay').classList.add('hidden');
  gameState = 'playing';
  running = true;
  lastTime = performance.now();
}

function pauseGame() {
  if (gameState !== 'playing') return;
  gameState = 'paused';
  running = false;
  document.getElementById('pauseOverlay').classList.remove('hidden');
}

function resumeGame() {
  if (gameState !== 'paused') return;
  gameState = 'playing';
  running = true;
  lastTime = performance.now();
  document.getElementById('pauseOverlay').classList.add('hidden');
}

function quitToMenu() {
  running = false;
  showStartScreen();
}

function gameOver() {
  gameState = 'gameover';
  running = false;
  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem('neonBloomBest', bestScore.toString());
    updateBestDisplay();
  }
  document.getElementById('finalScoreText').textContent = `Score: ${score}`;
  document.getElementById('gameOverOverlay').classList.remove('hidden');
}

function levelComplete() {
  gameState = 'levelcomplete';
  running = false;
  const bonus = 500 + timeLeft * 10;
  const parBonus = moves <= levels[currentLevel%levels.length].parMoves ? 1000 : 0;
  document.getElementById('levelScoreText').textContent = `+${bonus}${parBonus ? ' +1000 par bonus' : ''}`;
  document.getElementById('levelCompleteOverlay').classList.remove('hidden');
}

function onKeyDown(e) {
  if (gameState === 'playing') {
    if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
      e.preventDefault();
      pauseGame();
      return;
    }
    if (e.key === 'ArrowUp') { cursor.y = Math.max(0, cursor.y - 1); e.preventDefault(); }
    else if (e.key === 'ArrowDown') { cursor.y = Math.min(GRID_SIZE-1, cursor.y + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { cursor.x = Math.max(0, cursor.x - 1); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { cursor.x = Math.min(GRID_SIZE-1, cursor.x + 1); e.preventDefault(); }
    else if (e.key === ' ' || e.key === 'Space') { rotateMirrorAtCursor(); e.preventDefault(); }
  } else if (gameState === 'paused') {
    if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
      e.preventDefault();
      resumeGame();
    }
  }
}

function onKeyUp(e) {}

function onTouch(e) {
  e.preventDefault();
  if (gameState !== 'playing') return;
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches[0];
  const x = touch.clientX - rect.left;
  const y = touch.clientY - rect.top;
  const gx = Math.floor((x - OFFSET_X) / CELL_SIZE);
  const gy = Math.floor((y - OFFSET_Y) / CELL_SIZE);
  if (gx >= 0 && gx < GRID_SIZE && gy >= 0 && gy < GRID_SIZE) {
    const mirror = mirrors.find(m => m.x === gx && m.y === gy);
    if (mirror) { mirror.rot = 1 - mirror.rot; moves++; calculateBeams(); checkLevelComplete(); updateDisplays(); }
  }
}

function onMouseDown(e) {
  if (gameState !== 'playing') return;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const gx = Math.floor((x - OFFSET_X) / CELL_SIZE);
  const gy = Math.floor((y - OFFSET_Y) / CELL_SIZE);
  if (gx >= 0 && gx < GRID_SIZE && gy >= 0 && gy < GRID_SIZE) {
    const mirror = mirrors.find(m => m.x === gx && m.y === gy);
    if (mirror) { mirror.rot = 1 - mirror.rot; moves++; calculateBeams(); checkLevelComplete(); updateDisplays(); }
  }
}

function rotateMirrorAtCursor() {
  const mirror = mirrors.find(m => m.x === cursor.x && m.y === cursor.y);
  if (mirror) { mirror.rot = 1 - mirror.rot; moves++; calculateBeams(); checkLevelComplete(); updateDisplays(); }
}

function calculateBeams() {
  beams = [];
  flowers.forEach(f => f.lit = false);
  lasers.forEach(laser => {
    let bx = laser.x;
    let by = laser.y;
    let dir = laser.dir;
    const segments = [];
    let steps = 0;
    while (steps < 200) {
      const nx = bx + DIRS[dir][0];
      const ny = by + DIRS[dir][1];
      if (nx < 0 || nx >= GRID_SIZE || ny < 0 || ny >= GRID_SIZE) {
        segments.push({x1: bx, y1: by, x2: nx, y2: ny, exit: true});
        break;
      }
      const mirror = mirrors.find(m => m.x === nx && m.y === ny);
      if (mirror) {
        segments.push({x1: bx, y1: by, x2: nx, y2: ny, mirror: true});
        // Reflect: "/" mirror (rot=0): up->right, right->up, down->left, left->down
        // "\" mirror (rot=1): up->left, left->up, down->right, right->down
        if (mirror.rot === 0) { // "/"
          if (dir === 0) dir = 1;
          else if (dir === 1) dir = 0;
          else if (dir === 2) dir = 3;
          else if (dir === 3) dir = 2;
        } else { // "\"
          if (dir === 0) dir = 3;
          else if (dir === 3) dir = 0;
          else if (dir === 2) dir = 1;
          else if (dir === 1) dir = 2;
        }
        bx = nx; by = ny;
      } else {
        const flower = flowers.find(f => f.x === nx && f.y === ny);
        if (flower) {
          flower.lit = true;
          segments.push({x1: bx, y1: by, x2: nx, y2: ny, flower: true});
          // Beam continues through flower
        } else {
          segments.push({x1: bx, y1: by, x2: nx, y2: ny});
        }
        bx = nx; by = ny;
      }
      steps++;
    }
    beams.push(segments);
  });
}

function checkLevelComplete() {
  if (flowers.every(f => f.lit)) {
    levelComplete();
  }
}

function updateDisplays() {
  document.getElementById('levelDisplay').textContent = currentLevel + 1;
  document.getElementById('timeDisplay').textContent = Math.ceil(timeLeft);
  document.getElementById('movesDisplay').textContent = moves;
  document.getElementById('scoreDisplay').textContent = score;
}

function updateBestDisplay() {
  document.getElementById('bestDisplay').textContent = bestScore;
}

function gameLoop(timestamp) {
  if (running && gameState === 'playing') {
    const dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;
    timeLeft -= dt;
    if (timeLeft <= 0) { timeLeft = 0; gameOver(); }
    updateDisplays();
  }
  draw();
  requestAnimationFrame(gameLoop);
}

function draw() {
  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

  // Grid
  ctx.strokeStyle = COLORS.grid;
  ctx.lineWidth = 1;
  for (let i = 0; i <= GRID_SIZE; i++) {
    ctx.beginPath();
    ctx.moveTo(OFFSET_X + i * CELL_SIZE, OFFSET_Y);
    ctx.lineTo(OFFSET_X + i * CELL_SIZE, OFFSET_Y + GRID_H);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(OFFSET_X, OFFSET_Y + i * CELL_SIZE);
    ctx.lineTo(OFFSET_X + GRID_W, OFFSET_Y + i * CELL_SIZE);
    ctx.stroke();
  }

  // Lasers
  ctx.fillStyle = COLORS.laser;
  ctx.shadowColor = COLORS.laserGlow;
  ctx.shadowBlur = 10;
  lasers.forEach(l => {
    const x = OFFSET_X + l.x * CELL_SIZE + CELL_SIZE/2;
    const y = OFFSET_Y + l.y * CELL_SIZE + CELL_SIZE/2;
    ctx.beginPath();
    ctx.arc(x, y, 12, 0, Math.PI*2);
    ctx.fill();
    // Direction indicator
    ctx.strokeStyle = COLORS.laser;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + DIRS[l.dir][0]*20, y + DIRS[l.dir][1]*20);
    ctx.stroke();
  });
  ctx.shadowBlur = 0;

  // Beams
  beams.forEach(segList => {
    segList.forEach(seg => {
      const x1 = OFFSET_X + (seg.x1 + 0.5) * CELL_SIZE;
      const y1 = OFFSET_Y + (seg.y1 + 0.5) * CELL_SIZE;
      const x2 = OFFSET_X + (seg.x2 + 0.5) * CELL_SIZE;
      const y2 = OFFSET_Y + (seg.y2 + 0.5) * CELL_SIZE;
      ctx.strokeStyle = COLORS.beam;
      ctx.lineWidth = 3;
      ctx.shadowColor = COLORS.beamGlow;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      // Particle at mirror/flower
      if (seg.mirror || seg.flower) {
        ctx.fillStyle = seg.flower ? COLORS.flowerLit : COLORS.mirror;
        ctx.shadowColor = seg.flower ? COLORS.flowerLitGlow : COLORS.mirrorGlow;
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.arc(x2, y2, seg.flower ? 8 : 6, 0, Math.PI*2);
        ctx.fill();
      }
    });
  });
  ctx.shadowBlur = 0;

  // Mirrors
  mirrors.forEach(m => {
    const cx = OFFSET_X + m.x * CELL_SIZE + CELL_SIZE/2;
    const cy = OFFSET_Y + m.y * CELL_SIZE + CELL_SIZE/2;
    const size = 18;
    ctx.strokeStyle = COLORS.mirror;
    ctx.lineWidth = 3;
    ctx.shadowColor = COLORS.mirrorGlow;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    if (m.rot === 0) { // "/"
      ctx.moveTo(cx - size, cy + size);
      ctx.lineTo(cx + size, cy - size);
    } else { // "\"
      ctx.moveTo(cx - size, cy - size);
      ctx.lineTo(cx + size, cy + size);
    }
    ctx.stroke();
    ctx.shadowBlur = 0;
  });

  // Flowers
  flowers.forEach(f => {
    const cx = OFFSET_X + f.x * CELL_SIZE + CELL_SIZE/2;
    const cy = OFFSET_Y + f.y * CELL_SIZE + CELL_SIZE/2;
    const lit = f.lit;
    ctx.fillStyle = lit ? COLORS.flowerLit : COLORS.flower;
    ctx.shadowColor = lit ? COLORS.flowerLitGlow : COLORS.flowerGlow;
    ctx.shadowBlur = 15;
    // Draw flower as 4 petals
    for (let i = 0; i < 4; i++) {
      const angle = (i * Math.PI/2) + (Date.now()/500);
      const px = cx + Math.cos(angle) * 10;
      const py = cy + Math.sin(angle) * 10;
      ctx.beginPath();
      ctx.arc(px, py, 8, 0, Math.PI*2);
      ctx.fill();
    }
    // Center
    ctx.fillStyle = lit ? '#ff0' : '#fff';
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(cx, cy, 6, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.shadowBlur = 0;

  // Cursor
  if (gameState === 'playing' && showCursor) {
    const cx = OFFSET_X + cursor.x * CELL_SIZE + CELL_SIZE/2;
    const cy = OFFSET_Y + cursor.y * CELL_SIZE + CELL_SIZE/2;
    ctx.strokeStyle = COLORS.cursor;
    ctx.lineWidth = 2;
    ctx.setLineDash([5,5]);
    ctx.strokeRect(OFFSET_X + cursor.x * CELL_SIZE + 2, OFFSET_Y + cursor.y * CELL_SIZE + 2, CELL_SIZE - 4, CELL_SIZE - 4);
    ctx.setLineDash([]);
  }

  // Blink cursor
  if (Math.floor(Date.now() / 500) % 2 === 0) showCursor = true; else showCursor = false;
}

init();
  </script>
</body>
</html>
