<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Minesweeper - Day 31</title>
<style>
:root {
  --bg: #0a0a12;
  --fg: #e0ffe0;
  --neon-green: #00ff88;
  --neon-blue: #00ccff;
  --neon-pink: #ff00aa;
  --neon-orange: #ff8800;
  --neon-red: #ff3344;
  --panel: rgba(10, 10, 20, 0.9);
  --border: #00ff88;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Courier New', Courier, monospace;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  overflow: hidden;
  touch-action: none;
}
canvas {
  display: block;
  border: 2px solid var(--border);
  border-radius: 8px;
  box-shadow: 0 0 20px rgba(0, 255, 136, 0.3), inset 0 0 20px rgba(0, 255, 136, 0.1);
  background: #05050a;
}
.ui {
  position: fixed;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 24px;
  padding: 8px 16px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  box-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
  z-index: 10;
  font-size: 14px;
  letter-spacing: 1px;
}
.ui span { color: var(--neon-green); text-shadow: 0 0 5px var(--neon-green); }
.btn {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  padding: 10px 28px;
  background: transparent;
  border: 2px solid var(--neon-green);
  color: var(--neon-green);
  font-family: inherit;
  font-size: 14px;
  letter-spacing: 2px;
  cursor: pointer;
  border-radius: 4px;
  transition: all 0.2s;
  text-shadow: 0 0 5px var(--neon-green);
}
.btn:hover, .btn:focus {
  background: var(--neon-green);
  color: var(--bg);
  box-shadow: 0 0 20px var(--neon-green);
}
.msg {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  padding: 30px 50px;
  background: var(--panel);
  border: 2px solid var(--neon-pink);
  border-radius: 12px;
  text-align: center;
  display: none;
  z-index: 20;
  box-shadow: 0 0 30px rgba(255, 0, 170, 0.4);
}
.msg h2 { margin-bottom: 12px; color: var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink); font-size: 28px; }
.msg p { color: var(--neon-blue); margin-bottom: 20px; font-size: 18px; }
@media (max-width: 600px) {
  .ui { font-size: 11px; gap: 12px; padding: 6px 10px; top: 8px; }
  .btn { bottom: 12px; padding: 8px 20px; font-size: 12px; }
  .msg { padding: 20px 30px; width: 90%; }
  .msg h2 { font-size: 22px; }
  .msg p { font-size: 16px; }
}

.overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.95);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    gap: 20px;
    padding: 20px;
}
.overlay.hidden { display: none; }
.overlay h1 { font-size: clamp(32px, 8vw, 64px); text-shadow: 0 0 30px #00ffea; letter-spacing: 4px; }
.overlay p { color: #00ffea88; font-size: 14px; text-align: center; max-width: 400px; line-height: 1.6; }
.overlay .btn {
    position: static;
    transform: none;
    padding: 12px 32px;
    font-size: 16px;
    font-family: 'Courier New', monospace;
    background: transparent;
    color: #00ffea;
    border: 2px solid #00ffea;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
}
.overlay .btn:hover { background: #00ffea; color: #0a0a0f; box-shadow: 0 0 20px #00ffea; }
.mobile-hint { color: #ff6b00; font-size: 12px; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div class="ui">
  <div>LEVEL: <span id="levelEl">1</span></div>
  <div>MINES: <span id="minesEl">10</span></div>
  <div>FLAGS: <span id="flagsEl">0</span></div>
  <div>TIME: <span id="timeEl">0</span></div>
  <div>SCORE: <span id="scoreEl">0</span></div>
  <div>BEST: <span id="bestEl">0</span></div>
</div>
<button class="btn" id="restartBtn">RESTART</button>
<div class="msg" id="msgBox">
  <h2 id="msgTitle">LEVEL COMPLETE</h2>
  <p id="msgText">Well done!</p>
  <button class="btn" onclick="hideMsg()">CONTINUE</button>
</div>

<!-- Start Overlay -->
<div class="overlay" id="startOverlay">
  <h1>NEON MINESWEEPER</h1>
  <p>Tap cells to reveal. Long press or right-click to flag. Clear all non-mine cells to advance.</p>
  <button class="btn" onclick="startGame()">START GAME</button>
</div>

<!-- Pause Overlay -->
<div class="overlay hidden" id="pauseOverlay">
  <h1>PAUSED</h1>
  <p>Game is paused. Press RESUME to continue.</p>
  <button class="btn" onclick="resumeGame()">RESUME</button>
  <button class="btn" onclick="quitToMenu()">QUIT TO MENU</button>
</div>

<!-- Game Over Overlay -->
<div class="overlay hidden" id="gameOverOverlay">
  <h1 id="gameOverTitle">GAME OVER</h1>
  <p id="gameOverText"></p>
  <button class="btn" onclick="startGame()">RETRY</button>
  <button class="btn" onclick="quitToMenu()">MAIN MENU</button>
</div>

<script>
// ===== Neon Minesweeper - Day 31 =====
// Cyberpunk Minesweeper with increasing grid size, neon aesthetic, touch & keyboard support

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// UI elements
const levelEl = document.getElementById('levelEl');
const minesEl = document.getElementById('minesEl');
const flagsEl = document.getElementById('flagsEl');
const timeEl = document.getElementById('timeEl');
const scoreEl = document.getElementById('scoreEl');
const bestEl = document.getElementById('bestEl');
const restartBtn = document.getElementById('restartBtn');
const msgBox = document.getElementById('msgBox');
const msgTitle = document.getElementById('msgTitle');
const msgText = document.getElementById('msgText');
const pauseOverlay = document.getElementById('pauseOverlay');
const gameOverOverlay = document.getElementById('gameOverOverlay');
const gameOverTitle = document.getElementById('gameOverTitle');
const gameOverText = document.getElementById('gameOverText');
const startOverlay = document.getElementById('startOverlay');

// Game constants
const CELL_BASE = 28; // base cell size in px
const MIN_GRID = 8;
const MAX_GRID = 24;
const MINE_RATIO = 0.15625; // 10/64 for 8x8

// Colors
const COLORS = {
  bg: '#05050a',
  grid: '#003322',
  hidden: '#0a1a12',
  revealed: '#081810',
  flag: '#ff00aa',
  mine: '#ff3344',
  numbers: [
    '#000000', // 0 unused
    '#00ccff', // 1 - cyan
    '#00ff88', // 2 - green
    '#ff8800', // 3 - orange
    '#ff00aa', // 4 - pink
    '#ff3344', // 5 - red
    '#ffff00', // 6 - yellow
    '#ffffff', // 7 - white
    '#ff00ff'  // 8 - magenta
  ]
};

// Game state
let gridWidth = MIN_GRID;
let gridHeight = MIN_GRID;
let mineCount = 0;
let cells = [];
let gameState = 'start'; // start, playing, paused, gameover, win
let flagsCount = 0;
let revealedCount = 0;
let startTime = 0;
let timerInterval = null;
let score = 0;
let bestScore = parseInt(localStorage.getItem('neonMinesweeperBest') || '0', 10);
let currentLevel = 1;
let cellSize = CELL_BASE;
let firstClick = true;

// Touch handling
let touchStartTime = 0;
let touchStartX = 0;
let touchStartY = 0;
const LONG_PRESS_THRESHOLD = 500; // ms

// Initialize
bestEl.textContent = bestScore;
restartBtn.addEventListener('click', () => startGame());
document.addEventListener('keydown', handleKeyDown);
canvas.addEventListener('mousedown', handleMouseDown, { passive: false });
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
canvas.addEventListener('touchend', handleTouchEnd, { passive: false });

function handleKeyDown(e) {
  if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
    if (gameState === 'playing') pauseGame();
    else if (gameState === 'paused') resumeGame();
  }
  if (e.key === 'r' || e.key === 'R') {
    if (gameState === 'playing' || gameState === 'paused') startGame();
  }
}

function handleMouseDown(e) {
  if (gameState !== 'playing') return;
  const rect = canvas.getBoundingClientRect();
  const x = Math.floor((e.clientX - rect.left) / cellSize);
  const y = Math.floor((e.clientY - rect.top) / cellSize);
  if (x < 0 || x >= gridWidth || y < 0 || y >= gridHeight) return;
  if (e.button === 2) toggleFlag(x, y);
  else revealCell(x, y);
  render();
}

function handleTouchStart(e) {
  if (gameState !== 'playing') return;
  const touch = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  touchStartX = Math.floor((touch.clientX - rect.left) / cellSize);
  touchStartY = Math.floor((touch.clientY - rect.top) / cellSize);
  touchStartTime = Date.now();
}

function handleTouchEnd(e) {
  if (gameState !== 'playing') return;
  const touch = e.changedTouches[0];
  const rect = canvas.getBoundingClientRect();
  const x = Math.floor((touch.clientX - rect.left) / cellSize);
  const y = Math.floor((touch.clientY - rect.top) / cellSize);
  if (x !== touchStartX || y !== touchStartY) return; // ignore drag
  const duration = Date.now() - touchStartTime;
  if (duration >= LONG_PRESS_THRESHOLD) toggleFlag(x, y);
  else revealCell(x, y);
  render();
}

function startGame() {
  hideAllOverlays();
  currentLevel = 1;
  gridWidth = MIN_GRID;
  gridHeight = MIN_GRID;
  score = 0;
  initLevel();
  gameState = 'playing';
  startTimer();
  render();
}

function initLevel() {
  mineCount = Math.round(gridWidth * gridHeight * MINE_RATIO);
  cells = [];
  for (let y = 0; y < gridHeight; y++) {
    cells[y] = [];
    for (let x = 0; x < gridWidth; x++) {
      cells[y][x] = {
        mine: false,
        revealed: false,
        flagged: false,
        neighborMines: 0
      };
    }
  }
  flagsCount = 0;
  revealedCount = 0;
  firstClick = true;
  updateUI();
  resizeCanvas();
}

function placeMines(excludeX, excludeY) {
  let placed = 0;
  while (placed < mineCount) {
    const x = Math.floor(Math.random() * gridWidth);
    const y = Math.floor(Math.random() * gridHeight);
    if (cells[y][x].mine) continue;
    if (x === excludeX && y === excludeY) continue;
    // also avoid neighbors of first click for fairness
    if (Math.abs(x - excludeX) <= 1 && Math.abs(y - excludeY) <= 1) continue;
    cells[y][x].mine = true;
    placed++;
  }
  calculateNumbers();
}

function calculateNumbers() {
  for (let y = 0; y < gridHeight; y++) {
    for (let x = 0; x < gridWidth; x++) {
      if (cells[y][x].mine) continue;
      let count = 0;
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          if (dx === 0 && dy === 0) continue;
          const nx = x + dx, ny = y + dy;
          if (nx >= 0 && nx < gridWidth && ny >= 0 && ny < gridHeight && cells[ny][nx].mine) count++;
        }
      }
      cells[y][x].neighborMines = count;
    }
  }
}

function revealCell(x, y) {
  if (x < 0 || x >= gridWidth || y < 0 || y >= gridHeight) return;
  const cell = cells[y][x];
  if (cell.revealed || cell.flagged) return;
  if (firstClick) {
    placeMines(x, y);
    firstClick = false;
  }
  cell.revealed = true;
  revealedCount++;
  if (cell.mine) {
    gameOver(false);
    return;
  }
  if (cell.neighborMines === 0) {
    // auto-reveal neighbors
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        if (dx === 0 && dy === 0) continue;
        revealCell(x + dx, y + dy);
      }
    }
  }
  checkWin();
}

function toggleFlag(x, y) {
  if (x < 0 || x >= gridWidth || y < 0 || y >= gridHeight) return;
  const cell = cells[y][x];
  if (cell.revealed) return;
  cell.flagged = !cell.flagged;
  flagsCount += cell.flagged ? 1 : -1;
  updateUI();
}

function checkWin() {
  if (revealedCount === gridWidth * gridHeight - mineCount) {
    gameOver(true);
  }
}

function gameOver(win) {
  stopTimer();
  gameState = win ? 'win' : 'gameover';
  if (win) {
    // level complete
    const timeBonus = Math.max(0, 1000 - (Date.now() - startTime) / 10);
    const levelScore = mineCount * 10 + Math.floor(timeBonus);
    score += levelScore;
    if (score > bestScore) {
      bestScore = score;
      localStorage.setItem('neonMinesweeperBest', bestScore.toString());
      bestEl.textContent = bestScore;
    }
    scoreEl.textContent = score;
    // next level
    currentLevel++;
    if (gridWidth < MAX_GRID) {
      gridWidth += 2;
      gridHeight += 2;
      showLevelComplete(levelScore);
    } else {
      // max level reached, game won
      showGameOver(true, `YOU WIN! Final Score: ${score}`);
    }
  } else {
    showGameOver(false, `You hit a mine! Score: ${score}`);
  }
}

function showLevelComplete(levelScore) {
  msgTitle.textContent = 'LEVEL COMPLETE';
  msgText.textContent = `Level ${currentLevel - 1} cleared! +${levelScore} points`;
  msgBox.style.display = 'block';
  gameState = 'win'; // pause until continue
}

function hideMsg() {
  msgBox.style.display = 'none';
  if (gameState === 'win') {
    initLevel();
    gameState = 'playing';
    startTimer();
    render();
  }
}

function showGameOver(win, text) {
  gameOverTitle.textContent = win ? 'VICTORY' : 'GAME OVER';
  gameOverText.textContent = text;
  gameOverOverlay.classList.remove('hidden');
}

function pauseGame() {
  if (gameState !== 'playing') return;
  gameState = 'paused';
  stopTimer();
  pauseOverlay.classList.remove('hidden');
}

function resumeGame() {
  if (gameState !== 'paused') return;
  gameState = 'playing';
  pauseOverlay.classList.add('hidden');
  startTimer();
}

function quitToMenu() {
  stopTimer();
  hideAllOverlays();
  startOverlay.classList.remove('hidden');
  gameState = 'start';
  // reset to level 1
  currentLevel = 1;
  gridWidth = MIN_GRID;
  gridHeight = MIN_GRID;
  score = 0;
  updateUI();
}

function hideAllOverlays() {
  startOverlay.classList.add('hidden');
  pauseOverlay.classList.add('hidden');
  gameOverOverlay.classList.add('hidden');
  msgBox.style.display = 'none';
}

function startTimer() {
  startTime = Date.now();
  timerInterval = setInterval(updateTimer, 1000);
  updateTimer();
}

function stopTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = null;
}

function updateTimer() {
  if (gameState !== 'playing') return;
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  timeEl.textContent = elapsed;
}

function updateUI() {
  levelEl.textContent = currentLevel;
  minesEl.textContent = mineCount;
  flagsEl.textContent = flagsCount;
  scoreEl.textContent = score;
  bestEl.textContent = bestScore;
}

function resizeCanvas() {
  // Calculate cell size to fit screen with padding
  const maxWidth = window.innerWidth - 40;
  const maxHeight = window.innerHeight - 160; // account for UI and button
  const cellSizeByWidth = Math.floor(maxWidth / gridWidth);
  const cellSizeByHeight = Math.floor(maxHeight / gridHeight);
  cellSize = Math.min(CELL_BASE, cellSizeByWidth, cellSizeByHeight);
  cellSize = Math.max(cellSize, 12); // minimum cell size
  canvas.width = gridWidth * cellSize;
  canvas.height = gridHeight * cellSize;
  canvas.style.width = canvas.width + 'px';
  canvas.style.height = canvas.height + 'px';
}

function render() {
  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Draw grid lines
  ctx.strokeStyle = COLORS.grid;
  ctx.lineWidth = 1;
  for (let x = 0; x <= gridWidth; x++) {
    ctx.beginPath();
    ctx.moveTo(x * cellSize, 0);
    ctx.lineTo(x * cellSize, canvas.height);
    ctx.stroke();
  }
  for (let y = 0; y <= gridHeight; y++) {
    ctx.beginPath();
    ctx.moveTo(0, y * cellSize);
    ctx.lineTo(canvas.width, y * cellSize);
    ctx.stroke();
  }

  // Draw cells
  for (let y = 0; y < gridHeight; y++) {
    for (let x = 0; x < gridWidth; x++) {
      const cell = cells[y][x];
      const px = x * cellSize;
      const py = y * cellSize;
      const padding = 2;
      const cw = cellSize - padding * 2;
      const ch = cellSize - padding * 2;

      if (cell.revealed) {
        ctx.fillStyle = COLORS.revealed;
        ctx.fillRect(px + padding, py + padding, cw, ch);
        if (cell.mine) {
          // draw mine
          ctx.fillStyle = COLORS.mine;
          ctx.beginPath();
          ctx.arc(px + cellSize/2, py + cellSize/2, cellSize * 0.3, 0, Math.PI * 2);
          ctx.fill();
          // glow
          ctx.shadowColor = COLORS.mine;
          ctx.shadowBlur = 10;
          ctx.fill();
          ctx.shadowBlur = 0;
        } else if (cell.neighborMines > 0) {
          // draw number
          const color = COLORS.numbers[cell.neighborMines] || COLORS.numbers[1];
          ctx.fillStyle = color;
          ctx.font = `bold ${cellSize * 0.6}px Courier New`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(cell.neighborMines, px + cellSize/2, py + cellSize/2);
          // glow
          ctx.shadowColor = color;
          ctx.shadowBlur = 8;
          ctx.fillText(cell.neighborMines, px + cellSize/2, py + cellSize/2);
          ctx.shadowBlur = 0;
        }
      } else {
        // hidden cell
        ctx.fillStyle = COLORS.hidden;
        ctx.fillRect(px + padding, py + padding, cw, ch);
        // subtle border
        ctx.strokeStyle = '#004433';
        ctx.strokeRect(px + padding, py + padding, cw, ch);
        if (cell.flagged) {
          // draw flag
          ctx.fillStyle = COLORS.flag;
          ctx.beginPath();
          const cx = px + cellSize/2;
          const cy = py + cellSize/2;
          const fs = cellSize * 0.35;
          ctx.moveTo(cx, cy - fs);
          ctx.lineTo(cx + fs * 0.8, cy - fs * 0.4);
          ctx.lineTo(cx, cy);
          ctx.lineTo(cx - fs * 0.8, cy - fs * 0.4);
          ctx.closePath();
          ctx.fill();
          // pole
          ctx.strokeStyle = COLORS.flag;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.lineTo(cx, cy + fs);
          ctx.stroke();
          // glow
          ctx.shadowColor = COLORS.flag;
          ctx.shadowBlur = 10;
          ctx.fill();
          ctx.stroke();
          ctx.shadowBlur = 0;
        }
      }
    }
  }
}

// Handle window resize
window.addEventListener('resize', () => {
  if (gameState === 'playing' || gameState === 'paused') {
    resizeCanvas();
    render();
  }
});

// Initial render (start screen)
if (cells.length > 0) {
    render();
}
</script>
</body>
</html>
