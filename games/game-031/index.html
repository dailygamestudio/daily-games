<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Minesweeper - Day 31</title>
<style>
:root {
  --bg: #0a0a12;
  --fg: #e0ffe0;
  --neon-green: #00ff88;
  --neon-blue: #00ccff;
  --neon-pink: #ff00aa;
  --neon-orange: #ff8800;
  --neon-red: #ff3344;
  --panel: rgba(10, 10, 20, 0.9);
  --border: #00ff88;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Courier New', Courier, monospace;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  overflow: hidden;
  touch-action: none;
}
canvas {
  display: block;
  border: 2px solid var(--border);
  border-radius: 8px;
  box-shadow: 0 0 20px rgba(0, 255, 136, 0.3), inset 0 0 20px rgba(0, 255, 136, 0.1);
  background: #05050a;
}
.ui {
  position: fixed;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 24px;
  padding: 8px 16px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  box-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
  z-index: 10;
  font-size: 14px;
  letter-spacing: 1px;
}
.ui span { color: var(--neon-green); text-shadow: 0 0 5px var(--neon-green); }
.btn {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  padding: 10px 28px;
  background: transparent;
  border: 2px solid var(--neon-green);
  color: var(--neon-green);
  font-family: inherit;
  font-size: 14px;
  letter-spacing: 2px;
  cursor: pointer;
  border-radius: 4px;
  transition: all 0.2s;
  text-shadow: 0 0 5px var(--neon-green);
}
.btn:hover, .btn:focus {
  background: var(--neon-green);
  color: var(--bg);
  box-shadow: 0 0 20px var(--neon-green);
}
.msg {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  padding: 30px 50px;
  background: var(--panel);
  border: 2px solid var(--neon-pink);
  border-radius: 12px;
  text-align: center;
  display: none;
  z-index: 20;
  box-shadow: 0 0 30px rgba(255, 0, 170, 0.4);
}
.msg h2 { margin-bottom: 12px; color: var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink); font-size: 28px; }
.msg p { color: var(--neon-blue); margin-bottom: 20px; font-size: 18px; }
@media (max-width: 600px) {
  .ui { font-size: 11px; gap: 12px; padding: 6px 10px; top: 8px; }
  .btn { bottom: 12px; padding: 8px 20px; font-size: 12px; }
  .msg { padding: 20px 30px; width: 90%; }
  .msg h2 { font-size: 22px; }
  .msg p { font-size: 16px; }
}

.overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.95);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    gap: 20px;
    padding: 20px;
}
.overlay.hidden { display: none; }
.overlay h1 { font-size: clamp(32px, 8vw, 64px); text-shadow: 0 0 30px #00ffea; letter-spacing: 4px; }
.overlay p { color: #00ffea88; font-size: 14px; text-align: center; max-width: 400px; line-height: 1.6; }
.overlay .btn {
    position: static;
    transform: none;
    padding: 12px 32px;
    font-size: 16px;
    font-family: 'Courier New', monospace;
    background: transparent;
    color: #00ffea;
    border: 2px solid #00ffea;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
}
.overlay .btn:hover { background: #00ffea; color: #0a0a0f; box-shadow: 0 0 20px #00ffea; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div class="ui">
  <div>MINES: <span id="mineCount">0</span></div>
  <div>TIME: <span id="timer">0</span></div>
  <div>BEST: <span id="highScore">0</span></div>
</div>
<button class="btn" id="restartBtn">RESTART</button>

<div class="overlay" id="startOverlay">
  <h1>NEON MINESWEEPER</h1>
  <p>Click to reveal. Right-click or long press to flag. Clear all non-mine cells to win.</p>
  <button class="btn" id="startBtn">START GAME</button>
</div>

<div class="overlay hidden" id="pauseOverlay">
  <h1>PAUSED</h1>
  <button class="btn" id="resumeBtn">RESUME</button>
  <button class="btn" id="quitBtn">QUIT TO MENU</button>
</div>

<div class="overlay hidden" id="gameOverOverlay">
  <h1 id="gameOverTitle">GAME OVER</h1>
  <p id="gameOverMsg"></p>
  <button class="btn" id="retryBtn">RETRY</button>
  <button class="btn" id="mainMenuBtn">MAIN MENU</button>
</div>

<script>
(function() {
  'use strict';

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const mineCountEl = document.getElementById('mineCount');
  const timerEl = document.getElementById('timer');
  const highScoreEl = document.getElementById('highScore');
  const restartBtn = document.getElementById('restartBtn');
  const startOverlay = document.getElementById('startOverlay');
  const startBtn = document.getElementById('startBtn');
  const pauseOverlay = document.getElementById('pauseOverlay');
  const resumeBtn = document.getElementById('resumeBtn');
  const quitBtn = document.getElementById('quitBtn');
  const gameOverOverlay = document.getElementById('gameOverOverlay');
  const gameOverTitle = document.getElementById('gameOverTitle');
  const gameOverMsg = document.getElementById('gameOverMsg');
  const retryBtn = document.getElementById('retryBtn');
  const mainMenuBtn = document.getElementById('mainMenuBtn');

  // Game constants
  const COLS = 16;
  const ROWS = 16;
  const MINE_COUNT = 40;
  const CELL_SIZE = 30;
  const BOARD_WIDTH = COLS * CELL_SIZE;
  const BOARD_HEIGHT = ROWS * CELL_SIZE;

  // Game state
  let board = [];
  let revealed = [];
  let flagged = [];
  let mines = [];
  let gameOver = false;
  let gameWon = false;
  let firstClick = true;
  let timer = 0;
  let timerInterval = null;
  let highScore = parseInt(localStorage.getItem('neonMinesweeperBest')) || 0;
  let isPaused = false;
  let touchStartTime = 0;
  let touchCell = null;

  highScoreEl.textContent = highScore > 0 ? formatTime(highScore) : '0';

  // Colors for numbers
  const numberColors = [
    '#00ff88', // 1 - neon green
    '#00ccff', // 2 - neon blue
    '#ff00aa', // 3 - neon pink
    '#ff8800', // 4 - neon orange
    '#ff3344', // 5 - neon red
    '#ffff00', // 6 - yellow
    '#ffffff', // 7 - white
    '#ff00ff'  // 8 - magenta
  ];

  function initGame() {
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    
    canvas.addEventListener('mousedown', handleMouseDown);
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
    canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
    
    restartBtn.addEventListener('click', startGame);
    startBtn.addEventListener('click', startGame);
    resumeBtn.addEventListener('click', resumeGame);
    quitBtn.addEventListener('click', quitToMenu);
    retryBtn.addEventListener('click', startGame);
    mainMenuBtn.addEventListener('click', quitToMenu);
    
    document.addEventListener('keydown', handleKeyDown);
    
    showStartScreen();
    requestAnimationFrame(gameLoop);
  }

  function resizeCanvas() {
    const maxWidth = window.innerWidth * 0.95;
    const maxHeight = window.innerHeight * 0.85;
    const scale = Math.min(maxWidth / BOARD_WIDTH, maxHeight / BOARD_HEIGHT, 1);
    canvas.width = BOARD_WIDTH * scale;
    canvas.height = BOARD_HEIGHT * scale;
    canvas.style.width = `${BOARD_WIDTH * scale}px`;
    canvas.style.height = `${BOARD_HEIGHT * scale}px`;
  }

  function handleKeyDown(e) {
    if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
      if (!startOverlay.classList.contains('hidden') || !gameOverOverlay.classList.contains('hidden')) return;
      if (isPaused) resumeGame();
      else pauseGame();
    }
  }

  function startGame() {
    hideAllOverlays();
    resetGame();
    placeMines();
    calculateNumbers();
    startTimer();
    gameOver = false;
    gameWon = false;
    firstClick = true;
    isPaused = false;
    draw();
  }

  function resetGame() {
    board = Array(ROWS).fill().map(() => Array(COLS).fill(0));
    revealed = Array(ROWS).fill().map(() => Array(COLS).fill(false));
    flagged = Array(ROWS).fill().map(() => Array(COLS).fill(false));
    mines = [];
    mineCountEl.textContent = MINE_COUNT;
    timer = 0;
    timerEl.textContent = '0';
    clearInterval(timerInterval);
  }

  function placeMines() {
    let placed = 0;
    while (placed < MINE_COUNT) {
      const r = Math.floor(Math.random() * ROWS);
      const c = Math.floor(Math.random() * COLS);
      if (board[r][c] !== -1 && !(firstClick && (r === firstClickRow && c === firstClickCol))) {
        board[r][c] = -1;
        mines.push({r, c});
        placed++;
      }
    }
  }

  let firstClickRow = -1, firstClickCol = -1;

  function calculateNumbers() {
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (board[r][c] === -1) continue;
        let count = 0;
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            const nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc] === -1) {
              count++;
            }
          }
        }
        board[r][c] = count;
      }
    }
  }

  function startTimer() {
    timerInterval = setInterval(() => {
      if (!isPaused && !gameOver) {
        timer++;
        timerEl.textContent = formatTime(timer);
      }
    }, 1000);
  }

  function formatTime(seconds) {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return `${m}:${s.toString().padStart(2, '0')}`;
  }

  function pauseGame() {
    if (gameOver) return;
    isPaused = true;
    pauseOverlay.classList.remove('hidden');
  }

  function resumeGame() {
    isPaused = false;
    pauseOverlay.classList.add('hidden');
  }

  function quitToMenu() {
    hideAllOverlays();
    startOverlay.classList.remove('hidden');
    clearInterval(timerInterval);
    gameOver = true;
  }

  function showStartScreen() {
    hideAllOverlays();
    startOverlay.classList.remove('hidden');
  }

  function hideAllOverlays() {
    startOverlay.classList.add('hidden');
    pauseOverlay.classList.add('hidden');
    gameOverOverlay.classList.add('hidden');
  }

  function handleMouseDown(e) {
    if (gameOver || isPaused) return;
    const rect = canvas.getBoundingClientRect();
    const scaleX = BOARD_WIDTH / rect.width;
    const scaleY = BOARD_HEIGHT / rect.height;
    const x = (e.clientX - rect.left) * scaleX;
    const y = (e.clientY - rect.top) * scaleY;
    const col = Math.floor(x / CELL_SIZE);
    const row = Math.floor(y / CELL_SIZE);
    if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return;

    if (e.button === 2) { // Right click
      toggleFlag(row, col);
    } else { // Left click
      if (firstClick) {
        firstClick = false;
        firstClickRow = row;
        firstClickCol = col;
        placeMines();
        calculateNumbers();
      }
      revealCell(row, col);
    }
    draw();
  }

  function handleTouchStart(e) {
    if (gameOver || isPaused) return;
    e.preventDefault();
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    const scaleX = BOARD_WIDTH / rect.width;
    const scaleY = BOARD_HEIGHT / rect.height;
    const x = (touch.clientX - rect.left) * scaleX;
    const y = (touch.clientY - rect.top) * scaleY;
    const col = Math.floor(x / CELL_SIZE);
    const row = Math.floor(y / CELL_SIZE);
    if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return;
    touchStartTime = Date.now();
    touchCell = {row, col};
  }

  function handleTouchEnd(e) {
    if (gameOver || isPaused || !touchCell) return;
    e.preventDefault();
    const touchDuration = Date.now() - touchStartTime;
    const {row, col} = touchCell;
    touchCell = null;
    if (touchDuration > 500) { // Long press = flag
      toggleFlag(row, col);
    } else { // Tap = reveal
      if (firstClick) {
        firstClick = false;
        firstClickRow = row;
        firstClickCol = col;
        placeMines();
        calculateNumbers();
      }
      revealCell(row, col);
    }
    draw();
  }

  function toggleFlag(row, col) {
    if (revealed[row][col]) return;
    flagged[row][col] = !flagged[row][col];
    mineCountEl.textContent = MINE_COUNT - countFlags();
  }

  function countFlags() {
    let count = 0;
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (flagged[r][c]) count++;
      }
    }
    return count;
  }

  function revealCell(row, col) {
    if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return;
    if (revealed[row][col] || flagged[row][col]) return;
    
    revealed[row][col] = true;
    
    if (board[row][col] === -1) {
      gameOver = true;
      gameWon = false;
      revealAllMines();
      endGame();
      return;
    }
    
    if (board[row][col] === 0) {
      // Flood fill
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          revealCell(row + dr, col + dc);
        }
      }
    }
    
    checkWin();
  }

  function revealAllMines() {
    for (const {r, c} of mines) {
      revealed[r][c] = true;
    }
  }

  function checkWin() {
    let unrevealedSafe = 0;
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (board[r][c] !== -1 && !revealed[r][c]) {
          unrevealedSafe++;
        }
      }
    }
    if (unrevealedSafe === 0) {
      gameOver = true;
      gameWon = true;
      endGame();
    }
  }

  function endGame() {
    clearInterval(timerInterval);
    if (gameWon) {
      gameOverTitle.textContent = 'YOU WIN!';
      gameOverTitle.style.color = 'var(--neon-green)';
      gameOverTitle.style.textShadow = '0 0 10px var(--neon-green)';
      gameOverMsg.textContent = `Time: ${formatTime(timer)}`;
      if (highScore === 0 || timer < highScore) {
        highScore = timer;
        localStorage.setItem('neonMinesweeperBest', highScore);
        highScoreEl.textContent = formatTime(highScore);
        gameOverMsg.textContent += ' - NEW BEST!';
      }
    } else {
      gameOverTitle.textContent = 'GAME OVER';
      gameOverTitle.style.color = 'var(--neon-red)';
      gameOverTitle.style.textShadow = '0 0 10px var(--neon-red)';
      gameOverMsg.textContent = `Time: ${formatTime(timer)}`;
    }
    gameOverOverlay.classList.remove('hidden');
  }

  function draw() {
    const scale = canvas.width / BOARD_WIDTH;
    ctx.save();
    ctx.scale(scale, scale);
    ctx.clearRect(0, 0, BOARD_WIDTH, BOARD_HEIGHT);
    
    // Draw grid
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const x = c * CELL_SIZE;
        const y = r * CELL_SIZE;
        
        if (revealed[r][c]) {
          // Revealed cell
          ctx.fillStyle = board[r][c] === -1 ? '#1a0000' : '#0d0d1a';
          ctx.fillRect(x + 1, y + 1, CELL_SIZE - 2, CELL_SIZE - 2);
          
          if (board[r][c] === -1) {
            // Mine
            drawMine(x + CELL_SIZE/2, y + CELL_SIZE/2);
          } else if (board[r][c] > 0) {
            // Number
            drawNumber(board[r][c], x + CELL_SIZE/2, y + CELL_SIZE/2);
          }
        } else {
          // Hidden cell
          ctx.fillStyle = '#0a0a12';
          ctx.fillRect(x + 1, y + 1, CELL_SIZE - 2, CELL_SIZE - 2);
          
          // Border glow
          ctx.strokeStyle = 'rgba(0, 255, 136, 0.3)';
          ctx.lineWidth = 1;
          ctx.strokeRect(x + 1, y + 1, CELL_SIZE - 2, CELL_SIZE - 2);
          
          if (flagged[r][c]) {
            drawFlag(x + CELL_SIZE/2, y + CELL_SIZE/2);
          }
        }
      }
    }
    
    // Grid lines
    ctx.strokeStyle = 'rgba(0, 255, 136, 0.1)';
    ctx.lineWidth = 0.5;
    for (let i = 0; i <= COLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL_SIZE, 0);
      ctx.lineTo(i * CELL_SIZE, BOARD_HEIGHT);
      ctx.stroke();
    }
    for (let i = 0; i <= ROWS; i++) {
      ctx.beginPath();
      ctx.moveTo(0, i * CELL_SIZE);
      ctx.lineTo(BOARD_WIDTH, i * CELL_SIZE);
      ctx.stroke();
    }
    
    ctx.restore();
  }

  function drawMine(cx, cy) {
    const radius = CELL_SIZE * 0.3;
    // Glow
    const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius * 1.5);
    gradient.addColorStop(0, 'rgba(255, 51, 68, 0.8)');
    gradient.addColorStop(1, 'rgba(255, 51, 68, 0)');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(cx, cy, radius * 1.5, 0, Math.PI * 2);
    ctx.fill();
    
    // Mine body
    ctx.fillStyle = '#ff3344';
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.fill();
    
    // Highlight
    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
    ctx.beginPath();
    ctx.arc(cx - radius * 0.3, cy - radius * 0.3, radius * 0.3, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawFlag(cx, cy) {
    const poleX = cx;
    const poleTop = cy - CELL_SIZE * 0.35;
    const poleBottom = cy + CELL_SIZE * 0.35;
    
    // Pole
    ctx.strokeStyle = '#ff8800';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(poleX, poleTop);
    ctx.lineTo(poleX, poleBottom);
    ctx.stroke();
    
    // Flag triangle
    ctx.fillStyle = '#ff00aa';
    ctx.beginPath();
    ctx.moveTo(poleX, poleTop + 2);
    ctx.lineTo(poleX + CELL_SIZE * 0.3, poleTop + CELL_SIZE * 0.2);
    ctx.lineTo(poleX, poleTop + CELL_SIZE * 0.35);
    ctx.closePath();
    ctx.fill();
    
    // Flag glow
    ctx.shadowColor = '#ff00aa';
    ctx.shadowBlur = 5;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawNumber(num, cx, cy) {
    ctx.font = `bold ${CELL_SIZE * 0.6}px Courier New`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = numberColors[num - 1] || '#ffffff';
    ctx.shadowColor = ctx.fillStyle;
    ctx.shadowBlur = 8;
    ctx.fillText(num.toString(), cx, cy + 1);
    ctx.shadowBlur = 0;
  }

  function gameLoop() {
    draw();
    requestAnimationFrame(gameLoop);
  }

  // Initialize
  initGame();
})();
</script>
</body>
</html>
