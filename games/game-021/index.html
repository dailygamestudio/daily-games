<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Reflect - Day 21</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0a0a12;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', 'Courier New', monospace;
    color: #00ffff;
    overflow: hidden;
    touch-action: none;
}
#gameContainer {
    position: relative;
    box-shadow: 
        0 0 30px #00ffff88,
        0 0 60px #ff00ff44,
        inset 0 0 30px #00ffff22;
    border: 2px solid #00ffff;
    border-radius: 8px;
    background: #050510;
}
canvas { display: block; }
#ui {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
    z-index: 10;
}
.ui-panel {
    background: rgba(0, 20, 40, 0.9);
    border: 1px solid #00ffff66;
    border-radius: 6px;
    padding: 8px 16px;
    pointer-events: auto;
    backdrop-filter: blur(4px);
}
.ui-panel h2 { font-size: 14px; font-weight: 400; text-transform: uppercase; letter-spacing: 2px; color: #00ffff; text-shadow: 0 0 10px #00ffff; }
.ui-panel .value { font-size: 24px; font-weight: 700; color: #fff; text-shadow: 0 0 10px #ff00ff; }
#levelInfo { text-align: center; }
#controls {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    pointer-events: auto;
    z-index: 10;
}
.btn {
    background: linear-gradient(135deg, #003344, #001122);
    border: 1px solid #00ffff88;
    color: #00ffff;
    padding: 10px 20px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
    min-width: 100px;
}
.btn:active, .btn.active { background: linear-gradient(135deg, #00ffff, #0088ff); color: #000; box-shadow: 0 0 20px #00ffff; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
#touchControls {
    position: absolute;
    bottom: 10px;
    left: 10px;
    right: 10px;
    display: none;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 20px 20px;
    pointer-events: auto;
    z-index: 10;
}
.touch-btn {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: rgba(0, 30, 60, 0.9);
    border: 2px solid #00ffff88;
    color: #00ffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    touch-action: manipulation;
    user-select: none;
    transition: all 0.1s;
}
.touch-btn:active { background: #00ffff; color: #000; box-shadow: 0 0 20px #00ffff; }
.touch-area { flex: 1; display: flex; justify-content: center; }
#rotateBtn { width: 80px; height: 80px; font-size: 28px; }
#messageOverlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 10, 0.95);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    z-index: 100;
    border-radius: 6px;
}
#messageOverlay.show { display: flex; }
#messageOverlay h1 { font-size: 32px; text-transform: uppercase; letter-spacing: 4px; background: linear-gradient(90deg, #00ffff, #ff00ff, #ffff00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; text-shadow: 0 0 30px #00ffff88; }
#messageOverlay p { color: #88ffff; font-size: 16px; text-align: center; max-width: 80%; }
#messageOverlay .btn { padding: 14px 40px; font-size: 14px; }
@media (max-width: 768px) {
    #controls { display: none; }
    #touchControls { display: flex; }
    #messageOverlay h1 { font-size: 24px; }
    .ui-panel { padding: 6px 12px; }
    .ui-panel h2 { font-size: 11px; }
    .ui-panel .value { font-size: 18px; }
}
@media (orientation: landscape) and (max-height: 500px) {
    #touchControls { padding-bottom: 10px; }
    .touch-btn { width: 50px; height: 50px; }
    #rotateBtn { width: 70px; height: 70px; }
}

.overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.95);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    gap: 20px;
    padding: 20px;
}
.overlay.hidden { display: none; }
.overlay h1 { font-size: clamp(32px, 8vw, 64px); text-shadow: 0 0 30px #00ffea; letter-spacing: 4px; }
.overlay p { color: #00ffea88; font-size: 14px; text-align: center; max-width: 400px; line-height: 1.6; }
.btn {
    padding: 12px 32px;
    font-size: 16px;
    font-family: 'Courier New', monospace;
    background: transparent;
    color: #00ffea;
    border: 2px solid #00ffea;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
}
.btn:hover { background: #00ffea; color: #0a0a0f; box-shadow: 0 0 20px #00ffea; }
.mobile-hint { color: #ff6b00; font-size: 12px; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="gameContainer">
    <canvas id="canvas"></canvas>
    <div id="ui">
        <div class="ui-panel" id="scorePanel"><h2>Score</h2><div class="value" id="score">0</div></div>
        <div class="ui-panel" id="levelInfo"><h2>Level</h2><div class="value" id="level">1</div></div>
        <div class="ui-panel" id="highScorePanel"><h2>Best</h2><div class="value" id="highScore">0</div></div>
    </div>
    <div id="controls">
        <button class="btn" id="rotateBtn" title="Rotate Mirror (R)">Rotate</button>
        <button class="btn" id="fireBtn" title="Fire Laser (Space)">Fire</button>
        <button class="btn" id="resetBtn" title="Reset Level (Esc)">Reset</button>
    </div>
    <div id="touchControls">
        <div class="touch-area"></div>
        <button class="touch-btn" id="touchRotate" aria-label="Rotate Mirror">⟳</button>
        <div class="touch-area"></div>
        <button class="touch-btn" id="touchFire" aria-label="Fire Laser">▶</button>
        <div class="touch-area"></div>
        <button class="touch-btn" id="touchReset" aria-label="Reset Level">↺</button>
    </div>
    <div id="messageOverlay">
        <h1 id="overlayTitle">Neon Reflect</h1>
        <p id="overlayText">Guide the laser to the target using mirrors. Tap mirrors to rotate. Press Fire to shoot.</p>
        <button class="btn" id="startBtn">Start Game</button>
    </div>
</div>

<div class="overlay hidden" id="pauseOverlay">
    <h1>PAUSED</h1>
    <p>Wave <span id="pauseWave">1</span> • Score <span id="pauseScore">0</span></p>
    <button class="btn" id="resumeBtn">RESUME</button>
    <button class="btn" id="quitBtn">QUIT TO MENU</button>
</div>

<div class="overlay hidden" id="gameOverOverlay">
    <h1 style="color: #ff3366;">GAME OVER</h1>
    <p>Final Score: <span id="finalScore" style="color: #00ffea;">0</span></p>
    <p id="highScoreMsg" style="color: #ffd700;"></p>
    <button class="btn" id="retryBtn">RETRY</button>
    <button class="btn" id="menuBtn">MAIN MENU</button>
</div>

<script>
/**
 * Neon Reflect - Day 21
 * Laser reflection puzzle game with cyberpunk aesthetic
 * Guide laser beams through mirrors to hit targets
 */

// ============ CONFIGURATION ============
const CONFIG = {
    GRID_SIZE: 8,
    CELL_BASE: 60,
    MIN_CANVAS: 320,
    MAX_CANVAS: 720,
    COLORS: {
        bg: '#050510',
        grid: '#003344',
        gridAccent: '#00ffff33',
        wall: '#00ffff',
        mirror: '#ff00ff',
        mirrorGlow: '#ff00ff88',
        laser: '#00ffff',
        laserGlow: '#00ffff',
        target: '#ffff00',
        targetGlow: '#ffff00',
        source: '#00ff88',
        sourceGlow: '#00ff88',
        block: '#ff3300',
        blockGlow: '#ff330088',
        particle: ['#00ffff', '#ff00ff', '#ffff00', '#00ff88', '#ff6600'],
        uiText: '#00ffff',
        uiValue: '#ffffff',
        btnBg: 'linear-gradient(135deg, #003344, #001122)',
        btnBorder: '#00ffff88',
        btnActive: 'linear-gradient(135deg, #00ffff, #0088ff)'
    },
    LASER_SPEED: 8,
    PARTICLE_COUNT: 12,
    SHAKE_INTENSITY: 4,
    LEVELS: [
        { mirrors: [{r:1,c:2,rot:0}], targets: [{r:1,c:7}], blocks: [], source: {r:1,c:0,dir:0}, moving: false },
        { mirrors: [{r:3,c:3,rot:1}], targets: [{r:0,c:3}], blocks: [], source: {r:7,c:3,dir:2}, moving: false },
        { mirrors: [{r:2,c:2,rot:0},{r:2,c:5,rot:1}], targets: [{r:5,c:5}], blocks: [], source: {r:2,c:0,dir:0}, moving: false },
        { mirrors: [{r:1,c:1,rot:0},{r:1,c:6,rot:3},{r:6,c:6,rot:2}], targets: [{r:6,c:1}], blocks: [{r:3,c:3},{r:3,c:4},{r:4,c:3},{r:4,c:4}], source: {r:1,c:0,dir:0}, moving: false },
        { mirrors: [{r:2,c:2,rot:0},{r:5,c:5,rot:1}], targets: [{r:2,c:7},{r:7,c:2}], blocks: [], source: {r:0,c:4,dir:1}, moving: true },
        { mirrors: [{r:3,c:1,rot:0},{r:3,c:6,rot:2},{r:6,c:3,rot:3}], targets: [{r:0,c:3},{r:7,c:6}], blocks: [{r:3,c:3},{r:3,c:4},{r:4,c:3},{r:4,c:4}], source: {r:3,c:0,dir:0}, moving: true },
        { mirrors: [{r:1,c:3,rot:0},{r:4,c:6,rot:1},{r:6,c:2,rot:2},{r:2,c:5,rot:3}], targets: [{r:7,c:7},{r:0,c:0}], blocks: [{r:3,c:3},{r:3,c:4},{r:4,c:3},{r:4,c:4}], source: {r:0,c:4,dir:1}, moving: true },
        { mirrors: [{r:2,c:2,rot:0},{r:2,c:5,rot:1},{r:5,c:2,rot:2},{r:5,c:5,rot:3}], targets: [{r:0,c:7},{r:7,c:0},{r:7,c:7},{r:0,c:0}], blocks: [], source: {r:4,c:0,dir:0}, moving: true },
    ]
};

// ============ GAME STATE ============
const state = {
    canvas: null,
    ctx: null,
    cellSize: 0,
    gridOffsetX: 0,
    gridOffsetY: 0,
    mirrors: [],
    targets: [],
    blocks: [],
    source: null,
    laser: null,
    particles: [],
    screenShake: 0,
    score: 0,
    highScore: 0,
    level: 0,
    maxLevel: CONFIG.LEVELS.length - 1,
    gameState: 'menu',
    laserActive: false,
    laserPath: [],
    laserProgress: 0,
    animationId: null,
    lastTime: 0,
    selectedMirror: null,
    touchStart: null,
    running: false
};

// ============ UTILITY FUNCTIONS ============
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (min, max) => Math.random() * (max - min) + min;
const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1));

// Direction vectors: 0=right, 1=down, 2=left, 3=up
const DIRS = [[1,0],[0,1],[-1,0],[0,-1]];
const MIRROR_REFLECT = [
    [3, 2, 1, 0], // / mirror (rot 0)
    [1, 0, 3, 2], // \ mirror (rot 1)
    [1, 0, 3, 2], // \ mirror (rot 2) - same as rot 1 but flipped
    [3, 2, 1, 0]  // / mirror (rot 3) - same as rot 0 but flipped
];

// ============ DOM ELEMENTS ============
const elements = {
    canvas: document.getElementById('canvas'),
    score: document.getElementById('score'),
    level: document.getElementById('level'),
    highScore: document.getElementById('highScore'),
    rotateBtn: document.getElementById('rotateBtn'),
    fireBtn: document.getElementById('fireBtn'),
    resetBtn: document.getElementById('resetBtn'),
    touchRotate: document.getElementById('touchRotate'),
    touchFire: document.getElementById('touchFire'),
    touchReset: document.getElementById('touchReset'),
    messageOverlay: document.getElementById('messageOverlay'),
    overlayTitle: document.getElementById('overlayTitle'),
    overlayText: document.getElementById('overlayText'),
    startBtn: document.getElementById('startBtn'),
    pauseOverlay: document.getElementById('pauseOverlay'),
    pauseWave: document.getElementById('pauseWave'),
    pauseScore: document.getElementById('pauseScore'),
    resumeBtn: document.getElementById('resumeBtn'),
    quitBtn: document.getElementById('quitBtn'),
    gameOverOverlay: document.getElementById('gameOverOverlay'),
    finalScore: document.getElementById('finalScore'),
    highScoreMsg: document.getElementById('highScoreMsg'),
    retryBtn: document.getElementById('retryBtn'),
    menuBtn: document.getElementById('menuBtn')
};

// ============ INITIALIZATION ============
function init() {
    state.canvas = elements.canvas;
    state.ctx = state.canvas.getContext('2d');
    
    // Load high score
    state.highScore = parseInt(localStorage.getItem('neonReflectHighScore')) || 0;
    elements.highScore.textContent = state.highScore;
    
    // Event listeners
    window.addEventListener('resize', resize);
    document.addEventListener('keydown', handleKeyDown);
    document.addEventListener('keyup', handleKeyUp);
    
    // Button events
    elements.rotateBtn.addEventListener('click', () => rotateSelectedMirror());
    elements.fireBtn.addEventListener('click', () => fireLaser());
    elements.resetBtn.addEventListener('click', () => resetLevel());
    
    elements.touchRotate.addEventListener('click', () => rotateSelectedMirror());
    elements.touchFire.addEventListener('click', () => fireLaser());
    elements.touchReset.addEventListener('click', () => resetLevel());
    
    elements.startBtn.addEventListener('click', startGame);
    elements.resumeBtn.addEventListener('click', resumeGame);
    elements.quitBtn.addEventListener('click', quitToMenu);
    elements.retryBtn.addEventListener('click', startGame);
    elements.menuBtn.addEventListener('click', quitToMenu);
    
    // Canvas touch for mirror selection
    state.canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
    state.canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
    state.canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
    state.canvas.addEventListener('mousedown', handleMouseDown);
    state.canvas.addEventListener('mousemove', handleMouseMove);
    state.canvas.addEventListener('mouseup', handleMouseUp);
    state.canvas.addEventListener('mouseleave', handleMouseUp);
    
    resize();
    showStartScreen();
}

function resize() {
    const container = document.getElementById('gameContainer');
    const maxWidth = Math.min(window.innerWidth - 20, CONFIG.MAX_CANVAS);
    const maxHeight = Math.min(window.innerHeight - 20, CONFIG.MAX_CANVAS);
    const size = Math.min(maxWidth, maxHeight);
    
    state.cellSize = Math.floor(size / CONFIG.GRID_SIZE);
    const canvasSize = state.cellSize * CONFIG.GRID_SIZE;
    
    state.canvas.width = canvasSize;
    state.canvas.height = canvasSize;
    state.canvas.style.width = canvasSize + 'px';
    state.canvas.style.height = canvasSize + 'px';
    
    state.gridOffsetX = 0;
    state.gridOffsetY = 0;
    
    if (state.gameState === 'playing') {
        draw();
    }
}

// ============ GAME FLOW ============
function startGame() {
    state.gameState = 'playing';
    state.score = 0;
    state.level = 0;
    elements.score.textContent = state.score;
    elements.level.textContent = state.level + 1;
    hideAllOverlays();
    loadLevel(0);
    gameLoop(0);
}

function loadLevel(levelIndex) {
    if (levelIndex > state.maxLevel) {
        // Game completed
        gameOver(true);
        return;
    }
    
    state.level = levelIndex;
    elements.level.textContent = state.level + 1;
    
    const levelData = CONFIG.LEVELS[levelIndex];
    
    // Create mirrors
    state.mirrors = levelData.mirrors.map(m => ({
        r: m.r,
        c: m.c,
        rot: m.rot,
        baseRot: m.rot,
        moving: levelData.moving,
        moveDir: 1,
        moveTimer: 0
    }));
    
    // Create targets
    state.targets = levelData.targets.map(t => ({
        r: t.r,
        c: t.c,
        hit: false,
        pulse: 0
    }));
    
    // Create blocks
    state.blocks = levelData.blocks.map(b => ({ r: b.r, c: b.c }));
    
    // Create source
    state.source = { ...levelData.source };
    
    // Reset laser
    state.laser = null;
    state.laserActive = false;
    state.laserPath = [];
    state.laserProgress = 0;
    state.selectedMirror = null;
    state.particles = [];
    state.screenShake = 0;
}

function resetLevel() {
    loadLevel(state.level);
}

function nextLevel() {
    state.level++;
    if (state.level > state.maxLevel) {
        gameOver(true);
    } else {
        loadLevel(state.level);
    }
}

function gameOver(victory = false) {
    state.gameState = 'gameover';
    state.running = false;
    cancelAnimationFrame(state.animationId);
    
    elements.finalScore.textContent = state.score;
    
    if (victory) {
        elements.gameOverOverlay.querySelector('h1').textContent = 'VICTORY!';
        elements.gameOverOverlay.querySelector('h1').style.color = '#00ff88';
    } else {
        elements.gameOverOverlay.querySelector('h1').textContent = 'GAME OVER';
        elements.gameOverOverlay.querySelector('h1').style.color = '#ff3366';
    }
    
    if (state.score > state.highScore) {
        state.highScore = state.score;
        localStorage.setItem('neonReflectHighScore', state.highScore);
        elements.highScore.textContent = state.highScore;
        elements.highScoreMsg.textContent = 'NEW HIGH SCORE!';
    } else {
        elements.highScoreMsg.textContent = `Best: ${state.highScore}`;
    }
    
    elements.gameOverOverlay.classList.remove('hidden');
}

function pauseGame() {
    if (state.gameState !== 'playing') return;
    state.gameState = 'paused';
    state.running = false;
    cancelAnimationFrame(state.animationId);
    elements.pauseWave.textContent = state.level + 1;
    elements.pauseScore.textContent = state.score;
    elements.pauseOverlay.classList.remove('hidden');
}

function resumeGame() {
    if (state.gameState !== 'paused') return;
    state.gameState = 'playing';
    state.running = true;
    state.lastTime = performance.now();
    gameLoop(state.lastTime);
    elements.pauseOverlay.classList.add('hidden');
}

function quitToMenu() {
    state.gameState = 'menu';
    state.running = false;
    cancelAnimationFrame(state.animationId);
    hideAllOverlays();
    showStartScreen();
}

function showStartScreen() {
    elements.messageOverlay.classList.add('show');
    elements.overlayTitle.textContent = 'Neon Reflect';
    elements.overlayText.textContent = 'Guide the laser to the target using mirrors. Tap mirrors to rotate. Press Fire to shoot.';
    elements.startBtn.textContent = 'Start Game';
}

function hideAllOverlays() {
    elements.messageOverlay.classList.remove('show');
    elements.pauseOverlay.classList.add('hidden');
    elements.gameOverOverlay.classList.add('hidden');
}

// ============ INPUT HANDLING ============
const keys = {};

function handleKeyDown(e) {
    keys[e.code] = true;
    
    if (e.code === 'Escape') {
        if (state.gameState === 'playing') {
            pauseGame();
        } else if (state.gameState === 'paused') {
            resumeGame();
        }
        return;
    }
    
    if (state.gameState !== 'playing') return;
    
    if (e.code === 'KeyR') {
        rotateSelectedMirror();
    } else if (e.code === 'Space') {
        e.preventDefault();
        fireLaser();
    } else if (e.code === 'ArrowUp' || e.code === 'KeyW') {
        moveSelection(-1, 0);
    } else if (e.code === 'ArrowDown' || e.code === 'KeyS') {
        moveSelection(1, 0);
    } else if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
        moveSelection(0, -1);
    } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
        moveSelection(0, 1);
    }
}

function handleKeyUp(e) {
    keys[e.code] = false;
}

function handleMouseDown(e) {
    if (state.gameState !== 'playing') return;
    const rect = state.canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    selectMirrorAt(x, y);
}

function handleMouseMove(e) {
    if (state.gameState !== 'playing') return;
}

function handleMouseUp(e) {
    if (state.gameState !== 'playing') return;
}

function handleTouchStart(e) {
    if (state.gameState !== 'playing') return;
    e.preventDefault();
    const touch = e.touches[0];
    const rect = state.canvas.getBoundingClientRect();
    const x = touch.clientX - rect.left;
    const y = touch.clientY - rect.top;
    state.touchStart = { x, y, time: Date.now() };
    selectMirrorAt(x, y);
}

function handleTouchMove(e) {
    e.preventDefault();
}

function handleTouchEnd(e) {
    if (state.gameState !== 'playing') return;
    if (!state.touchStart) return;
    
    const touch = e.changedTouches[0];
    const rect = state.canvas.getBoundingClientRect();
    const x = touch.clientX - rect.left;
    const y = touch.clientY - rect.top;
    
    const dx = x - state.touchStart.x;
    const dy = y - state.touchStart.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const time = Date.now() - state.touchStart.time;
    
    // Tap detection
    if (dist < 20 && time < 300) {
        // Already handled by selectMirrorAt
    }
    
    state.touchStart = null;
}

function selectMirrorAt(x, y) {
    const c = Math.floor(x / state.cellSize);
    const r = Math.floor(y / state.cellSize);
    
    if (r < 0 || r >= CONFIG.GRID_SIZE || c < 0 || c >= CONFIG.GRID_SIZE) {
        state.selectedMirror = null;
        return;
    }
    
    // Check if there's a mirror at this position
    const mirror = state.mirrors.find(m => m.r === r && m.c === c);
    if (mirror) {
        state.selectedMirror = mirror;
    } else {
        state.selectedMirror = null;
    }
}

function moveSelection(dr, dc) {
    if (!state.selectedMirror) {
        // Select first mirror
        if (state.mirrors.length > 0) {
            state.selectedMirror = state.mirrors[0];
        }
        return;
    }
    
    let bestMirror = null;
    let bestDist = Infinity;
    
    for (const mirror of state.mirrors) {
        const dist = Math.abs(mirror.r - state.selectedMirror.r - dr) + Math.abs(mirror.c - state.selectedMirror.c - dc);
        if (dist < bestDist) {
            bestDist = dist;
            bestMirror = mirror;
        }
    }
    
    if (bestMirror) {
        state.selectedMirror = bestMirror;
    }
}

function rotateSelectedMirror() {
    if (state.selectedMirror && state.gameState === 'playing') {
        state.selectedMirror.rot = (state.selectedMirror.rot + 1) % 4;
        createParticles(
            state.selectedMirror.c * state.cellSize + state.cellSize/2,
            state.selectedMirror.r * state.cellSize + state.cellSize/2,
            CONFIG.COLORS.mirror,
            6
        );
    }
}

function fireLaser() {
    if (state.gameState !== 'playing' || state.laserActive) return;
    
    state.laserActive = true;
    state.laserPath = [];
    state.laserProgress = 0;
    
    // Calculate laser path
    simulateLaser();
    
    // Start laser animation
    animateLaser();
}

function animateLaser() {
    if (!state.laserActive) return;
    
    state.laserProgress += CONFIG.LASER_SPEED;
    
    if (state.laserProgress >= state.laserPath.length - 1) {
        state.laserProgress = state.laserPath.length - 1;
        state.laserActive = false;
        checkLevelComplete();
    }
    
    draw();
    
    if (state.laserActive) {
        requestAnimationFrame(animateLaser);
    }
}
