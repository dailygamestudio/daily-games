<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Shooter</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0a0a12;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', 'Courier New', monospace;
    color: #00ffcc;
    overflow: hidden;
    touch-action: none;
}
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

#gameContainer {
    position: relative;
    border: 3px solid #00ffcc;
    border-radius: 8px;
    box-shadow: 
        0 0 30px #00ffcc,
        0 0 60px #0066ff,
        inset 0 0 30px rgba(0, 255, 204, 0.1);
    background: #050510;
}
canvas { display: block; }

#ui {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    padding: 16px;
}
#topBar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}
.statBox {
    background: rgba(0, 20, 30, 0.85);
    border: 1px solid #00ffcc44;
    border-radius: 6px;
    padding: 8px 16px;
    backdrop-filter: blur(4px);
}
.statLabel { font-size: 10px; color: #00ffcc88; text-transform: uppercase; letter-spacing: 1px; }
.statValue { font-size: 22px; font-weight: 700; color: #00ffcc; text-shadow: 0 0 10px #00ffcc; font-variant-numeric: tabular-nums; }
#highScore .statValue { color: #ffcc00; text-shadow: 0 0 10px #ffcc00; }
#wave .statValue { color: #ff6600; text-shadow: 0 0 10px #ff6600; }

#bottomBar { margin-top: auto; display: flex; justify-content: center; gap: 12px; }
.controlHint {
    background: rgba(0, 20, 30, 0.85);
    border: 1px solid #00ffcc44;
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 11px;
    color: #00ffccaa;
    display: flex;
    align-items: center;
    gap: 6px;
}
.controlHint kbd {
    background: #001122;
    border: 1px solid #00ffcc66;
    border-radius: 4px;
    padding: 2px 8px;
    font-family: inherit;
    font-size: 10px;
    color: #00ffcc;
}

#startScreen, #gameOverScreen, #pauseScreen {
    position: absolute;
    inset: 0;
    background: rgba(5, 5, 16, 0.98);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    z-index: 10;
    backdrop-filter: blur(8px);
}
#startScreen.hidden, #gameOverScreen.hidden, #pauseScreen.hidden { display: none; }
.title {
    font-size: clamp(32px, 8vw, 56px);
    font-weight: 900;
    background: linear-gradient(135deg, #00ffcc, #0066ff, #cc00ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    letter-spacing: 4px;
    animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.3); } }
.subtitle { font-size: 14px; color: #00ffcc88; letter-spacing: 3px; text-transform: uppercase; }
.btn {
    background: linear-gradient(135deg, #003344, #001122);
    border: 2px solid #00ffcc;
    color: #00ffcc;
    padding: 14px 48px;
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
    border-radius: 4px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 2px;
    transition: all 0.2s;
    box-shadow: 0 0 20px #00ffcc44;
}
.btn:hover, .btn:focus { background: linear-gradient(135deg, #00ffcc, #0066ff); color: #000; box-shadow: 0 0 30px #00ffcc, 0 0 60px #0066ff; outline: none; }
.btn:active { transform: scale(0.96); }
.btn.secondary { border-color: #ff6600; color: #ff6600; box-shadow: 0 0 20px #ff660044; }
.btn.secondary:hover, .btn.secondary:focus { background: linear-gradient(135deg, #ff6600, #cc00ff); box-shadow: 0 0 30px #ff6600, 0 0 60px #cc00ff; }

#finalScore { font-size: 28px; font-weight: 700; color: #00ffcc; text-shadow: 0 0 15px #00ffcc; }
#bestScore { font-size: 16px; color: #ffcc00; text-shadow: 0 0 10px #ffcc00; }

.pauseMenu { display: flex; flex-direction: column; gap: 16px; align-items: center; }
.pauseMenu .btn { width: 220px; }

@media (max-width: 600px) {
    #gameContainer { border-width: 2px; border-radius: 0; width: 100vw; height: 100vh; max-width: 100%; max-height: 100%; }
    body { align-items: stretch; justify-content: stretch; }
    #ui { padding: 12px; }
    .statValue { font-size: 18px; }
    .controlHint { padding: 5px 10px; font-size: 10px; }
    .pauseMenu .btn { width: 180px; }
}
</style>
</head>
<body>
<div id="gameContainer">
    <canvas id="canvas"></canvas>
    <div id="ui">
        <div id="topBar">
            <div class="statBox" id="score">
                <div class="statLabel">Score</div>
                <div class="statValue" id="scoreVal">0</div>
            </div>
            <div class="statBox" id="highScore">
                <div class="statLabel">Best</div>
                <div class="statValue" id="highScoreVal">0</div>
            </div>
            <div class="statBox" id="wave">
                <div class="statLabel">Wave</div>
                <div class="statValue" id="waveVal">1</div>
            </div>
        </div>
        <div id="bottomBar">
            <div class="controlHint"><kbd>WASD</kbd> / <kbd>Arrows</kbd> Move</div>
            <div class="controlHint"><kbd>Space</kbd> Dash</div>
            <div class="controlHint">Drag Left: Move / Right: Aim</div>
        </div>
    </div>

    <div id="startScreen">
        <div class="title">NEON SHOOTER</div>
        <div class="subtitle">Twin-Stick Arena Shooter</div>
        <button class="btn" id="startBtn">Start Game</button>
    </div>

    <div id="pauseScreen" class="hidden">
        <div class="title">PAUSED</div>
        <div class="pauseMenu">
            <button class="btn" id="resumeBtn">Resume</button>
            <button class="btn secondary" id="quitToMenuBtn">Quit to Menu</button>
        </div>
    </div>

    <div id="gameOverScreen" class="hidden">
        <div class="title">GAME OVER</div>
        <div id="finalScore">Score: 0</div>
        <div id="bestScore">Best: 0</div>
        <div class="pauseMenu">
            <button class="btn" id="retryBtn">Retry</button>
            <button class="btn secondary" id="mainMenuBtn">Main Menu</button>
        </div>
    </div>
</div>

<script>
// ============================================
// NEON SHOOTER - Twin-Stick Arena Shooter
// ============================================

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// --- Config ---
const CONFIG = {
    baseWidth: 800,
    baseHeight: 600,
    player: {
        radius: 18,
        speed: 6,
        fireRate: 150,
        bulletSpeed: 14,
        bulletDamage: 1,
        dashSpeed: 22,
        dashCooldown: 800,
        dashDuration: 120,
        invincibleDuration: 1500
    },
    enemy: {
        baseSpeed: 1.8,
        baseHealth: 3,
        baseDamage: 10,
        spawnRate: 1200,
        maxEnemies: 50,
        types: {
            basic: { color: '#ff3366', speed: 1.8, health: 3, damage: 10, score: 10, radius: 16 },
            fast: { color: '#ffcc00', speed: 3.5, health: 1, damage: 5, score: 15, radius: 12 },
            tank: { color: '#cc00ff', speed: 1.0, health: 12, damage: 20, score: 40, radius: 24 },
            splitter: { color: '#00ff66', speed: 2.2, health: 5, damage: 15, score: 30, radius: 18 }
        }
    },
    bullet: {
        radius: 4,
        lifetime: 1200
    },
    particle: {
        maxCount: 300
    },
    wave: {
        enemiesPerWave: 10,
        enemyIncreasePerWave: 5,
        spawnRateDecrease: 50,
        minSpawnRate: 400
    },
    arena: {
        padding: 40
    }
};

// --- Game State ---
let running = false;
let paused = false;
let gameTime = 0;
let lastTime = 0;

let player = {
    x: 0, y: 0,
    vx: 0, vy: 0,
    aimX: 0, aimY: 0,
    lastFire: 0,
    dashCooldown: 0,
    dashTime: 0,
    invincibleTime: 0,
    hp: 3,
    maxHp: 3
};

let bullets = [];
let enemies = [];
let particles = [];
let pickups = [];

let score = 0;
let highScore = parseInt(localStorage.getItem('neonShooterHighScore') || '0', 10);
let wave = 1;
let enemiesKilledThisWave = 0;
let enemiesToSpawnThisWave = CONFIG.wave.enemiesPerWave;
let spawnTimer = 0;
let currentSpawnRate = CONFIG.enemy.spawnRate;

let keys = {};
let mouse = { x: 0, y: 0, down: false };
let touchState = { left: null, right: null };

const canvasRect = { x: 0, y: 0, w: CONFIG.baseWidth, h: CONFIG.baseHeight };

// --- DOM Elements ---
const scoreVal = document.getElementById('scoreVal');
const highScoreVal = document.getElementById('highScoreVal');
const waveVal = document.getElementById('waveVal');
const startScreen = document.getElementById('startScreen');
const pauseScreen = document.getElementById('pauseScreen');
const gameOverScreen = document.getElementById('gameOverScreen');
const finalScoreEl = document.getElementById('finalScore');
const bestScoreEl = document.getElementById('bestScore');
const startBtn = document.getElementById('startBtn');
const resumeBtn = document.getElementById('resumeBtn');
const quitToMenuBtn = document.getElementById('quitToMenuBtn');
const retryBtn = document.getElementById('retryBtn');
const mainMenuBtn = document.getElementById('mainMenuBtn');

// --- Init ---
function resize() {
    const container = document.getElementById('gameContainer');
    const rect = container.getBoundingClientRect();
    const scale = Math.min(rect.width / CONFIG.baseWidth, rect.height / CONFIG.baseHeight);
    canvas.width = CONFIG.baseWidth * scale;
    canvas.height = CONFIG.baseHeight * scale;
    canvas.style.width = (CONFIG.baseWidth * scale) + 'px';
    canvas.style.height = (CONFIG.baseHeight * scale) + 'px';
    canvasRect.x = (rect.width - canvas.width) / 2;
    canvasRect.y = (rect.height - canvas.height) / 2;
    canvasRect.w = canvas.width;
    canvasRect.h = canvas.height;
}
window.addEventListener('resize', resize);
resize();

// --- Input ---
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Escape' || e.code === 'KeyP') {
        e.preventDefault();
        if (running) togglePause();
    }
    if (e.code === 'Space' && running && !paused) {
        e.preventDefault();
        tryDash();
    }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = (e.clientX - rect.left) / rect.width * CONFIG.baseWidth;
    mouse.y = (e.clientY - rect.top) / rect.height * CONFIG.baseHeight;
});
canvas.addEventListener('mousedown', e => { mouse.down = true; });
canvas.addEventListener('mouseup', e => { mouse.down = false; });
canvas.addEventListener('mouseleave', e => { mouse.down = false; });

canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    for (let touch of e.changedTouches) {
        const x = (touch.clientX - canvasRect.x) / canvasRect.w * CONFIG.baseWidth;
        const y = (touch.clientY - canvasRect.y) / canvasRect.h * CONFIG.baseHeight;
        if (x < CONFIG.baseWidth / 2) {
            touchState.left = { id: touch.identifier, startX: x, startY: y, currentX: x, currentY: y };
        } else {
            touchState.right = { id: touch.identifier, x, y };
        }
    }
}, { passive: false });
canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    for (let touch of e.changedTouches) {
        const x = (touch.clientX - canvasRect.x) / canvasRect.w * CONFIG.baseWidth;
        const y = (touch.clientY - canvasRect.y) / canvasRect.h * CONFIG.baseHeight;
        if (touchState.left && touchState.left.id === touch.identifier) {
            touchState.left.currentX = x;
            touchState.left.currentY = y;
        }
        if (touchState.right && touchState.right.id === touch.identifier) {
            touchState.right.x = x;
            touchState.right.y = y;
        }
    }
}, { passive: false });
canvas.addEventListener('touchend', e => {
    e.preventDefault();
    for (let touch of e.changedTouches) {
        if (touchState.left && touchState.left.id === touch.identifier) touchState.left = null;
        if (touchState.right && touchState.right.id === touch.identifier) touchState.right = null;
    }
}, { passive: false });

// --- Buttons ---
startBtn.addEventListener('click', startGame);
resumeBtn.addEventListener('click', resumeGame);
quitToMenuBtn.addEventListener('click', quitToMenu);
retryBtn.addEventListener('click', startGame);
mainMenuBtn.addEventListener('click', quitToMenu);

// --- Core Functions ---
function startGame() {
    running = true;
    paused = false;
    gameTime = 0;
    lastTime = performance.now();
    
    player.x = CONFIG.baseWidth / 2;
    player.y = CONFIG.baseHeight / 2;
    player.vx = 0; player.vy = 0;
    player.aimX = 1; player.aimY = 0;
    player.lastFire = 0;
    player.dashCooldown = 0;
    player.dashTime = 0;
    player.invincibleTime = CONFIG.player.invincibleDuration;
    player.hp = player.maxHp;
    
    bullets = [];
    enemies = [];
    particles = [];
    pickups = [];
    
    score = 0;
    wave = 1;
    enemiesKilledThisWave = 0;
    enemiesToSpawnThisWave = CONFIG.wave.enemiesPerWave;
    spawnTimer = 0;
    currentSpawnRate = CONFIG.enemy.spawnRate;
    
    updateUI();
    showStartScreen(false);
    showPauseScreen(false);
    showGameOverScreen(false);
    requestAnimationFrame(gameLoop);
}

function pauseGame() {
    if (!running || paused) return;
    paused = true;
    showPauseScreen(true);
}

function resumeGame() {
    if (!running || !paused) return;
    paused = false;
    showPauseScreen(false);
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
}

function togglePause() {
    if (paused) resumeGame();
    else pauseGame();
}

function quitToMenu() {
    running = false;
    paused = false;
    showPauseScreen(false);
    showGameOverScreen(false);
    showStartScreen(true);
}

function showStartScreen(show) {
    startScreen.classList.toggle('hidden', !show);
}

function showPauseScreen(show) {
    pauseScreen.classList.toggle('hidden', !show);
}

function showGameOverScreen(show) {
    gameOverScreen.classList.toggle('hidden', !show);
}

function gameOver() {
    running = false;
    paused = false;
    if (score > highScore) {
        highScore = score;
        localStorage.setItem('neonShooterHighScore', highScore.toString());
    }
    finalScoreEl.textContent = 'Score: ' + score;
    bestScoreEl.textContent = 'Best: ' + highScore;
    showGameOverScreen(true);
    updateUI();
}

// --- Game Loop ---
function gameLoop(time) {
    if (!running) return;
    if (paused) return;
    
    const dt = time - lastTime;
    lastTime = time;
    gameTime += dt;
    
    update(dt);
    render();
    
    requestAnimationFrame(gameLoop);
}

// --- Update ---
function update(dt) {
    handleInput(dt);
    updatePlayer(dt);
    updateBullets(dt);
    updateEnemies(dt);
    updateParticles(dt);
    updatePickups(dt);
    updateSpawning(dt);
    checkCollisions();
    checkWaveComplete();
}

function handleInput(dt) {
    let moveX = 0, moveY = 0;
    let aimX = 0, aimY = 0;
    
    // Keyboard movement
    if (keys['KeyW'] || keys['ArrowUp']) moveY -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) moveY += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) moveX -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) moveX += 1;
    
    // Keyboard aim (right stick alternative)
    if (keys['KeyI']) aimY -= 1;
    if (keys['KeyK']) aimY += 1;
    if (keys['KeyJ']) aimX -= 1;
    if (keys['KeyL']) aimX += 1;
    
    // Mouse aim
    if (mouse.down || (mouse.x !== 0 || mouse.y !== 0)) {
        aimX = mouse.x - player.x;
        aimY = mouse.y - player.y;
    }
    
    // Touch controls
    if (touchState.left) {
        const dx = touchState.left.currentX - touchState.left.startX;
        const dy = touchState.left.currentY - touchState.left.startY;
        const dist = Math.hypot(dx, dy);
        if (dist > 10) {
            moveX = dx / dist;
            moveY = dy / dist;
        }
    }
    if (touchState.right) {
        aimX = touchState.right.x - player.x;
        aimY = touchState.right.y - player.y;
    }
    
    // Normalize movement
    const moveLen = Math.hypot(moveX, moveY);
    if (moveLen > 0) {
        moveX /= moveLen;
        moveY /= moveLen;
    }
    player.vx = moveX * CONFIG.player.speed;
    player.vy = moveY * moveLen;
    
    // Normalize aim
    const aimLen = Math.hypot(aimX, aimY);
    if (aimLen > 0) {
        player.aimX = aimX / aimLen;
        player.aimY = aimY / aimLen;
    }
    
    // Auto-fire
    if (aimLen > 0 && gameTime - player.lastFire >= CONFIG.player.fireRate) {
        fireBullet();
        player.lastFire = gameTime;
    }
}

function updatePlayer(dt) {
    if (player.dashTime > 0) {
        player.dashTime -= dt;
        player.x += player.dashVx * dt * 0.01;
        player.y += player.dashVy * dt * 0.01;
    } else {
        player.x += player.vx * dt * 0.01;
        player.y += player.vy * dt * 0.01;
    }
    
    // Clamp to arena
    const padding = CONFIG.arena.padding + player.radius;
    player.x = Math.max(padding, Math.min(CONFIG.baseWidth - padding, player.x));
    player.y = Math.max(padding, Math.min(CONFIG.baseHeight - padding, player.y));
    
    if (player.dashCooldown > 0) player.dashCooldown -= dt;
    if (player.invincibleTime > 0) player.invincibleTime -= dt;
}

function tryDash() {
    if (player.dashCooldown <= 0 && (player.vx !== 0 || player.vy !== 0)) {
        const len = Math.hypot(player.vx, player.vy);
        player.dashVx = (player.vx / len) * CONFIG.player.dashSpeed;
        player.dashVy = (player.vy / len) * CONFIG.player.dashSpeed;
        player.dashTime = CONFIG.player.dashDuration;
        player.dashCooldown = CONFIG.player.dashCooldown;
        player.invincibleTime = Math.max(player.invincibleTime, 200);
        createDashParticles();
    }
}

function fireBullet() {
    const spread = (Math.random() - 0.5) * 0.15;
    const cos = player.aimX * Math.cos(spread) - player.aimY * Math.sin(spread);
    const sin = player.aimX * Math.sin(spread) + player.aimY * Math.cos(spread);
    
    bullets.push({
        x: player.x + cos * (player.radius + 4),
        y: player.y + sin * (player.radius + 4),
        vx: cos * CONFIG.player.bulletSpeed,
        vy: sin * CONFIG.player.bulletSpeed,
        damage: CONFIG.player.bulletDamage,
        life: CONFIG.bullet.lifetime
    });
    
    // Muzzle flash particles
    for (let i = 0; i < 3; i++) {
        particles.push({
            x: player.x + cos * player.radius,
            y: player.y + sin * player.radius,
            vx: (cos + (Math.random() - 0.5) * 0.5) * 3,
            vy: (sin + (Math.random() - 0.5) * 0.5) * 3,
            life: 100,
            maxLife: 100,
            color: '#00ffcc',
            size: 3 + Math.random() * 2
        });
    }
}

function updateBullets(dt) {
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx * dt * 0.01;
        b.y += b.vy * dt * 0.01;
        b.life -= dt;
        if (b.life <= 0 || b.x < -20 || b.x > CONFIG.baseWidth + 20 || b.y < -20 || b.y > CONFIG.baseHeight + 20) {
            bullets.splice(i, 1);
        }
    }
}

function spawnEnemy(typeName) {
    const type = CONFIG.enemy.types[typeName];
    const side = Math.floor(Math.random() * 4);
    let x, y;
    const padding = 50;
    switch (side) {
        case 0: x = Math.random() * CONFIG.baseWidth; y = -padding; break;
        case 1: x = CONFIG.baseWidth + padding; y = Math.random() * CONFIG.baseHeight; break;
        case 2: x = Math.random() * CONFIG.baseWidth; y = CONFIG.baseHeight + padding; break;
        case 3: x = -padding; y = Math.random() * CONFIG.baseHeight; break;
    }
    
    const healthMult = 1 + (wave - 1) * 0.15;
    const speedMult = 1 + (wave - 1) * 0.05;
    
    enemies.push({
        x, y,
        vx: 0, vy: 0,
        type: typeName,
        radius: type.radius,
        color: type.color,
        speed: type.speed * speedMult,
        health: Math.ceil(type.health * healthMult),
        maxHealth: Math.ceil(type.health * healthMult),
        damage: type.damage,
        score: type.score,
        split: typeName === 'splitter'
    });
}

function updateEnemies(dt) {
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        const dx = player.x - e.x;
        const dy = player.y - e.y;
        const dist = Math.hypot(dx, dy);
        if (dist > 0) {
            e.vx = (dx / dist) * e.speed;
            e.vy = (dy / dist) * e.speed;
        }
        e.x += e.vx * dt * 0.01;
        e.y += e.vy * dt * 0.01;
        
        // Separation
        for (let j = i + 1; j < enemies.length; j++) {
            const o = enemies[j];
            const sdx = e.x - o.x;
            const sdy = e.y - o.y;
            const sdist = Math.hypot(sdx, sdy);
            const minDist = e.radius + o.radius;
            if (sdist < minDist && sdist > 0) {
                const push = (minDist - sdist) * 0.5;
                e.x += (sdx / sdist) * push;
                e.y += (sdy / sdist) * push;
                o.x -= (sdx / sdist) * push;
                o.y -= (sdy / sdist) * push;
            }
        }
    }
}

function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt * 0.01;
        p.y += p.vy * dt * 0.01;
        p.vx *= 0.98;
        p.vy *= 0.98;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
    }
    if (particles.length > CONFIG.particle.maxCount) {
        particles.splice(0, particles.length - CONFIG.particle.maxCount);
    }
}

function updatePickups(dt) {
    for (let i = pickups.length - 1; i >= 0; i--) {
        const p = pickups[i];
        p.life -= dt;
        p.bob += dt * 0.005;
        p.y += Math.sin(p.bob) * 0.1;
        if (p.life <= 0) pickups.splice(i, 1);
    }
}

function updateSpawning(dt) {
    if (enemies.length >= CONFIG.enemy.maxEnemies) return;
    if (enemiesToSpawnThisWave <= 0) return;
    
    spawnTimer += dt;
    if (spawnTimer >= currentSpawnRate) {
        spawnTimer = 0;
        enemiesToSpawnThisWave--;
        
        let typeName = 'basic';
        const rand = Math.random();
        if (wave >= 3 && rand < 0.15) typeName = 'tank';
        else if (wave >= 2 && rand < 0.3) typeName = 'fast';
        else if (wave >= 4 && rand < 0.4) typeName = 'splitter';
        
        spawnEnemy(typeName);
    }
}

function checkCollisions() {
    // Bullets vs Enemies
    for (let bi = bullets.length - 1; bi >= 0; bi--) {
        const b = bullets[bi];
        for (let ei = enemies.length - 1; ei >= 0; ei--) {
            const e = enemies[ei];
            const dx = b.x - e.x;
            const dy = b.y - e.y;
            if (dx * dx + dy * dy < (e.radius + CONFIG.bullet.radius) ** 2) {
                e.health -= b.damage;
                createHitParticles(b.x, b.y, e.color);
                bullets.splice(bi, 1);
                if (e.health <= 0) {
                    killEnemy(e, ei);
                }
                break;
            }
        }
    }
    
    // Enemies vs Player
    if (player.invincibleTime <= 0) {
        for (let ei = enemies.length - 1; ei >= 0; ei--) {
            const e = enemies[ei];
            const dx = player.x - e.x;
            const dy = player.y - e.y;
            if (dx * dx + dy * dy < (player.radius + e.radius) ** 2) {
                player.hp -= 1;
                player.invincibleTime = CONFIG.player.invincibleDuration;
                createHitParticles(player.x, player.y, '#ff3366', 15);
                if (player.hp <= 0) {
                    gameOver();
                    return;
                }
                // Knockback
                const dist = Math.hypot(dx, dy);
                if (dist > 0) {
                    player.x += (dx / dist) * 30;
                    player.y += (dy / dist) * 30;
                }
                break;
            }
        }
    }
    
    // Pickups vs Player
    for (let i = pickups.length - 1; i >= 0; i--) {
        const p = pickups[i];
        const dx = player.x - p.x;
        const dy = player.y - p.y;
        if (dx * dx + dy * dy < (player.radius + 16) ** 2) {
            applyPickup(p.type);
            createPickupParticles(p.x, p.y, p.color);
            pickups.splice(i, 1);
        }
    }
}

function killEnemy(enemy, index) {
    score += enemy.score * wave;
    enemiesKilledThisWave++;
    createDeathParticles(enemy.x, enemy.y, enemy.color, enemy.radius);
    
    // Drop pickup chance
    if (Math.random() < 0.08) {
        const types = ['health', 'score'];
        pickups.push({
            x: enemy.x, y: enemy.y,
            type: types[Math.floor(Math.random() * types.length)],
            color: types[0] === 'health' ? '#00ff66' : '#ffcc00',
            life: 10000,
            bob: 0
        });
    }
    
    enemies.splice(index, 1);
    updateUI();
}

function applyPickup(type) {
    if (type === 'health') {
        player.hp = Math.min(player.maxHp, player.hp + 1);
    } else if (type === 'score') {
        score += 50 * wave
