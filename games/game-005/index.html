<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Rhythm</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0a0a12;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', 'Courier New', monospace;
    color: #00ffea;
    overflow: hidden;
    touch-action: none;
}
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

#gameContainer {
    position: relative;
    border: 3px solid #00ffea;
    border-radius: 8px;
    box-shadow: 
        0 0 30px #00ffea,
        0 0 60px #cc00ff,
        inset 0 0 30px rgba(0, 255, 234, 0.1);
    background: #050510;
}
canvas { display: block; }

#ui {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    padding: 16px;
}
#topBar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}
.statBox {
    background: rgba(0, 20, 30, 0.85);
    border: 1px solid #00ffea44;
    border-radius: 6px;
    padding: 8px 16px;
    backdrop-filter: blur(4px);
}
.statLabel { font-size: 10px; color: #00ffea88; text-transform: uppercase; letter-spacing: 1px; }
.statValue { font-size: 22px; font-weight: 700; color: #00ffea; text-shadow: 0 0 10px #00ffea; font-variant-numeric: tabular-nums; }
#highScore .statValue { color: #ffcc00; text-shadow: 0 0 10px #ffcc00; }
#combo .statValue { color: #ff6600; text-shadow: 0 0 10px #ff6600; }
#accuracy .statValue { color: #00ffcc; text-shadow: 0 0 10px #00ffcc; }

#bottomBar { margin-top: auto; display: flex; justify-content: center; gap: 12px; }
.controlHint {
    background: rgba(0, 20, 30, 0.85);
    border: 1px solid #00ffea44;
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 11px;
    color: #00ffeaaa;
    display: flex;
    align-items: center;
    gap: 6px;
}
.controlHint kbd {
    background: #001122;
    border: 1px solid #00ffea66;
    border-radius: 4px;
    padding: 2px 8px;
    font-family: inherit;
    font-size: 10px;
    color: #00ffea;
}

.overlay {
    position: absolute;
    inset: 0;
    background: rgba(5, 5, 16, 0.98);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    z-index: 10;
    backdrop-filter: blur(8px);
}
.overlay.hidden { display: none; }
.title {
    font-size: clamp(32px, 8vw, 56px);
    font-weight: 900;
    background: linear-gradient(135deg, #00ffea, #cc00ff, #ffcc00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    letter-spacing: 4px;
    animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.3); } }
.subtitle { font-size: 14px; color: #00ffea88; letter-spacing: 3px; text-transform: uppercase; }
.btn {
    background: linear-gradient(135deg, #003344, #001122);
    border: 2px solid #00ffea;
    color: #00ffea;
    padding: 14px 48px;
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
    border-radius: 4px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 2px;
    transition: all 0.2s;
    box-shadow: 0 0 20px #00ffea44;
}
.btn:hover, .btn:focus { background: linear-gradient(135deg, #00ffea, #cc00ff); color: #000; box-shadow: 0 0 30px #00ffea, 0 0 60px #cc00ff; outline: none; }
.btn:active { transform: scale(0.96); }

#finalScore { font-size: 28px; font-weight: 700; color: #00ffea; text-shadow: 0 0 15px #00ffea; }
#bestScore { font-size: 16px; color: #ffcc00; text-shadow: 0 0 10px #ffcc00; }
#finalCombo { font-size: 20px; color: #ff6600; text-shadow: 0 0 10px #ff6600; }
#finalAcc { font-size: 16px; color: #00ffcc; text-shadow: 0 0 10px #00ffcc; }

@media (max-width: 600px) {
    #gameContainer { border-width: 2px; border-radius: 0; width: 100vw; height: 100vh; max-width: 100%; max-height: 100%; }
    body { align-items: stretch; justify-content: stretch; }
    #ui { padding: 12px; }
    .statValue { font-size: 18px; }
    .controlHint { padding: 5px 10px; font-size: 10px; }
}
</style>
</head>
<body>
<div id="gameContainer">
    <canvas id="canvas"></canvas>
    <div id="ui">
        <div id="topBar">
            <div class="statBox" id="score">
                <div class="statLabel">Score</div>
                <div class="statValue" id="scoreVal">0</div>
            </div>
            <div class="statBox" id="highScore">
                <div class="statLabel">Best</div>
                <div class="statValue" id="highScoreVal">0</div>
            </div>
            <div class="statBox" id="combo">
                <div class="statLabel">Combo</div>
                <div class="statValue" id="comboVal">0</div>
            </div>
            <div class="statBox" id="accuracy">
                <div class="statLabel">Acc</div>
                <div class="statValue" id="accVal">100%</div>
            </div>
        </div>
        <div id="bottomBar">
            <div class="controlHint"><kbd>D</kbd> <kbd>F</kbd> <kbd>J</kbd> <kbd>K</kbd> / Tap Lanes</div>
        </div>
    </div>

    <div id="startScreen" class="overlay">
        <div class="title">NEON RHYTHM</div>
        <div class="subtitle">4-Lane Neon Music Game</div>
        <button class="btn" id="startBtn">Start Game</button>
    </div>

    <div id="pauseOverlay" class="overlay hidden">
        <div class="title">PAUSED</div>
        <div class="subtitle">Wave <span id="pauseWave">1</span> • Score <span id="pauseScore">0</span></div>
        <button class="btn" id="resumeBtn">RESUME</button>
        <button class="btn" id="quitBtn">QUIT TO MENU</button>
    </div>

    <div id="gameOverOverlay" class="overlay hidden">
        <div class="title" style="color: #ff3366;">GAME OVER</div>
        <div id="finalScore">Score: 0</div>
        <div id="finalCombo">Max Combo: 0</div>
        <div id="finalAcc">Accuracy: 100%</div>
        <div id="bestScore">Best: 0</div>
        <button class="btn" id="retryBtn">RETRY</button>
        <button class="btn" id="menuBtn">MAIN MENU</button>
    </div>
</div>

<script>
// ============================================
// NEON RHYTHM - 4-Lane Neon Music Game
// ============================================

// --- Config ---
const CONFIG = {
    baseWidth: 600,
    baseHeight: 800,
    lanes: 4,
    laneWidth: 80,
    judgmentLineY: 680,
    noteHeight: 20,
    noteWidth: 70,
    approachRate: 0.6,
    timingWindows: { perfect: 30, great: 60, good: 100, miss: 150 },
    scores: { perfect: 1000, great: 700, good: 400 },
    comboMultiplier: 1.5,
    spawnInterval: 1200,
    minSpawnInterval: 400,
    difficultyIncrease: 0.98,
    songLength: 120000,
    bpm: 140
};

const LANE_COLORS = [
    { main: '#00ffea', glow: '#00ffff', key: 'D' },
    { main: '#ff006e', glow: '#ff3388', key: 'F' },
    { main: '#ffbe0b', glow: '#ffcc00', key: 'J' },
    { main: '#cc00ff', glow: '#cc66ff', key: 'K' }
];

const KEY_MAP = { 'KeyD': 0, 'KeyF': 1, 'KeyJ': 2, 'KeyK': 3 };

// --- State ---
const state = {
    running: false,
    paused: false,
    score: 0,
    highScore: 0,
    combo: 0,
    maxCombo: 0,
    hits: { perfect: 0, great: 0, good: 0, miss: 0 },
    totalNotes: 0,
    notes: [],
    particles: [],
    screenShake: 0,
    gameTime: 0,
    nextSpawnTime: 1200,
    spawnInterval: 1200,
    pressedLanes: [false, false, false, false],
    lastSpawnTime: 0
};

// --- DOM Elements ---
let gameCanvas, ctx;
let scoreVal, highScoreVal, comboVal, accVal;
let startBtn, retryBtn, menuBtn, resumeBtn, quitBtn;
let startScreen, pauseOverlay, gameOverOverlay;
let finalScoreEl, finalComboEl, finalAccEl, bestScoreEl, pauseWaveEl, pauseScoreEl;

// --- Particle System ---
class Particle {
    constructor(x, y, color, size, life, velocity, gravity = 0) {
        this.x = x; this.y = y;
        this.vx = velocity.x; this.vy = velocity.y;
        this.color = color;
        this.size = size;
        this.maxSize = size;
        this.life = life;
        this.maxLife = life;
        this.gravity = gravity;
    }
    update(dt) {
        this.x += this.vx * dt * 60;
        this.y += this.vy * dt * 60;
        this.vy += this.gravity * dt * 60;
        this.life -= dt;
    }
    draw(ctx) {
        if (this.life <= 0) return;
        const alpha = this.life / this.maxLife;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * (this.life / this.maxLife), 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

// --- Note Class ---
class Note {
    constructor(lane, spawnTime) {
        this.lane = lane;
        this.spawnTime = spawnTime;
        this.y = -50;
        this.hit = false;
        this.judged = false;
    }
    update(currentTime) {
        if (this.hit) return;
        const elapsed = currentTime - this.spawnTime;
        this.y = (elapsed / 2000) * (gameCanvas.height - 50); // 2 second approach
    }
    draw(ctx) {
        if (this.hit) return;
        const color = LANE_COLORS[this.lane];
        const x = 150 + this.lane * 80;
        ctx.save();
        ctx.shadowColor = color.glow;
        ctx.shadowBlur = 15;
        ctx.fillStyle = color.main;
        ctx.fillRect(x - 35, this.y - 10, 70, 20);
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.fillRect(x - 35, this.y - 10, 70, 4);
        ctx.restore();
    }
}

// --- Initialization ---
function init() {
    gameCanvas = document.getElementById('canvas');
    ctx = gameCanvas.getContext('2d');

    // DOM elements
    scoreVal = document.getElementById('scoreVal');
    highScoreVal = document.getElementById('highScoreVal');
    comboVal = document.getElementById('comboVal');
    accVal = document.getElementById('accVal');
    startBtn = document.getElementById('startBtn');
    retryBtn = document.getElementById('retryBtn');
    menuBtn = document.getElementById('menuBtn');
    resumeBtn = document.getElementById('resumeBtn');
    quitBtn = document.getElementById('quitBtn');
    startScreen = document.getElementById('startScreen');
    pauseOverlay = document.getElementById('pauseOverlay');
    gameOverOverlay = document.getElementById('gameOverOverlay');
    finalScoreEl = document.getElementById('finalScore');
    finalComboEl = document.getElementById('finalCombo');
    finalAccEl = document.getElementById('finalAcc');
    bestScoreEl = document.getElementById('bestScore');
    pauseWaveEl = document.getElementById('pauseWave');
    pauseScoreEl = document.getElementById('pauseScore');

    resize();
    window.addEventListener('resize', resize);

    // High score
    state.highScore = parseInt(localStorage.getItem('neonRhythmHS')) || 0;
    highScoreVal.textContent = state.highScore.toLocaleString();

    // Input
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);
    gameCanvas.addEventListener('touchstart', onTouchStart, { passive: false });
    gameCanvas.addEventListener('touchend', onTouchEnd, { passive: false });

    // Buttons
    startBtn.addEventListener('click', startGame);
    retryBtn.addEventListener('click', startGame);
    menuBtn.addEventListener('click', quitToMenu);
    resumeBtn.addEventListener('click', resumeGame);
    quitBtn.addEventListener('click', quitToMenu);

    document.addEventListener('keydown', (e) => {
        if (e.code === 'Enter' && !state.running && !startScreen.classList.contains('hidden')) startGame();
        if (e.code === 'Escape') {
            if (state.running && !state.paused) pauseGame();
            else if (state.running && state.paused) resumeGame();
        }
    });

    showStartScreen();
    requestAnimationFrame(gameLoop);
}

function resize() {
    const container = document.getElementById('gameContainer');
    const maxW = Math.min(window.innerWidth * 0.95, 600);
    const maxH = Math.min(window.innerHeight * 0.95, 800);
    const scale = Math.min(maxW / 600, maxH / 800);
    gameCanvas.width = 600 * scale;
    gameCanvas.height = 800 * scale;
    gameCanvas.style.width = (600 * scale) + 'px';
    gameCanvas.style.height = (800 * scale) + 'px';
}

// --- Game Control ---
function startGame() {
    state.running = true;
    state.paused = false;
    state.score = 0;
    state.combo = 0;
    state.maxCombo = 0;
    state.hits = { perfect: 0, great: 0, good: 0, miss: 0 };
    state.totalNotes = 0;
    state.notes = [];
    state.particles = [];
    state.gameTime = 0;
    state.spawnInterval = 1200;
    state.lastSpawnTime = performance.now();
    state.pressedLanes = [false, false, false, false];

    startScreen.classList.add('hidden');
    pauseOverlay.classList.add('hidden');
    gameOverOverlay.classList.add('hidden');
    updateUI();
}

function pauseGame() {
    if (!state.running || state.paused) return;
    state.paused = true;
    pauseWaveEl.textContent = Math.floor(state.gameTime / 10000) + 1;
    pauseScoreEl.textContent = state.score.toLocaleString();
    pauseOverlay.classList.remove('hidden');
}

function resumeGame() {
    if (!state.running || !state.paused) return;
    state.paused = false;
    pauseOverlay.classList.add('hidden');
    state.lastSpawnTime = performance.now(); // reset spawn timer
}

function quitToMenu() {
    state.running = false;
    state.paused = false;
    pauseOverlay.classList.add('hidden');
    gameOverOverlay.classList.add('hidden');
    showStartScreen();
}

function showStartScreen() {
    state.running = false;
    state.paused = false;
    startScreen.classList.remove('hidden');
    pauseOverlay.classList.add('hidden');
    gameOverOverlay.classList.add('hidden');
}

function endGame() {
    state.running = false;
    state.paused = false;
    const acc = state.totalNotes > 0 ? Math.round((state.hits.perfect + state.hits.great + state.hits.good) / state.totalNotes * 100) : 100;
    if (state.score > state.highScore) {
        state.highScore = state.score;
        localStorage.setItem('neonRhythmHS', state.highScore);
    }
    finalScoreEl.textContent = 'Score: ' + state.score.toLocaleString();
    finalComboEl.textContent = 'Max Combo: ' + state.maxCombo;
    finalAccEl.textContent = 'Accuracy: ' + acc + '%';
    bestScoreEl.textContent = 'Best: ' + state.highScore.toLocaleString();
    gameOverOverlay.classList.remove('hidden');
}

// --- Input Handling ---
function onKeyDown(e) {
    if (!state.running || state.paused) return;
    const lane = KEY_MAP[e.code];
    if (lane !== undefined && !state.pressedLanes[lane]) {
        state.pressedLanes[lane] = true;
        checkHit(lane);
    }
}

function onKeyUp(e) {
    const lane = KEY_MAP[e.code];
    if (lane !== undefined) state.pressedLanes[lane] = false;
}

function onTouchStart(e) {
    e.preventDefault();
    if (!state.running || state.paused) return;
    const rect = gameCanvas.getBoundingClientRect();
    for (let t of e.changedTouches) {
        const x = t.clientX - rect.left;
        const lane = Math.floor(x / (gameCanvas.width / 4));
        if (lane >= 0 && lane < 4 && !state.pressedLanes[lane]) {
            state.pressedLanes[lane] = true;
            checkHit(lane);
        }
    }
}

function onTouchEnd(e) {
    if (!state.running) return;
    const rect = gameCanvas.getBoundingClientRect();
    for (let t of e.changedTouches) {
        const x = t.clientX - rect.left;
        const lane = Math.floor(x / (gameCanvas.width / 4));
        if (lane >= 0 && lane < 4) state.pressedLanes[lane] = false;
    }
}

// --- Game Logic ---
function checkHit(lane) {
    let bestNote = null;
    let bestDiff = Infinity;
    const judgmentY = gameCanvas.height - 100;

    for (const note of state.notes) {
        if (note.lane !== lane || note.hit) continue;
        const diff = Math.abs(note.y - judgmentY);
        if (diff < bestDiff) {
            bestDiff = diff;
            bestNote = note;
        }
    }

    if (bestNote) {
        let judgment, points;
        if (bestDiff <= 30) { judgment = 'perfect'; points = 1000; }
        else if (bestDiff <= 60) { judgment = 'great'; points = 700; }
        else if (bestDiff <= 100) { judgment = 'good'; points = 400; }
        else { judgment = 'miss'; points = 0; }

        bestNote.hit = true;

        if (judgment === 'miss') {
            state.combo = 0;
            state.hits.miss++;
        } else {
            state.combo++;
            state.maxCombo = Math.max(state.maxCombo, state.combo);
            state.hits[judgment]++;
            const multiplier = 1 + Math.floor(state.combo / 10) * 0.5;
            state.score += Math.round(points * multiplier);
        }

        // Particles
        const color = LANE_COLORS[lane].glow;
        for (let i = 0; i < 15; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 50 + Math.random() * 150;
            state.particles.push(new Particle(
                150 + lane * 80,
                gameCanvas.height - 100,
                color,
                3 + Math.random() * 4,
                0.5 + Math.random() * 0.5,
                { x: Math.cos(angle) * speed, y: Math.sin(angle) * speed - 100 },
                0
            ));
        }

        updateUI();
    }
}

function spawnNote(currentTime) {
    const lane = Math.floor(Math.random() * 4);
    state.notes.push(new Note(lane, currentTime));
    state.totalNotes++;
}

function update(dt) {
    if (!state.running || state.paused) return;

    state.gameTime += dt * 1000;
    const currentTime = state.gameTime;

    // Update notes
    for (let i = state.notes.length - 1; i >= 0; i--) {
        const note = state.notes[i];
        note.update(currentTime);

        // Auto-miss if past judgment line
        if (note.y > gameCanvas.height + 50 && !note.hit) {
            note.hit = true;
            state.combo = 0;
            state.hits.miss++;
        }

        if (note.y > gameCanvas.height + 100) {
            state.notes.splice(i, 1);
        }
    }

    // Update particles
    for (let i = state.particles.length - 1; i >= 0; i--) {
        state.particles[i].update(dt);
        if (state.particles[i].life <= 0) state.particles.splice(i, 1);
    }

    // Spawn new notes
    if (currentTime - state.lastSpawnTime > state.spawnInterval) {
        spawnNote(currentTime);
        state.lastSpawnTime = currentTime;
        state.spawnInterval = Math.max(400, state.spawnInterval * 0.9995);
    }

    // Check for song end (optional)
    if (state.gameTime > CONFIG.songLength) {
        endGame();
    }
}

function updateUI() {
    scoreVal.textContent = state.score.toLocaleString();
    comboVal.textContent = state.combo.toLocaleString();
    const acc = state.totalNotes > 0 ? Math.round((state.hits.perfect + state.hits.great + state.hits.good) / state.totalNotes * 100) : 100;
    accVal.textContent = acc + '%';
    highScoreVal.textContent = state.highScore.toLocaleString();
}

// --- Rendering ---
function drawBackground() {
    ctx.fillStyle = '#050510';
    ctx.fillRect(0, 0, gameCanvas.width, gameCanvas.height);

    // Lane backgrounds
    for (let i = 0; i < 4; i++) {
        ctx.fillStyle = LANE_COLORS[i].main + '22';
        ctx.fillRect(150 + i * 80 - 40, 0, 80, gameCanvas.height);
    }

    // Grid lines
    ctx.strokeStyle = '#003333';
    ctx.lineWidth = 0.5;
    for (let i = 0; i <= 4; i++) {
        const x = 150 + i * 80;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, gameCanvas.height);
        ctx.stroke();
    }

    // Judgment line
    ctx.strokeStyle = '#00ffea';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#00ffea';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.moveTo(150, gameCanvas.height - 100);
    ctx.lineTo(150 + 4 * 80, gameCanvas.height - 100);
    ctx.stroke();
    ctx.shadowBlur = 0;
}

function drawNotes() {
    state.notes.forEach(note => note.draw(ctx));
}

function drawParticles() {
    state.particles.forEach(p => p.draw(ctx));
}

function draw() {
    drawBackground();
    drawNotes();
    drawParticles();
}

// --- Main Loop ---
let lastTime = 0;
function gameLoop(timestamp) {
    const dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;
    update(dt);
    draw();
    requestAnimationFrame(gameLoop);
}

// Start
init();
</script>
</body>
</html>
