<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Rhythm</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0a0a12;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', 'Courier New', monospace;
    color: #00ffea;
    overflow: hidden;
    touch-action: none;
}
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

#gameContainer {
    position: relative;
    border: 3px solid #00ffea;
    border-radius: 8px;
    box-shadow: 
        0 0 30px #00ffea,
        0 0 60px #cc00ff,
        inset 0 0 30px rgba(0, 255, 234, 0.1);
    background: #050510;
}
canvas { display: block; }

#ui {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    padding: 16px;
}
#topBar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}
.statBox {
    background: rgba(0, 20, 30, 0.85);
    border: 1px solid #00ffea44;
    border-radius: 6px;
    padding: 8px 16px;
    backdrop-filter: blur(4px);
}
.statLabel { font-size: 10px; color: #00ffea88; text-transform: uppercase; letter-spacing: 1px; }
.statValue { font-size: 22px; font-weight: 700; color: #00ffea; text-shadow: 0 0 10px #00ffea; font-variant-numeric: tabular-nums; }
#highScore .statValue { color: #ffcc00; text-shadow: 0 0 10px #ffcc00; }
#combo .statValue { color: #ff6600; text-shadow: 0 0 10px #ff6600; }
#accuracy .statValue { color: #00ffcc; text-shadow: 0 0 10px #00ffcc; }

#bottomBar { margin-top: auto; display: flex; justify-content: center; gap: 12px; }
.controlHint {
    background: rgba(0, 20, 30, 0.85);
    border: 1px solid #00ffea44;
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 11px;
    color: #00ffeaaa;
    display: flex;
    align-items: center;
    gap: 6px;
}
.controlHint kbd {
    background: #001122;
    border: 1px solid #00ffea66;
    border-radius: 4px;
    padding: 2px 8px;
    font-family: inherit;
    font-size: 10px;
    color: #00ffea;
}

#startScreen, #gameOverScreen {
    position: absolute;
    inset: 0;
    background: rgba(5, 5, 16, 0.98);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    z-index: 10;
    backdrop-filter: blur(8px);
}
#startScreen.hidden, #gameOverScreen.hidden { display: none; }
.title {
    font-size: clamp(32px, 8vw, 56px);
    font-weight: 900;
    background: linear-gradient(135deg, #00ffea, #cc00ff, #ffcc00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    letter-spacing: 4px;
    animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.3); } }
.subtitle { font-size: 14px; color: #00ffea88; letter-spacing: 3px; text-transform: uppercase; }
.btn {
    background: linear-gradient(135deg, #003344, #001122);
    border: 2px solid #00ffea;
    color: #00ffea;
    padding: 14px 48px;
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
    border-radius: 4px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 2px;
    transition: all 0.2s;
    box-shadow: 0 0 20px #00ffea44;
}
.btn:hover, .btn:focus { background: linear-gradient(135deg, #00ffea, #cc00ff); color: #000; box-shadow: 0 0 30px #00ffea, 0 0 60px #cc00ff; outline: none; }
.btn:active { transform: scale(0.96); }

#finalScore { font-size: 28px; font-weight: 700; color: #00ffea; text-shadow: 0 0 15px #00ffea; }
#bestScore { font-size: 16px; color: #ffcc00; text-shadow: 0 0 10px #ffcc00; }
#finalCombo { font-size: 20px; color: #ff6600; text-shadow: 0 0 10px #ff6600; }
#finalAcc { font-size: 16px; color: #00ffcc; text-shadow: 0 0 10px #00ffcc; }

@media (max-width: 600px) {
    #gameContainer { border-width: 2px; border-radius: 0; width: 100vw; height: 100vh; max-width: 100%; max-height: 100%; }
    body { align-items: stretch; justify-content: stretch; }
    #ui { padding: 12px; }
    .statValue { font-size: 18px; }
    .controlHint { padding: 5px 10px; font-size: 10px; }
}
</style>
</head>
<body>
<div id="gameContainer">
    <canvas id="canvas"></canvas>
    <div id="ui">
        <div id="topBar">
            <div class="statBox" id="score">
                <div class="statLabel">Score</div>
                <div class="statValue" id="scoreVal">0</div>
            </div>
            <div class="statBox" id="highScore">
                <div class="statLabel">Best</div>
                <div class="statValue" id="highScoreVal">0</div>
            </div>
            <div class="statBox" id="combo">
                <div class="statLabel">Combo</div>
                <div class="statValue" id="comboVal">0</div>
            </div>
            <div class="statBox" id="accuracy">
                <div class="statLabel">Acc</div>
                <div class="statValue" id="accVal">100%</div>
            </div>
        </div>
        <div id="bottomBar">
            <div class="controlHint"><kbd>D</kbd> <kbd>F</kbd> <kbd>J</kbd> <kbd>K</kbd> / Tap Lanes</div>
        </div>
    </div>

    <div id="startScreen">
        <div class="title">NEON RHYTHM</div>
        <div class="subtitle">4-Lane Neon Music Game</div>
        <button class="btn" id="startBtn">Start Game</button>
    </div>

    <div id="gameOverScreen" class="hidden">
        <div class="title">GAME OVER</div>
        <div id="finalScore">Score: 0</div>
        <div id="finalCombo">Max Combo: 0</div>
        <div id="finalAcc">Accuracy: 100%</div>
        <div id="bestScore">Best: 0</div>
        <button class="btn" id="retryBtn">Play Again</button>
    </div>
</div>

<script>
// ============================================
// NEON RHYTHM - 4-Lane Neon Music Game
// ============================================

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// --- Config ---
const CONFIG = {
    baseWidth: 600,
    baseHeight: 800,
    lanes: 4,
    laneWidth: 80,
    judgmentLineY: 680,
    noteHeight: 20,
    noteWidth: 70,
    approachRate: 0.6,
    timingWindows: { perfect: 30, great: 60, good: 100, miss: 150 },
    scores: { perfect: 1000, great: 700, good: 400 },
    comboMultiplier: 1.5,
    spawnInterval: 1200,
    minSpawnInterval: 400,
    difficultyIncrease: 0.98,
    songLength: 120000,
    bpm: 140
};

const LANE_COLORS = [
    { main: '#00ffea', glow: '#00ffff', key: 'D' },
    { main: '#ff006e', glow: '#ff3388', key: 'F' },
    { main: '#ffbe0b', glow: '#ffcc00', key: 'J' },
    { main: '#cc00ff', glow: '#cc66ff', key: 'K' }
];

const KEY_MAP = { 'KeyD': 0, 'KeyF': 1, 'KeyJ': 2, 'KeyK': 3 };

// --- State ---
let state = {
    running: false,
    score: 0,
    highScore: 0,
    combo: 0,
    maxCombo: 0,
    hits: { perfect: 0, great: 0, good: 0, miss: 0 },
    totalNotes: 0,
    notes: [],
    particles: [],
    screenShake: 0,
    gameTime: 0,
    nextSpawnTime: 1200,
    spawnInterval: 1200,
    pressedLanes: [false, false, false, false]
};

// --- Particle System ---
class Particle {
    constructor(x, y, color, size, life, velocity, gravity = 0) {
        this.x = x; this.y = y;
        this.vx = velocity.x; this.vy = velocity.y;
        this.color = color;
        this.size = size;
        this.maxSize = size;
        this.life = life;
        this.maxLife = life;
        this.gravity = gravity;
    }
    update(dt) {
        this.x += this.vx * dt * 60;
        this.y += this.vy * dt * 60;
        this.vy += this.gravity * dt * 60;
        this.life -= dt;
    }
    draw(ctx) {
        if (this.life <= 0) return;
        const alpha = this.life / this.maxLife;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * (this.life / this.maxLife), 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

class ParticleSystem {
    constructor() { this.particles = []; }
    emit(x, y, color, count, options = {}) {
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * (options.maxSpeed || 200) + (options.minSpeed || 50);
            const vx = Math.cos(angle) * speed;
            const vy = Math.sin(angle) * speed;
            this.particles.push({
                x, y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                color,
                size: Math.random() * (options.maxSize || 5) + (options.minSize || 2),
                life: Math.random() * (options.maxLife || 0.5) + (options.minLife || 0.2),
                maxLife: Math.random() * (options.maxLife || 0.5) + (options.minLife || 0.2),
                gravity: options.gravity || 0
            });
        }
    }
    update(dt) {
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.x += p.vx * dt * 60;
            p.y += p.vy * dt * 60;
            p.vy += p.gravity * dt * 60;
            p.life -= dt;
            if (p.life <= 0) this.particles.splice(i, 1);
        }
    }
    draw(ctx) { this.particles.forEach(p => p.draw(ctx)); }
}

// --- Note Class ---
class Note {
    constructor(lane, startTime) {
        this.lane = lane;
        this.startTime = startTime;
        this.y = -100;
        this.hit = false;
        this.judged = false;
    }
    update(currentTime) {
        if (this.hit) return;
        const elapsed = currentTime - this.startTime;
        this.y = (elapsed / 2000) * (canvas.height - 100); // 2 second approach
    }
    getJudgment(currentTime) {
        const diff = Math.abs(currentTime - (this.startTime + 2000)); // 2 second approach time
        if (diff <= 30) return 'perfect';
        if (diff <= 60) return 'great';
        if (diff <= 100) return 'good';
        return 'miss';
    }
    draw(ctx) {
        if (this.hit) return;
        const color = LANE_COLORS[this.lane];
        const x = 150 + this.lane * 80;
        const width = 70;
        const height = 20;
        
        ctx.save();
        ctx.shadowColor = LANE_COLORS[this.lane].glow;
        ctx.shadowBlur = 15;
        ctx.fillStyle = LANE_COLORS[this.lane].main;
        
        // Note body
        ctx.fillRect(150 + this.lane * 80 - 35, this.y - 10, 70, 20);
        
        // Glow highlight
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.fillRect(this.x - 35, this.y - 10, 70, 4);
        ctx.restore();
    }
}

// --- State ---
let canvas, ctx;
let running = false;
let score = 0;
let highScore = 0;
let combo = 0;
let maxCombo = 0;
let hits = { perfect: 0, great: 0, good: 0, miss: 0 };
let totalNotes = 0;
let notes = [];
let particles = null;
let screenShake = 0;
let gameTime = 0;
let nextSpawnTime = 1200;
let spawnInterval = 1200;
let pressedLanes = [false, false, false, false];
let currentSpeed = 1;
let currentSpawnInterval = 1200;
let nextSpawnTime = 1200;

// DOM Elements
let startBtn, retryBtn, startScreen, gameOverScreen;
let scoreVal, highScoreVal, comboVal, accVal, highScoreVal;
let finalScoreEl, highScoreEl, finalComboEl, finalAccEl, gameOverScreen, startScreen, startBtn, retryBtn;
let canvas, ctx;

function init() {
    canvas = document.getElementById('canvas');
    ctx = canvas.getContext('2d');
    
    // DOM elements
    startBtn = document.getElementById('startBtn');
    retryBtn = document.getElementById('retryBtn');
    startScreen = document.getElementById('startScreen');
    gameOverScreen = document.getElementById('gameOverScreen');
    scoreVal = document.getElementById('scoreVal');
    highScoreVal = document.getElementById('highScoreVal');
    comboVal = document.getElementById('comboVal');
    accVal = document.getElementById('accVal');
    highScoreVal = document.getElementById('highScoreVal');
    finalScoreEl = document.getElementById('finalScore');
    highScoreEl = document.getElementById('highScoreEl');
    finalComboEl = document.getElementById('finalCombo');
    finalAccEl = document.getElementById('finalAcc');
    gameOverScreen = document.getElementById('gameOverScreen');
    startScreen = document.getElementById('startScreen');
    startBtn = document.getElementById('startBtn');
    retryBtn = document.getElementById('retryBtn');
    
    resize();
    window.addEventListener('resize', resize);
    
    // High score
    const savedHS = parseInt(localStorage.getItem('neonRhythmHS')) || 0;
    document.getElementById('highScoreVal').textContent = '0';
    
    // Input
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);
    canvas.addEventListener('touchstart', onTouchStart, { passive: false });
    canvas.addEventListener('touchend', onTouchEnd, { passive: false });
    
    // Buttons
    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('retryBtn').addEventListener('click', startGame);
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Enter' && !running && startScreen.classList.contains('hidden') === false) startGame();
    });
    
    // Touch lane detection
    canvas.addEventListener('touchstart', onTouchStart, { passive: false });
    canvas.addEventListener('touchend', onTouchEnd, { passive: false });
    
    // Particle system
    particles = [];
    
    // High score
    const savedHS = parseInt(localStorage.getItem('neonRhythmHS')) || 0;
    document.getElementById('highScoreVal').textContent = '0';
    
    showStartScreen();
    requestAnimationFrame(gameLoop);
}

function resize() {
    const container = document.getElementById('gameContainer');
    const maxW = Math.min(window.innerWidth * 0.95, 600);
    const maxH = Math.min(window.innerHeight * 0.95, 800);
    const scale = Math.min(maxW / 600, maxH / 800);
    canvas.width = 600 * scale;
    canvas.height = 800 * scale;
    canvas.style.width = (600 * canvas.width / 600) + 'px';
    canvas.style.height = (800 * canvas.height / 800) + 'px';
}

function startGame() {
    // Reset state
    score = 0;
    combo = 0;
    maxCombo = 0;
    hits = { perfect: 0, great: 0, good: 0, miss: 0 };
    totalNotes = 0;
    notes = [];
    nextSpawnTime = 1200;
    spawnInterval = 1200;
    gameTime = 0;
    nextSpawnTime = 1200;
    pressedLanes = [false, false, false, false];
    running = true;
    
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('gameOverScreen').classList.add('hidden');
    document.getElementById('scoreVal').textContent = '0';
    document.getElementById('comboVal').textContent = '0';
    document.getElementById('accVal').textContent = '100%';
    document.getElementById('highScoreVal').textContent = localStorage.getItem('neonRhythmHS') || '0';
}

function endGame() {
    running = false;
    const acc = totalNotes > 0 ? Math.round((hits.perfect + hits.great + hits.good) / totalNotes * 100) : 100;
    if (score > highScore) {
        highScore = score;
        localStorage.setItem('neonRhythmHS', highScore);
    }
    document.getElementById('finalScore').textContent = 'SCORE: ' + score.toLocaleString();
    document.getElementById('highScoreEl').textContent = 'BEST: ' + highScore.toLocaleString();
    document.getElementById('finalCombo').textContent = 'MAX COMBO: ' + maxCombo;
    document.getElementById('finalAcc').textContent = 'ACCURACY: ' + acc + '%';
    document.getElementById('gameOverScreen').classList.remove('hidden');
}

// Input
function onKeyDown(e) {
    if (e.code === 'Escape') {
        if (state.running && !document.getElementById('pauseOverlay').classList.contains('hidden')) {
            resumeGame();
        } else if (state.running) {
            pauseGame();
        }
        return;
    }
    if (!running) return;
    const lane = KEY_MAP[e.code];
    if (lane !== undefined && !pressedLanes[lane]) {
        pressedLanes[lane] = true;
        checkHit(lane);
    }
}

function onKeyUp(e) {
    const lane = KEY_MAP[e.code];
    if (lane !== undefined) {
        pressedLanes[lane] = false;
    }
}

function onTouchStart(e) {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    for (let t of e.changedTouches) {
        const x = t.clientX - canvas.getBoundingClientRect().left;
        const lane = Math.floor(x / (canvas.width / 4));
        if (lane >= 0 && lane < 4 && !pressedLanes[lane]) {
            pressedLanes[lane] = true;
            checkHit(lane);
        }
    }
}

function onTouchEnd(e) {
    for (let t of e.changedTouches) {
        const x = t.clientX - canvas.getBoundingClientRect().left;
        const lane = Math.floor(x / (canvas.width / 4));
        if (lane >= 0 && lane < 4) {
            pressedLanes[lane] = false;
        }
    }
}

function checkHit(lane) {
    let bestNote = null;
    let bestDiff = Infinity;
    
    for (const note of notes) {
        if (note.lane !== lane || note.hit) continue;
        const diff = Math.abs(note.y - (canvas.height - 100));
        if (diff < bestDiff) {
            bestDiff = diff;
            bestNote = note;
        }
    }
    
    if (bestNote) {
        const diff = Math.abs(bestNote.y - (canvas.height - 100));
        let judgment, points;
        
        if (diff <= 30) { judgment = 'perfect'; points = 1000; }
        else if (diff <= 60) { judgment = 'great'; points = 700; }
        else if (diff <= 100) { judgment = 'good'; points = 400; }
        else { judgment = 'miss'; points = 0; }
        
        bestNote.hit = true;
        
        if (judgment === 'miss') {
            combo = 0;
            hits.miss++;
        } else {
            combo++;
            maxCombo = Math.max(maxCombo, combo);
            hits[judgment]++;
            score += points * (1 + Math.floor(combo / 10) * 0.5);
        }
        
        // Particles
        for (let i = 0; i < 15; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 50 + Math.random() * 150;
            particles.push({
                x: 150 + lane * 80,
                y: canvas.height - 100,
                vx: Math.cos(angle) * (50 + Math.random() * 100),
                vy: Math.sin(angle) * (50 + Math.random() * 100) - 100,
                color: LANE_COLORS[lane].glow,
                size: 3 + Math.random() * 4,
                life: 0.5 + Math.random() * 0.5,
                maxLife: 0.5 + Math.random() * 0.5,
                gravity: 0
            });
        }
        
        updateUI();
    }
}

function spawnNote() {
    const lane = Math.floor(Math.random() * 4);
    notes.push({
        lane: lane,
        y: -50,
        hit: false,
        time: Date.now()
    });
    totalNotes++;
}

function update(dt) {
    // Update notes
    for (let i = notes.length - 1; i >= 0; i--) {
        const note = notes[i];
        note.y += 300 * dt; // Note speed
        
        // Auto-miss if past judgment line
        if (note.y > canvas.height + 50 && !note.hit) {
            note.hit = true;
            combo = 0;
            hits.miss++;
        }
        
        if (note.y > canvas.height + 100) {
            notes.splice(i, 1);
        }
    }
    
    // Spawn new notes
    if (Date.now() - lastSpawnTime > spawnInterval) {
        const lane = Math.floor(Math.random() * 4);
        notes.push({
            x: 150 + lane * 80,
            y: -50,
            lane: lane,
            hit: false
        });
        totalNotes++;
        lastSpawnTime = Date.now();
    }
    
    // Increase difficulty
    if (spawnInterval > 400) {
        spawnInterval *= 0.9995;
    }
}

function updateUI() {
    document.getElementById('scoreVal').textContent = score.toLocaleString();
    document.getElementById('comboVal').textContent = combo.toLocaleString();
    const acc = totalNotes > 0 ? Math.round((hits.perfect + hits.great + hits.good) / (totalNotes) * 100) : 100;
    document.getElementById('accVal').textContent = acc + '%';
}

function drawBackground() {
    ctx.fillStyle = '#050510';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Grid
    ctx.strokeStyle = '#003333';
    ctx.lineWidth = 0.5;
    for (let i = 0; i <= 4; i++) {
        const x = 150 + i * 80;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
    }
    
    // Judgment line
    ctx.strokeStyle = '#00ffea';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#00ffea';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.moveTo(150, canvas.height - 100);
    ctx.lineTo(150 + 4 * 80, canvas.height - 100);
    ctx.stroke();
    ctx.shadowBlur = 0;
}

function drawNotes() {
    notes.forEach(note => {
        if (!note.hit) {
            const color = LANE_COLORS[note.lane];
            ctx.save();
            ctx.shadowColor = LANE_COLORS[note.lane].glow;
            ctx.shadowBlur = 15;
            ctx.fillStyle = LANE_COLORS[note.lane].main;
            ctx.fillRect(150 + note.lane * 80 - 35, note.y - 10, 70, 20);
            ctx.restore();
        }
    }
}

function drawParticles() {
    particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    });
}

function draw() {
    // Clear
    ctx.fillStyle = '#050510';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Lanes
    for (let i = 0; i < 4; i++) {
        ctx.fillStyle = LANE_COLORS[i].main + '22';
        ctx.fillRect(150 + i * 80 - 40, 0, 80, canvas.height);
    }
    
    // Judgment line
    ctx.strokeStyle = '#00ffea';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#00ffea';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.moveTo(150, canvas.height - 100);
    ctx.lineTo(150 + 4 * 80, canvas.height - 100);
    ctx.stroke();
    ctx.shadowBlur = 0;
    
    // Notes
    notes.forEach(note => {
        if (!note.hit) {
            const color = LANE_COLORS[note.lane];
            ctx.save();
            ctx.shadowColor = LANE_COLORS[note.lane].glow;
            ctx.shadowBlur = 15;
            ctx.fillStyle = LANE_COLORS[note.lane].main;
            ctx.fillRect(150 + note.lane * 80 - 35, note.y - 10, 70, 20);
            ctx.restore();
        }
    });
    
    // Particles
    particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    });
}

function gameLoop(timestamp) {
    const dt = 1/60;
    update(1/60);
    draw();
    requestAnimationFrame(gameLoop);
}

function onKeyDown(e) {
    if (e.code === 'Escape') {
        if (state.running && !document.getElementById('pauseOverlay').classList.contains('hidden')) {
            resumeGame();
        } else if (state.running) {
            pauseGame();
        }
        return;
    }
    if (!running) return;
    const lane = KEY_MAP[e.code];
    if (lane !== undefined && !pressedLanes[lane]) {
        pressedLanes[lane] = true;
        checkHit(lane);
    }
}

function onKeyUp(e) {
    const lane = KEY_MAP[e.code];
    if (lane !== undefined) pressedLanes[lane] = false;
}

function onTouchStart(e) {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    for (let t of e.changedTouches) {
        const x = t.clientX - canvas.getBoundingClientRect().left;
        const lane = Math.floor(x / (canvas.width / 4));
        if (lane >= 0 && lane < 4 && !pressedLanes[lane]) {
            pressedLanes[lane] = true;
            checkHit(lane);
        }
    }
}

function onTouchEnd(e) {
    for (let t of e.changedTouches) {
        const x = t.clientX - canvas.getBoundingClientRect().left;
        const lane = Math.floor(x / (canvas.width / 4));
        if (lane >= 0 && lane < 4) pressedLanes[lane] = false;
    }
}

function init() {
    canvas = document.getElementById('canvas');
    ctx = canvas.getContext('2d');
    
    resize();
    window.addEventListener('resize', resize);
    
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', (e) => {
        const lane = KEY_MAP[e.code];
        if (lane !== undefined) pressedLanes[lane] = false;
    });
    
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        for (let t of e.changedTouches) {
            const x = t.clientX - canvas.getBoundingClientRect().left;
            const lane = Math.floor(x / (canvas.width / 4));
            if (lane >= 0 && lane < 4 && !pressedLanes[lane]) {
                pressedLanes[lane] = true;
                checkHit(lane);
            }
        }
    }, { passive: false });
    
    canvas.addEventListener('touchend', (e) => {
        for (let t of e.changedTouches) {
            const x = t.clientX - canvas.getBoundingClientRect().left;
            const lane = Math.floor(x / (canvas.width / 4));
            if (lane >= 0 && lane < 4) pressedLanes[lane] = false;
        }
    }, { passive: false });
    
    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('retryBtn').addEventListener('click', startGame);
    
    showStartScreen();
    requestAnimationFrame(gameLoop);
}

function startGame() {
    score = 0;
    combo = 0;
    maxCombo = 0;
    hits = { perfect: 0, great: 0, good: 0, miss: 0 };
    totalNotes = 0;
    lastNoteTime = Date.now();
    spawnInterval = 1200;
    notes = [];
    spawnTimer = 0;
    
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('gameOverScreen').classList.add('hidden');
    document.getElementById('scoreVal').textContent = '0';
    document.getElementById('comboVal').textContent = '0';
    document.getElementById('accVal').textContent = '100%';
    document.getElementById('highScoreVal').textContent = localStorage.getItem('neonRhythmHS') || '0';
    
    running = true;
    score = 0;
    combo = 0;
    maxCombo = 0;
    totalNotes = 0;
    hitCounts = { perfect: 0, great: 0, good: 0, miss: 0 };
    notes = [];
    lastNoteTime = Date.now();
    spawnInterval = 1200;
    nextNoteTime = Date.now() + 1000;
    
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('gameOverScreen').classList.add('hidden');
    document.getElementById('scoreVal').textContent = '0';
    document.getElementById('comboVal').textContent = '0';
    document.getElementById('accVal').textContent = '100%';
    document.getElementById('highScoreVal').textContent = localStorage.getItem('neonRhythmHS') || '0';
}

function gameLoop(timestamp) {
    if (running) {
        update(1/60);
        draw();
    }
    requestAnimationFrame(gameLoop);
}

function update(dt) {
    // Update notes
    for (let i = notes.length - 1; i >= 0; i--) {
        const note = notes[i];
        note.y += 300 * (1/60);
        if (note.y > canvas.height + 50 && !note.hit) {
            note.hit = true;
            combo = 0;
        }
        if (note.y > canvas.height + 100) {
            notes.splice(i, 1);
        }
    }
    
    // Spawn notes
    if (Date.now() - lastNoteTime > spawnInterval) {
        const lane = Math.floor(Math.random() * 4);
        notes.push({
            lane: lane,
            y: -50,
            hit: false
        });
        lastNoteTime = Date.now();
        spawnInterval = Math.max(400, spawnInterval * 0.9995);
    }
}

function draw() {
    ctx.fillStyle = '#050510';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Lanes
    for (let i = 0; i < 4; i++) {
        ctx.fillStyle = LANE_COLORS[i].main + '22';
        ctx.fillRect(150 + i * 80 - 40, 0, 80, canvas.height);
    }
    
    // Judgment line
    ctx.strokeStyle = '#00ffea';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#00ffea';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.moveTo(150, canvas.height - 100);
    ctx.lineTo(150 + 4 * 80, canvas.height - 100);
    ctx.stroke();
    ctx.shadowBlur = 0;
    
    // Notes
    notes.forEach(note => {
        if (!note.hit) {
            ctx.save();
            ctx.shadowColor = LANE_COLORS[note.lane].glow;
            ctx.shadowBlur = 15;
            ctx.fillStyle = LANE_COLORS[note.lane].main;
            ctx.fillRect(150 + note.lane * 80 - 35, note.y - 10, 70, 20);
            ctx.restore();
        }
    });
    
    // Particles
    particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    });
}

function gameLoop(timestamp) {
    if (running) {
        update(1/60);
        draw();
    }
    requestAnimationFrame(gameLoop);
}

// Start
init();


// --- Pause/Resume/Quit Functions for Neon Rhythm ---
function pauseGame() {
    if (!state.running) return;
    state.running = false;
    document.getElementById('pauseOverlay').classList.remove('hidden');
}

function resumeGame() {
    if (state.running) return;
    state.running = true;
    document.getElementById('pauseOverlay').classList.add('hidden');
}

function quitToMenu() {
    state.running = false;
    document.getElementById('pauseOverlay').classList.add('hidden');
    document.getElementById('gameOverOverlay').classList.add('hidden');
    showStartScreen();
}

function showStartScreen() {
    state.running = false;
    document.getElementById('startScreen').classList.remove('hidden');
    document.getElementById('pauseOverlay').classList.add('hidden');
    document.getElementById('gameOverOverlay').classList.add('hidden');
}
</script>
