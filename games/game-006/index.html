<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Day 6: Neon Platformer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a12;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Orbitron',monospace;overflow:hidden;color:#00ffff}
@font-face{font-family:'Orbitron';src:url('https://fonts.gstatic.com/s/orbitron/v18/yMJX0gDPIzYldPF9DVf86Na5G8yf.woff2') format('woff2');font-display:swap}
canvas{display:block;box-shadow:0 0 60px #00ffff44,0 0 120px #ff00ff22,inset 0 0 60px #000000aa;border:2px solid #00ffff44;border-radius:4px;background:#050510}
#ui{position:fixed;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:32px;z-index:10;pointer-events:none}
.stat{background:rgba(0,0,0,0.8);border:1px solid #00ffff44;padding:8px 20px;border-radius:8px;text-align:center;min-width:100px;box-shadow:0 0 20px #00ffff22}
.stat-label{font-size:10px;color:#00ffff88;text-transform:uppercase;letter-spacing:2px;margin-bottom:4px}
.stat-value{font-size:22px;color:#00ffff;text-shadow:0 0 10px #00ffff;font-variant-numeric:tabular-nums}
#controls{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:12px;z-index:10;pointer-events:auto}
.btn{width:64px;height:64px;border:none;border-radius:12px;background:rgba(0,20,40,0.9);border:2px solid #00ffff44;color:#00ffff;font-size:24px;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;transition:all 0.1s;box-shadow:0 0 20px #00ffff22}
.btn:active,.btn.active{background:#00ffff33;border-color:#00ffff;box-shadow:0 0 30px #00ffff,inset 0 0 20px #00ffff44;transform:scale(0.95)}
.btn-jump{width:140px;font-size:14px;font-family:inherit;text-transform:uppercase;letter-spacing:2px}
#menu,#gameover{position:fixed;inset:0;background:rgba(5,5,15,0.98);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;z-index:20;pointer-events:auto}
#menu.hidden,#gameover.hidden{display:none}
h1{font-size:clamp(32px,8vw,64px);background:linear-gradient(135deg,#00ffff,#ff00ff,#ffff00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-shadow:0 0 60px #00ffff88;letter-spacing:4px;animation:glow 2s ease-in-out infinite alternate}
@keyframes glow{from{filter:drop-shadow(0 0 20px #00ffff)}to{filter:drop-shadow(0 0 40px #ff00ff)}}
.subtitle{color:#00ffff88;font-size:14px;letter-spacing:4px;text-transform:uppercase}
.start-btn{padding:16px 60px;font-size:18px;font-family:inherit;background:transparent;border:2px solid #00ffff;color:#00ffff;border-radius:8px;cursor:pointer;text-transform:uppercase;letter-spacing:3px;transition:all 0.2s;box-shadow:0 0 30px #00ffff44}
.start-btn:hover{background:#00ffff22;box-shadow:0 0 50px #00ffff,inset 0 0 30px #00ffff33;transform:scale(1.05)}
.start-btn:active{transform:scale(0.98)}
.highscore-display{color:#ffdd00;font-size:18px;text-shadow:0 0 20px #ffdd00}
.final-score{color:#00ffff;font-size:32px;text-shadow:0 0 30px #00ffff}
@media(min-width:769px){#controls{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="ui">
<div class="stat"><div class="stat-label">Score</div><div class="stat-value" id="score">0</div></div>
<div class="stat"><div class="stat-label">Best</div><div class="stat-value" id="best">0</div></div>
<div class="stat"><div class="stat-label">Speed</div><div class="stat-value" id="speed">1.0x</div></div>
</div>
<canvas id="game"></canvas>
<div id="controls">
<button class="btn" id="btnLeft" aria-label="Move Left">◀</button>
<button class="btn btn-jump" id="btnJump" aria-label="Jump">JUMP</button>
<button class="btn" id="btnRight" aria-label="Move Right">▶</button>
</div>
<div id="menu">
<h1>NEON PLATFORMER</h1>
<div class="subtitle">DAY 6 — DAILY GAME STUDIO</div>
<div class="highscore-display" id="menuBest">Best: 0</div>
<button class="start-btn" id="startBtn">BEGIN RUN</button>
</div>
<div id="gameover" class="hidden">
<h1>RUN COMPLETE</h1>
<div class="final-score" id="finalScore">Score: 0</div>
<div class="highscore-display" id="goBest">Best: 0</div>
<button class="start-btn" id="restartBtn">RUN AGAIN</button>
</div>
<script>
/**
 * Day 6: Neon Platformer
 * Endless cyberpunk platformer with procedural generation
 * Neon aesthetic, increasing difficulty, high score persistence
 */

// ============ CONFIGURATION ============
const CONFIG = {
  canvasWidth: 900,
  canvasHeight: 500,
  gravity: 0.45,
  jumpForce: -13,
  moveSpeed: 6,
  baseScrollSpeed: 3,
  maxScrollSpeed: 14,
  speedIncreaseRate: 0.0003,
  playerWidth: 36,
  playerHeight: 48,
  platformMinWidth: 80,
  platformMaxWidth: 180,
  platformHeight: 18,
  gapMin: 140,
  gapMax: 280,
  verticalSpread: 160,
  minPlatformY: 120,
  maxPlatformY: 420,
  neonColors: [
    '#00ffff', '#ff00ff', '#ffff00', '#ff4400', '#00ff88', '#ff0088', '#8800ff'
  ],
  particleCount: 120,
  trailLength: 8,
  screenShakeMax: 8
};

// ============ GAME STATE ============
const state = {
  running: false,
  score: 0,
  best: 0,
  scrollSpeed: CONFIG.baseScrollSpeed,
  screenShake: 0,
  cameraY: 0,
  input: { left: false, right: false, jump: false },
  lastTime: 0
};

// ============ ENTITIES ============
const player = {
  x: 0, y: 0, vx: 0, vy: 0,
  width: CONFIG.playerWidth, height: CONFIG.playerHeight,
  grounded: false, coyote: 0, jumpBuffer: 0,
  facing: 1, trail: [], color: '#00ffff',
  glowPhase: 0
};

const platforms = [];
const particles = [];
const backgroundLayers = [];

// ============ CANVAS SETUP ============
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let dpr = Math.min(window.devicePixelRatio || 1, 2);

function resize() {
  const maxW = Math.min(CONFIG.canvasWidth, window.innerWidth - 24);
  const maxH = Math.min(CONFIG.canvasHeight, window.innerHeight - 100);
  const scale = Math.min(maxW / CONFIG.canvasWidth, maxH / CONFIG.canvasHeight);
  canvas.width = CONFIG.canvasWidth * dpr;
  canvas.height = CONFIG.canvasHeight * dpr;
  canvas.style.width = (CONFIG.canvasWidth * scale) + 'px';
  canvas.style.height = (CONFIG.canvasHeight * scale) + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ============ HIGH SCORE ============
function loadBest() {
  try {
    state.best = parseInt(localStorage.getItem('neonPlatformerBest')) || 0;
  } catch { state.best = 0; }
  updateBestDisplay();
}
function saveBest() {
  try { localStorage.setItem('neonPlatformerBest', state.best.toString()); } catch {}
  updateBestDisplay();
}
function updateBestDisplay() {
  document.getElementById('best').textContent = state.best;
  document.getElementById('menuBest').textContent = 'Best: ' + state.best;
  document.getElementById('goBest').textContent = 'Best: ' + state.best;
}

// ============ INITIALIZATION ============
function initBackground() {
  backgroundLayers.length = 0;
  // Far buildings
  for (let i = 0; i < 12; i++) {
    backgroundLayers.push({
      x: (i / 12) * CONFIG.canvasWidth * 2,
      y: CONFIG.canvasHeight - Math.random() * 200 - 100,
      width: 60 + Math.random() * 100,
      height: 100 + Math.random() * 200,
      color: `hsl(${180 + Math.random() * 120}, 80%, ${10 + Math.random() * 15}%)`,
      speed: 0.15 + Math.random() * 0.1,
      windows: Array.from({length: 20}, () => ({
        x: Math.random(), y: Math.random(),
        color: Math.random() > 0.5 ? '#00ffff' : '#ff00ff',
        blink: Math.random() * Math.PI * 2
      }))
    });
  }
  // Mid grid lines
  for (let i = 0; i < 30; i++) {
    backgroundLayers.push({
      x: Math.random() * CONFIG.canvasWidth * 2,
      y: Math.random() * CONFIG.canvasHeight,
      type: 'grid',
      speed: 0.3 + Math.random() * 0.2,
      length: 50 + Math.random() * 100,
      angle: Math.random() > 0.5 ? 0 : Math.PI / 2,
      color: Math.random() > 0.5 ? '#00ffff33' : '#ff00ff33'
    });
  }
  // Floating particles
  for (let i = 0; i < 40; i++) {
    backgroundLayers.push({
      x: Math.random() * CONFIG.canvasWidth * 2,
      y: Math.random() * CONFIG.canvasHeight,
      type: 'float',
      speed: 0.05 + Math.random() * 0.15,
      size: 1 + Math.random() * 3,
      color: CONFIG.neonColors[Math.floor(Math.random() * CONFIG.neonColors.length)],
      phase: Math.random() * Math.PI * 2
    });
  }
}

function initGame() {
  state.running = true;
  state.score = 0;
  state.scrollSpeed = CONFIG.baseScrollSpeed;
  state.screenShake = 0;
  state.cameraY = 0;
  state.input = { left: false, right: false, jump: false };
  
  player.x = CONFIG.canvasWidth / 2 - player.width / 2;
  player.y = CONFIG.canvasHeight - 200;
  player.vx = 0; player.vy = 0;
  player.grounded = false; player.coyote = 0; player.jumpBuffer = 0;
  player.facing = 1; player.trail = []; player.glowPhase = 0;
  player.color = CONFIG.neonColors[0];
  
  platforms.length = 0;
  particles.length = 0;
  
  // Starting platform
  platforms.push(createPlatform(CONFIG.canvasWidth / 2 - 100, CONFIG.canvasHeight - 100, 200, true));
  
  // Generate initial platforms
  let lastX = CONFIG.canvasWidth / 2;
  let lastY = CONFIG.canvasHeight - 100;
  for (let i = 0; i < 10; i++) {
    const plat = generatePlatform(lastX, lastY);
    platforms.push(plat);
    lastX = plat.x + plat.width / 2;
    lastY = plat.y;
  }
  
  initBackground();
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('gameover').classList.add('hidden');
}

function createPlatform(x, y, width, isStart = false) {
  const color = isStart ? '#00ffff' : CONFIG.neonColors[Math.floor(Math.random() * CONFIG.neonColors.length)];
  return {
    x, y, width,
    height: CONFIG.platformHeight,
    color,
    glowPhase: Math.random() * Math.PI * 2,
    passed: false,
    particles: [],
    type: isStart ? 'start' : (Math.random() < 0.15 ? 'boost' : 'normal'),
    breakable: !isStart && Math.random() < 0.1
  };
}

function generatePlatform(lastX, lastY) {
  const gap = CONFIG.gapMin + Math.random() * (CONFIG.gapMax - CONFIG.gapMin);
  const width = CONFIG.platformMinWidth + Math.random() * (CONFIG.platformMaxWidth - CONFIG.platformMinWidth);
  
  // Horizontal position - sometimes left, sometimes right
  const direction = Math.random() > 0.5 ? 1 : -1;
  let x = lastX + direction * (width / 2 + gap / 2 + Math.random() * 60);
  x = Math.max(width / 2 + 20, Math.min(CONFIG.canvasWidth - width / 2 - 20, x));
  
  // Vertical position
  let y = lastY + (Math.random() - 0.5) * CONFIG.verticalSpread;
  y = Math.max(CONFIG.minPlatformY, Math.min(CONFIG.maxPlatformY, y));
  
  return createPlatform(x - width / 2, y, width);
}

// ============ INPUT HANDLING ============
function setupInput() {
  // Keyboard
  window.addEventListener('keydown', e => {
    if (e.repeat) return;
    switch(e.code) {
      case 'ArrowLeft': case 'KeyA': state.input.left = true; break;
      case 'ArrowRight': case 'KeyD': state.input.right = true; break;
      case 'Space': case 'ArrowUp': case 'KeyW': 
        state.input.jump = true; 
        e.preventDefault(); 
        break;
    }
  });
  window.addEventListener('keyup', e => {
    switch(e.code) {
      case 'ArrowLeft': case 'KeyA': state.input.left = false; break;
      case 'ArrowRight': case 'KeyD': state.input.right = false; break;
      case 'Space': case 'ArrowUp': case 'KeyW': state.input.jump = false; break;
    }
  });
  
  // Touch buttons
  const btnLeft = document.getElementById('btnLeft');
  const btnRight = document.getElementById('btnRight');
  const btnJump = document.getElementById('btnJump');
  
  const addTouch = (btn, key) => {
    btn.addEventListener('touchstart', e => { e.preventDefault(); state.input[key] = true; btn.classList.add('active'); }, {passive:false});
    btn.addEventListener('touchend', e => { e.preventDefault(); state.input[key] = false; btn.classList.remove('active'); });
    btn.addEventListener('mousedown', e => { e.preventDefault(); state.input[key] = true; btn.classList.add('active'); });
    btn.addEventListener('mouseup', e => { state.input[key] = false; btn.classList.remove('active'); });
    btn.addEventListener('mouseleave', e => { state.input[key] = false; btn.classList.remove('active'); });
  };
  
  addTouch(btnLeft, 'left');
  addTouch(btnRight, 'right');
  addTouch(btnJump, 'jump');
  
  // Menu buttons
  document.getElementById('startBtn').addEventListener('click', initGame);
  document.getElementById('restartBtn').addEventListener('click', initGame);
}

// ============ PARTICLES ============
function spawnParticles(x, y, color, count, speed = 3, life = 40, gravity = 0) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = speed * (0.3 + Math.random() * 0.7);
    particles.push({
      x, y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd - Math.random() * 2,
      life: life * (0.5 + Math.random() * 0.5),
      maxLife: life,
      size: 2 + Math.random() * 4,
      color,
      gravity,
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.3
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += p.gravity * dt;
    p.life -= dt;
    p.rotation += p.rotSpeed * dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  
  // Platform particles
  platforms.forEach(plat => {
    for (let i = plat.particles.length - 1; i >= 0; i--) {
      const p = plat.particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      if (p.life <= 0) plat.particles.splice(i, 1);
    }
    // Spawn ambient particles
    if (Math.random() < 0.03) {
      plat.particles.push({
        x: plat.x + Math.random() * plat.width,
        y: plat.y,
        vx: (Math.random() - 0.5) * 0.5,
        vy: -0.5 - Math.random() * 1.5,
        life: 60 + Math.random() * 60,
        size: 1 + Math.random() * 2,
        color: plat.color
      });
    }
  });
}

function drawParticles() {
  // World particles
  particles.forEach(p => {
    const alpha = p.life / p.maxLife;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rotation);
    ctx.globalAlpha = alpha * 0.8;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 10;
    ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
    ctx.restore();
  });
  
  // Platform particles
  platforms.forEach(plat => {
    plat.particles.forEach(p => {
      const alpha = p.life / 120;
      ctx.globalAlpha = alpha * 0.6;
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
      ctx.fill();
    });
  });
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

// ============ PLAYER PHYSICS ============
const COYOTE_TIME = 6;
const JUMP_BUFFER = 8;

function updatePlayer(dt) {
  // Horizontal movement
  let targetVx = 0;
  if (state.input.left) targetVx -= 1;
  if (state.input.right) targetVx += 1;
  
  const accel = player.grounded ? 0.6 : 0.3;
  const decel = player.grounded ? 0.35 : 0.15;
  
  if (targetVx !== 0) {
    player.vx += targetVx * accel * dt;
    player.facing = targetVx > 0 ? 1 : -1;
  } else {
    player.vx *= Math.pow(1 - decel, dt);
  }
  
  const maxSpeed = CONFIG.moveSpeed;
  player.vx = Math.max(-maxSpeed, Math.min(maxSpeed, player.vx));
  
  player.x += player.vx * dt;
  
  // Screen wrap
  if (player.x < -player.width) player.x = CONFIG.canvasWidth;
  if (player.x > CONFIG.canvasWidth) player.x = -player.width;
  
  // Vertical movement
  player.vy += CONFIG.gravity * dt;
  player.y += player.vy * dt;
  
  // Ground check
  player.grounded = false;
  platforms.forEach(plat => {
    if (player.vy >= 0 &&
        player.x + player.width > plat.x + 4 &&
        player.x + 4 < plat.x + plat.width &&
        player.y + player.height >= plat.y &&
        player.y + player.height <= plat.y + plat.height + player.vy * dt) {
      player.y = plat.y - player.height;
      player.vy = 0;
      player.grounded = true;
      
      // Platform effects
      if (plat.type === 'boost' && !plat.used) {
        player.vy = CONFIG.jumpForce * 1.5;
        plat.used = true;
        spawnParticles(player.x + player.width/2, player.y + player.height, '#ffff00', 30, 6, 50, 0.1);
        state.screenShake = 6;
      }
      if (plat.breakable && !plat.broken) {
        plat.broken = true;
        spawnParticles(plat.x + plat.width/2, plat.y, plat.color, 40, 8, 60, 0.15);
        state.screenShake = 10;
        // Platform falls
        setTimeout(() => {
          const idx = platforms.indexOf(plat);
          if (idx > -1) platforms.splice(idx, 1);
        }, 300);
      }
    }
  });
  
  // Coyote time & jump buffer
  if (player.grounded) player.coyote = COYOTE_TIME;
  else player.coyote -= dt;
  
  if (state.input.jump) player.jumpBuffer = JUMP_BUFFER;
  else player.jumpBuffer -= dt;
  
  // Jump
  if (player.jumpBuffer > 0 && player.coyote > 0) {
    player.vy = CONFIG.jumpForce;
    player.jumpBuffer = 0;
    player.coyote = 0;
    player.grounded = false;
    spawnParticles(player.x + player.width/2, player.y + player.height, player.color, 15, 4, 30, 0.1);
    state.screenShake = 3;
  }
  
  // Trail
  player.trail.unshift({ x: player.x + player.width/2, y: player.y + player.height/2, life: 1 });
  if (player.trail.length > CONFIG.trailLength) player.trail.pop();
  player.trail.forEach(t => t.life -= 0.08);
  
  // Glow phase
  player.glowPhase += 0.15 * dt;
  
  // Death check
  if (player.y > CONFIG.canvasHeight + 100) {
    gameOver();
  }
  
  // Camera follow (vertical)
  const targetCamY = Math.max(0, player.y - CONFIG.canvasHeight * 0.6);
  state.cameraY += (targetCamY - state.cameraY) * 0.1 * dt;
}

// ============ PLATFORMS ============
function updatePlatforms(dt) {
  state.scrollSpeed = Math.min(CONFIG.maxScrollSpeed, state.scrollSpeed + CONFIG.speedIncreaseRate * dt * 60);
  
  platforms.forEach(plat => {
    plat.y += state.scrollSpeed * dt;
    plat.glowPhase += 0.08 * dt;
    
    // Score when passing platform
    if (!plat.passed && plat.y > player.y + player.height) {
      plat.passed = true;
      state.score += Math.floor(10 * (state.scrollSpeed / CONFIG.baseScrollSpeed));
      document.getElementById('score').textContent = state.score;
      document.getElementById('speed').textContent = (state.scrollSpeed / CONFIG.baseScrollSpeed).toFixed(1) + 'x';
      
      // Color shift every 500 points
      if (state.score % 500 < 10) {
        player.color = CONFIG.neonColors[Math.floor(Math.random() * CONFIG.neonColors.length)];
      }
    }
  });
  
  // Remove off-screen platforms
  for (let i = platforms.length - 1; i >= 0; i--) {
    if (platforms[i].y > CONFIG.canvasHeight + 50) {
      platforms.splice(i, 1);
    }
  }
  
  // Generate new platforms at top
  const topMost = Math.min(...platforms.map(p => p.y));
  while (topMost > -100) {
    const lastPlat = platforms.reduce((prev, curr) => prev.y < curr.y ? prev : curr);
    const newPlat = generatePlatform(lastPlat.x + lastPlat.width/2, lastPlat.y);
    newPlat.y = topMost - CONFIG.gapMin - Math.random() * (CONFIG.gapMax - CONFIG.gapMin);
    platforms.push(newPlat);
  }
}

function drawPlatforms() {
  platforms.forEach(plat => {
    const drawY = plat.y - state.cameraY;
    if (drawY > CONFIG.canvasHeight + 50 || drawY < -50) return;
    
    const pulse = Math.sin(plat.glowPhase) * 0.3 + 0.7;
    const glowIntensity = 15 + Math.sin(plat.glowPhase * 2) * 5;
    
    ctx.save();
    
    // Glow
    ctx.shadowColor = plat.color;
    ctx.shadowBlur = glowIntensity * pulse;
    
    // Platform body
    const gradient = ctx.createLinearGradient(plat.x, drawY, plat.x, drawY + plat.height);
    gradient.addColorStop(0, plat.color);
    gradient.addColorStop(0.5, adjustBrightness(plat.color, 1.3));
    gradient.addColorStop(1, plat.color);
    ctx.fillStyle = gradient;
    
    roundRect(ctx, plat.x, drawY, plat.width, plat.height, 6);
    ctx.fill();
    
    // Top highlight
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    roundRect(ctx, plat.x + 2, drawY + 2, plat.width - 4, 4, 3);
    ctx.fill();
    
    // Type indicators
    if (plat.type === 'boost') {
      ctx.fillStyle = '#ffff00';
      ctx.shadowColor = '#ffff00';
      ctx.shadowBlur = 10;
      for (let i = 0; i < 3; i++) {
        const x = plat.x + plat.width/2 + (i-1)*12;
        ctx.beginPath();
        ctx.moveTo(x, drawY - 4);
        ctx.lineTo(x - 6, drawY + 4);
        ctx.lineTo(x + 6, drawY + 4);
        ctx.fill();
      }
    }
    if (plat.breakable && !plat.broken) {
      ctx.strokeStyle = '#ff4400';
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 4]);
      ctx.lineDashOffset = -plat.glowPhase * 10;
      roundRect(ctx, plat.x, drawY, plat.width, plat.height, 6);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    
    ctx.restore();
  });
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function adjustBrightness(hex, factor) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgb(${Math.min(255, Math.round(r*factor))}, ${Math.min(255, Math.round(g*factor))}, ${Math.min(255, Math.round(b*factor))})`;
}

// ============ BACKGROUND ============
function updateBackground(dt) {
  backgroundLayers.forEach(layer => {
    layer.x -= state.scrollSpeed * layer.speed * dt;
    if (layer.x < -layer.width - 100) layer.x += CONFIG.canvasWidth * 2 + 200;
    if (layer.phase !== undefined) layer.phase += 0.02 * dt;
  });
}
