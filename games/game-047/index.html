<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Pipeline - Day 47</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a12; color: #00ffff; font-family: 'Courier New', monospace; overflow: hidden; touch-action: none; }
  canvas { display: block; margin: 0 auto; background: #05050a; box-shadow: 0 0 30px rgba(0,255,255,0.2), inset 0 0 60px rgba(0,20,30,0.5); }
  #ui { position: fixed; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; pointer-events: none; z-index: 10; }
  .panel { background: rgba(0,10,20,0.8); border: 1px solid #00ffff44; border-radius: 8px; padding: 8px 16px; backdrop-filter: blur(4px); text-shadow: 0 0 5px #00ffff; }
  .panel h3 { font-size: 14px; font-weight: normal; color: #00ffaa; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 2px; }
  .panel .value { font-size: 20px; font-weight: bold; color: #00ffff; }
  #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,5,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
  #overlay.visible { opacity: 1; pointer-events: auto; }
  #overlay h1 { font-size: clamp(28px, 8vw, 48px); margin-bottom: 10px; text-shadow: 0 0 20px #00ffff, 0 0 40px #0088ff; background: linear-gradient(90deg, #00ffff, #0088ff, #ff00ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.5); } }
  #overlay p { color: #88ffcc; margin-bottom: 30px; font-size: 16px; letter-spacing: 1px; }
  .btn { background: linear-gradient(135deg, #003344, #001122); border: 2px solid #00ffff; color: #00ffff; padding: 14px 40px; font-size: 16px; font-family: inherit; border-radius: 4px; cursor: pointer; margin: 8px; text-transform: uppercase; letter-spacing: 2px; transition: all 0.2s; box-shadow: 0 0 10px #00ffff44; touch-action: manipulation; }
  .btn:hover, .btn:focus { background: linear-gradient(135deg, #005566, #002233); box-shadow: 0 0 20px #00ffff, 0 0 30px #0088ff; transform: translateY(-2px); }
  .btn:active { transform: translateY(0); }
  .btn.secondary { border-color: #ff0088; color: #ff0088; box-shadow: 0 0 10px #ff008844; }
  .btn.secondary:hover { box-shadow: 0 0 20px #ff0088, 0 0 30px #ff0044; }
  .btn.hidden { display: none; }
  #touchControls { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: none; gap: 10px; z-index: 50; pointer-events: auto; }
  #touchControls .btn { padding: 12px 24px; font-size: 14px; }
  @media (hover: none) and (pointer: coarse) { #touchControls { display: flex; } }
  #pauseOverlay, #gameOverOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,5,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
  #pauseOverlay.visible, #gameOverOverlay.visible { opacity: 1; pointer-events: auto; }
  #pauseOverlay h2, #gameOverOverlay h2 { font-size: clamp(24px, 6vw, 40px); margin-bottom: 20px; text-shadow: 0 0 20px #00ffff; background: linear-gradient(90deg, #00ffff, #0088ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  #pauseOverlay .btn, #gameOverOverlay .btn { margin: 10px; }
  #gameOverOverlay p { color: #88ffcc; margin-bottom: 20px; font-size: 18px; }
</style>
</head>
<body>
<div id="ui">
  <div class="panel"><h3>Score</h3><div class="value" id="scoreDisplay">0</div></div>
  <div class="panel"><h3>Level</h3><div class="value" id="levelDisplay">1</div></div>
  <div class="panel"><h3>Best</h3><div class="value" id="bestDisplay">0</div></div>
</div>
<canvas id="gameCanvas"></canvas>
<div id="overlay">
  <h1>Neon Pipeline</h1>
  <p>Connect the flow. Rotate pipes to complete the circuit.</p>
  <button class="btn" id="startBtn">Start Game</button>
  <button class="btn secondary hidden" id="quitBtn">Quit to Menu</button>
</div>
<div id="pauseOverlay">
  <h2>Paused</h2>
  <button class="btn" id="resumeBtn">Resume</button>
  <button class="btn secondary" id="pauseQuitBtn">Quit to Menu</button>
</div>
<div id="gameOverOverlay">
  <h2>Game Over</h2>
  <p id="finalScore">Score: 0</p>
  <button class="btn" id="retryBtn">Retry</button>
  <button class="btn secondary" id="menuBtn">Main Menu</button>
</div>
<div id="touchControls">
  <button class="btn" id="touchUp">▲</button>
  <button class="btn" id="touchDown">▼</button>
  <button class="btn" id="touchLeft">◄</button>
  <button class="btn" id="touchRight">►</button>
  <button class="btn" id="touchRotate">Rotate</button>
</div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreDisplay = document.getElementById('scoreDisplay');
const levelDisplay = document.getElementById('levelDisplay');
const bestDisplay = document.getElementById('bestDisplay');
const overlay = document.getElementById('overlay');
const pauseOverlay = document.getElementById('pauseOverlay');
const gameOverOverlay = document.getElementById('gameOverOverlay');
const startBtn = document.getElementById('startBtn');
const quitBtn = document.getElementById('quitBtn');
const resumeBtn = document.getElementById('resumeBtn');
const pauseQuitBtn = document.getElementById('pauseQuitBtn');
const retryBtn = document.getElementById('retryBtn');
const menuBtn = document.getElementById('menuBtn');
const finalScoreEl = document.getElementById('finalScore');
const touchUp = document.getElementById('touchUp');
const touchDown = document.getElementById('touchDown');
const touchLeft = document.getElementById('touchLeft');
const touchRight = document.getElementById('touchRight');
const touchRotate = document.getElementById('touchRotate');

let width, height, cellSize, gridSize, offsetX, offsetY;
let grid = [];
let selected = { x: 0, y: 0 };
let score = 0;
let level = 1;
let bestScore = parseInt(localStorage.getItem('neonPipelineBest')) || 0;
let gameRunning = false;
let paused = false;
let animationId = null;
let flowProgress = 0;
let flowPath = [];
let levelComplete = false;
let particles = [];

const PIPE_TYPES = {
  straight: { connections: [0,1,0,1], color: '#00ffff' },
  corner: { connections: [1,1,0,0], color: '#00ff88' },
  tJunction: { connections: [1,1,1,0], color: '#ff00ff' },
  cross: { connections: [1,1,1,1], color: '#ffff00' },
  source: { connections: [0,1,0,0], color: '#00ffff', fixed: true },
  target: { connections: [0,0,0,1], color: '#ff0088', fixed: true }
};

const DIRS = [[-1,0],[0,1],[1,0],[0,-1]];

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
  const minDim = Math.min(width, height) - 40;
  gridSize = 5 + level;
  if (gridSize > 10) gridSize = 10;
  cellSize = Math.floor(minDim / gridSize);
  offsetX = (width - cellSize * gridSize) / 2;
  offsetY = (height - cellSize * gridSize) / 2;
}
window.addEventListener('resize', resize);

function rotateConnections(connections, rotation) {
  const rotated = [0,0,0,0];
  for (let i = 0; i < 4; i++) {
    rotated[(i + rotation) % 4] = connections[i];
  }
  return rotated;
}

function getPipeConnections(pipe) {
  return rotateConnections(PIPE_TYPES[pipe.type].connections, pipe.rotation);
}

function generateLevel() {
  grid = [];
  for (let y = 0; y < gridSize; y++) {
    grid[y] = [];
    for (let x = 0; x < gridSize; x++) {
      grid[y][x] = { type: 'straight', rotation: 0 };
    }
  }
  const path = generatePath();
  placePipesAlongPath(path);
  fillRemainingRandom();
  randomizeRotations();
  grid[0][0] = { type: 'source', rotation: 0 };
  grid[gridSize-1][gridSize-1] = { type: 'target', rotation: 0 };
  selected = { x: 0, y: 0 };
  flowProgress = 0;
  flowPath = [];
  levelComplete = false;
  particles = [];
}

function generatePath() {
  const path = [{x:0,y:0}];
  let x = 0, y = 0;
  const visited = new Set(['0,0']);
  while (x !== gridSize-1 || y !== gridSize-1) {
    const dirs = [];
    if (x < gridSize-1) dirs.push([1,0]);
    if (y < gridSize-1) dirs.push([0,1]);
    if (x > 0) dirs.push([-1,0]);
    if (y > 0) dirs.push([0,-1]);
    const valid = dirs.filter(([dx,dy]) => !visited.has(`${x+dx},${y+dy}`));
    if (valid.length === 0) break;
    const [dx,dy] = valid[Math.floor(Math.random() * valid.length)];
    x += dx; y += dy;
    path.push({x,y});
    visited.add(`${x},${y}`);
  }
  return path;
}

function placePipesAlongPath(path) {
  for (let i = 0; i < path.length - 1; i++) {
    const cur = path[i];
    const next = path[i+1];
    let dx = next.x - cur.x;
    let dy = next.y - cur.y;
    let dirOut, dirIn;
    if (dx === 1) { dirOut = 1; dirIn = 3; }
    else if (dx === -1) { dirOut = 3; dirIn = 1; }
    else if (dy === 1) { dirOut = 2; dirIn = 0; }
    else { dirOut = 0; dirIn = 2; }
    const pipe = grid[cur.y][cur.x];
    const nextPipe = grid[next.y][next.x];
    if (i === 0) {
      pipe.type = 'straight';
      pipe.rotation = dirOut === 1 ? 0 : (dirOut === 2 ? 1 : (dirOut === 3 ? 2 : 3));
    } else {
      const prev = path[i-1];
      const pdx = cur.x - prev.x;
      const pdy = cur.y - prev.y;
      let dirPrev;
      if (pdx === 1) dirPrev = 3;
      else if (pdx === -1) dirPrev = 1;
      else if (pdy === 1) dirPrev = 0;
      else dirPrev = 2;
      if (dirPrev === dirOut) {
        pipe.type = 'straight';
        pipe.rotation = dirOut === 1 ? 0 : (dirOut === 2 ? 1 : (dirOut === 3 ? 2 : 3));
      } else {
        pipe.type = 'corner';
        const base = PIPE_TYPES.corner.connections;
        for (let r = 0; r < 4; r++) {
          const rot = rotateConnections(base, r);
          if (rot[dirPrev] && rot[dirOut]) {
            pipe.rotation = r;
            break;
          }
        }
      }
    }
    if (i === path.length - 2) {
      nextPipe.type = 'straight';
      nextPipe.rotation = dirIn === 3 ? 0 : (dirIn === 0 ? 1 : (dirIn === 1 ? 2 : 3));
    }
  }
}

function fillRemainingRandom() {
  const types = ['straight', 'corner', 'tJunction', 'cross'];
  for (let y = 0; y < gridSize; y++) {
    for (let x = 0; x < gridSize; x++) {
      if (grid[y][x].type === 'straight' && grid[y][x].rotation === 0) continue;
      if (x === 0 && y === 0) continue;
      if (x === gridSize-1 && y === gridSize-1) continue;
      grid[y][x].type = types[Math.floor(Math.random() * types.length)];
    }
  }
}

function randomizeRotations() {
  for (let y = 0; y < gridSize; y++) {
    for (let x = 0; x < gridSize; x++) {
      if (grid[y][x].fixed) continue;
      if (x === 0 && y === 0) continue;
      if (x === gridSize-1 && y === gridSize-1) continue;
      grid[y][x].rotation = Math.floor(Math.random() * 4);
    }
  }
}

function checkConnection() {
  const visited = new Set();
  const queue = [{x:0,y:0,from:3}];
  visited.add('0,0');
  while (queue.length) {
    const {x,y,from} = queue.shift();
    if (x === gridSize-1 && y === gridSize-1) return true;
    const pipe = grid[y][x];
    const conns = getPipeConnections(pipe);
    for (let dir = 0; dir < 4; dir++) {
      if (!conns[dir]) continue;
      if (dir === from) continue;
      const nx = x + DIRS[dir][1];
      const ny = y + DIRS[dir][0];
      if (nx < 0 || nx >= gridSize || ny < 0 || ny >= gridSize) continue;
      const nPipe = grid[ny][nx];
      const nConns = getPipeConnections(nPipe);
      const opp = (dir + 2) % 4;
      if (!nConns[opp]) continue;
      const key = `${nx},${ny}`;
      if (visited.has(key)) continue;
      visited.add(key);
      queue.push({x:nx, y:ny, from:opp});
    }
  }
  return false;
}

function findFlowPath() {
  const visited = new Set();
  const queue = [{x:0,y:0,from:3,path:[{x:0,y:0}]}];
  visited.add('0,0');
  while (queue.length) {
    const {x,y,from,path} = queue.shift();
    if (x === gridSize-1 && y === gridSize-1) return path;
    const pipe = grid[y][x];
    const conns = getPipeConnections(pipe);
    for (let dir = 0; dir < 4; dir++) {
      if (!conns[dir]) continue;
      if (dir === from) continue;
      const nx = x + DIRS[dir][1];
      const ny = y + DIRS[dir][0];
      if (nx < 0 || nx >= gridSize || ny < 0 || ny >= gridSize) continue;
      const nPipe = grid[ny][nx];
      const nConns = getPipeConnections(nPipe);
      const opp = (dir + 2) % 4;
      if (!nConns[opp]) continue;
      const key = `${nx},${ny}`;
      if (visited.has(key)) continue;
      visited.add(key);
      queue.push({x:nx, y:ny, from:opp, path:[...path, {x:nx, y:ny}]});
    }
  }
  return [];
}

function startGame() {
  level = 1;
  score = 0;
  gameRunning = true;
  paused = false;
  overlay.classList.remove('visible');
  pauseOverlay.classList.remove('visible');
  gameOverOverlay.classList.remove('visible');
  generateLevel();
  updateUI();
  if (animationId) cancelAnimationFrame(animationId);
  gameLoop();
}

function pauseGame() {
  if (!gameRunning || paused) return;
  paused = true;
  pauseOverlay.classList.add('visible');
}

function resumeGame() {
  if (!gameRunning || !paused) return;
  paused = false;
  pauseOverlay.classList.remove('visible');
  gameLoop();
}

function quitToMenu() {
  gameRunning = false;
  paused = false;
  if (animationId) cancelAnimationFrame(animationId);
  overlay.classList.add('visible');
  pauseOverlay.classList.remove('visible');
  gameOverOverlay.classList.remove('visible');
  quitBtn.classList.add('hidden');
  startBtn.textContent = 'Start Game';
}

function showStartScreen() {
  quitToMenu();
}

function gameOver() {
  gameRunning = false;
  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem('neonPipelineBest', bestScore);
  }
  finalScoreEl.textContent = `Score: ${score} | Best: ${bestScore}`;
  gameOverOverlay.classList.add('visible');
}

function updateUI() {
  scoreDisplay.textContent = score;
  levelDisplay.textContent = level;
  bestDisplay.textContent = bestScore;
}

function rotateSelected() {
  if (!gameRunning || paused || levelComplete) return;
  const pipe = grid[selected.y][selected.x];
  if (pipe.fixed) return;
  pipe.rotation = (pipe.rotation + 1) % 4;
  checkLevelComplete();
}

function checkLevelComplete() {
  if (checkConnection()) {
    levelComplete = true;
    flowPath = findFlowPath();
    flowProgress = 0;
    score += 100 * level;
    updateUI();
    setTimeout(nextLevel, 2000);
  }
}

function nextLevel() {
  level++;
  generateLevel();
  levelComplete = false;
}

function gameLoop(timestamp) {
  if (!gameRunning || paused) return;
  update(timestamp);
  draw();
  animationId = requestAnimationFrame(gameLoop);
}

let lastTime = 0;
function update(timestamp) {
  const dt = (timestamp - lastTime) / 1000;
  lastTime = timestamp;
  if (levelComplete) {
    flowProgress += dt * 2;
    if (flowProgress > 1) flowProgress = 1;
    for (let i = 0; i < 3; i++) {
      if (Math.random() < 0.3) spawnParticle();
    }
  }
  updateParticles(dt);
}

function spawnParticle() {
  if (flowPath.length < 2) return;
  const idx = Math.floor(flowProgress * (flowPath.length - 1));
  const p1 = flowPath[idx];
  const p2 = flowPath[Math.min(idx+1, flowPath.length-1)];
  const x = offsetX + (p1.x + (p2.x - p1.x) * Math.random()) * cellSize + cellSize/2;
  const y = offsetY + (p1.y + (p2.y - p1.y) * Math.random()) * cellSize + cellSize/2;
  particles.push({
    x, y,
    vx: (Math.random()-0.5)*20,
    vy: (Math.random()-0.5)*20,
    life: 1,
    color: `hsl(${180 + Math.random()*60}, 100%, 50%)`
  });
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt * 2;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function draw() {
  ctx.fillStyle = '#05050a';
  ctx.fillRect(0, 0, width, height);
  drawGrid();
  drawSelection();
  if (levelComplete) drawFlow();
  drawParticles();
}

function drawGrid() {
  for (let y = 0; y < gridSize; y++) {
    for (let x = 0; x < gridSize; x++) {
      const pipe = grid[y][x];
      const px = offsetX + x * cellSize;
      const py = offsetY + y * cellSize;
      drawPipe(pipe, px, py, cellSize);
    }
  }
}

function drawPipe(pipe, x, y, size) {
  const type = PIPE_TYPES[pipe.type];
  const conns = getPipeConnections(pipe);
  const centerX = x + size/2;
  const centerY = y + size/2;
  const radius = size * 0.35;
  ctx.save();
  ctx.translate(centerX, centerY);
  ctx.rotate(pipe.rotation * Math.PI/2);
  ctx.lineWidth = size * 0.15;
  ctx.lineCap = 'round';
  ctx.strokeStyle = type.color;
  ctx.shadowColor = type.color;
  ctx.shadowBlur = 10;
  ctx.beginPath();
  if (conns[0]) { ctx.moveTo(0, -radius); ctx.lineTo(0, -size/2); }
  if (conns[1]) { ctx.moveTo(radius, 0); ctx.lineTo(size/2, 0); }
  if (conns[2]) { ctx.moveTo(0, radius); ctx.lineTo(0, size/2); }
  if (conns[3]) { ctx.moveTo(-radius, 0); ctx.lineTo(-size/2, 0); }
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(0, 0, radius, 0, Math.PI*2);
  ctx.stroke();
  if (pipe.type === 'source' || pipe.type === 'target') {
    ctx.fillStyle = type.color;
    ctx.beginPath();
    ctx.arc(0, 0, radius * 0.6, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function drawSelection() {
  if (!gameRunning) return;
  const x = offsetX + selected.x * cellSize;
  const y = offsetY + selected.y * cellSize;
  ctx.strokeStyle = '#ff0088';
  ctx.lineWidth = 3;
  ctx.shadowColor = '#ff0088';
  ctx.shadowBlur = 15;
  ctx.strokeRect(x + 2, y + 2, cellSize - 4, cellSize - 4);
  ctx.shadowBlur = 0;
}

function drawFlow() {
  if (flowPath.length < 2) return;
  const progress = flowProgress;
  const totalSegments = flowPath.length - 1;
  const segmentProgress = progress * totalSegments;
  const fullSegments = Math.floor(segmentProgress);
  const partial = segmentProgress - fullSegments;
  ctx.lineWidth = cellSize * 0.2;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#00ffff';
  ctx.shadowColor = '#00ffff';
  ctx.shadowBlur = 20;
  ctx.beginPath();
  for (let i = 0; i < fullSegments; i++) {
    const p1 = flowPath[i];
    const p2 = flowPath[i+1];
    const x1 = offsetX + p1.x * cellSize + cellSize/2;
    const y1 = offsetY + p1.y * cellSize + cellSize/2;
    const x2 = offsetX + p2.x * cellSize + cellSize/2;
    const y2 = offsetY + p2.y * cellSize + cellSize/2;
    if (i === 0) ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
  }
  if (fullSegments < totalSegments) {
    const p1 = flowPath[fullSegments];
    const p2 = flowPath[fullSegments+1];
    const x1 = offsetX + p1.x * cellSize + cellSize/2;
    const y1 = offsetY + p1.y * cellSize + cellSize/2;
    const x2 = offsetX + p2.x * cellSize + cellSize/2;
    const y2 = offsetY + p2.y * cellSize + cellSize/2;
    const x = x1 + (x2 - x1) * partial;
    const y = y1 + (y2 - y1) * partial;
    if (fullSegments === 0) ctx.moveTo(x1, y1);
    ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.shadowBlur = 0;
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(p.x, p.y, cellSize * 0.1 * p.life, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

function handleKey(e) {
  if (!gameRunning || paused) {
    if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
      if (gameRunning) pauseGame();
      else if (paused) resumeGame();
    }
    return;
  }
  switch(e.key) {
    case 'ArrowUp': case 'w': case 'W': moveSelection(0, -1); break;
    case 'ArrowDown': case 's': case 'S': moveSelection(0, 1); break;
    case 'ArrowLeft': case 'a': case 'A': moveSelection(-1, 0); break;
    case 'ArrowRight': case 'd': case 'D': moveSelection(1, 0); break;
    case ' ': case 'Enter': rotateSelected(); break;
    case 'Escape': case 'p': case 'P': pauseGame(); break;
  }
}

function moveSelection(dx, dy) {
  if (!gameRunning || paused || levelComplete) return;
  selected.x = Math.max(0, Math.min(gridSize - 1, selected.x + dx));
  selected.y = Math.max(0, Math.min(gridSize - 1, selected.y + dy));
}

// Event listeners
startBtn.addEventListener('click', startGame);
quitBtn.addEventListener('click', quitToMenu);
resumeBtn.addEventListener('click', resumeGame);
pauseQuitBtn.addEventListener('click', quitToMenu);
retryBtn.addEventListener('click', startGame);
menuBtn.addEventListener('click', showStartScreen);

touchUp.addEventListener('click', () => moveSelection(0, -1), { passive: false });
touchDown.addEventListener('click', () => moveSelection(0, 1), { passive: false });
touchLeft.addEventListener('click', () => moveSelection(-1, 0), { passive: false });
touchRight.addEventListener('click', () => moveSelection(1, 0), { passive: false });
touchRotate.addEventListener('click', rotateSelected, { passive: false });

document.addEventListener('keydown', handleKey);

// Initialize
resize();
showStartScreen();
</script>
</body>
</html>
