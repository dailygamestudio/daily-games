<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Pipeline - Day 47</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a12; color: #00ffff; font-family: 'Courier New', monospace; overflow: hidden; touch-action: none; }
  canvas { display: block; margin: 0 auto; background: #05050a; box-shadow: 0 0 30px rgba(0,255,255,0.2), inset 0 0 60px rgba(0,20,30,0.5); position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
  #ui { position: fixed; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; pointer-events: none; z-index: 10; }
  .panel { background: rgba(0,10,20,0.8); border: 1px solid #00ffff44; border-radius: 8px; padding: 8px 16px; backdrop-filter: blur(4px); text-shadow: 0 0 5px #00ffff; }
  .panel h3 { font-size: 14px; font-weight: normal; color: #00ffaa; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 2px; }
  .panel .value { font-size: 20px; font-weight: bold; color: #00ffff; }
  #overlay, #pauseOverlay, #gameOverOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(8px); }
  #overlay.hidden, #pauseOverlay.hidden, #gameOverOverlay.hidden { display: none !important; }
  .overlay-content { text-align: center; max-width: 90%; }
  .overlay-content h1 { font-size: clamp(2rem, 8vw, 4rem); color: #00ffff; text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff; margin-bottom: 1rem; letter-spacing: 4px; }
  .overlay-content p { color: #00ffaa; font-size: 1.2rem; margin-bottom: 2rem; text-shadow: 0 0 10px #00ffaa; }
  .btn { background: transparent; border: 2px solid #00ffff; color: #00ffff; padding: 12px 32px; font-size: 1.1rem; font-family: inherit; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; transition: all 0.3s; text-shadow: 0 0 5px #00ffff; box-shadow: 0 0 10px rgba(0,255,255,0.3); }
  .btn:hover, .btn:focus { background: #00ffff; color: #0a0a12; box-shadow: 0 0 30px #00ffff; outline: none; }
  .btn:active { transform: scale(0.95); }
  .btn-group { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
  @media (max-width: 600px) { .btn { padding: 10px 24px; font-size: 1rem; } }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="ui">
  <div class="panel"><h3>Score</h3><div class="value" id="score">0</div></div>
  <div class="panel"><h3>Level</h3><div class="value" id="level">1</div></div>
  <div class="panel"><h3>High Score</h3><div class="value" id="highScore">0</div></div>
</div>

<div id="overlay">
  <div class="overlay-content">
    <h1>NEON PIPELINE</h1>
    <p>Connect the flow from source to target. Tap pipes to rotate.</p>
    <div class="btn-group">
      <button class="btn" id="startBtn">START</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="hidden">
  <div class="overlay-content">
    <h1>PAUSED</h1>
    <div class="btn-group">
      <button class="btn" id="resumeBtn">RESUME</button>
      <button class="btn" id="quitBtn">QUIT TO MENU</button>
    </div>
  </div>
</div>

<div id="gameOverOverlay" class="hidden">
  <div class="overlay-content">
    <h1>PIPELINE BREACH</h1>
    <p>Final Score: <span id="finalScore">0</span></p>
    <div class="btn-group">
      <button class="btn" id="retryBtn">RETRY</button>
      <button class="btn" id="menuBtn">MAIN MENU</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const levelEl = document.getElementById('level');
const highScoreEl = document.getElementById('highScore');
const finalScoreEl = document.getElementById('finalScore');
const overlay = document.getElementById('overlay');
const pauseOverlay = document.getElementById('pauseOverlay');
const gameOverOverlay = document.getElementById('gameOverOverlay');
const startBtn = document.getElementById('startBtn');
const resumeBtn = document.getElementById('resumeBtn');
const quitBtn = document.getElementById('quitBtn');
const retryBtn = document.getElementById('retryBtn');
const menuBtn = document.getElementById('menuBtn');

let width, height, cellSize, cols, rows;
let grid = [];
let score = 0, level = 1, highScore = 0;
let gameRunning = false, paused = false;
let animationId = null;
let flowProgress = 0, flowPath = [], flowing = false;
let lastTime = 0;

const PIPE_TYPES = {
  EMPTY: 0,
  STRAIGHT: 1,
  CORNER: 2,
  T_JUNCTION: 3,
  CROSS: 4,
  SOURCE: 5,
  TARGET: 6
};

const CONNECTIONS = {
  [PIPE_TYPES.STRAIGHT]: [0, 2],
  [PIPE_TYPES.CORNER]: [0, 1],
  [PIPE_TYPES.T_JUNCTION]: [0, 1, 2],
  [PIPE_TYPES.CROSS]: [0, 1, 2, 3],
  [PIPE_TYPES.SOURCE]: [0],
  [PIPE_TYPES.TARGET]: [2]
};

const DIRS = [[0,-1],[1,0],[0,1],[-1,0]];

function resize() {
  const maxW = window.innerWidth - 20;
  const maxH = window.innerHeight - 100;
  const size = Math.min(maxW, maxH);
  canvas.width = size;
  canvas.height = size;
  width = height = size;
  cellSize = size / cols;
}
window.addEventListener('resize', () => { if (gameRunning) { resize(); draw(); } });

function initGrid() {
  cols = 4 + level;
  rows = 4 + level;
  grid = [];
  for (let y = 0; y < rows; y++) {
    grid[y] = [];
    for (let x = 0; x < cols; x++) {
      grid[y][x] = { type: PIPE_TYPES.EMPTY, rotation: 0, fixed: false };
    }
  }
  const sx = Math.floor(Math.random() * cols);
  const sy = 0;
  const tx = Math.floor(Math.random() * cols);
  const ty = rows - 1;
  grid[sy][sx] = { type: PIPE_TYPES.SOURCE, rotation: 2, fixed: true };
  grid[ty][tx] = { type: PIPE_TYPES.TARGET, rotation: 0, fixed: true };
  generatePath(sx, sy, tx, ty);
  fillRandom();
  resize();
}

function generatePath(sx, sy, tx, ty) {
  const path = [];
  let x = sx, y = sy;
  while (x !== tx || y !== ty) {
    const dirs = [];
    if (x < tx) dirs.push(1);
    if (x > tx) dirs.push(3);
    if (y < ty) dirs.push(2);
    if (y > ty) dirs.push(0);
    const dir = dirs[Math.floor(Math.random() * dirs.length)];
    path.push({x, y, dir});
    x += DIRS[dir][0];
    y += DIRS[dir][1];
  }
  path.forEach((p, i) => {
    const next = path[i+1] || {x: tx, y: ty, dir: (p.dir+2)%4};
    const cell = grid[p.y][p.x];
    if (cell.type === PIPE_TYPES.SOURCE) return;
    const inDir = (p.dir + 2) % 4;
    const outDir = next.dir;
    if (inDir === outDir) cell.type = PIPE_TYPES.STRAIGHT;
    else if ((inDir + 1) % 4 === outDir || (outDir + 1) % 4 === inDir) cell.type = PIPE_TYPES.CORNER;
    else cell.type = PIPE_TYPES.T_JUNCTION;
    cell.rotation = Math.floor(Math.random() * 4);
    cell.fixed = false;
  });
}

function fillRandom() {
  const types = [PIPE_TYPES.STRAIGHT, PIPE_TYPES.CORNER, PIPE_TYPES.T_JUNCTION, PIPE_TYPES.CROSS];
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      if (grid[y][x].type === PIPE_TYPES.EMPTY) {
        grid[y][x].type = types[Math.floor(Math.random() * types.length)];
        grid[y][x].rotation = Math.floor(Math.random() * 4);
      }
    }
  }
}

function getConnections(x, y) {
  const cell = grid[y][x];
  if (!cell || cell.type === PIPE_TYPES.EMPTY) return [];
  const base = CONNECTIONS[cell.type] || [];
  return base.map(d => (d + cell.rotation) % 4);
}

function checkComplete() {
  const visited = new Set();
  const queue = [];
  for (let x = 0; x < cols; x++) {
    if (grid[0][x].type === PIPE_TYPES.SOURCE) {
      queue.push({x, y: 0, from: 2});
      break;
    }
  }
  while (queue.length) {
    const {x, y, from} = queue.shift();
    const key = `${x},${y},${from}`;
    if (visited.has(key)) continue;
    visited.add(key);
    const cell = grid[y][x];
    const conns = getConnections(x, y);
    if (!conns.includes(from)) continue;
    conns.forEach(to => {
      if (to === from) return;
      const nx = x + DIRS[to][0];
      const ny = y + DIRS[to][1];
      if (nx < 0 || nx >= cols || ny < 0 || ny >= rows) return;
      const nCell = grid[ny][nx];
      const nConns = getConnections(nx, ny);
      if (nConns.includes((to + 2) % 4)) {
        if (nCell.type === PIPE_TYPES.TARGET) {
          flowPath = Array.from(visited).map(v => v.split(',').map(Number));
          return true;
        }
        queue.push({x: nx, y: ny, from: (to + 2) % 4});
      }
    });
  }
  return false;
}

function startFlow() {
  flowing = true;
  flowProgress = 0;
}

function updateFlow(dt) {
  if (!flowing) return;
  flowProgress += dt * 3;
  if (flowProgress >= flowPath.length) {
    flowing = false;
    levelComplete();
  }
}

function levelComplete() {
  score += 100 * level;
  level++;
  scoreEl.textContent = score;
  levelEl.textContent = level;
  initGrid();
}

function rotatePipe(x, y) {
  const cell = grid[y][x];
  if (cell.fixed) return;
  cell.rotation = (cell.rotation + 1) % 4;
  draw();
  if (checkComplete()) startFlow();
}

function getCellFromEvent(e) {
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  const x = Math.floor((clientX - rect.left) / cellSize);
  const y = Math.floor((clientY - rect.top) / cellSize);
  if (x >= 0 && x < cols && y >= 0 && y < rows) return {x, y};
  return null;
}

canvas.addEventListener('click', e => {
  if (!gameRunning || paused) return;
  const cell = getCellFromEvent(e);
  if (cell) rotatePipe(cell.x, cell.y);
}, {passive: false});

canvas.addEventListener('touchstart', e => {
  if (!gameRunning || paused) return;
  e.preventDefault();
  const cell = getCellFromEvent(e);
  if (cell) rotatePipe(cell.x, cell.y);
}, {passive: false});

function draw() {
  ctx.fillStyle = '#05050a';
  ctx.fillRect(0, 0, width, height);
  ctx.strokeStyle = '#00ffff22';
  ctx.lineWidth = 1;
  for (let i = 0; i <= cols; i++) {
    ctx.beginPath();
    ctx.moveTo(i * cellSize, 0);
    ctx.lineTo(i * cellSize, height);
    ctx.stroke();
  }
  for (let i = 0; i <= rows; i++) {
    ctx.beginPath();
    ctx.moveTo(0, i * cellSize);
    ctx.lineTo(width, i * cellSize);
    ctx.stroke();
  }
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      drawPipe(x, y);
    }
  }
  if (flowing) drawFlow();
}

function drawPipe(x, y) {
  const cell = grid[y][x];
  if (cell.type === PIPE_TYPES.EMPTY) return;
  const cx = x * cellSize + cellSize / 2;
  const cy = y * cellSize + cellSize / 2;
  const r = cellSize * 0.35;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(cell.rotation * Math.PI / 2);
  const conns = CONNECTIONS[cell.type] || [];
  ctx.lineWidth = cellSize * 0.15;
  ctx.lineCap = 'round';
  const glow = cell.fixed ? '#00ffaa' : '#00ffff';
  ctx.strokeStyle = glow;
  ctx.shadowColor = glow;
  ctx.shadowBlur = 10;
  conns.forEach(dir => {
    const angle = dir * Math.PI / 2;
    const x1 = 0, y1 = 0;
    const x2 = Math.cos(angle) * r;
    const y2 = Math.sin(angle) * r;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  });
  if (cell.type === PIPE_TYPES.SOURCE || cell.type === PIPE_TYPES.TARGET) {
    ctx.fillStyle = cell.type === PIPE_TYPES.SOURCE ? '#00ffaa' : '#ff00aa';
    ctx.shadowColor = ctx.fillStyle;
    ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.6, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawFlow() {
  const progress = Math.min(flowProgress, flowPath.length - 1);
  const idx = Math.floor(progress);
  const t = progress - idx;
  if (idx >= flowPath.length) return;
  const [x, y, from] = flowPath[idx];
  const cx = x * cellSize + cellSize / 2;
  const cy = y * cellSize + cellSize / 2;
  const r = cellSize * 0.35;
  const conns = getConnections(x, y);
  conns.forEach(to => {
    if (to === from) return;
    const angle = to * Math.PI / 2;
    const x1 = cx, y1 = cy;
    const x2 = cx + Math.cos(angle) * r * t;
    const y2 = cy + Math.sin(angle) * r * t;
    ctx.strokeStyle = '#00ffff';
    ctx.lineWidth = cellSize * 0.12;
    ctx.lineCap = 'round';
    ctx.shadowColor = '#00ffff';
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  });
}

function gameLoop(time) {
  if (!gameRunning) return;
  const dt = (time - lastTime) / 1000;
  lastTime = time;
  if (!paused) {
    updateFlow(dt);
    draw();
  }
  animationId = requestAnimationFrame(gameLoop);
}

function startGame() {
  overlay.classList.add('hidden');
  pauseOverlay.classList.add('hidden');
  gameOverOverlay.classList.add('hidden');
  score = 0;
  level = 1;
  scoreEl.textContent = score;
  levelEl.textContent = level;
  highScore = parseInt(localStorage.getItem('neonPipelineHighScore')) || 0;
  highScoreEl.textContent = highScore;
  initGrid();
  gameRunning = true;
  paused = false;
  lastTime = performance.now();
  animationId = requestAnimationFrame(gameLoop);
}

function pauseGame() {
  if (!gameRunning || paused) return;
  paused = true;
  pauseOverlay.classList.remove('hidden');
}

function resumeGame() {
  paused = false;
  pauseOverlay.classList.add('hidden');
  lastTime = performance.now();
}

function quitToMenu() {
  gameRunning = false;
  paused = false;
  cancelAnimationFrame(animationId);
  pauseOverlay.classList.add('hidden');
  showStartScreen();
}

function showStartScreen() {
  overlay.classList.remove('hidden');
}

function gameOver() {
  gameRunning = false;
  cancelAnimationFrame(animationId);
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('neonPipelineHighScore', highScore);
    highScoreEl.textContent = highScore;
  }
  finalScoreEl.textContent = score;
  gameOverOverlay.classList.remove('hidden');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
    if (gameRunning && !paused) pauseGame();
    else if (paused) resumeGame();
  }
});

startBtn.addEventListener('click', startGame);
resumeBtn.addEventListener('click', resumeGame);
quitBtn.addEventListener('click', quitToMenu);
retryBtn.addEventListener('click', startGame);
menuBtn.addEventListener('click', quitToMenu);

showStartScreen();
</script>
</body>
</html>
