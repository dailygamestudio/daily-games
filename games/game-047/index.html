<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Pipeline - Day 47</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a12; color: #00ffff; font-family: 'Courier New', monospace; overflow: hidden; touch-action: none; }
  canvas { display: block; margin: 0 auto; background: #05050a; box-shadow: 0 0 30px rgba(0,255,255,0.2), inset 0 0 60px rgba(0,20,30,0.5); position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
  #ui { position: fixed; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; pointer-events: none; z-index: 10; }
  .panel { background: rgba(0,10,20,0.8); border: 1px solid #00ffff44; border-radius: 8px; padding: 8px 16px; backdrop-filter: blur(4px); text-shadow: 0 0 5px #00ffff; }
  .panel h3 { font-size: 14px; font-weight: normal; color: #00ffaa; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 2px; }
  .panel .value { font-size: 20px; font-weight: bold; color: #00ffff; }
  #overlay, #pauseOverlay, #gameOverOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(8px); }
  #overlay.hidden, #pauseOverlay.hidden, #gameOverOverlay.hidden { display: none !important; }
  .overlay-content { text-align: center; max-width: 90%; }
  .overlay-content h1 { font-size: clamp(2rem, 8vw, 4rem); color: #00ffff; text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff; margin-bottom: 1rem; letter-spacing: 4px; }
  .overlay-content p { color: #00ffaa; font-size: 1.2rem; margin-bottom: 2rem; text-shadow: 0 0 10px #00ffaa; }
  .btn { background: transparent; border: 2px solid #00ffff; color: #00ffff; padding: 12px 32px; font-size: 1.1rem; font-family: inherit; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; transition: all 0.2s; margin: 0.5rem; }
  .btn:hover, .btn:focus { background: #00ffff; color: #0a0a12; box-shadow: 0 0 20px #00ffff; outline: none; }
  .btn:active { transform: scale(0.95); }
  @media (max-width: 600px) {
    .panel { padding: 6px 12px; }
    .panel h3 { font-size: 12px; }
    .panel .value { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="ui">
  <div class="panel"><h3>Level</h3><div class="value" id="levelDisplay">1</div></div>
  <div class="panel"><h3>Score</h3><div class="value" id="scoreDisplay">0</div></div>
  <div class="panel"><h3>Best</h3><div class="value" id="bestDisplay">0</div></div>
  <div class="panel"><h3>Time</h3><div class="value" id="timeDisplay">60</div></div>
</div>

<canvas id="gameCanvas"></canvas>

<div id="overlay">
  <div class="overlay-content">
    <h1>NEON PIPELINE</h1>
    <p>Connect the flow from start to end before time runs out.<br>Tap/click pipes to rotate. Complete circuits to advance.</p>
    <button class="btn" id="startBtn">START GAME</button>
  </div>
</div>

<div id="pauseOverlay" class="hidden">
  <div class="overlay-content">
    <h1>PAUSED</h1>
    <p>Press ESC or P to resume</p>
    <button class="btn" id="resumeBtn">RESUME</button>
    <button class="btn" id="quitBtn">QUIT TO MENU</button>
  </div>
</div>

<div id="gameOverOverlay" class="hidden">
  <div class="overlay-content">
    <h1>GAME OVER</h1>
    <p id="finalScoreText">Score: 0</p>
    <button class="btn" id="retryBtn">RETRY</button>
    <button class="btn" id="menuBtn">MAIN MENU</button>
  </div>
</div>

<script>
(function() {
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const GRID_SIZE = 5;
const CELL_SIZE = 60;
const PIPE_TYPES = {
  EMPTY: 0,
  STRAIGHT: 1,
  CORNER: 2,
  T_JUNCTION: 3,
  CROSS: 4,
  START: 5,
  END: 6
};

const PIPE_COLORS = {
  [PIPE_TYPES.STRAIGHT]: '#00ffff',
  [PIPE_TYPES.CORNER]: '#00ffaa',
  [PIPE_TYPES.T_JUNCTION]: '#00ccff',
  [PIPE_TYPES.CROSS]: '#0099ff',
  [PIPE_TYPES.START]: '#00ff00',
  [PIPE_TYPES.END]: '#ff00ff'
};

const ROTATIONS = {
  [PIPE_TYPES.STRAIGHT]: [0, 90],
  [PIPE_TYPES.CORNER]: [0, 90, 180, 270],
  [PIPE_TYPES.T_JUNCTION]: [0, 90, 180, 270],
  [PIPE_TYPES.CROSS]: [0],
  [PIPE_TYPES.START]: [0, 90, 180, 270],
  [PIPE_TYPES.END]: [0, 90, 180, 270]
};

const CONNECTIONS = {
  [PIPE_TYPES.STRAIGHT]: {0: ['N','S'], 90: ['E','W']},
  [PIPE_TYPES.CORNER]: {0: ['N','E'], 90: ['E','S'], 180: ['S','W'], 270: ['W','N']},
  [PIPE_TYPES.T_JUNCTION]: {0: ['N','E','S'], 90: ['E','S','W'], 180: ['S','W','N'], 270: ['W','N','E']},
  [PIPE_TYPES.CROSS]: {0: ['N','E','S','W']},
  [PIPE_TYPES.START]: {0: ['S'], 90: ['W'], 180: ['N'], 270: ['E']},
  [PIPE_TYPES.END]: {0: ['N'], 90: ['E'], 180: ['S'], 270: ['W']}
};

const OPPOSITE = {N:'S', S:'N', E:'W', W:'E'};

let grid = [];
let level = 1;
let score = 0;
let bestScore = parseInt(localStorage.getItem('neonPipelineBest')) || 0;
let timeLeft = 60;
let gameRunning = false;
let gamePaused = false;
let animationId = null;
let lastTime = 0;
let startPos = {x:0, y:0};
let endPos = {x:4, y:4};
let selectedCell = null;
let particles = [];
let flowProgress = 0;
let flowActive = false;

document.getElementById('bestDisplay').textContent = bestScore;

function resizeCanvas() {
  const maxWidth = window.innerWidth * 0.95;
  const maxHeight = window.innerHeight * 0.85;
  const size = Math.min(maxWidth, maxHeight, GRID_SIZE * CELL_SIZE);
  canvas.width = size;
  canvas.height = size;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function generateLevel() {
  grid = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill().map(() => ({type: PIPE_TYPES.EMPTY, rotation: 0})));
  
  const pipes = [PIPE_TYPES.STRAIGHT, PIPE_TYPES.CORNER, PIPE_TYPES.T_JUNCTION, PIPE_TYPES.CROSS];
  for (let y = 0; y < GRID_SIZE; y++) {
    for (let x = 0; x < GRID_SIZE; x++) {
      if ((x === startPos.x && y === startPos.y) || (x === endPos.x && y === endPos.y)) continue;
      const type = pipes[Math.floor(Math.random() * pipes.length)];
      const rots = ROTATIONS[type];
      grid[y][x] = {type, rotation: rots[Math.floor(Math.random() * rots.length)]};
    }
  }
  
  grid[startPos.y][startPos.x] = {type: PIPE_TYPES.START, rotation: 0};
  grid[endPos.y][endPos.x] = {type: PIPE_TYPES.END, rotation: 180};
  
  ensureSolvable();
}

function ensureSolvable() {
  for (let attempt = 0; attempt < 100; attempt++) {
    if (checkConnection()) return;
    const pipes = [PIPE_TYPES.STRAIGHT, PIPE_TYPES.CORNER, PIPE_TYPES.T_JUNCTION, PIPE_TYPES.CROSS];
    for (let y = 0; y < GRID_SIZE; y++) {
      for (let x = 0; x < GRID_SIZE; x++) {
        if ((x === startPos.x && y === startPos.y) || (x === endPos.x && y === endPos.y)) continue;
        const type = pipes[Math.floor(Math.random() * pipes.length)];
        const rots = ROTATIONS[type];
        grid[y][x] = {type, rotation: rots[Math.floor(Math.random() * rots.length)]};
      }
    }
  }
}

function checkConnection() {
  const visited = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(false));
  const queue = [{x: startPos.x, y: startPos.y, from: 'N'}];
  visited[startPos.y][startPos.x] = true;
  
  while (queue.length) {
    const {x, y, from} = queue.shift();
    const cell = grid[y][x];
    if (cell.type === PIPE_TYPES.EMPTY) continue;
    
    const conns = CONNECTIONS[cell.type][cell.rotation] || [];
    if (!conns.includes(from)) continue;
    
    if (x === endPos.x && y === endPos.y && conns.includes(OPPOSITE[from])) {
      return true;
    }
    
    for (const dir of conns) {
      if (dir === from) continue;
      let nx = x, ny = y;
      if (dir === 'N') ny--;
      else if (dir === 'S') ny++;
      else if (dir === 'E') nx++;
      else if (dir === 'W') nx--;
      
      if (nx >= 0 && nx < GRID_SIZE && ny >= 0 && ny < GRID_SIZE && !visited[ny][nx]) {
        visited[ny][nx] = true;
        queue.push({x: nx, y: ny, from: OPPOSITE[dir]});
      }
    }
  }
  return false;
}

function rotatePipe(x, y) {
  if (x === startPos.x && y === startPos.y) return;
  if (x === endPos.x && y === endPos.y) return;
  
  const cell = grid[y][x];
  const rots = ROTATIONS[cell.type];
  const currentIndex = rots.indexOf(cell.rotation);
  const nextIndex = (currentIndex + 1) % rots.length;
  cell.rotation = rots[nextIndex];
  
  createParticles(x, y);
}

function createParticles(x, y) {
  const cx = x * CELL_SIZE + CELL_SIZE/2;
  const cy = y * CELL_SIZE + CELL_SIZE/2;
  for (let i = 0; i < 8; i++) {
    const angle = (Math.PI * 2 / 8) * i;
    particles.push({
      x: cx, y: cy,
      vx: Math.cos(angle) * 2,
      vy: Math.sin(angle) * 2,
      life: 1,
      color: PIPE_COLORS[grid[y][x].type] || '#00ffff'
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= dt * 2;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawPipe(x, y, cell) {
  const cx = x * CELL_SIZE + CELL_SIZE/2;
  const cy = y * CELL_SIZE + CELL_SIZE/2;
  const size = CELL_SIZE * 0.35;
  
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(cell.rotation * Math.PI / 180);
  
  ctx.strokeStyle = PIPE_COLORS[cell.type] || '#00ffff';
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.shadowColor = ctx.strokeStyle;
  ctx.shadowBlur = 15;
  
  ctx.beginPath();
  const conns = CONNECTIONS[cell.type][cell.rotation] || [];
  
  if (conns.includes('N')) ctx.moveTo(0, -size), ctx.lineTo(0, 0);
  if (conns.includes('S')) ctx.moveTo(0, 0), ctx.lineTo(0, size);
  if (conns.includes('E')) ctx.moveTo(0, 0), ctx.lineTo(size, 0);
  if (conns.includes('W')) ctx.moveTo(-size, 0), ctx.lineTo(0, 0);
  
  ctx.stroke();
  
  if (cell.type === PIPE_TYPES.START || cell.type === PIPE_TYPES.END) {
    ctx.fillStyle = ctx.strokeStyle;
    ctx.beginPath();
    ctx.arc(0, 0, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 20;
  }
  
  ctx.restore();
}

function drawGrid() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  ctx.strokeStyle = '#00ffff11';
  ctx.lineWidth = 1;
  for (let i = 0; i <= GRID_SIZE; i++) {
    ctx.beginPath();
    ctx.moveTo(i * CELL_SIZE, 0);
    ctx.lineTo(i * CELL_SIZE, GRID_SIZE * CELL_SIZE);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, i * CELL_SIZE);
    ctx.lineTo(GRID_SIZE * CELL_SIZE, i * CELL_SIZE);
    ctx.stroke();
  }
  
  for (let y = 0; y < GRID_SIZE; y++) {
    for (let x = 0; x < GRID_SIZE; x++) {
      drawPipe(x, y, grid[y][x]);
    }
  }
  
  if (flowActive) {
    drawFlow();
  }
  
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
  
  if (selectedCell) {
    const x = selectedCell.x, y = selectedCell.y;
    ctx.strokeStyle = '#ffff00';
    ctx.lineWidth = 3;
    ctx.setLineDash([5, 5]);
    ctx.strokeRect(x * CELL_SIZE + 2, y * CELL_SIZE + 2, CELL_SIZE - 4, CELL_SIZE - 4);
    ctx.setLineDash([]);
  }
}

function drawFlow() {
  const visited = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(false));
  const path = [];
  const queue = [{x: startPos.x, y: startPos.y, from: 'N', path: []}];
  visited[startPos.y][startPos.x] = true;
  
  while (queue.length) {
    const {x, y, from, path: currentPath} = queue.shift();
    const cell = grid[y][x];
    if (cell.type === PIPE_TYPES.EMPTY) continue;
    
    const conns = CONNECTIONS[cell.type][cell.rotation] || [];
    if (!conns.includes(from)) continue;
    
    const newPath = [...currentPath, {x, y, from}];
    
    if (x === endPos.x && y === endPos.y && conns.includes(OPPOSITE[from])) {
      path.push(...newPath);
      break;
    }
    
    for (const dir of conns) {
      if (dir === from) continue;
      let nx = x, ny = y;
      if (dir === 'N') ny--;
      else if (dir === 'S') ny++;
      else if (dir === 'E') nx++;
      else if (dir === 'W') nx--;
      
      if (nx >= 0 && nx < GRID_SIZE && ny >= 0 && ny < GRID_SIZE && !visited[ny][nx]) {
        visited[ny][nx] = true;
        queue.push({x: nx, y: ny, from: OPPOSITE[dir], path: newPath});
      }
    }
  }
  
  if (path.length === 0) return;
  
  ctx.save();
  ctx.strokeStyle = '#00ffff';
  ctx.lineWidth = 8;
  ctx.lineCap = 'round';
  ctx.shadowColor = '#00ffff';
  ctx.shadowBlur = 20;
  ctx.globalAlpha = 0.8;
  
  const totalSegments = path.length;
  const progressSegments = Math.floor(totalSegments * flowProgress);
  const partialProgress = (totalSegments * flowProgress) - progressSegments;
  
  ctx.beginPath();
  for (let i = 0; i < progressSegments; i++) {
    const p = path[i];
    const cx = p.x * CELL_SIZE + CELL_SIZE/2;
    const cy = p.y * CELL_SIZE + CELL_SIZE/2;
    if (i === 0) ctx.moveTo(cx, cy);
    else ctx.lineTo(cx, cy);
  }
  
  if (progressSegments < totalSegments && partialProgress > 0) {
    const p1 = path[progressSegments - 1] || path[0];
    const p2 = path[progressSegments];
    const cx1 = p1.x * CELL_SIZE + CELL_SIZE/2;
    const cy1 = p1.y * CELL_SIZE + CELL_SIZE/2;
    const cx2 = p2.x * CELL_SIZE + CELL_SIZE/2;
    const cy2 = p2.y * CELL_SIZE + CELL_SIZE/2;
    ctx.lineTo(cx1 + (cx2 - cx1) * partialProgress, cy1 + (cy2 - cy1) * partialProgress);
  }
  
  ctx.stroke();
  ctx.restore();
}

function updateFlow(dt) {
  if (!flowActive) return;
  flowProgress += dt * 2;
  if (flowProgress >= 1) {
    flowProgress = 0;
    flowActive = false;
    completeLevel();
  }
}

function completeLevel() {
  score += 100 * level + Math.floor(timeLeft * 10);
  level++;
  timeLeft = Math.max(30, 60 - level * 3);
  document.getElementById('levelDisplay').textContent = level;
  document.getElementById('scoreDisplay').textContent = score;
  document.getElementById('timeDisplay').textContent = timeLeft;
  
  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem('neonPipelineBest', bestScore);
    document.getElementById('bestDisplay').textContent = bestScore;
  }
  
  generateLevel();
}

function gameLoop(timestamp) {
  if (!gameRunning) return;
  
  const dt = (timestamp - lastTime) / 1000;
  lastTime = timestamp;
  
  if (!gamePaused) {
    timeLeft -= dt;
    document.getElementById('timeDisplay').textContent = Math.ceil(timeLeft);
    
    if (timeLeft <= 0) {
      gameOver();
      return;
    }
    
    updateParticles(dt);
    updateFlow(dt);
  }
  
  drawGrid();
  animationId = requestAnimationFrame(gameLoop);
}

function getCanvasCoords(e) {
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x: Math.floor((clientX - rect.left) / CELL_SIZE),
    y: Math.floor((clientY - rect.top) / CELL_SIZE)
  };
}

function handleCanvasClick(e) {
  if (!gameRunning || gamePaused) return;
  const {x, y} = getCanvasCoords(e);
  if (x >= 0 && x < GRID_SIZE && y >= 0 && y < GRID_SIZE) {
    selectedCell = {x, y};
    rotatePipe(x, y);
    if (checkConnection()) {
      flowActive = true;
      flowProgress = 0;
    }
  }
}

function handleCanvasTouchStart(e) {
  e.preventDefault();
  const {x, y} = getCanvasCoords(e);
  if (x >= 0 && x < GRID_SIZE && y >= 0 && y < GRID_SIZE) {
    selectedCell = {x, y};
  }
}

function handleCanvasTouchEnd(e) {
  e.preventDefault();
  if (selectedCell && gameRunning && !gamePaused) {
    rotatePipe(selectedCell.x, selectedCell.y);
    if (checkConnection()) {
      flowActive = true;
      flowProgress = 0;
    }
  }
  selectedCell = null;
}

canvas.addEventListener('click', handleCanvasClick, {passive: false});
canvas.addEventListener('touchstart', handleCanvasTouchStart, {passive: false});
canvas.addEventListener('touchend', handleCanvasTouchEnd, {passive: false});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
    if (gameRunning && !gamePaused) pauseGame();
    else if (gamePaused) resumeGame();
  }
});

function startGame() {
  // Hide overlays FIRST to ensure they're hidden even if errors occur later
  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('pauseOverlay').classList.add('hidden');
  document.getElementById('gameOverOverlay').classList.add('hidden');
  
  level = 1;
  score = 0;
  timeLeft = 60;
  gameRunning = true;
  gamePaused = false;
  flowActive = false;
  particles = [];
  document.getElementById('levelDisplay').textContent = level;
  document.getElementById('scoreDisplay').textContent = score;
  document.getElementById('timeDisplay').textContent = timeLeft;
  
  try {
    generateLevel();
    lastTime = performance.now();
    animationId = requestAnimationFrame(gameLoop);
  } catch (err) {
    console.error('Game start error:', err);
    showStartScreen();
  }
}

function pauseGame() {
  gamePaused = true;
  document.getElementById('pauseOverlay').classList.remove('hidden');
}

function resumeGame() {
  gamePaused = false;
  document.getElementById('pauseOverlay').classList.add('hidden');
  lastTime = performance.now();
  animationId = requestAnimationFrame(gameLoop);
}

function quitToMenu() {
  gameRunning = false;
  gamePaused = false;
  cancelAnimationFrame(animationId);
  document.getElementById('pauseOverlay').classList.add('hidden');
  document.getElementById('overlay').classList.remove('hidden');
}

function gameOver() {
  gameRunning = false;
  cancelAnimationFrame(animationId);
  document.getElementById('finalScoreText').textContent = `Score: ${score}`;
  document.getElementById('gameOverOverlay').classList.remove('hidden');
}

function retryGame() {
  document.getElementById('gameOverOverlay').classList.add('hidden');
  startGame();
}

function showStartScreen() {
  gameRunning = false;
  gamePaused = false;
  cancelAnimationFrame(animationId);
  document.getElementById('gameOverOverlay').classList.add('hidden');
  document.getElementById('pauseOverlay').classList.add('hidden');
  document.getElementById('overlay').classList.remove('hidden');
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('resumeBtn').addEventListener('click', resumeGame);
document.getElementById('quitBtn').addEventListener('click', quitToMenu);
document.getElementById('retryBtn').addEventListener('click', retryGame);
document.getElementById('menuBtn').addEventListener('click', showStartScreen);

showStartScreen();
})();
</script>
</body>
</html>
