<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Pipeline - Day 47</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a12; color: #00ffff; font-family: 'Courier New', monospace; overflow: hidden; touch-action: none; }
  canvas { display: block; margin: 0 auto; background: #05050a; box-shadow: 0 0 30px rgba(0,255,255,0.2), inset 0 0 60px rgba(0,20,30,0.5); }
  #ui { position: fixed; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; pointer-events: none; z-index: 10; }
  .panel { background: rgba(0,10,20,0.8); border: 1px solid #00ffff44; border-radius: 8px; padding: 8px 16px; backdrop-filter: blur(4px); text-shadow: 0 0 5px #00ffff; }
  .panel h3 { font-size: 14px; font-weight: normal; color: #00ffaa; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 2px; }
  .panel .value { font-size: 20px; font-weight: bold; color: #00ffff; }
  #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,5,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s; display: none; }
  #overlay.visible { opacity: 1; pointer-events: auto; display: flex; }
  #overlay h1 { font-size: clamp(28px, 8vw, 48px); margin-bottom: 10px; text-shadow: 0 0 20px #00ffff, 0 0 40px #0088ff; background: linear-gradient(90deg, #00ffff, #0088ff, #ff00ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.5); } }
  #overlay p { color: #88ffcc; margin-bottom: 30px; font-size: 16px; letter-spacing: 1px; }
  .btn { background: linear-gradient(135deg, #003344, #001122); border: 2px solid #00ffff; color: #00ffff; padding: 14px 40px; font-size: 16px; font-family: inherit; border-radius: 4px; cursor: pointer; margin: 8px; text-transform: uppercase; letter-spacing: 2px; transition: all 0.2s; box-shadow: 0 0 10px rgba(0,255,255,0.3); }
  .btn:hover { background: linear-gradient(135deg, #005566, #002233); box-shadow: 0 0 20px rgba(0,255,255,0.6), 0 0 30px rgba(0,255,255,0.4); transform: scale(1.05); }
  .btn:active { transform: scale(0.98); }
  .btn.secondary { border-color: #ff00ff; color: #ff00ff; box-shadow: 0 0 10px rgba(255,0,255,0.3); }
  .btn.secondary:hover { background: linear-gradient(135deg, #330033, #110011); box-shadow: 0 0 20px rgba(255,0,255,0.6), 0 0 30px rgba(255,0,255,0.4); }
  #touchControls { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: none; gap: 10px; z-index: 20; }
  .touchBtn { width: 60px; height: 60px; background: rgba(0,20,30,0.8); border: 2px solid #00ffff; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #00ffff; font-size: 24px; touch-action: manipulation; }
  .touchBtn:active { background: rgba(0,255,255,0.3); }
  @media (max-width: 768px) { #touchControls { display: flex; } }
  #pauseOverlay, #gameOverOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,5,0.95); z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; }
  #pauseOverlay.visible, #gameOverOverlay.visible { display: flex; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="ui">
  <div class="panel"><h3>Score</h3><div class="value" id="score">0</div></div>
  <div class="panel"><h3>Level</h3><div class="value" id="level">1</div></div>
  <div class="panel"><h3>Time</h3><div class="value" id="timer">60</div></div>
  <div class="panel"><h3>High Score</h3><div class="value" id="highScore">0</div></div>
</div>
<div id="overlay">
  <h1>NEON PIPELINE</h1>
  <p>Connect the flow before time runs out</p>
  <button class="btn" id="startBtn">START GAME</button>
  <button class="btn secondary" id="quitBtn">QUIT TO MENU</button>
</div>
<div id="pauseOverlay">
  <h1 style="color:#00ffff; text-shadow:0 0 20px #00ffff;">PAUSED</h1>
  <button class="btn" id="resumeBtn">RESUME</button>
  <button class="btn secondary" id="pauseQuitBtn">QUIT TO MENU</button>
</div>
<div id="gameOverOverlay">
  <h1 style="color:#ff0066; text-shadow:0 0 20px #ff0066;">GAME OVER</h1>
  <p id="finalScore" style="color:#00ffff; font-size:24px; margin-bottom:20px;">Score: 0</p>
  <button class="btn" id="retryBtn">RETRY</button>
  <button class="btn secondary" id="menuBtn">MAIN MENU</button>
</div>
<div id="touchControls">
  <button class="touchBtn" id="touchUp">▲</button>
  <button class="touchBtn" id="touchDown">▼</button>
  <button class="touchBtn" id="touchLeft">◄</button>
  <button class="touchBtn" id="touchRight">►</button>
  <button class="touchBtn" id="touchRotate">⟳</button>
</div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let width, height, cellSize, cols, rows;
let grid = [];
let score = 0, level = 1, timeLeft = 60, highScore = 0;
let gameState = 'menu';
let animationId = null;
let lastTime = 0;
let flowProgress = 0;
let flowActive = false;
let selectedCell = null;
let timerInterval = null;

const PIPE_TYPES = {
  empty: 0,
  straight: 1,
  corner: 2,
  tshape: 3,
  cross: 4,
  start: 5,
  end: 6
};

const PIPE_CONNECTIONS = {
  [PIPE_TYPES.straight]: [0, 2],
  [PIPE_TYPES.corner]: [0, 1],
  [PIPE_TYPES.tshape]: [0, 1, 3],
  [PIPE_TYPES.cross]: [0, 1, 2, 3],
  [PIPE_TYPES.start]: [1],
  [PIPE_TYPES.end]: [3]
};

function resize() {
  width = window.innerWidth;
  height = window.innerHeight - 80;
  canvas.width = width;
  canvas.height = height;
  cellSize = Math.min(width / 12, height / 8);
  cols = Math.floor(width / cellSize);
  rows = Math.floor(height / cellSize);
  if (gameState === 'playing') generateLevel();
}
window.addEventListener('resize', resize);

function generateLevel() {
  grid = [];
  for (let y = 0; y < rows; y++) {
    grid[y] = [];
    for (let x = 0; x < cols; x++) {
      grid[y][x] = { type: PIPE_TYPES.empty, rotation: 0, fixed: false };
    }
  }
  const startY = Math.floor(rows / 2);
  grid[startY][0] = { type: PIPE_TYPES.start, rotation: 0, fixed: true };
  grid[startY][cols - 1] = { type: PIPE_TYPES.end, rotation: 0, fixed: true };
  const pipeTypes = [PIPE_TYPES.straight, PIPE_TYPES.corner, PIPE_TYPES.tshape, PIPE_TYPES.cross];
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      if (grid[y][x].type === PIPE_TYPES.empty) {
        grid[y][x] = {
          type: pipeTypes[Math.floor(Math.random() * pipeTypes.length)],
          rotation: Math.floor(Math.random() * 4) * 90,
          fixed: false
        };
      }
    }
  }
  flowProgress = 0;
  flowActive = false;
  selectedCell = null;
}

function rotatePipe(x, y) {
  if (grid[y][x].fixed) return;
  grid[y][x].rotation = (grid[y][x].rotation + 90) % 360;
}

function getConnections(type, rotation) {
  const base = PIPE_CONNECTIONS[type] || [];
  const rotSteps = rotation / 90;
  return base.map(dir => (dir + rotSteps) % 4);
}

function checkConnection(x1, y1, x2, y2, dir) {
  if (x2 < 0 || x2 >= cols || y2 < 0 || y2 >= rows) return false;
  const c1 = getConnections(grid[y1][x1].type, grid[y1][x1].rotation);
  const c2 = getConnections(grid[y2][x2].type, grid[y2][x2].rotation);
  const opposite = (dir + 2) % 4;
  return c1.includes(dir) && c2.includes(opposite);
}

function traceFlow() {
  const startY = Math.floor(rows / 2);
  let x = 0, y = startY, dir = 1;
  const path = [{x, y}];
  const visited = new Set();
  visited.add(`${x},${y},${dir}`);
  let steps = 0;
  while (steps < cols * rows * 2) {
    const conn = getConnections(grid[y][x].type, grid[y][x].rotation);
    if (!conn.includes(dir)) break;
    let nx = x, ny = y;
    if (dir === 0) ny--;
    else if (dir === 1) nx++;
    else if (dir === 2) ny++;
    else if (dir === 3) nx--;
    if (nx < 0 || nx >= cols || ny < 0 || ny >= rows) break;
    const nConn = getConnections(grid[ny][nx].type, grid[ny][nx].rotation);
    const opp = (dir + 2) % 4;
    if (!nConn.includes(opp)) break;
    x = nx; y = ny;
    path.push({x, y});
    if (grid[y][x].type === PIPE_TYPES.end) return path;
    const nextDirs = nConn.filter(d => d !== opp);
    if (nextDirs.length === 0) break;
    dir = nextDirs[0];
    if (visited.has(`${x},${y},${dir}`)) break;
    visited.add(`${x},${y},${dir}`);
    steps++;
  }
  return null;
}

function updateFlow(dt) {
  if (!flowActive) return;
  flowProgress += dt * 2;
  const path = traceFlow();
  if (path && flowProgress >= path.length - 1) {
    score += 100 * level + Math.max(0, timeLeft) * 10;
    level++;
    timeLeft = Math.max(30, 60 - level * 2);
    generateLevel();
    flowActive = false;
    flowProgress = 0;
    updateUI();
  }
}

function updateTimer() {
  if (gameState !== 'playing') return;
  timeLeft--;
  if (timeLeft <= 0) {
    gameOver();
    return;
  }
  updateUI();
}

function updateUI() {
  document.getElementById('score').textContent = score;
  document.getElementById('level').textContent = level;
  document.getElementById('timer').textContent = timeLeft;
  document.getElementById('highScore').textContent = highScore;
}

function draw() {
  ctx.fillStyle = '#05050a';
  ctx.fillRect(0, 0, width, height);
  
  // Grid lines
  ctx.strokeStyle = '#00ffff11';
  ctx.lineWidth = 1;
  for (let x = 0; x <= cols; x++) {
    ctx.beginPath();
    ctx.moveTo(x * cellSize, 0);
    ctx.lineTo(x * cellSize, rows * cellSize);
    ctx.stroke();
  }
  for (let y = 0; y <= rows; y++) {
    ctx.beginPath();
    ctx.moveTo(0, y * cellSize);
    ctx.lineTo(cols * cellSize, y * cellSize);
    ctx.stroke();
  }

  // Draw pipes
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const cell = grid[y][x];
      if (cell.type === PIPE_TYPES.empty) continue;
      drawPipe(x, y, cell);
    }
  }

  // Draw selection highlight
  if (selectedCell) {
    const {x, y} = selectedCell;
    ctx.strokeStyle = '#ff00ff';
    ctx.lineWidth = 3;
    ctx.strokeRect(x * cellSize + 2, y * cellSize + 2, cellSize - 4, cellSize - 4);
  }

  // Draw flow animation
  if (flowActive) {
    const path = traceFlow();
    if (path) {
      const progress = Math.min(flowProgress, path.length - 1);
      const steps = Math.floor(progress);
      const partial = progress - steps;
      
      ctx.strokeStyle = '#00ffff';
      ctx.lineWidth = cellSize * 0.3;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.shadowColor = '#00ffff';
      ctx.shadowBlur = 15;
      
      ctx.beginPath();
      for (let i = 0; i <= steps; i++) {
        const px = path[i].x * cellSize + cellSize / 2;
        const py = path[i].y * cellSize + cellSize / 2;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      if (steps < path.length - 1 && partial > 0) {
        const px1 = path[steps].x * cellSize + cellSize / 2;
        const py1 = path[steps].y * cellSize + cellSize / 2;
        const px2 = path[steps + 1].x * cellSize + cellSize / 2;
        const py2 = path[steps + 1].y * cellSize + cellSize / 2;
        ctx.lineTo(px1 + (px2 - px1) * partial, py1 + (py2 - py1) * partial);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
  }
}

function drawPipe(x, y, cell) {
  const cx = x * cellSize + cellSize / 2;
  const cy = y * cellSize + cellSize / 2;
  const size = cellSize * 0.35;
  const connections = getConnections(cell.type, cell.rotation);
  
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate((cell.rotation * Math.PI) / 180);
  
  // Pipe body
  ctx.strokeStyle = cell.fixed ? '#00ffaa' : '#00ffff';
  ctx.lineWidth = size * 0.5;
  ctx.lineCap = 'round';
  ctx.shadowColor = cell.fixed ? '#00ffaa' : '#00ffff';
  ctx.shadowBlur = 10;
  
  if (cell.type === PIPE_TYPES.start) {
    ctx.fillStyle = '#00ffaa';
    ctx.shadowColor = '#00ffaa';
    ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.arc(0, 0, size * 0.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(size * 1.5, 0);
    ctx.stroke();
  } else if (cell.type === PIPE_TYPES.end) {
    ctx.fillStyle = '#ff0066';
    ctx.shadowColor = '#ff0066';
    ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.arc(0, 0, size * 0.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-size * 1.5, 0);
    ctx.stroke();
  } else {
    ctx.beginPath();
    if (connections.includes(0)) ctx.moveTo(0, -size), ctx.lineTo(0, 0);
    if (connections.includes(1)) ctx.moveTo(0, 0), ctx.lineTo(size, 0);
    if (connections.includes(2)) ctx.moveTo(0, 0), ctx.lineTo(0, size);
    if (connections.includes(3)) ctx.moveTo(-size, 0), ctx.lineTo(0, 0);
    ctx.stroke();
    
    // Center hub
    ctx.fillStyle = cell.fixed ? '#00ffaa' : '#00ffff';
    ctx.beginPath();
    ctx.arc(0, 0, size * 0.25, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function gameLoop(timestamp) {
  if (gameState !== 'playing') return;
  const dt = (timestamp - lastTime) / 1000;
  lastTime = timestamp;
  updateFlow(dt);
  draw();
  animationId = requestAnimationFrame(gameLoop);
}

function startGame() {
  gameState = 'playing';
  score = 0;
  level = 1;
  timeLeft = 60;
  document.getElementById('overlay').classList.remove('visible');
  document.getElementById('pauseOverlay').classList.remove('visible');
  document.getElementById('gameOverOverlay').classList.remove('visible');
  generateLevel();
  updateUI();
  lastTime = performance.now();
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(updateTimer, 1000);
  animationId = requestAnimationFrame(gameLoop);
}

function pauseGame() {
  if (gameState !== 'playing') return;
  gameState = 'paused';
  document.getElementById('pauseOverlay').classList.add('visible');
  if (timerInterval) clearInterval(timerInterval);
  cancelAnimationFrame(animationId);
}

function resumeGame() {
  if (gameState !== 'paused') return;
  gameState = 'playing';
  document.getElementById('pauseOverlay').classList.remove('visible');
  lastTime = performance.now();
  timerInterval = setInterval(updateTimer, 1000);
  animationId = requestAnimationFrame(gameLoop);
}

function quitToMenu() {
  gameState = 'menu';
  document.getElementById('pauseOverlay').classList.remove('visible');
  document.getElementById('gameOverOverlay').classList.remove('visible');
  document.getElementById('overlay').classList.add('visible');
  if (timerInterval) clearInterval(timerInterval);
  cancelAnimationFrame(animationId);
}

function showStartScreen() {
  gameState = 'menu';
  document.getElementById('overlay').classList.add('visible');
  if (timerInterval) clearInterval(timerInterval);
  cancelAnimationFrame(animationId);
}

function gameOver() {
  gameState = 'gameover';
  if (timerInterval) clearInterval(timerInterval);
  cancelAnimationFrame(animationId);
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('neonPipelineHighScore', highScore);
  }
  document.getElementById('finalScore').textContent = `Score: ${score}`;
  document.getElementById('gameOverOverlay').classList.add('visible');
  updateUI();
}

function handleKeyDown(e) {
  if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
    if (gameState === 'playing') pauseGame();
    else if (gameState === 'paused') resumeGame();
  }
  if (gameState !== 'playing') return;
  if (selectedCell) {
    const {x, y} = selectedCell;
    if (e.key === 'ArrowUp' && y > 0) selectedCell = {x, y: y - 1};
    else if (e.key === 'ArrowDown' && y < rows - 1) selectedCell = {x, y: y + 1};
    else if (e.key === 'ArrowLeft' && x > 0) selectedCell = {x: x - 1, y};
    else if (e.key === 'ArrowRight' && x < cols - 1) selectedCell = {x: x + 1, y};
    else if (e.key === ' ' || e.key === 'Enter') rotatePipe(x, y);
    else if (e.key === 'f' || e.key === 'F') {
      const path = traceFlow();
      if (path) {
        flowActive = true;
        flowProgress = 0;
      }
    }
  } else {
    selectedCell = {x: 0, y: Math.floor(rows / 2)};
  }
}

function handleTouchStart(e) {
  e.preventDefault();
  const btn = e.target.closest('.touchBtn');
  if (!btn) return;
  if (gameState !== 'playing') return;
  if (!selectedCell) {
    selectedCell = {x: 0, y: Math.floor(rows / 2)};
    return;
  }
  const {x, y} = selectedCell;
  switch (btn.id) {
    case 'touchUp': if (y > 0) selectedCell = {x, y: y - 1}; break;
    case 'touchDown': if (y < rows - 1) selectedCell = {x, y: y + 1}; break;
    case 'touchLeft': if (x > 0) selectedCell = {x: x - 1, y}; break;
    case 'touchRight': if (x < cols - 1) selectedCell = {x: x + 1, y}; break;
    case 'touchRotate': rotatePipe(x, y); break;
  }
}

function handleCanvasClick(e) {
  if (gameState !== 'playing') return;
  const rect = canvas.getBoundingClientRect();
  const x = Math.floor((e.clientX - rect.left) / cellSize);
  const y = Math.floor((e.clientY - rect.top) / cellSize);
  if (x >= 0 && x < cols && y >= 0 && y < rows) {
    selectedCell = {x, y};
  }
}

function handleCanvasContextMenu(e) {
  e.preventDefault();
  if (gameState !== 'playing') return;
  if (selectedCell) rotatePipe(selectedCell.x, selectedCell.y);
}

function init() {
  highScore = parseInt(localStorage.getItem('neonPipelineHighScore')) || 0;
  updateUI();
  
  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('quitBtn').addEventListener('click', showStartScreen);
  document.getElementById('resumeBtn').addEventListener('click', resumeGame);
  document.getElementById('pauseQuitBtn').addEventListener('click', quitToMenu);
  document.getElementById('retryBtn').addEventListener('click', startGame);
  document.getElementById('menuBtn').addEventListener('click', quitToMenu);
  
  window.addEventListener('keydown', handleKeyDown);
  canvas.addEventListener('click', handleCanvasClick);
  canvas.addEventListener('contextmenu', handleCanvasContextMenu);
  
  const touchButtons = document.querySelectorAll('.touchBtn');
  touchButtons.forEach(btn => {
    btn.addEventListener('touchstart', handleTouchStart, {passive: false});
    btn.addEventListener('click', handleTouchStart);
  });
  
  resize();
  showStartScreen();
}

init();
</script>
</body>
</html>
