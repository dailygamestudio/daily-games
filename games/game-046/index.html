<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Neon Air Hockey - Day 46</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a12; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #e0e0ff; }
        canvas { display: block; position: fixed; top: 0; left: 0; z-index: 1; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 10, 25, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; gap: 20px; }
        .overlay.hidden { display: none; }
        h1 { font-size: clamp(2rem, 8vw, 4rem); font-weight: 700; text-transform: uppercase; letter-spacing: 0.2em; background: linear-gradient(135deg, #00ffff, #ff00ff, #ffff00); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 30px rgba(0, 255, 255, 0.5); animation: pulse 2s infinite alternate; }
        @keyframes pulse { from { filter: brightness(1); } to { filter: brightness(1.5); } }
        .score-display { font-size: clamp(1.5rem, 5vw, 2.5rem); font-weight: 600; color: #00ffff; text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff; }
        .btn { padding: 15px 40px; font-size: clamp(1rem, 3vw, 1.3rem); font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; border: none; border-radius: 50px; cursor: pointer; transition: all 0.2s; box-shadow: 0 0 15px currentColor; }
        .btn:hover, .btn:focus { transform: scale(1.05); box-shadow: 0 0 25px currentColor; }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background: linear-gradient(135deg, #00ffff, #0088ff); color: #000; }
        .btn-secondary { background: linear-gradient(135deg, #ff00ff, #aa00aa); color: #fff; }
        .btn-danger { background: linear-gradient(135deg, #ff3333, #cc0000); color: #fff; }
        .controls-hint { font-size: 0.9rem; color: #888; margin-top: 10px; text-align: center; line-height: 1.6; }
        .difficulty-indicator { font-size: 1rem; color: #ffff00; text-shadow: 0 0 10px #ffff00; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="startScreen" class="overlay">
        <h1>Neon Air Hockey</h1>
        <div class="score-display">HIGH SCORE: <span id="highScoreDisplay">0</span></div>
        <button id="startBtn" class="btn btn-primary">START</button>
        <div class="controls-hint">
            <strong>CONTROLS:</strong><br>
            Desktop: ← / → or A / D to move paddle<br>
            Mobile: Drag on screen to move paddle<br>
            Pause: ESC or P
        </div>
    </div>

    <div id="pauseOverlay" class="overlay hidden">
        <h1>PAUSED</h1>
        <button id="resumeBtn" class="btn btn-primary">RESUME</button>
        <button id="quitBtn" class="btn btn-danger">QUIT TO MENU</button>
    </div>

    <div id="gameOverOverlay" class="overlay hidden">
        <h1>GAME OVER</h1>
        <div class="score-display">FINAL SCORE: <span id="finalScore">0</span></div>
        <button id="retryBtn" class="btn btn-primary">RETRY</button>
        <button id="menuBtn" class="btn btn-secondary">MAIN MENU</button>
    </div>

    <script>
        // ==========================================
        // GAME CONSTANTS & CONFIGURATION
        // ==========================================
        const CONFIG = {
            GAME_WIDTH: 800,
            GAME_HEIGHT: 600,
            PADDLE_WIDTH: 120,
            PADDLE_HEIGHT: 20,
            PADDLE_RADIUS: 60,
            PADDLE_SPEED: 8,
            PADDLE_COLOR: '#00ffff',
            PADDLE_GLOW: '#00ffff',
            PUCK_RADIUS: 14,
            PUCK_MASS: 1,
            PUCK_FRICTION: 0.992,
            PUCK_MAX_SPEED: 18,
            PUCK_COLOR: '#ff00ff',
            PUCK_GLOW: '#ff00ff',
            GOAL_WIDTH: 200,
            GOAL_DEPTH: 30,
            AI_BASE_SPEED: 4.5,
            AI_REACTION_DELAY: 0.15,
            AI_MAX_SPEED: 10,
            DIFFICULTY_INCREASE_INTERVAL: 15,
            SPEED_INCREASE_FACTOR: 1.08,
            MAX_DIFFICULTY_LEVEL: 10,
            TRAIL_LENGTH: 8,
            PARTICLE_COUNT: 12,
            PARTICLE_LIFE: 0.6,
            BG_COLOR: '#0a0a12',
            LINE_COLOR: '#004444',
            CENTER_LINE_COLOR: '#006666',
            SCORE_COLOR_PLAYER: '#00ffff',
            SCORE_COLOR_AI: '#ff3333',
            TEXT_COLOR: '#e0e0ff'
        };

        // ==========================================
        // GAME STATE
        // ==========================================
        let canvas = document.getElementById('gameCanvas');
        let ctx = canvas.getContext('2d');
        let dpr = window.devicePixelRatio || 1;
        let scaleX = 1, scaleY = 1;

        let gameState = 'start';
        let animationId = null;
        let lastTime = 0;
        let score = { player: 0, ai: 0 };
        let highScore = parseInt(localStorage.getItem('neonAirHockeyHighScore')) || 0;
        let difficultyLevel = 1;
        let difficultyTimer = 0;

        let playerPaddle = { x: 0, y: 0, vx: 0, targetX: 0 };
        let aiPaddle = { x: 0, y: 0, vx: 0, targetX: 0, reactionTimer: 0 };
        let puck = { x: 0, y: 0, vx: 0, vy: 0, trail: [] };
        let particles = [];

        let keys = { left: false, right: false };
        let touchX = null;

        const startScreen = document.getElementById('startScreen');
        const pauseOverlay = document.getElementById('pauseOverlay');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const highScoreDisplay = document.getElementById('highScoreDisplay');
        const finalScoreDisplay = document.getElementById('finalScore');

        // ==========================================
        // INITIALIZATION
        // ==========================================
        function resize() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            scaleX = canvas.width / CONFIG.GAME_WIDTH;
            scaleY = canvas.height / CONFIG.GAME_HEIGHT;
            ctx.scale(dpr, dpr);
        }

        function resetGame() {
            score = { player: 0, ai: 0 };
            difficultyLevel = 1;
            difficultyTimer = 0;
            resetPuck();
            resetPaddles();
            particles = [];
            highScoreDisplay.textContent = highScore;
        }

        function resetPaddles() {
            playerPaddle.x = CONFIG.GAME_WIDTH / 2;
            playerPaddle.y = CONFIG.GAME_HEIGHT - CONFIG.PADDLE_HEIGHT - 10;
            playerPaddle.vx = 0;
            playerPaddle.targetX = playerPaddle.x;

            aiPaddle.x = CONFIG.GAME_WIDTH / 2;
            aiPaddle.y = CONFIG.PADDLE_HEIGHT + 10;
            aiPaddle.vx = 0;
            aiPaddle.targetX = aiPaddle.x;
            aiPaddle.reactionTimer = 0;
        }

        function resetPuck() {
            puck.x = CONFIG.GAME_WIDTH / 2;
            puck.y = CONFIG.GAME_HEIGHT / 2;
            puck.vx = 0;
            puck.vy = 0;
            puck.trail = [];
            for (let i = 0; i < CONFIG.TRAIL_LENGTH; i++) {
                puck.trail.push({ x: puck.x, y: puck.y });
            }
        }

        function spawnParticles(x, y, color, count = CONFIG.PARTICLE_COUNT) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 8 + 4;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: CONFIG.PARTICLE_LIFE,
                    maxLife: CONFIG.PARTICLE_LIFE,
                    color: color,
                    size: Math.random() * 4 + 2
                });
            }
        }

        // ==========================================
        // GAME STATE FUNCTIONS
        // ==========================================
        function startGame() {
            gameState = 'playing';
            startScreen.classList.add('hidden');
            pauseOverlay.classList.add('hidden');
            gameOverOverlay.classList.add('hidden');
            resetGame();
            lastTime = performance.now();
            if (animationId) cancelAnimationFrame(animationId);
            animationId = requestAnimationFrame(gameLoop);
        }

        function pauseGame() {
            if (gameState !== 'playing') return;
            gameState = 'paused';
            pauseOverlay.classList.remove('hidden');
            cancelAnimationFrame(animationId);
        }

        function resumeGame() {
            if (gameState !== 'paused') return;
            gameState = 'playing';
            pauseOverlay.classList.add('hidden');
            lastTime = performance.now();
            animationId = requestAnimationFrame(gameLoop);
        }

        function quitToMenu() {
            gameState = 'start';
            pauseOverlay.classList.add('hidden');
            startScreen.classList.remove('hidden');
            cancelAnimationFrame(animationId);
        }

        function showStartScreen() {
            gameState = 'start';
            gameOverOverlay.classList.add('hidden');
            startScreen.classList.remove('hidden');
        }

        function gameOver() {
            gameState = 'gameover';
            gameOverOverlay.classList.remove('hidden');
            finalScoreDisplay.textContent = score.player;
            if (score.player > highScore) {
                highScore = score.player;
                localStorage.setItem('neonAirHockeyHighScore', highScore);
                highScoreDisplay.textContent = highScore;
            }
            cancelAnimationFrame(animationId);
        }

        // ==========================================
        // INPUT HANDLING
        // ==========================================
        function handleKeydown(e) {
            if (gameState === 'playing') {
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
                if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') pauseGame();
            } else if (gameState === 'paused') {
                if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') resumeGame();
            }
        }

        function handleKeyup(e) {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
        }

        function handleTouchStart(e) {
            e.preventDefault();
            if (gameState === 'playing') {
                touchX = e.touches[0].clientX / scaleX;
                playerPaddle.targetX = touchX;
            }
        }

        function handleTouchMove(e) {
            e.preventDefault();
            if (gameState === 'playing' && touchX !== null) {
                touchX = e.touches[0].clientX / scaleX;
                playerPaddle.targetX = touchX;
            }
        }

        function handleTouchEnd(e) {
            touchX = null;
        }

        // ==========================================
        // GAME LOGIC
        // ==========================================
        function updatePlayerPaddle(dt) {
            if (keys.left) playerPaddle.targetX -= CONFIG.PADDLE_SPEED * 60 * dt;
            if (keys.right) playerPaddle.targetX += CONFIG.PADDLE_SPEED * 60 * dt;

            playerPaddle.targetX = Math.max(CONFIG.PADDLE_RADIUS, Math.min(CONFIG.GAME_WIDTH - CONFIG.PADDLE_RADIUS, playerPaddle.targetX));
            playerPaddle.vx = (playerPaddle.targetX - playerPaddle.x) * 0.3;
            playerPaddle.x += playerPaddle.vx;
        }

        function updateAIPaddle(dt) {
            aiPaddle.reactionTimer -= dt;
            if (aiPaddle.reactionTimer <= 0) {
                const puckFutureX = puck.x + puck.vx * 0.5;
                aiPaddle.targetX = puckFutureX;
                aiPaddle.reactionTimer = CONFIG.AI_REACTION_DELAY;
            }

            const aiSpeed = Math.min(CONFIG.AI_BASE_SPEED * Math.pow(CONFIG.SPEED_INCREASE_FACTOR, difficultyLevel - 1), CONFIG.AI_MAX_SPEED);
            const dx = aiPaddle.targetX - aiPaddle.x;
            const maxMove = aiSpeed * 60 * dt;
            if (Math.abs(dx) > maxMove) {
                aiPaddle.vx = dx > 0 ? maxMove : -maxMove;
            } else {
                aiPaddle.vx = dx;
            }
            aiPaddle.x += aiPaddle.vx;
            aiPaddle.x = Math.max(CONFIG.PADDLE_RADIUS, Math.min(CONFIG.GAME_WIDTH - CONFIG.PADDLE_RADIUS, aiPaddle.x));
        }

        function updatePuck(dt) {
            puck.trail.unshift({ x: puck.x, y: puck.y });
            if (puck.trail.length > CONFIG.TRAIL_LENGTH) puck.trail.pop();

            puck.x += puck.vx * 60 * dt;
            puck.y += puck.vy * 60 * dt;

            puck.vx *= CONFIG.PUCK_FRICTION;
            puck.vy *= CONFIG.PUCK_FRICTION;

            const speed = Math.sqrt(puck.vx * puck.vx + puck.vy * puck.vy);
            if (speed > CONFIG.PUCK_MAX_SPEED) {
                puck.vx = (puck.vx / speed) * CONFIG.PUCK_MAX_SPEED;
                puck.vy = (puck.vy / speed) * CONFIG.PUCK_MAX_SPEED;
            }

            // Wall collisions
            if (puck.x - CONFIG.PUCK_RADIUS < 0) {
                puck.x = CONFIG.PUCK_RADIUS;
                puck.vx = Math.abs(puck.vx);
                spawnParticles(puck.x, puck.y, CONFIG.PUCK_GLOW, 6);
            }
            if (puck.x + CONFIG.PUCK_RADIUS > CONFIG.GAME_WIDTH) {
                puck.x = CONFIG.GAME_WIDTH - CONFIG.PUCK_RADIUS;
                puck.vx = -Math.abs(puck.vx);
                spawnParticles(puck.x, puck.y, CONFIG.PUCK_GLOW, 6);
            }

            // Paddle collisions
            checkPaddleCollision(playerPaddle, true);
            checkPaddleCollision(aiPaddle, false);

            // Goal detection
            if (puck.y - CONFIG.PUCK_RADIUS < 0) {
                if (puck.x > (CONFIG.GAME_WIDTH - CONFIG.GOAL_WIDTH) / 2 && puck.x < (CONFIG.GAME_WIDTH + CONFIG.GOAL_WIDTH) / 2) {
                    score.player++;
                    spawnParticles(puck.x, puck.y, CONFIG.SCORE_COLOR_PLAYER, 20);
                    resetPuck();
                    resetPaddles();
                } else {
                    puck.y = CONFIG.PUCK_RADIUS;
                    puck.vy = Math.abs(puck.vy);
                    spawnParticles(puck.x, puck.y, CONFIG.PUCK_GLOW, 6);
                }
            }
            if (puck.y + CONFIG.PUCK_RADIUS > CONFIG.GAME_HEIGHT) {
                if (puck.x > (CONFIG.GAME_WIDTH - CONFIG.GOAL_WIDTH) / 2 && puck.x < (CONFIG.GAME_WIDTH + CONFIG.GOAL_WIDTH) / 2) {
                    score.ai++;
                    spawnParticles(puck.x, puck.y, CONFIG.SCORE_COLOR_AI, 20);
                    resetPuck();
                    resetPaddles();
                } else {
                    puck.y = CONFIG.GAME_HEIGHT - CONFIG.PUCK_RADIUS;
                    puck.vy = -Math.abs(puck.vy);
                    spawnParticles(puck.x, puck.y, CONFIG.PUCK_GLOW, 6);
                }
            }
        }

        function checkPaddleCollision(paddle, isPlayer) {
            const paddleTop = isPlayer ? paddle.y - CONFIG.PADDLE_HEIGHT / 2 : paddle.y - CONFIG.PADDLE_HEIGHT / 2;
            const paddleBottom = isPlayer ? paddle.y + CONFIG.PADDLE_HEIGHT / 2 : paddle.y + CONFIG.PADDLE_HEIGHT / 2;
            const paddleLeft = paddle.x - CONFIG.PADDLE_RADIUS;
            const paddleRight = paddle.x + CONFIG.PADDLE_RADIUS;

            if (puck.x + CONFIG.PUCK_RADIUS > paddleLeft && puck.x - CONFIG.PUCK_RADIUS < paddleRight &&
                puck.y + CONFIG.PUCK_RADIUS > paddleTop && puck.y - CONFIG.PUCK_RADIUS < paddleBottom) {

                const overlapX = Math.min(puck.x + CONFIG.PUCK_RADIUS - paddleLeft, paddleRight - (puck.x - CONFIG.PUCK_RADIUS));
                const overlapY = Math.min(puck.y + CONFIG.PUCK_RADIUS - paddleTop, paddleBottom - (puck.y - CONFIG.PUCK_RADIUS));

                if (overlapX < overlapY) {
                    if (puck.x < paddle.x) puck.x = paddleLeft - CONFIG.PUCK_RADIUS;
                    else puck.x = paddleRight + CONFIG.PUCK_RADIUS;
                    puck.vx = -puck.vx * 1.1;
                } else {
                    if (isPlayer) puck.y = paddleTop - CONFIG.PUCK_RADIUS;
                    else puck.y = paddleBottom + CONFIG.PUCK_RADIUS;
                    puck.vy = -puck.vy * 1.1;
                }

                puck.vx += paddle.vx * 0.3;
                spawnParticles(puck.x, puck.y, isPlayer ? CONFIG.PADDLE_GLOW : CONFIG.PUCK_GLOW, 8);
            }
        }

        function updateParticles(dt) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx * 60 * dt;
                p.y += p.vy * 60 * dt;
                p.vx *= 0.98;
                p.vy *= 0.98;
                p.life -= dt;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function updateDifficulty(dt) {
            difficultyTimer += dt;
            if (difficultyTimer >= CONFIG.DIFFICULTY_INCREASE_INTERVAL && difficultyLevel < CONFIG.MAX_DIFFICULTY_LEVEL) {
                difficultyLevel++;
                difficultyTimer = 0;
            }
        }

        function update(dt) {
            if (gameState !== 'playing') return;
            updatePlayerPaddle(dt);
            updateAIPaddle(dt);
            updatePuck(dt);
            updateParticles(dt);
            updateDifficulty(dt);

            if (score.player >= 7 || score.ai >= 7) {
                gameOver();
            }
        }

        // ==========================================
        // RENDERING
        // ==========================================
        function drawBackground() {
            ctx.fillStyle = CONFIG.BG_COLOR;
            ctx.fillRect(0, 0, CONFIG.GAME_WIDTH, CONFIG.GAME_HEIGHT);

            // Grid lines
            ctx.strokeStyle = CONFIG.LINE_COLOR;
            ctx.lineWidth = 1;
            const gridSize = 40;
            for (let x = 0; x <= CONFIG.GAME_WIDTH; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, CONFIG.GAME_HEIGHT);
                ctx.stroke();
            }
            for (let y = 0; y <= CONFIG.GAME_HEIGHT; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(CONFIG.GAME_WIDTH, y);
                ctx.stroke();
            }

            // Center line
            ctx.strokeStyle = CONFIG.CENTER_LINE_COLOR;
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(0, CONFIG.GAME_HEIGHT / 2);
            ctx.lineTo(CONFIG.GAME_WIDTH, CONFIG.GAME_HEIGHT / 2);
            ctx.stroke();
            ctx.setLineDash([]);

            // Center circle
            ctx.beginPath();
            ctx.arc(CONFIG.GAME_WIDTH / 2, CONFIG.GAME_HEIGHT / 2, 60, 0, Math.PI * 2);
            ctx.stroke();

            // Goals
            const goalLeft = (CONFIG.GAME_WIDTH - CONFIG.GOAL_WIDTH) / 2;
            const goalRight = (CONFIG.GAME_WIDTH + CONFIG.GOAL_WIDTH) / 2;

            // Top goal (AI)
            ctx.fillStyle = 'rgba(255, 51, 51, 0.1)';
            ctx.fillRect(goalLeft, 0, CONFIG.GOAL_WIDTH, CONFIG.GOAL_DEPTH);
            ctx.strokeStyle = CONFIG.SCORE_COLOR_AI;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(goalLeft, 0);
            ctx.lineTo(goalLeft, CONFIG.GOAL_DEPTH);
            ctx.lineTo(goalRight, CONFIG.GOAL_DEPTH);
            ctx.lineTo(goalRight, 0);
            ctx.stroke();

            // Bottom goal (Player)
            ctx.fillStyle = 'rgba(0, 255, 255, 0.1)';
            ctx.fillRect(goalLeft, CONFIG.GAME_HEIGHT - CONFIG.GOAL_DEPTH, CONFIG.GOAL_WIDTH, CONFIG.GOAL_DEPTH);
            ctx.strokeStyle = CONFIG.SCORE_COLOR_PLAYER;
            ctx.beginPath();
            ctx.moveTo(goalLeft, CONFIG.GAME_HEIGHT);
            ctx.lineTo(goalLeft, CONFIG.GAME_HEIGHT - CONFIG.GOAL_DEPTH);
            ctx.lineTo(goalRight, CONFIG.GAME_HEIGHT - CONFIG.GOAL_DEPTH);
            ctx.lineTo(goalRight, CONFIG.GAME_HEIGHT);
            ctx.stroke();
        }

        function drawPaddle(paddle, color, glowColor, isPlayer) {
            ctx.save();
            ctx.translate(paddle.x, paddle.y);

            // Glow
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, CONFIG.PADDLE_RADIUS + 10);
            gradient.addColorStop(0, glowColor + '80');
            gradient.addColorStop(1, glowColor + '00');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, CONFIG.PADDLE_RADIUS + 10, 0, Math.PI * 2);
            ctx.fill();

            // Paddle body
            ctx.fillStyle = color;
            ctx.shadowColor = glowColor;
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(0, 0, CONFIG.PADDLE_RADIUS, 0, Math.PI * 2);
            ctx.fill();

            // Inner detail
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#ffffff40';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, CONFIG.PADDLE_RADIUS - 5, 0, Math.PI * 2);
            ctx.stroke();

            ctx.restore();
        }

        function drawPuck() {
            // Trail
            for (let i = puck.trail.length - 1; i >= 0; i--) {
                const t = puck.trail[i];
                const alpha = (i + 1) / puck.trail.length * 0.3;
                const radius = CONFIG.PUCK_RADIUS * (i + 1) / puck.trail.length;
                ctx.fillStyle = CONFIG.PUCK_COLOR + Math.floor(alpha * 255).toString(16).padStart(2, '0');
                ctx.beginPath();
                ctx.arc(t.x, t.y, radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // Glow
            const glowGradient = ctx.createRadialGradient(puck.x, puck.y, 0, puck.x, puck.y, CONFIG.PUCK_RADIUS + 15);
            glowGradient.addColorStop(0, CONFIG.PUCK_GLOW + '80');
            glowGradient.addColorStop(1, CONFIG.PUCK_GLOW + '00');
            ctx.fillStyle = glowGradient;
            ctx.beginPath();
            ctx.arc(puck.x, puck.y, CONFIG.PUCK_RADIUS + 15, 0, Math.PI * 2);
            ctx.fill();

            // Puck body
            ctx.fillStyle = CONFIG.PUCK_COLOR;
            ctx.shadowColor = CONFIG.PUCK_GLOW;
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(puck.x, puck.y, CONFIG.PUCK_RADIUS, 0, Math.PI * 2);
            ctx.fill();

            // Highlight
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ffffff80';
            ctx.beginPath();
            ctx.arc(puck.x - 4, puck.y - 4, CONFIG.PUCK_RADIUS * 0.3, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawParticles() {
            for (const p of particles) {
                const alpha = p.life / p.maxLife;
                ctx.fillStyle = p.color + Math.floor(alpha * 255).toString(16).padStart(2, '0');
                ctx.globalAlpha = alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        function drawScore() {
            ctx.font = 'bold 48px Segoe UI';
            ctx.textAlign = 'center';
            ctx.fillStyle = CONFIG.SCORE_COLOR_PLAYER;
            ctx.shadowColor = CONFIG.SCORE_COLOR_PLAYER;
            ctx.shadowBlur = 10;
            ctx.fillText(score.player, CONFIG.GAME_WIDTH / 2, CONFIG.GAME_HEIGHT / 2 + 16);

            ctx.fillStyle = CONFIG.SCORE_COLOR_AI;
            ctx.shadowColor = CONFIG.SCORE_COLOR_AI;
            ctx.fillText(score.ai, CONFIG.GAME_WIDTH / 2, CONFIG.GAME_HEIGHT / 2 - 30);

            ctx.shadowBlur = 0;
        }

        function drawDifficulty() {
            ctx.font = '14px Segoe UI';
            ctx.textAlign = 'right';
            ctx.fillStyle = '#ffff00';
            ctx.shadowColor = '#ffff00';
            ctx.shadowBlur = 5;
            ctx.fillText(`DIFFICULTY: ${difficultyLevel}/${CONFIG.MAX_DIFFICULTY_LEVEL}`, CONFIG.GAME_WIDTH - 20, 30);
            ctx.shadowBlur = 0;
        }

        function draw() {
            ctx.clearRect(0, 0, CONFIG.GAME_WIDTH, CONFIG.GAME_HEIGHT);
            drawBackground();
            drawPaddle(playerPaddle, CONFIG.PADDLE_COLOR, CONFIG.PADDLE_GLOW, true);
            drawPaddle(aiPaddle, '#ff3333', '#ff3333', false);
            drawPuck();
            drawParticles();
            drawScore();
            drawDifficulty();
        }

        // ==========================================
        // GAME LOOP
        // ==========================================
        function gameLoop(timestamp) {
            const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
            lastTime = timestamp;

            update(dt);
            draw();

            if (gameState === 'playing') {
                animationId = requestAnimationFrame(gameLoop);
            }
        }

        // ==========================================
        // EVENT LISTENERS
        // ==========================================
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('resumeBtn').addEventListener('click', resumeGame);
        document.getElementById('quitBtn').addEventListener('click', quitToMenu);
        document.getElementById('retryBtn').addEventListener('click', startGame);
        document.getElementById('menuBtn').addEventListener('click', showStartScreen);

        window.addEventListener('keydown', handleKeydown);
        window.addEventListener('keyup', handleKeyup);

        canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
        canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
        canvas.addEventListener('touchend', handleTouchEnd, { passive: false });

        window.addEventListener('resize', resize);

        // ==========================================
        // START
        // ==========================================
        resize();
        highScoreDisplay.textContent = highScore;
    </script>
</body>
</html>
