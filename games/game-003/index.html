<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Runner</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0a0a12;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', 'Courier New', monospace;
    color: #00ffcc;
    overflow: hidden;
    touch-action: none;
}
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

#gameContainer {
    position: relative;
    border: 3px solid #00ffcc;
    border-radius: 8px;
    box-shadow: 
        0 0 30px #00ffcc,
        0 0 60px #0066ff,
        inset 0 0 30px rgba(0, 255, 204, 0.1);
    background: #050510;
}
canvas { display: block; }

#ui {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    padding: 16px;
}
#topBar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}
.statBox {
    background: rgba(0, 20, 30, 0.85);
    border: 1px solid #00ffcc44;
    border-radius: 6px;
    padding: 8px 16px;
    backdrop-filter: blur(4px);
}
.statLabel { font-size: 10px; color: #00ffcc88; text-transform: uppercase; letter-spacing: 1px; }
.statValue { font-size: 22px; font-weight: 700; color: #00ffcc; text-shadow: 0 0 10px #00ffcc; font-variant-numeric: tabular-nums; }
#highScore .statValue { color: #ffcc00; text-shadow: 0 0 10px #ffcc00; }
#speed .statValue { color: #ff6600; text-shadow: 0 0 10px #ff6600; }

#bottomBar { margin-top: auto; display: flex; justify-content: center; gap: 12px; }
.controlHint {
    background: rgba(0, 20, 30, 0.85);
    border: 1px solid #00ffcc44;
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 11px;
    color: #00ffccaa;
    display: flex;
    align-items: center;
    gap: 6px;
}
.controlHint kbd {
    background: #001122;
    border: 1px solid #00ffcc66;
    border-radius: 4px;
    padding: 2px 8px;
    font-family: inherit;
    font-size: 10px;
    color: #00ffcc;
}

#startScreen, #gameOverScreen {
    position: absolute;
    inset: 0;
    background: rgba(5, 5, 16, 0.98);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    z-index: 10;
    backdrop-filter: blur(8px);
}
#startScreen.hidden, #gameOverScreen.hidden { display: none; }
.title {
    font-size: clamp(32px, 8vw, 56px);
    font-weight: 900;
    background: linear-gradient(135deg, #00ffcc, #0066ff, #cc00ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    letter-spacing: 4px;
    animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.3); } }
.subtitle { font-size: 14px; color: #00ffcc88; letter-spacing: 3px; text-transform: uppercase; }
.btn {
    background: linear-gradient(135deg, #003344, #001122);
    border: 2px solid #00ffcc;
    color: #00ffcc;
    padding: 14px 48px;
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
    border-radius: 4px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 2px;
    transition: all 0.2s;
    box-shadow: 0 0 20px #00ffcc44;
}
.btn:hover, .btn:focus { background: linear-gradient(135deg, #00ffcc, #0066ff); color: #000; box-shadow: 0 0 30px #00ffcc, 0 0 60px #0066ff; outline: none; }
.btn:active { transform: scale(0.96); }

#finalScore { font-size: 28px; font-weight: 700; color: #00ffcc; text-shadow: 0 0 15px #00ffcc; }
#bestScore { font-size: 16px; color: #ffcc00; text-shadow: 0 0 10px #ffcc00; }

@media (max-width: 600px) {
    #gameContainer { border-width: 2px; border-radius: 0; width: 100vw; height: 100vh; max-width: 100%; max-height: 100%; }
    body { align-items: stretch; justify-content: stretch; }
    #ui { padding: 12px; }
    .statValue { font-size: 18px; }
    .controlHint { padding: 5px 10px; font-size: 10px; }
}
</style>
</head>
<body>
<div id="gameContainer">
    <canvas id="canvas"></canvas>
    <div id="ui">
        <div id="topBar">
            <div class="statBox" id="score">
                <div class="statLabel">Score</div>
                <div class="statValue" id="scoreVal">0</div>
            </div>
            <div class="statBox" id="highScore">
                <div class="statLabel">Best</div>
                <div class="statValue" id="highScoreVal">0</div>
            </div>
            <div class="statBox" id="speed">
                <div class="statLabel">Speed</div>
                <div class="statValue" id="speedVal">1.0x</div>
            </div>
        </div>
        <div id="bottomBar">
            <div class="controlHint"><kbd>Space</kbd> / <kbd>↑</kbd> Jump</div>
            <div class="controlHint"><kbd>↓</kbd> Slide</div>
            <div class="controlHint">Tap Jump / Swipe Down Slide</div>
        </div>
    </div>

    <div id="startScreen">
        <div class="title">NEON RUNNER</div>
        <div class="subtitle">Endless Cyberpunk Runner</div>
        <button class="btn" id="startBtn">Start Run</button>
    </div>

    <div id="gameOverScreen" class="hidden">
        <div class="title">RUN ENDED</div>
        <div id="finalScore">Score: 0</div>
        <div id="bestScore">Best: 0</div>
        <button class="btn" id="restartBtn">Run Again</button>
    </div>
</div>



    <div class="overlay hidden" id="pauseOverlay">
        <h1>PAUSED</h1>
        <p>Wave <span id="pauseWave">1</span> • Score <span id="pauseScore">0</span></p>
        <button class="btn" id="resumeBtn">RESUME</button>
        <button class="btn" id="quitBtn">QUIT TO MENU</button>
    </div>


    <div class="overlay hidden" id="gameOverOverlay">
        <h1 style="color: #ff3366;">GAME OVER</h1>
        <p>Final Score: <span id="finalScore" style="color: #00ffea;">0</span></p>
        <p id="highScoreMsg" style="color: #ffd700;"></p>
        <button class="btn" id="retryBtn">RETRY</button>
        <button class="btn" id="menuBtn">MAIN MENU</button>
    </div>


<script>
// ============================================
// NEON RUNNER - Endless Cyberpunk Runner
// ============================================

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// --- Config ---
const CONFIG = {
    // Dimensions
    baseWidth: 800,
    baseHeight: 400,
    // Physics
    gravity: 0.45,
    jumpForce: -11.5,
    slideHeight: 36,
    standHeight: 56,
    // Gameplay
    baseSpeed: 5.5,
    maxSpeed: 16,
    speedAccel: 0.0008,
    spawnIntervalBase: 1800,
    spawnIntervalMin: 700,
    // Visual
    groundY: 320,
    parallaxLayers: 3
};

// --- State ---
let state = {
    running: false,
    score: 0,
    highScore: 0,
    speed: CONFIG.baseSpeed,
    gameTime: 0,
    lastSpawn: 0,
    player: null,
    obstacles: [],
    particles: [],
    collectibles: [],
    background: [],
    screenShake: 0,
    touchStartY: 0
};

// --- Asset Generation (Procedural) ---
function createGradient(ctx, x, y, w, h, stops) {
    const g = ctx.createLinearGradient(x, y, x, y + h);
    stops.forEach(s => g.addColorStop(s[0], s[1]));
    return g;
}

// --- Player Class ---
class Player {
    constructor() {
        this.x = 80;
        this.y = CONFIG.groundY;
        this.width = 28;
        this.height = CONFIG.standHeight;
        this.velY = 0;
        this.grounded = true;
        this.sliding = false;
        this.slideTimer = 0;
        this.invulnerable = 0;
        this.trail = [];
        this.color = '#00ffcc';
        this.glowColor = '#0066ff';
    }

    update(dt) {
        // Gravity
        if (!this.grounded) {
            this.velY += CONFIG.gravity;
            this.y += this.velY;
            if (this.y >= CONFIG.groundY) {
                this.y = CONFIG.groundY;
                this.velY = 0;
                this.grounded = true;
            }
        }

        // Slide timer
        if (this.sliding) {
            this.slideTimer -= 1/60;
            this.height = CONFIG.slideHeight;
            this.y = CONFIG.groundY;
            if (this.slideTimer <= 0) {
                this.sliding = false;
                this.height = CONFIG.standHeight;
            }
        }

        // Invulnerability
        if (this.invulnerable > 0) this.invulnerable -= 1/60;

        // Trail
        this.trail.unshift({ x: this.x + this.width/2, y: this.y + this.height/2, life: 0.3 });
        if (this.trail.length > 10) this.trail.pop();
        this.trail.forEach(t => t.life -= 1/60);
        this.trail = this.trail.filter(t => t.life > 0);
    }

    jump() {
        if (this.grounded && !this.sliding) {
            this.velY = CONFIG.jumpForce;
            this.grounded = false;
        }
    }

    slide() {
        if (this.grounded && !this.sliding) {
            this.sliding = true;
            this.slideTimer = 0.8;
        }
    }

    getHitbox() {
        const pad = this.sliding ? 4 : 2;
        return {
            x: this.x + pad,
            y: this.y + pad,
            w: this.width - pad*2,
            h: this.height - pad*2
        };
    }

    draw(ctx) {
        // Trail
        ctx.fillStyle = this.color;
        this.trail.forEach((t, i) => {
            ctx.globalAlpha = t.life / 0.3 * 0.5;
            ctx.fillRect(t.x - 2, t.y - 2, 4, 4);
        });
        ctx.globalAlpha = 1;

        // Body
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.glowColor;
        ctx.shadowBlur = this.invulnerable > 0 ? 30 : 20;
        ctx.fillRect(this.x, this.y, this.width, this.height);
        ctx.shadowBlur = 0;

        // Eye
        ctx.fillStyle = '#fff';
        ctx.fillRect(this.x + this.width - 6, this.y + 6, 4, 4);

        // Invulnerability flash
        if (this.invulnerable > 0 && Math.floor(this.invulnerable * 10) % 2 === 0) {
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.strokeRect(this.x - 2, this.y - 2, this.width + 4, this.height + 4);
        }
    }
}

// --- Obstacle Class ---
class Obstacle {
    constructor(type, speed) {
        this.type = type;
        this.speed = speed;
        this.passed = false;
        this.x = 800;
        
        switch(type) {
            case 'block':
                this.width = 32; this.height = 48; this.y = CONFIG.groundY - 48; break;
            case 'tall':
                this.width = 24; this.height = 96; this.y = CONFIG.groundY - 96; break;
            case 'gap':
                this.width = 48; this.height = 32; this.y = CONFIG.groundY - 32; break;
            case 'floating':
                this.width = 32; this.height = 24; this.y = CONFIG.groundY - 120 - Math.random() * 80; break;
        }
    }
    update(dt) {
        this.x -= this.speed * dt * 60;
    }
    isOffscreen() { return this.x + this.width < 0; }
    getHitbox() {
        return { x: this.x, y: this.y, w: this.width, h: this.height };
    }
    draw(ctx) {
        const colors = ['#ff3366', '#ff6600', '#cc00ff', '#00ff88'];
        const c = colors[Math.floor(this.x / 100) % colors.length];
        ctx.fillStyle = c;
        ctx.shadowColor = c; ctx.shadowBlur = 15;
        ctx.fillRect(this.x, this.y, this.width, this.height);
        ctx.shadowBlur = 0;
        
        // Neon trim
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.strokeRect(this.x, this.y, this.width, this.height);
    }
}

// --- Collectible Class ---
class Collectible {
    constructor(speed) {
        this.x = 800;
        this.y = CONFIG.groundY - 120 - Math.random() * 80;
        this.width = 24;
        this.height = 24;
        this.speed = speed;
        this.value = 50;
        this.bob = Math.random() * Math.PI * 2;
        this.rotation = 0;
    }
    update(dt) {
        this.x -= this.speed * dt * 60;
        this.rotation += dt * 3;
        this.bob += dt * 4;
    }
    isOffscreen() { return this.x + 24 < 0; }
    getHitbox() { return { x: this.x, y: this.y, w: 24, h: 24 }; }
    draw(ctx) {
        ctx.save();
        ctx.translate(this.x + 12, this.y + 12);
        ctx.rotate(this.rotation);
        ctx.translate(0, Math.sin(Date.now() * 0.004) * 4);
        
        ctx.fillStyle = '#ffbe0b';
        ctx.shadowColor = '#ffcc00'; ctx.shadowBlur = 20;
        
        // Star shape
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
            const angle = (i * Math.PI * 2) / 5 - Math.PI/2;
            const r = i % 2 === 0 ? 12 : 5;
            const x = Math.cos(angle) * r;
            const y = Math.sin(angle) * r;
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.closePath(); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.restore();
    }
}

// --- Particle ---
class Particle {
    constructor(x, y, vx, vy, color, life, size) {
        this.x = x; this.y = y;
        this.vx = vx; this.vy = vy;
        this.color = color;
        this.life = life;
        this.maxLife = life;
        this.size = size;
    }
    update(dt) {
        this.x += this.vx * dt * 60;
        this.y += this.vy * dt * 60;
        this.vy += 0.1 * dt * 60;
        this.life -= dt;
    }
    draw(ctx) {
        if (this.life <= 0) return;
        const alpha = this.life / this.maxLife;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color; ctx.shadowBlur = 10;
        ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1;
    }
}

// --- Background Layer ---
class BGLayer {
    constructor(speed, color) {
        this.speed = speed;
        this.color = color;
        this.offset = 0;
        this.segments = [];
        for (let i = 0; i < 20; i++) {
            this.segments.push({
                x: i * 80,
                y: 350 + Math.random() * 40,
                width: 40 + Math.random() * 40,
                height: 10 + Math.random() * 30,
                color: `rgba(${Math.floor(Math.random()*20)}, ${Math.floor(Math.random()*100)}, ${Math.floor(Math.random()*100)}, 0.3)`
            });
        }
    }
    update(dt, speed) {
        this.offset += this.speed * dt * 60;
        if (this.offset > 1600) this.offset -= 1600;
    }
    draw(ctx, speed) {
        ctx.fillStyle = this.color;
        this.segments.forEach(s => {
            const x = s.x - this.offset;
            if (x > -100 && x < 900) {
                ctx.fillStyle = s.color;
                ctx.fillRect(x, s.y, s.width, s.height);
            }
        });
    }
}

// --- Init ---
function init() {
    resize();
    window.addEventListener('resize', resize);
    
    state.highScore = parseInt(localStorage.getItem('neonRunnerHighScore')) || 0;
    document.getElementById('highScoreVal').textContent = state.highScore;
    
    // Input
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);
    canvas.addEventListener('touchstart', onTouchStart, { passive: false });
    canvas.addEventListener('touchmove', onTouchMove, { passive: false });
    canvas.addEventListener('touchend', onTouchEnd, { passive: false });
    
    // Buttons
    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('restartBtn').addEventListener('click', startGame);
    
    // Background layers
    state.background.push(new BGLayer(0.2, '#003333'));
    state.background.push(new BGLayer(0.5, '#002222'));
    state.background.push(new BGLayer(1.0, '#001111'));
    
    showStartScreen();
    requestAnimationFrame(gameLoop);
}

function resize() {
    const container = document.getElementById('gameContainer');
    const maxW = Math.min(window.innerWidth * 0.95, CONFIG.baseWidth);
    const maxH = Math.min(window.innerHeight * 0.9, CONFIG.baseHeight);
    const scale = Math.min(maxW / CONFIG.baseWidth, maxH / CONFIG.baseHeight);
    
    canvas.width = CONFIG.baseWidth * scale;
    canvas.height = CONFIG.baseHeight * scale;
    canvas.style.width = (CONFIG.baseWidth * scale) + 'px';
    canvas.style.height = (CONFIG.baseHeight * scale) + 'px';
}

function onKeyDown(e) {
    if (e.code === 'Escape') {
        if (state.running && !document.getElementById('pauseOverlay').classList.contains('hidden')) {
            resumeGame();
        } else if (state.running) {
            pauseGame();
        }
        return;
    }
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); state.player?.jump(); }
    else if (e.code === 'ArrowDown') { e.preventDefault(); state.player?.slide(); }
}

function onKeyUp(e) {}

function onTouchStart(e) {
    e.preventDefault();
    state.touchStartY = e.touches[0].clientY;
}

function onTouchMove(e) { e.preventDefault(); }

function onTouchEnd(e) {
    e.preventDefault();
    if (!state.running) return;
    const dy = e.changedTouches[0].clientY - state.touchStartY;
    if (dy < -30) state.player.jump();
    else if (dy > 30) state.player.slide();
    else state.player.jump(); // Tap = jump
}

function startGame() {
    state.running = true;
    state.score = 0;
    state.speed = CONFIG.baseSpeed;
    state.gameTime = 0;
    state.lastSpawn = 0;
    state.obstacles = [];
    state.collectibles = [];
    state.particles = [];
    state.screenShake = 0;
    
    state.player = new Player();
    
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('gameOverScreen').classList.add('hidden');
    document.getElementById('scoreVal').textContent = '0';
    document.getElementById('speedVal').textContent = '1.0x';
}

function gameOver() {
    state.running = false;
    if (state.score > state.highScore) {
        state.highScore = state.score;
        localStorage.setItem('neonRunnerHighScore', state.highScore);
    }
    document.getElementById('finalScore').textContent = 'Score: ' + state.score;
    document.getElementById('bestScore').textContent = 'Best: ' + state.highScore;
    document.getElementById('gameOverScreen').classList.remove('hidden');
}

function showStartScreen() {
    state.running = false;
    document.getElementById('startScreen').classList.remove('hidden');
    document.getElementById('gameOverScreen').classList.add('hidden');
}

// --- Spawning ---
function trySpawn(dt) {
    state.lastSpawn += dt * 1000;
    const interval = Math.max(CONFIG.spawnIntervalMin, CONFIG.spawnIntervalBase - state.gameTime * 0.3);
    
    if (state.lastSpawn >= interval) {
        state.lastSpawn = 0;
        const rand = Math.random();
        let type;
        if (Math.random() < 0.4) type = 'block';
        else if (Math.random() < 0.6) type = 'tall';
        else if (Math.random() < 0.8) type = 'gap';
        else type = 'floating';
        
        state.obstacles.push(new Obstacle(type, state.speed));
        
        if (Math.random() < 0.35) {
            state.collectibles.push(new Collectible(state.speed));
        }
    }
}

// --- Collision ---
function checkCollisions() {
    const pHit = state.player.getHitbox();
    
    // Obstacles
    for (const obs of state.obstacles) {
        if (obs.passed) continue;
        const oHit = obs.getHitbox();
        if (rectsOverlap(pHit, oHit)) {
            if (state.player.invulnerable <= 0) {
                gameOver();
                return;
            }
        }
        if (!obs.passed && obs.x + obs.width < state.player.x) {
            obs.passed = true;
            state.score += 10;
            document.getElementById('scoreVal').textContent = state.score;
        }
    }
    
    // Collectibles
    for (const col of state.collectibles) {
        if (col.collected) continue;
        const cHit = col.getHitbox();
        if (rectsOverlap(pHit, cHit)) {
            col.collected = true;
            state.score += col.value;
            document.getElementById('scoreVal').textContent = state.score;
            for (let i = 0; i < 10; i++) {
                state.particles.push(new Particle(
                    col.x + 12, col.y + 12,
                    (Math.random()-0.5)*5, (Math.random()-0.5)*5 - 1,
                    '#00ffcc', 500, 3
                ));
            }
        }
    }
}

function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// --- Update ---
function update(dt) {
    if (!state.running) return;
    
    state.gameTime += dt;
    state.speed = Math.min(CONFIG.maxSpeed, CONFIG.baseSpeed + state.gameTime * CONFIG.speedAccel);
    document.getElementById('speedVal').textContent = state.speed.toFixed(1) + 'x';
    
    state.player.update(dt);
    
    // Obstacles
    for (let i = state.obstacles.length - 1; i >= 0; i--) {
        state.obstacles[i].update(dt);
        if (state.obstacles[i].isOffscreen()) state.obstacles.splice(i, 1);
    }
    
    // Collectibles
    for (let i = state.collectibles.length - 1; i >= 0; i--) {
        state.collectibles[i].update(dt);
        if (state.collectibles[i].isOffscreen()) state.collectibles.splice(i, 1);
    }
    
    // Particles
    for (let i = state.particles.length - 1; i >= 0; i--) {
        state.particles[i].update(1/60);
        if (state.particles[i].life <= 0) state.particles.splice(i, 1);
    }
    
    // Background
    state.background.forEach(bg => bg.update(1/60, state.speed));
    
    // Spawning
    trySpawn(1/60);
    
    // Collisions
    checkCollisions();
    
    // Score
    state.score += state.speed * 0.1 * dt;
    document.getElementById('scoreVal').textContent = Math.floor(state.score);
}

// --- Draw ---
function draw() {
    // Screen shake
    if (state.screenShake > 0) {
        ctx.save();
        ctx.translate((Math.random()-0.5)*state.screenShake, (Math.random()-0.5)*state.screenShake);
        state.screenShake *= 0.9;
    }
    
    // Clear
    ctx.fillStyle = '#050510';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Background layers
    state.background.forEach(bg => bg.draw(ctx, state.speed));
    
    // Ground
    ctx.fillStyle = '#001111';
    ctx.fillRect(0, CONFIG.groundY + 40, canvas.width, canvas.height - CONFIG.groundY - 40);
    
    // Ground line
    ctx.strokeStyle = '#00ffcc44';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#00ffcc'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.moveTo(0, CONFIG.groundY); ctx.lineTo(canvas.width, CONFIG.groundY); ctx.stroke();
    ctx.shadowBlur = 0;
    
    // Entities
    state.collectibles.forEach(c => c.draw(ctx));
    state.obstacles.forEach(o => o.draw(ctx));
    if (state.player) state.player.draw(ctx);
    
    // Particles
    state.particles.forEach(p => p.draw(ctx));
    
    // Screen shake
    if (state.screenShake > 0) ctx.restore();
    
    // UI updated via HTML
    document.getElementById('scoreVal').textContent = Math.floor(state.score);
}

function gameLoop(timestamp) {
    const dt = 1/60;
    update(dt);
    draw();
    requestAnimationFrame(gameLoop);
}

// Start
init();


// --- Pause/Resume/Quit Functions for Neon Runner ---
function pauseGame() {
    if (!state.running) return;
    state.running = false;
    document.getElementById('pauseOverlay').classList.remove('hidden');
}

function resumeGame() {
    if (state.running) return;
    state.running = true;
    document.getElementById('pauseOverlay').classList.add('hidden');
}

function quitToMenu() {
    state.running = false;
    document.getElementById('pauseOverlay').classList.add('hidden');
    document.getElementById('gameOverOverlay').classList.add('hidden');
    showStartScreen();
}

</script>
