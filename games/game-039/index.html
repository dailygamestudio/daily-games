<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Merge - Day 39</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    background: #0a0a12; 
    color: #00ffcc; 
    font-family: 'Courier New', Courier, monospace; 
    overflow: hidden; 
    height: 100vh; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
  }
  #gameCanvas { 
    display: block; 
    box-shadow: 0 0 30px #00ffcc, inset 0 0 30px rgba(0,255,204,0.1); 
    border-radius: 8px; 
    background: #05050a; 
  }
  #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
  #hud { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; pointer-events: none; z-index: 10; }
  .hud-box { background: rgba(0,20,30,0.8); border: 1px solid #00ffcc; padding: 8px 16px; border-radius: 4px; box-shadow: 0 0 10px #00ffcc; font-size: 1.2rem; }
  .screen, .overlay { 
    position: absolute; 
    top: 50%; left: 50%; 
    transform: translate(-50%, -50%); 
    background: rgba(0,10,20,0.95); 
    border: 2px solid #00ffcc; 
    border-radius: 12px; 
    padding: 40px; 
    text-align: center; 
    box-shadow: 0 0 40px #00ffcc, inset 0 0 20px rgba(0,255,204,0.1); 
    z-index: 20; 
    pointer-events: auto; 
    min-width: 300px; 
  }
  .hidden { display: none !important; }
  h1 { font-size: 2.5rem; text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc; margin-bottom: 10px; letter-spacing: 4px; }
  h2 { font-size: 2rem; text-shadow: 0 0 10px #ff0066; margin-bottom: 20px; color: #ff0066; }
  p { margin: 10px 0; font-size: 1.1rem; opacity: 0.9; }
  button { 
    background: linear-gradient(135deg, #003322, #005533); 
    border: 2px solid #00ffcc; 
    color: #00ffcc; 
    padding: 12px 28px; 
    font-size: 1.1rem; 
    font-family: inherit; 
    border-radius: 4px; 
    cursor: pointer; 
    margin: 10px; 
    transition: all 0.2s; 
    box-shadow: 0 0 10px rgba(0,255,204,0.3); 
    text-transform: uppercase; 
    letter-spacing: 2px; 
  }
  button:hover, button:focus { background: linear-gradient(135deg, #005533, #007744); box-shadow: 0 0 20px #00ffcc; transform: scale(1.05); }
  button:active { transform: scale(0.98); }
  #pauseOverlay h2 { color: #ffcc00; text-shadow: 0 0 10px #ffcc00; }
  #gameOverOverlay h2 { color: #ff3344; text-shadow: 0 0 10px #ff3344; }
  @media (max-width: 600px) {
    .screen, .overlay { padding: 20px; min-width: 90vw; }
    h1 { font-size: 1.8rem; }
    button { padding: 10px 20px; font-size: 1rem; }
    #hud { top: 10px; left: 10px; right: 10px; }
    .hud-box { padding: 6px 12px; font-size: 1rem; }
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="ui">
  <div id="hud">
    <div class="hud-box">SCORE: <span id="score">0</span></div>
    <div class="hud-box">BEST: <span id="best">0</span></div>
  </div>
  <div id="startScreen" class="screen">
    <h1>NEON MERGE</h1>
    <p>Merge neon tiles to reach 2048</p>
    <p>Arrow keys or swipe to move</p>
    <button id="startBtn" type="button">START GAME</button>
  </div>
  <div id="pauseOverlay" class="overlay hidden">
    <h2>PAUSED</h2>
    <button id="resumeBtn" type="button">RESUME</button>
    <button id="quitBtn" type="button">QUIT TO MENU</button>
  </div>
  <div id="gameOverOverlay" class="overlay hidden">
    <h2>GAME OVER</h2>
    <p>Final Score: <span id="finalScore">0</span></p>
    <button id="retryBtn" type="button">RETRY</button>
    <button id="menuBtn" type="button">MAIN MENU</button>
  </div>
</div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const finalScoreEl = document.getElementById('finalScore');
const startScreen = document.getElementById('startScreen');
const pauseOverlay = document.getElementById('pauseOverlay');
const gameOverOverlay = document.getElementById('gameOverOverlay');
const startBtn = document.getElementById('startBtn');
const resumeBtn = document.getElementById('resumeBtn');
const quitBtn = document.getElementById('quitBtn');
const retryBtn = document.getElementById('retryBtn');
const menuBtn = document.getElementById('menuBtn');

const GRID_SIZE = 4;
const TILE_SIZE = 80;
const GAP = 10;
const BOARD_SIZE = GRID_SIZE * TILE_SIZE + (GRID_SIZE + 1) * GAP;

let grid = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(0));
let score = 0;
let best = parseInt(localStorage.getItem('neonMergeBest')) || 0;
let gameOver = false;
let paused = false;
let animating = false;
let touchStartX = 0;
let touchStartY = 0;

const TILE_COLORS = {
  2: { bg: '#00ffcc', glow: '#00ffcc', text: '#001111' },
  4: { bg: '#00ccaa', glow: '#00ccaa', text: '#001111' },
  8: { bg: '#009988', glow: '#009988', text: '#ffffff' },
  16: { bg: '#007766', glow: '#007766', text: '#ffffff' },
  32: { bg: '#005544', glow: '#005544', text: '#ffffff' },
  64: { bg: '#003322', glow: '#003322', text: '#ffffff' },
  128: { bg: '#ff0066', glow: '#ff0066', text: '#ffffff' },
  256: { bg: '#cc0055', glow: '#cc0055', text: '#ffffff' },
  512: { bg: '#990044', glow: '#990044', text: '#ffffff' },
  1024: { bg: '#660033', glow: '#660033', text: '#ffffff' },
  2048: { bg: '#330022', glow: '#330022', text: '#ffffff' },
  4096: { bg: '#ffcc00', glow: '#ffcc00', text: '#000000' },
  8192: { bg: '#ffaa00', glow: '#ffaa00', text: '#000000' }
};

function init() {
  canvas.width = BOARD_SIZE * window.devicePixelRatio;
  canvas.height = BOARD_SIZE * window.devicePixelRatio;
  canvas.style.width = BOARD_SIZE + 'px';
  canvas.style.height = BOARD_SIZE + 'px';
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
  bestEl.textContent = best;
  startBtn.addEventListener('click', startGame);
  resumeBtn.addEventListener('click', resumeGame);
  quitBtn.addEventListener('click', quitToMenu);
  retryBtn.addEventListener('click', startGame);
  menuBtn.addEventListener('click', showStartScreen);
  window.addEventListener('keydown', handleKeydown);
  canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
  canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
  canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
  window.addEventListener('resize', init);
  showStartScreen();
}

function startGame() {
  grid = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(0));
  score = 0;
  gameOver = false;
  paused = false;
  scoreEl.textContent = score;
  spawnTile();
  spawnTile();
  startScreen.classList.add('hidden');
  pauseOverlay.classList.add('hidden');
  gameOverOverlay.classList.add('hidden');
  draw();
}

function showStartScreen() {
  startScreen.classList.remove('hidden');
  pauseOverlay.classList.add('hidden');
  gameOverOverlay.classList.add('hidden');
}

function pauseGame() {
  if (gameOver) return;
  paused = true;
  pauseOverlay.classList.remove('hidden');
}

function resumeGame() {
  paused = false;
  pauseOverlay.classList.add('hidden');
}

function quitToMenu() {
  paused = false;
  gameOver = false;
  showStartScreen();
  draw();
}

function handleKeydown(e) {
  if (gameOver) return;
  if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
    if (paused) resumeGame();
    else pauseGame();
    return;
  }
  if (paused) return;
  let moved = false;
  switch(e.key) {
    case 'ArrowUp': case 'w': case 'W': moved = move(0, -1); break;
    case 'ArrowDown': case 's': case 'S': moved = move(1, 1); break;
    case 'ArrowLeft': case 'a': case 'A': moved = move(2, -1); break;
    case 'ArrowRight': case 'd': case 'D': moved = move(3, 1); break;
  }
  if (moved) {
    spawnTile();
    updateScore();
    checkGameOver();
    draw();
  }
}

function handleTouchStart(e) {
  if (gameOver || paused) return;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}

function handleTouchMove(e) {
  e.preventDefault();
}

function handleTouchEnd(e) {
  if (gameOver || paused) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 30) move(3, 1); // right
    else if (dx < -30) move(2, -1); // left
  } else {
    if (dy > 30) move(1, 1); // down
    else if (dy < -30) move(0, -1); // up
  }
  draw();
}

function move(dir, sign) {
  let moved = false;
  const newGrid = grid.map(row => [...row]);
  const merged = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(false));

  const indices = [...Array(GRID_SIZE).keys()];
  if (sign === 1) indices.reverse();

  for (let i of indices) {
    for (let j of indices) {
      let x, y;
      if (dir === 0 || dir === 1) { // vertical
        x = j; y = i;
      } else { // horizontal
        x = i; y = j;
      }
      const val = grid[y][x];
      if (val === 0) continue;
      let ny = y, nx = x;
      while (true) {
        const nextY = ny + (dir === 0 ? -1 : dir === 1 ? 1 : 0);
        const nextX = nx + (dir === 2 ? -1 : dir === 3 ? 1 : 0);
        if (nextY < 0 || nextY >= GRID_SIZE || nextX < 0 || nextX >= GRID_SIZE) break;
        if (newGrid[nextY][nextX] === 0) {
          ny = nextY; nx = nextX;
        } else if (newGrid[nextY][nextX] === val && !merged[nextY][nextX]) {
          ny = nextY; nx = nextX;
          break;
        } else break;
      }
      if (ny !== y || nx !== x) {
        if (newGrid[ny][nx] === val && !merged[ny][nx]) {
          newGrid[ny][nx] = val * 2;
          score += val * 2;
          merged[ny][nx] = true;
        } else {
          newGrid[ny][nx] = val;
        }
        newGrid[y][x] = 0;
        moved = true;
      }
    }
  }
  grid = newGrid;
  return moved;
}

function spawnTile() {
  const empty = [];
  for (let y = 0; y < GRID_SIZE; y++) {
    for (let x = 0; x < GRID_SIZE; x++) {
      if (grid[y][x] === 0) empty.push({x, y});
    }
  }
  if (empty.length === 0) return;
  const {x, y} = empty[Math.floor(Math.random() * empty.length)];
  grid[y][x] = Math.random() < 0.9 ? 2 : 4;
}

function canMove() {
  for (let y = 0; y < GRID_SIZE; y++) {
    for (let x = 0; x < GRID_SIZE; x++) {
      if (grid[y][x] === 0) return true;
      if (x < GRID_SIZE - 1 && grid[y][x] === grid[y][x+1]) return true;
      if (y < GRID_SIZE - 1 && grid[y][x] === grid[y+1][x]) return true;
    }
  }
  return false;
}

function checkGameOver() {
  if (!canMove()) {
    gameOver = true;
    if (score > best) {
      best = score;
      localStorage.setItem('neonMergeBest', best);
      bestEl.textContent = best;
    }
    finalScoreEl.textContent = score;
    gameOverOverlay.classList.remove('hidden');
  }
}

function updateScore() {
  scoreEl.textContent = score;
  if (score > best) {
    best = score;
    bestEl.textContent = best;
    localStorage.setItem('neonMergeBest', best);
  }
}

function draw() {
  ctx.clearRect(0, 0, BOARD_SIZE, BOARD_SIZE);
  drawGrid();
  for (let y = 0; y < GRID_SIZE; y++) {
    for (let x = 0; x < GRID_SIZE; x++) {
      const val = grid[y][x];
      if (val !== 0) drawTile(x, y, val);
    }
  }
}

function drawGrid() {
  ctx.fillStyle = '#05050a';
  ctx.fillRect(0, 0, BOARD_SIZE, BOARD_SIZE);
  for (let y = 0; y < GRID_SIZE; y++) {
    for (let x = 0; x < GRID_SIZE; x++) {
      const px = GAP + x * (TILE_SIZE + GAP);
      const py = GAP + y * (TILE_SIZE + GAP);
      ctx.fillStyle = '#0a0a1a';
      roundRect(ctx, px, py, TILE_SIZE, TILE_SIZE, 6);
      ctx.fill();
    }
  }
}

function drawTile(x, y, value) {
  const px = GAP + x * (TILE_SIZE + GAP);
  const py = GAP + y * (TILE_SIZE + GAP);
  const color = TILE_COLORS[value] || TILE_COLORS[8192];
  ctx.shadowColor = color.glow;
  ctx.shadowBlur = 15;
  ctx.fillStyle = color.bg;
  roundRect(ctx, px, py, TILE_SIZE, TILE_SIZE, 6);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = color.text;
  ctx.font = 'bold 36px Courier New';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(value, px + TILE_SIZE/2, py + TILE_SIZE/2);
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

init();
</script>
</body>
</html>
