<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Merge - Day 39</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    background: #0a0a12; 
    color: #00ffcc; 
    font-family: 'Courier New', Courier, monospace; 
    overflow: hidden; 
    height: 100vh; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
  }
  #gameCanvas { 
    display: block; 
    box-shadow: 0 0 30px #00ffcc, inset 0 0 30px rgba(0,255,204,0.1); 
    border-radius: 8px; 
    background: #05050a; 
  }
  #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
  #hud { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; pointer-events: none; z-index: 10; }
  .hud-box { background: rgba(0,20,30,0.8); border: 1px solid #00ffcc; padding: 8px 16px; border-radius: 4px; box-shadow: 0 0 10px #00ffcc; font-size: 1.2rem; }
  .screen, .overlay { 
    position: absolute; 
    top: 50%; left: 50%; 
    transform: translate(-50%, -50%); 
    background: rgba(0,10,20,0.95); 
    border: 2px solid #00ffcc; 
    border-radius: 12px; 
    padding: 40px; 
    text-align: center; 
    box-shadow: 0 0 40px #00ffcc, inset 0 0 20px rgba(0,255,204,0.1); 
    z-index: 20; 
    pointer-events: auto; 
    min-width: 300px; 
  }
  .hidden { display: none !important; }
  h1 { font-size: 2.5rem; text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc; margin-bottom: 10px; letter-spacing: 4px; }
  h2 { font-size: 2rem; text-shadow: 0 0 10px #ff0066; margin-bottom: 20px; color: #ff0066; }
  p { margin: 10px 0; font-size: 1.1rem; opacity: 0.9; }
  button { 
    background: linear-gradient(135deg, #003322, #005533); 
    border: 2px solid #00ffcc; 
    color: #00ffcc; 
    padding: 12px 28px; 
    font-size: 1.1rem; 
    font-family: inherit; 
    border-radius: 4px; 
    cursor: pointer; 
    margin: 10px; 
    transition: all 0.2s; 
    box-shadow: 0 0 10px rgba(0,255,204,0.3); 
    text-transform: uppercase; 
    letter-spacing: 2px; 
  }
  button:hover, button:focus { background: linear-gradient(135deg, #005533, #007744); box-shadow: 0 0 20px #00ffcc; transform: scale(1.05); }
  button:active { transform: scale(0.98); }
  #pauseOverlay h2 { color: #ffcc00; text-shadow: 0 0 10px #ffcc00; }
  #gameOverOverlay h2 { color: #ff3344; text-shadow: 0 0 10px #ff3344; }
  @media (max-width: 600px) {
    .screen, .overlay { padding: 20px; min-width: 90vw; }
    h1 { font-size: 1.8rem; }
    button { padding: 10px 20px; font-size: 1rem; }
    #hud { top: 10px; left: 10px; right: 10px; }
    .hud-box { padding: 6px 12px; font-size: 1rem; }
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="ui">
  <div id="hud">
    <div class="hud-box">SCORE: <span id="score">0</span></div>
    <div class="hud-box">BEST: <span id="best">0</span></div>
  </div>
  <div id="startScreen" class="screen">
    <h1>NEON MERGE</h1>
    <p>Merge neon tiles to reach 2048</p>
    <p>Arrow keys or swipe to move</p>
    <button id="startBtn" type="button">START GAME</button>
  </div>
  <div id="pauseOverlay" class="overlay hidden">
    <h2>PAUSED</h2>
    <button id="resumeBtn" type="button">RESUME</button>
    <button id="quitBtn" type="button">QUIT TO MENU</button>
  </div>
  <div id="gameOverOverlay" class="overlay hidden">
    <h2>GAME OVER</h2>
    <p>Final Score: <span id="finalScore">0</span></p>
    <button id="retryBtn" type="button">RETRY</button>
    <button id="menuBtn" type="button">MAIN MENU</button>
  </div>
</div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const finalScoreEl = document.getElementById('finalScore');
const startScreen = document.getElementById('startScreen');
const pauseOverlay = document.getElementById('pauseOverlay');
const gameOverOverlay = document.getElementById('gameOverOverlay');
const startBtn = document.getElementById('startBtn');
const resumeBtn = document.getElementById('resumeBtn');
const quitBtn = document.getElementById('quitBtn');
const retryBtn = document.getElementById('retryBtn');
const menuBtn = document.getElementById('menuBtn');

const GRID_SIZE = 4;
const TILE_SIZE = 80;
const GAP = 10;
const BOARD_SIZE = GRID_SIZE * TILE_SIZE + (GRID_SIZE + 1) * GAP;

let grid = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(0));
let score = 0;
let best = parseInt(localStorage.getItem('neonMergeBest')) || 0;
let gameOver = false;
let paused = false;
let animating = false;
let touchStartX, touchStartY;

const COLORS = {
  0: '#0d1b2a',
  2: '#00ffcc',
  4: '#00e6b8',
  8: '#00cc99',
  16: '#00b386',
  32: '#009973',
  64: '#008060',
  128: '#00664d',
  256: '#004d3a',
  512: '#003326',
  1024: '#001a13',
  2048: '#ff0066'
};

function initCanvas() {
  canvas.width = BOARD_SIZE;
  canvas.height = BOARD_SIZE;
  canvas.style.width = BOARD_SIZE + 'px';
  canvas.style.height = BOARD_SIZE + 'px';
}

function startGame() {
  grid = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(0));
  score = 0;
  gameOver = false;
  paused = false;
  updateScore();
  addRandomTile();
  addRandomTile();
  draw();
  startScreen.classList.add('hidden');
  pauseOverlay.classList.add('hidden');
  gameOverOverlay.classList.add('hidden');
}

function pauseGame() {
  if (gameOver) return;
  paused = true;
  pauseOverlay.classList.remove('hidden');
}

function resumeGame() {
  paused = false;
  pauseOverlay.classList.add('hidden');
}

function quitToMenu() {
  paused = false;
  pauseOverlay.classList.add('hidden');
  startScreen.classList.remove('hidden');
}

function showStartScreen() {
  startScreen.classList.remove('hidden');
  pauseOverlay.classList.add('hidden');
  gameOverOverlay.classList.add('hidden');
}

function updateScore() {
  scoreEl.textContent = score;
  if (score > best) {
    best = score;
    bestEl.textContent = best;
    localStorage.setItem('neonMergeBest', best);
  }
}

function addRandomTile() {
  const empty = [];
  for (let r = 0; r < GRID_SIZE; r++) {
    for (let c = 0; c < GRID_SIZE; c++) {
      if (grid[r][c] === 0) empty.push({r, c});
    }
  }
  if (empty.length > 0) {
    const {r, c} = empty[Math.floor(Math.random() * empty.length)];
    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
  }
}

function canMove() {
  for (let r = 0; r < GRID_SIZE; r++) {
    for (let c = 0; c < GRID_SIZE; c++) {
      if (grid[r][c] === 0) return true;
      if (c < GRID_SIZE - 1 && grid[r][c] === grid[r][c+1]) return true;
      if (r < GRID_SIZE - 1 && grid[r][c] === grid[r+1][c]) return true;
    }
  }
  return false;
}

function move(direction) {
  if (gameOver || paused || animating) return false;
  let moved = false;
  const newGrid = grid.map(row => [...row]);
  
  const vectors = {
    ArrowUp: {dr: -1, dc: 0, startR: 0, startC: 0, stepR: 1, stepC: 1},
    ArrowDown: {dr: 1, dc: 0, startR: GRID_SIZE-1, startC: 0, stepR: -1, stepC: 1},
    ArrowLeft: {dr: 0, dc: -1, startR: 0, startC: 0, stepR: 1, stepC: 1},
    ArrowRight: {dr: 0, dc: 1, startR: 0, startC: GRID_SIZE-1, stepR: 1, stepC: -1}
  };
  
  const v = vectors[direction];
  if (!v) return false;
  
  for (let r = v.startR; r >= 0 && r < GRID_SIZE; r += v.stepR) {
    for (let c = v.startC; c >= 0 && c < GRID_SIZE; c += v.stepC) {
      if (newGrid[r][c] === 0) continue;
      let cr = r, cc = c;
      while (true) {
        const nr = cr + v.dr;
        const nc = cc + v.dc;
        if (nr < 0 || nr >= GRID_SIZE || nc < 0 || nc >= GRID_SIZE) break;
        if (newGrid[nr][nc] === 0) {
          newGrid[nr][nc] = newGrid[cr][cc];
          newGrid[cr][cc] = 0;
          cr = nr; cc = nc;
          moved = true;
        } else if (newGrid[nr][nc] === newGrid[cr][cc]) {
          newGrid[nr][nc] *= 2;
          score += newGrid[nr][nc];
          newGrid[cr][cc] = 0;
          moved = true;
          break;
        } else {
          break;
        }
      }
    }
  }
  
  if (moved) {
    grid = newGrid;
    addRandomTile();
    updateScore();
    if (!canMove()) {
      gameOver = true;
      finalScoreEl.textContent = score;
      gameOverOverlay.classList.remove('hidden');
    }
    draw();
  }
  return moved;
}

function draw() {
  ctx.fillStyle = '#05050a';
  ctx.fillRect(0, 0, BOARD_SIZE, BOARD_SIZE);
  
  for (let r = 0; r < GRID_SIZE; r++) {
    for (let c = 0; c < GRID_SIZE; c++) {
      const value = grid[r][c];
      const x = GAP + c * (TILE_SIZE + GAP);
      const y = GAP + r * (TILE_SIZE + GAP);
      
      // Tile background
      ctx.fillStyle = COLORS[value] || COLORS[2048];
      roundRect(ctx, x, y, TILE_SIZE, TILE_SIZE, 6, true);
      
      // Tile value
      if (value !== 0) {
        ctx.fillStyle = value <= 4 ? '#05050a' : '#ffffff';
        ctx.font = 'bold 36px Courier New';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(value, x + TILE_SIZE/2, y + TILE_SIZE/2);
      }
    }
  }
}

function roundRect(ctx, x, y, width, height, radius, fill) {
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.lineTo(x + width - radius, y);
  ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
  ctx.lineTo(x + width, y + height - radius);
  ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
  ctx.lineTo(x + radius, y + height);
  ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
  ctx.lineTo(x, y + radius);
  ctx.quadraticCurveTo(x, y, x + radius, y);
  ctx.closePath();
  if (fill) ctx.fill();
}

function handleKeyDown(e) {
  if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
    if (!gameOver && !startScreen.classList.contains('hidden')) return;
    if (paused) resumeGame();
    else pauseGame();
    return;
  }
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
    e.preventDefault();
    move(e.key);
  }
}

function handleTouchStart(e) {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}

function handleTouchEnd(e) {
  if (touchStartX === undefined || touchStartY === undefined) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const absDx = Math.abs(dx);
  const absDy = Math.abs(dy);
  
  if (Math.max(absDx, absDy) < 30) return; // Minimum swipe distance
  
  if (absDx > absDy) {
    move(dx > 0 ? 'ArrowRight' : 'ArrowLeft');
  } else {
    move(dy > 0 ? 'ArrowDown' : 'ArrowUp');
  }
  
  touchStartX = touchStartY = undefined;
}

function retryGame() {
  gameOverOverlay.classList.add('hidden');
  startGame();
}

function init() {
  initCanvas();
  bestEl.textContent = best;
  
  startBtn.addEventListener('click', startGame);
  resumeBtn.addEventListener('click', resumeGame);
  quitBtn.addEventListener('click', quitToMenu);
  retryBtn.addEventListener('click', retryGame);
  menuBtn.addEventListener('click', showStartScreen);
  
  document.addEventListener('keydown', handleKeyDown);
  canvas.addEventListener('touchstart', handleTouchStart, {passive: false});
  canvas.addEventListener('touchend', handleTouchEnd, {passive: false});
  
  draw();
}

init();
</script>
</body>
</html>
