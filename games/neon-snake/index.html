<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Snake</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a0f;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  font-family: 'Courier New', monospace;
  overflow: hidden;
  color: #0ff;
}
#game-container {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
#hud {
  display: flex;
  gap: 40px;
  font-size: 18px;
  text-shadow: 0 0 10px #0ff;
  letter-spacing: 2px;
}
#hud span { color: #f0f; text-shadow: 0 0 10px #f0f; }
canvas {
  border: 2px solid #333;
  border-radius: 4px;
  box-shadow: 0 0 20px rgba(0,255,255,0.3);
  touch-action: none;
}
#overlay {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(10,10,15,0.92);
  z-index: 10;
  gap: 15px;
}
#overlay h1 {
  font-size: 36px;
  text-shadow: 0 0 20px #0ff, 0 0 40px #0ff;
  letter-spacing: 4px;
}
#overlay p {
  color: #888;
  font-size: 14px;
  max-width: 300px;
  text-align: center;
  line-height: 1.6;
}
#overlay button {
  padding: 12px 36px;
  font-size: 18px;
  font-family: 'Courier New', monospace;
  background: transparent;
  color: #0ff;
  border: 2px solid #0ff;
  border-radius: 4px;
  cursor: pointer;
  text-shadow: 0 0 10px #0ff;
  letter-spacing: 2px;
  transition: all 0.2s;
}
#overlay button:hover {
  background: #0ff;
  color: #0a0a0f;
  box-shadow: 0 0 20px #0ff;
}
.hidden { display: none !important; }
#hint {
  font-size: 12px;
  color: #555;
}
#pause-btn {
  position: absolute;
  top: 10px;
  right: 10px;
  padding: 6px 12px;
  font-size: 12px;
  font-family: 'Courier New', monospace;
  background: transparent;
  color: #0ff;
  border: 1px solid #0ff;
  border-radius: 3px;
  cursor: pointer;
  text-shadow: 0 0 5px #0ff;
  letter-spacing: 1px;
  transition: all 0.2s;
  z-index: 5;
}
#pause-btn:hover {
  background: #0ff;
  color: #0a0a0f;
}
</style>
</head>
<body>
<div id="game-container">
  <div id="hud">
    <div>SCORE: <span id="score">0</span></div>
    <div>BEST: <span id="best">0</span></div>
    <div>SPEED: <span id="speed">1</span></div>
  </div>
  <canvas id="game" width="400" height="400"></canvas>
  <button id="pause-btn" class="hidden">PAUSE</button>
  <div id="hint">Arrow keys / WASD / Swipe to move | Space to pause</div>
  <div id="overlay">
    <h1>NEON SNAKE</h1>
    <p>Eat the glowing orbs. Don't hit the walls or yourself. Speed up every 5 orbs!</p>
    <button id="start-btn">START</button>
  </div>
</div>

<script>
// === Neon Snake ===
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const speedEl = document.getElementById('speed');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('start-btn');
const pauseBtn = document.getElementById('pause-btn');
const hint = document.getElementById('hint');

const GRID = 20;
const COLS = canvas.width / GRID;
const ROWS = canvas.height / GRID;

let snake, dir, nextDir, food, score, best, speedLevel;
let running = false, paused = false;
let lastTime = 0;
let particles = [];
let touchStartX = 0, touchStartY = 0;

best = parseInt(localStorage.getItem('neonSnakeBest') || '0');
bestEl.textContent = best;

function init() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1,y:0};
  nextDir = {x:1,y:0};
  score = 0;
  speedLevel = 1;
  particles = [];
  placeFood();
  updateHUD();
  paused = false;
  pauseBtn.textContent = 'PAUSE';
  pauseBtn.classList.add('hidden');
}

function placeFood() {
  let ok = false;
  while (!ok) {
    food = {x: (Math.random()*COLS)|0, y: (Math.random()*ROWS)|0};
    ok = !snake.some(s => s.x===food.x && s.y===food.y);
  }
}

function updateHUD() {
  scoreEl.textContent = score;
  bestEl.textContent = best;
  speedEl.textContent = speedLevel;
}

function getSpeed() {
  return Math.max(50, 150 - (speedLevel - 1) * 12);
}

function gameLoop(time) {
  if (!running || paused) {
    lastTime = time;
    requestAnimationFrame(gameLoop);
    return;
  }

  const speed = getSpeed();
  if (time - lastTime >= speed) {
    tick();
    lastTime = time;
  }
  draw();
  requestAnimationFrame(gameLoop);
}

function tick() {
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
    return gameOver();
  }
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    return gameOver();
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score++;
    for (let i = 0; i < 12; i++) {
      particles.push({
        x: food.x * GRID + GRID/2,
        y: food.y * GRID + GRID/2,
        vx: (Math.random()-0.5)*6,
        vy: (Math.random()-0.5)*6,
        life: 1,
        color: Math.random() > 0.5 ? '#0ff' : '#f0f'
      });
    }
    if (score % 5 === 0) speedLevel++;
    placeFood();
    updateHUD();
  } else {
    snake.pop();
  }

  updateParticles();
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15;
    p.life -= 0.02;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function gameOver() {
  running = false;
  pauseBtn.classList.add('hidden');
  if (score > best) {
    best = score;
    localStorage.setItem('neonSnakeBest', best);
    updateHUD();
  }
  overlay.classList.remove('hidden');
  overlay.querySelector('h1').textContent = 'GAME OVER';
  overlay.querySelector('p').innerHTML = `Score: ${score} &nbsp; Best: ${best}`;
  startBtn.textContent = 'PLAY AGAIN';
}

function draw() {
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = '#1a1a2e';
  ctx.lineWidth = 0.5;
  for (let x = 0; x <= canvas.width; x += GRID) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, canvas.height);
    ctx.stroke();
  }
  for (let y = 0; y <= canvas.height; y += GRID) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(canvas.width, y);
    ctx.stroke();
  }

  const gradient = ctx.createRadialGradient(
    food.x * GRID + GRID/2, food.y * GRID + GRID/2, 0,
    food.x * GRID + GRID/2, food.y * GRID + GRID/2, GRID
  );
  gradient.addColorStop(0, '#0ff');
  gradient.addColorStop(0.5, '#f0f');
  gradient.addColorStop(1, 'transparent');
  ctx.fillStyle = gradient;
  ctx.beginPath();
  ctx.arc(food.x * GRID + GRID/2, food.y * GRID + GRID/2, GRID/2 - 2, 0, Math.PI * 2);
  ctx.fill();

  ctx.shadowColor = '#0ff';
  ctx.shadowBlur = 10;
  snake.forEach((segment, i) => {
    const hue = 180 + (i * 2) % 60;
    ctx.fillStyle = `hsl(${hue}, 100%, 50%)`;
    const radius = GRID/2 - 2 - i * 0.3;
    ctx.beginPath();
    ctx.roundRect(
      segment.x * GRID + 2,
      segment.y * GRID + 2,
      GRID - 4,
      GRID - 4,
      Math.max(2, radius)
    );
    ctx.fill();
  });
  ctx.shadowBlur = 0;

  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  });
  ctx.globalAlpha = 1;
}

function handleKeyDown(e) {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD','Space'].includes(e.code)) {
    e.preventDefault();
  }
  if (e.code === 'Escape') {
    if (!paused && running) {
      togglePause();
    } else if (paused) {
      togglePause();
    }
    return;
  }
  if (e.code === 'Space') {
    togglePause();
    return;
  }
  if (!running || paused) return;

  const keyMap = {
    'ArrowUp': {x:0,y:-1}, 'KeyW': {x:0,y:-1},
    'ArrowDown': {x:0,y:1}, 'KeyS': {x:0,y:1},
    'ArrowLeft': {x:-1,y:0}, 'KeyA': {x:-1,y:0},
    'ArrowRight': {x:1,y:0}, 'KeyD': {x:1,y:0}
  };
  if (keyMap[e.code]) {
    const newDir = keyMap[e.code];
    if (newDir.x !== -dir.x || newDir.y !== -dir.y) {
      nextDir = newDir;
    }
  }
}

function togglePause() {
  if (!running) return;
  paused = !paused;
  pauseBtn.textContent = paused ? 'RESUME' : 'PAUSE';
  if (!paused) lastTime = performance.now();
}

function handleTouchStart(e) {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}

function handleTouchEnd(e) {
  if (!running || paused) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 30 && dir.x !== -1) nextDir = {x:1,y:0};
    else if (dx < -30 && dir.x !== 1) nextDir = {x:-1,y:0};
  } else {
    if (dy > 30 && dir.y !== -1) nextDir = {x:0,y:1};
    else if (dy < -30 && dir.y !== 1) nextDir = {x:0,y:-1};
  }
}

function startGame() {
  init();
  running = true;
  overlay.classList.add('hidden');
  pauseBtn.classList.remove('hidden');
  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
}

startBtn.addEventListener('click', startGame);
pauseBtn.addEventListener('click', togglePause);
document.addEventListener('keydown', handleKeyDown);
canvas.addEventListener('touchstart', handleTouchStart, {passive: true});
canvas.addEventListener('touchend', handleTouchEnd, {passive: true});

if (typeof ctx.roundRect !== 'function') {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    this.beginPath();
    this.moveTo(x + r, y);
    this.lineTo(x + w - r, y);
    this.quadraticCurveTo(x + w, y, x + w, y + r);
    this.lineTo(x + w, y + h - r);
    this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    this.lineTo(x + r, y + h);
    this.quadraticCurveTo(x, y + h, x, y + h - r);
    this.lineTo(x, y + r);
    this.quadraticCurveTo(x, y, x + r, y);
    this.closePath();
  };
}

// --- Pause/Resume/Quit Functions ---
function pauseGame() {
    if (!state.running) return;
    state.running = false;
    document.getElementById('pauseOverlay').classList.remove('hidden');
    document.getElementById('pauseWave').textContent = state.wave || state.level || 1;
    document.getElementById('pauseScore').textContent = state.score;
}

function resumeGame() {
    if (state.running) return;
    if (state.player && state.player.health > 0) {
        state.running = true;
        document.getElementById('pauseOverlay').classList.add('hidden');
    }
}

function quitToMenu() {
    state.running = false;
    document.getElementById('pauseOverlay').classList.add('hidden');
    document.getElementById('gameOverOverlay').classList.add('hidden');
    showStartScreen();
}

function showStartScreen() {
    state.running = false;
    document.getElementById('startScreen').classList.remove('hidden');
    document.getElementById('pauseOverlay').classList.add('hidden');
    document.getElementById('gameOverOverlay').classList.add('hidden');
}
</script>

    <div class="overlay hidden" id="pauseOverlay">
        <h1>PAUSED</h1>
        <p>Wave <span id="pauseWave">1</span> • Score <span id="pauseScore">0</span></p>
        <button class="btn" id="resumeBtn">RESUME</button>
        <button class="btn" id="quitBtn">QUIT TO MENU</button>
    </div>


    <div class="overlay hidden" id="gameOverOverlay">
        <h1 style="color: #ff3366;">GAME OVER</h1>
        <p>Final Score: <span id="finalScore" style="color: #00ffea;">0</span></p>
        <p id="highScoreMsg" style="color: #ffd700;"></p>
        <button class="btn" id="retryBtn">RETRY</button>
        <button class="btn" id="menuBtn">MAIN MENU</button>
    </div>

</body>
</html>
