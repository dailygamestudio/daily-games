<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Snake</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a0f;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  font-family: 'Courier New', monospace;
  overflow: hidden;
  color: #0ff;
}
#game-container {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
#hud {
  display: flex;
  gap: 40px;
  font-size: 18px;
  text-shadow: 0 0 10px #0ff;
  letter-spacing: 2px;
}
#hud span { color: #f0f; text-shadow: 0 0 10px #f0f; }
canvas {
  border: 2px solid #333;
  border-radius: 4px;
  box-shadow: 0 0 20px rgba(0,255,255,0.3);
  touch-action: none;
}
#overlay {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(10,10,15,0.92);
  z-index: 10;
  gap: 15px;
}
#overlay h1 {
  font-size: 36px;
  text-shadow: 0 0 20px #0ff, 0 0 40px #0ff;
  letter-spacing: 4px;
}
#overlay p {
  color: #888;
  font-size: 14px;
  max-width: 300px;
  text-align: center;
  line-height: 1.6;
}
#overlay button {
  padding: 12px 36px;
  font-size: 18px;
  font-family: 'Courier New', monospace;
  background: transparent;
  color: #0ff;
  border: 2px solid #0ff;
  border-radius: 4px;
  cursor: pointer;
  text-shadow: 0 0 10px #0ff;
  letter-spacing: 2px;
  transition: all 0.2s;
}
#overlay button:hover {
  background: #0ff;
  color: #0a0a0f;
  box-shadow: 0 0 20px #0ff;
}
.hidden { display: none !important; }
#hint {
  font-size: 12px;
  color: #555;
}
#pause-btn {
  position: absolute;
  top: 10px;
  right: 10px;
  padding: 6px 12px;
  font-size: 12px;
  font-family: 'Courier New', monospace;
  background: transparent;
  color: #0ff;
  border: 1px solid #0ff;
  border-radius: 3px;
  cursor: pointer;
  text-shadow: 0 0 5px #0ff;
  letter-spacing: 1px;
  transition: all 0.2s;
  z-index: 5;
}
#pause-btn:hover {
  background: #0ff;
  color: #0a0a0f;
}
</style>
</head>
<body>
<div id="game-container">
  <div id="hud">
    <div>SCORE: <span id="score">0</span></div>
    <div>BEST: <span id="best">0</span></div>
    <div>SPEED: <span id="speed">1</span></div>
  </div>
  <canvas id="game" width="400" height="400"></canvas>
  <button id="pause-btn" class="hidden">PAUSE</button>
  <div id="hint">Arrow keys / WASD / Swipe to move | Space to pause</div>
  <div id="overlay">
    <h1>NEON SNAKE</h1>
    <p>Eat the glowing orbs. Don't hit the walls or yourself. Speed up every 5 orbs!</p>
    <button id="start-btn">START</button>
  </div>
</div>

<script>
// === Neon Snake ===
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const speedEl = document.getElementById('speed');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('start-btn');
const pauseBtn = document.getElementById('pause-btn');
const hint = document.getElementById('hint');

const GRID = 20;
const COLS = canvas.width / GRID;
const ROWS = canvas.height / GRID;

let snake, dir, nextDir, food, score, best, speedLevel;
let running = false, paused = false;
let lastTime = 0;
let particles = [];
let touchStartX = 0, touchStartY = 0;

best = parseInt(localStorage.getItem('neonSnakeBest') || '0');
bestEl.textContent = best;

function init() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1,y:0};
  nextDir = {x:1,y:0};
  score = 0;
  speedLevel = 1;
  particles = [];
  placeFood();
  updateHUD();
  paused = false;
  pauseBtn.textContent = 'PAUSE';
  pauseBtn.classList.add('hidden');
}

function placeFood() {
  let ok = false;
  while (!ok) {
    food = {x: (Math.random()*COLS)|0, y: (Math.random()*ROWS)|0};
    ok = !snake.some(s => s.x===food.x && s.y===food.y);
  }
}

function updateHUD() {
  scoreEl.textContent = score;
  bestEl.textContent = best;
  speedEl.textContent = speedLevel;
}

function getSpeed() {
  return Math.max(50, 150 - (speedLevel - 1) * 12);
}

function gameLoop(time) {
  if (!running || paused) {
    lastTime = time;
    requestAnimationFrame(gameLoop);
    return;
  }

  const speed = getSpeed();
  if (time - lastTime >= speed) {
    tick();
    lastTime = time;
  }
  draw();
  requestAnimationFrame(gameLoop);
}

function tick() {
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
    return gameOver();
  }
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    return gameOver();
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score++;
    for (let i = 0; i < 12; i++) {
      particles.push({
        x: food.x * GRID + GRID/2,
        y: food.y * GRID + GRID/2,
        vx: (Math.random()-0.5)*6,
        vy: (Math.random()-0.5)*6,
        life: 1,
        color: Math.random() > 0.5 ? '#0ff' : '#f0f'
      });
    }
    if (score % 5 === 0) speedLevel++;
    placeFood();
    updateHUD();
  } else {
    snake.pop();
  }

  updateParticles();
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15;
    p.life -= 0.02;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function gameOver() {
  running = false;
  pauseBtn.classList.add('hidden');
  if (score > best) {
    best = score;
    localStorage.setItem('neonSnakeBest', best);
    updateHUD();
  }
  overlay.classList.remove('hidden');
  overlay.querySelector('h1').textContent = 'GAME OVER';
  overlay.querySelector('p').innerHTML = `Score: ${score} &nbsp; Best: ${best}`;
  startBtn.textContent = 'PLAY AGAIN';
}

function draw() {
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = '#111';
  ctx.lineWidth = 1;
  for (let i = 0; i <= COLS; i++) {
    ctx.beginPath();
    ctx.moveTo(i*GRID, 0);
    ctx.lineTo(i*GRID, canvas.height);
    ctx.stroke();
  }
  for (let i = 0; i <= ROWS; i++) {
    ctx.beginPath();
    ctx.moveTo(0, i*GRID);
    ctx.lineTo(canvas.width, i*GRID);
    ctx.stroke();
  }

  const pulse = Math.sin(Date.now() / 200) * 2;
  const fxx = food.x * GRID + GRID/2;
  const fyy = food.y * GRID + GRID/2;
  ctx.shadowColor = '#f0f';
  ctx.shadowBlur = 15 + pulse;
  ctx.fillStyle = '#f0f';
  ctx.beginPath();
  ctx.arc(fxx, fyy, GRID/2 - 2 + pulse, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  ctx.shadowColor = '#0ff';
  for (let i = snake.length - 1; i >= 0; i--) {
    const s = snake[i];
    const alpha = 1 - (i / snake.length) * 0.5;
    ctx.shadowBlur = i === 0 ? 20 : 10;
    ctx.fillStyle = i === 0 ? '#0ff' : `rgba(0,255,255,${alpha})`;
    const radius = i === 0 ? 2 : 1;
    ctx.fillRect(s.x * GRID + 1, s.y * GRID + 1, GRID - 2, GRID - 2);
  }
  ctx.shadowBlur = 0;

  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(1, 3 * p.life), 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;

  if (paused) {
    ctx.fillStyle = 'rgba(10,10,15,0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#0ff';
    ctx.font = 'bold 32px Courier New';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = '#0ff';
    ctx.shadowBlur = 20;
    ctx.fillText('PAUSED', canvas.width/2, canvas.height/2);
    ctx.shadowBlur = 0;
  }
}

function setDirection(newDir) {
  if ((newDir.x === -dir.x && newDir.y === -dir.y) || (newDir.x === 0 && newDir.y === 0)) return;
  nextDir = newDir;
}

function handleKey(e) {
  switch(e.key) {
    case 'ArrowUp': case 'w': case 'W': setDirection({x:0,y:-1}); break;
    case 'ArrowDown': case 's': case 'S': setDirection({x:0,y:1}); break;
    case 'ArrowLeft': case 'a': case 'A': setDirection({x:-1,y:0}); break;
    case 'ArrowRight': case 'd': case 'D': setDirection({x:1,y:0}); break;
    case ' ': case 'Space': e.preventDefault(); togglePause(); break;
  }
}

function togglePause() {
  if (!running) return;
  paused = !paused;
  pauseBtn.textContent = paused ? 'RESUME' : 'PAUSE';
}

function startGame() {
  overlay.classList.add('hidden');
  init();
  running = true;
  pauseBtn.classList.remove('hidden');
  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
}

function handleTouchStart(e) {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}

function handleTouchEnd(e) {
  if (!running || paused) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy)) {
    setDirection({x: dx > 0 ? 1 : -1, y: 0});
  } else {
    setDirection({x: 0, y: dy > 0 ? 1 : -1});
  }
}

startBtn.addEventListener('click', startGame);
pauseBtn.addEventListener('click', togglePause);
document.addEventListener('keydown', handleKey);
canvas.addEventListener('touchstart', handleTouchStart, {passive: true});
canvas.addEventListener('touchend', handleTouchEnd, {passive: true});

init();
</script>
</body>
</html>
