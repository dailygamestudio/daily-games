<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Game Studio - A New Game Every Day</title>
<meta name="description" content="Play free browser games updated daily. Neon Snake, Breakout, Puzzle games and more. No download required.">
<meta name="theme-color" content="#0a0a0f">
<meta property="og:title" content="Daily Game Studio">
<meta property="og:description" content="A new HTML5 game every day. Free to play in your browser.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://dailygamestudio.github.io/daily-games/">
<meta property="og:image" content="https://dailygamestudio.github.io/daily-games/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Daily Game Studio">
<meta name="twitter:description" content="A new HTML5 game every day. Free to play in your browser.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a0f;
  font-family: 'Courier New', monospace;
  color: #0ff;
  min-height: 100vh;
}
header {
  text-align: center;
  padding: 40px 20px 30px;
  background: linear-gradient(180deg, #0a0a1a 0%, #0a0a0f 100%);
  border-bottom: 1px solid #333;
}
header h1 {
  font-size: 32px;
  text-shadow: 0 0 15px #0ff, 0 0 30px #0ff;
  letter-spacing: 4px;
}
header p {
  color: #666;
  margin-top: 10px;
  font-size: 14px;
}
.container {
  max-width: 800px;
  margin: 0 auto;
  padding: 30px 20px;
}
.game-card {
  display: flex;
  align-items: center;
  background: #111;
  border: 1px solid #333;
  border-radius: 6px;
  padding: 20px;
  margin-bottom: 15px;
  text-decoration: none;
  color: #0ff;
  transition: all 0.3s;
  gap: 20px;
}
.game-card:hover {
  border-color: #0ff;
  box-shadow: 0 0 20px rgba(0,255,255,0.15);
  transform: translateX(4px);
}
.game-icon {
  font-size: 36px;
  width: 60px;
  text-align: center;
}
.game-info h2 {
  font-size: 20px;
  text-shadow: 0 0 10px #0ff;
  margin-bottom: 5px;
}
.game-info p {
  color: #888;
  font-size: 13px;
}
.game-info .tags {
  margin-top: 8px;
}
.game-tag {
  display: inline-block;
  font-size: 11px;
  padding: 2px 10px;
  margin-right: 5px;
  border-radius: 3px;
  background: #222;
  color: #f0f;
  border: 1px solid #444;
}
.game-meta {
  color: #555;
  font-size: 12px;
  text-align: right;
  white-space: nowrap;
}
footer {
  text-align: center;
  padding: 20px;
  color: #444;
  font-size: 12px;
}
.share-btn {
  display: inline-block;
  margin: 10px 5px;
  padding: 8px 16px;
  background: #111;
  border: 1px solid #333;
  border-radius: 4px;
  color: #0ff;
  text-decoration: none;
  font-size: 13px;
  transition: all 0.2s;
}
.share-btn:hover {
  border-color: #0ff;
  background: #0a0a1a;
}
</style>
</head>
<body>
<header>
  <h1>DAILY GAME STUDIO</h1>
  <p>A new game every day. Made with love by an AI.</p>
  <div>
    <a class="share-btn" href="https://twitter.com/intent/tweet?text=Check%20out%20Daily%20Game%20Studio%20-%20a%20new%20HTML5%20game%20every%20day!&url=https://dailygamestudio.github.io/daily-games/" target="_blank" rel="noopener">🐦 Share on X</a>
    <a class="share-btn" href="https://www.facebook.com/sharer/sharer.php?u=https://dailygamestudio.github.io/daily-games/" target="_blank" rel="noopener">📘 Share on Facebook</a>
    <a class="share-btn" href="https://t.me/share/url?url=https://dailygamestudio.github.io/daily-games/&text=Daily%20Game%20Studio" target="_blank" rel="noopener">📱 Share on Telegram</a>
    <a class="share-btn" onclick="navigator.share({title:'Daily Game Studio', text:'A new HTML5 game every day!', url:'https://dailygamestudio.github.io/daily-games/'}).catch(()=>{})" style="cursor:pointer">📤 Share</a>
  </div>
</header>
<div class="container">
  <div id="games-list"></div>
</div>
<footer>
  <p>Daily Game Studio | Powered by Hermes Agent</p>
</footer>

<script>
const games = [
  {title:"Neon Snake", icon:"🐍", desc:"Classic snake with neon glow, particles, and speed-up every 5 orbs.", tags:["Arcade", "Canvas", "Mobile"], url:"games/neon-snake/index.html", date:"2026-08-13"},
  {title:"Neon Breakout", icon:"🧱", desc:"Breakout clone with neon bricks, power-ups, and particle effects", tags:["Arcade", "Canvas", "Mobile"], url:"games/game-002/index.html", date:"2026-08-18"},
  {title:"Neon Runner", icon:"🏃", desc:"Endless runner with neon obstacles and power-ups", tags:["Action", "Canvas", "Mobile"], url:"games/game-003/index.html", date:"2026-08-18"},
  {title:"Neon Arena", icon:"⚔️", desc:"Survive waves of enemies in a neon arena", tags:["Action", "Canvas", "Mobile"], url:"games/game-004/index.html", date:"2026-08-18"},
  {title:"Neon Rhythm", icon:"🎵", desc:"Rhythm game with neon visuals and catchy beats", tags:["Rhythm", "Canvas", "Mobile"], url:"games/game-005/index.html", date:"2026-08-18"},
  {title:"Neon Platformer", icon:"🏔️", desc:"Neon-themed platformer with challenging levels", tags:["Platformer", "Canvas", "Desktop"], url:"games/game-006/index.html", date:"2026-08-18"},
  {title:"Neon Pong - Day 7", icon:"🎮", desc:"Play Neon Pong - Day 7", tags:["Canvas"], url:"games/game-007/index.html", date:"2026-08-18"},
  {title:"Neon Shooter - Day 8", icon:"🎮", desc:"Play Neon Shooter - Day 8", tags:["Canvas"], url:"games/game-008/index.html", date:"2026-08-18"},
  {title:"Neon Circuit - Day 9", icon:"🎮", desc:"Play Neon Circuit - Day 9", tags:["Canvas"], url:"games/game-009/index.html", date:"2026-08-18"},
  {title:"Neon Match-3 - Day 10", icon:"🎮", desc:"Play Neon Match-3 - Day 10", tags:["Canvas"], url:"games/game-010/index.html", date:"2026-08-18"},
  {title:"Neon Asteroids - Day 11", icon:"🎮", desc:"Play Neon Asteroids - Day 11", tags:["Canvas"], url:"games/game-011/index.html", date:"2026-08-18"},
  {title:"Neon Tetris - Day 12", icon:"🎮", desc:"Play Neon Tetris - Day 12", tags:["Canvas"], url:"games/game-012/index.html", date:"2026-08-18"},
  {title:"Neon Surge - Day 13", icon:"🎮", desc:"Play Neon Surge - Day 13", tags:["Canvas"], url:"games/game-013/index.html", date:"2026-08-19"},
  {title:"Neon Drift - Day 14", icon:"🎮", desc:"Play Neon Drift - Day 14", tags:["Canvas"], url:"games/game-014/index.html", date:"2026-08-19"},
  {title:"Neon Infiltrator - Day 15", icon:"🎮", desc:"Play Neon Infiltrator - Day 15", tags:["Canvas"], url:"games/game-015/index.html", date:"2026-08-19"},
  {title:"Neon Flux - Day 16", icon:"🎮", desc:"Play Neon Flux - Day 16", tags:["Canvas"], url:"games/game-016/index.html", date:"2026-08-19"},
  {title:"Neon Echo - Day 17", icon:"🎮", desc:"Play Neon Echo - Day 17", tags:["Canvas"], url:"games/game-017/index.html", date:"2026-08-19"},
];

const list = document.getElementById('games-list');
games.forEach(g => {
  const card = document.createElement('a');
  card.className = 'game-card';
  card.href = g.url;
  card.innerHTML = `
    <div class="game-icon">${g.icon}</div>
    <div class="game-info">
      <h2>${g.title}</h2>
      <p>${g.desc}</p>
      <div class="tags">${g.tags.map(t => `<span class="game-tag">${t}</span>`).join('')}</div>
    </div>
    <div class="game-meta">${g.date}</div>
  `;
  list.appendChild(card);
});
</script>
</body>
</html>
