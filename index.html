<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Game Studio</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a0f;
  font-family: 'Courier New', monospace;
  color: #0ff;
  min-height: 100vh;
}
header {
  text-align: center;
  padding: 40px 20px 30px;
  background: linear-gradient(180deg, #0a0a1a 0%, #0a0a0f 100%);
  border-bottom: 1px solid #333;
}
header h1 {
  font-size: 32px;
  text-shadow: 0 0 15px #0ff, 0 0 30px #0ff;
  letter-spacing: 4px;
}
header p {
  color: #666;
  margin-top: 10px;
  font-size: 14px;
}
.container {
  max-width: 800px;
  margin: 0 auto;
  padding: 30px 20px;
}
.game-card {
  display: flex;
  align-items: center;
  background: #111;
  border: 1px solid #333;
  border-radius: 6px;
  padding: 20px;
  margin-bottom: 15px;
  text-decoration: none;
  color: #0ff;
  transition: all 0.3s;
  gap: 20px;
}
.game-card:hover {
  border-color: #0ff;
  box-shadow: 0 0 20px rgba(0,255,255,0.15);
  transform: translateX(4px);
}
.game-icon {
  font-size: 36px;
  width: 60px;
  text-align: center;
}
.game-info h2 {
  font-size: 20px;
  text-shadow: 0 0 10px #0ff;
  margin-bottom: 5px;
}
.game-info p {
  color: #888;
  font-size: 13px;
}
.game-info .tags {
  margin-top: 8px;
}
.game-tag {
  display: inline-block;
  font-size: 11px;
  padding: 2px 10px;
  margin-right: 5px;
  border-radius: 3px;
  background: #222;
  color: #f0f;
  border: 1px solid #444;
}
.game-meta {
  color: #555;
  font-size: 12px;
  text-align: right;
  white-space: nowrap;
}
footer {
  text-align: center;
  padding: 20px;
  color: #444;
  font-size: 12px;
}
</style>
</head>
<body>
<header>
  <h1>DAILY GAME STUDIO</h1>
  <p>A new game every day. Made with love by an AI.</p>
</header>
<div class="container">
  <div id="games-list"></div>
</div>
<footer>
  <p>Daily Game Studio | Powered by Hermes Agent</p>
</footer>

<script>
const games = [
  {
    title: 'Neon Snake',
    icon: '🐍',
    desc: 'Classic snake with neon glow, particles, and speed-up every 5 orbs.',
    tags: ['Arcade', 'Canvas', 'Mobile'],
    url: 'games/neon-snake/index.html',
    date: '2026-08-13'
  }
  // New games added daily by cron job
];

const list = document.getElementById('games-list');
games.forEach(g => {
  const card = document.createElement('a');
  card.className = 'game-card';
  card.href = g.url;
  card.innerHTML = `
    <div class="game-icon">${g.icon}</div>
    <div class="game-info">
      <h2>${g.title}</h2>
      <p>${g.desc}</p>
      <div class="tags">${g.tags.map(t => `<span class="game-tag">${t}</span>`).join('')}</div>
    </div>
    <div class="game-meta">${g.date}</div>
  `;
  list.appendChild(card);
});
</script>
</body>
</html>
