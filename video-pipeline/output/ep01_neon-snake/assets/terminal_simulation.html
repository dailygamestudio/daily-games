            font-size: 14px;
            line-height: 1.5;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        .terminal {
            height: 100vh;
            width: 100vw;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        .title-bar {
            background: #1a1a2e;
            padding: 10px 15px;
            border-radius: 8px 8px 0 0;
            margin: -20px -20px 20px -20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #00ffea;
        }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .dot.red { background: #ff5f56; }
        .dot.yellow { background: #ffbd2e; }
        .dot.green { background: #27c93f; }
        .title-text { color: #888; font-size: 13px; margin-left: 10px; }
        .content {
            flex: 1;
            overflow-y: auto;
            background: #0a0a0f;
            border: 1px solid #00ffea33;
            border-radius: 8px;
            padding: 15px;
        }
        .line {
            margin: 2px 0;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .prompt { color: #0ff; }
        .command { color: #fff; }
        .output { color: #aaa; }
        .success { color: #0f0; }
        .error { color: #f55; }
        .warning { color: #ff0; }
        .info { color: #0ff; }
        .section { color: #f0f; font-weight: bold; margin-top: 20px; }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #1a1a2e;
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #0ff, #f0f);
            border-radius: 4px;
            transition: width 0.3s;
        }
        .blink::after {
            content: '_';
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
    </style>

                div.innerHTML = '<span class="' + line.type + '">' + line.text + '</span>';
            }

            lineIndex++;
